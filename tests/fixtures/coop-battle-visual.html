<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="../../">
  <title>CO-OP BOSS Visual QA</title>
  <style>html,body,#gameFrame{width:100%;height:100%;margin:0;border:0;background:#03070a;overflow:hidden}</style>
</head>
<body>
  <iframe id="gameFrame" src="index.html?coopMvp=1" title="CO-OP BOSS Visual QA"></iframe>
  <script>
    document.getElementById('gameFrame').addEventListener('load', () => {
      const app = document.getElementById('gameFrame').contentWindow;
      app.addEventListener('error', event => { document.body.dataset.qaError = `${event.message} @ ${event.lineno}:${event.colno}`; });
      const now = Date.now();
      const roundId = app.KatamonCoopBattle.makeRoundId(2, Uint8Array.from({length:20},(_,i)=>i+1));
      const slots = {p1:{uid:'qa-host',name:'鋼鉄ネコ',character:'kyoryu',subweapon:'barrier',coopItem:'rescue-kit',ready:true,claimedAt:now,seenAt:now}};
      const room = {protocol:1,hostUid:'qa-host',phase:'playing',expiresAt:now+600000,settings:{difficulty:'normal',aiFill:true,revision:2},slots,round:{id:roundId,status:'input',deadlineAt:now+30000,wind:{direction:1,strength:4},nextWind:{direction:-1,strength:6}},rounds:{}};
      let sequence = 0;
      const bridge = {
        getBattleUiContract:()=>app.KatamonCoopBridge.getBattleUiContract(),
        getCanvas:()=>app.KatamonCoopBridge.getCanvas(),
        getBattleCharacters:()=>app.KatamonCoopBridge.getBattleCharacters(),
        startNormalBattle:config=>app.KatamonCoopBridge.startNormalBattle(config),
        stopNormalBattle:()=>app.KatamonCoopBridge.stopNormalBattle(),
        getNormalBattleState:()=>app.KatamonCoopBridge.getNormalBattleState(),
        reportNormalBattleError:message=>app.KatamonCoopBridge.reportNormalBattleError(message),
        serverNow:()=>Date.now(),pushId:()=>`qa-${++sequence}`,setBattleAudio:()=>{},
        request:async(path,_auth,options={})=>{
          if(!options.method) return room;
          const body=options.body?JSON.parse(options.body):null;
          if(path.includes('/messages/')){const parts=path.split('/');const round=parts[3];const id=parts[5];room.rounds[round]??={messages:{}};room.rounds[round].messages[id]=body;return body}
          if(path.endsWith('/round')){room.round=body;return body}
          if(path.endsWith('/phase')){room.phase=body;return body}
          if(path.includes('/slots/')){const seat=path.split('/').pop();room.slots[seat]={...room.slots[seat],...body,seenAt:Date.now()};return room.slots[seat]}
          return {};
        },
      };
      const started = app.KatamonCoopBattle.startBrowser({session:{role:'host',seat:'p1',code:'QA234567',auth:{uid:'qa-host',serverTimeOffset:0},room},bridge,characters:app.KatamonCoopBridge.getBattleCharacters()});
      document.body.dataset.qaStarted=String(started);
    });
  </script>
</body>
</html>
