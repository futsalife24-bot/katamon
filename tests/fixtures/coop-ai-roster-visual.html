<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>協力ボス AI編成 QA</title>
  <style>:root{--katamon-font-ui:sans-serif;--katamon-font-display:sans-serif}html,body{margin:0;width:100%;height:100%;background:#050708}</style>
</head>
<body>
  <script src="../../coop-mvp-foundation.js"></script>
  <script>
    (() => {
      const characters = [
        { id: 'kyoryu', name: 'ディラノ' },
        { id: 'medama', name: 'アイボルト' },
        { id: 'iwa', name: 'ゴーロッカ' },
        { id: 'tori', name: 'フェニーチェ' },
      ];
      let room = null;
      const clone = (value) => value == null ? value : JSON.parse(JSON.stringify(value));
      globalThis.KATAMON_FEATURES = { coopBossMvp: true };
      globalThis.KatamonCoopBridge = {
        getCharacters: () => characters.map((entry) => ({ ...entry })),
        getBattleCharacters: () => characters.map((entry) => ({ ...entry, maxHp: 100, color: '#e8c47a' })),
        getPlayerName: () => 'QAホスト',
        getState: () => ({ gamePhase: 'title', onlineActive: false }),
        playUiSound() {}, syncBgm() {},
        generateRoomCode: () => 'QA234567',
        ensureAuth: async () => ({ uid: 'qa-host', serverTimeOffset: 0 }),
        serverNow: () => Date.now(),
        claimEmptySlot: async () => false,
        request: async (path, _auth, options = {}) => {
          const method = options.method || 'GET';
          const body = options.body ? JSON.parse(options.body) : null;
          if (path === 'coopRooms/QA234567' && method === 'PUT') { room = clone(body); return true; }
          if (path === 'coopRooms/QA234567' && method === 'GET') return clone(room);
          if (path === 'coopRooms/QA234567/settings' && method === 'PUT') { room.settings = clone(body); return true; }
          if (path === 'coopRooms/QA234567/expiresAt' && method === 'PUT') { room.expiresAt = body; return true; }
          return true;
        },
      };
      globalThis.qaRoom = () => clone(room);
    })();
  </script>
  <script src="../../coop-mvp-room.js"></script>
  <script>
    addEventListener('load', () => setTimeout(() => {
      KatamonCoopRoom.openLobby();
      document.body.dataset.qaReady = 'true';
    }, 20));
  </script>
</body>
</html>
