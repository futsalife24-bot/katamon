<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="../../">
  <title>CO-OP BOSS Result Visual QA</title>
  <style>:root{--katamon-font-ui:system-ui,sans-serif}html,body{margin:0;background:#03070a}</style>
</head>
<body>
  <script src="coop-mvp-foundation.js"></script>
  <script src="coop-mvp-boss.js"></script>
  <script src="coop-mvp-boss-ai.js"></script>
  <script src="coop-mvp-engine.js"></script>
  <script src="coop-mvp-survival.js"></script>
  <script src="coop-mvp-items.js"></script>
  <script src="subweapon-mvp.js"></script>
  <script src="coop-mvp-rewards.js"></script>
  <script src="coop-mvp-session.js"></script>
  <script src="coop-mvp-battle.js"></script>
  <script>
    const now = Date.now();
    const roundId = KatamonCoopBattle.makeRoundId(3, Uint8Array.from({length:20},(_,i)=>20-i));
    const slots = {
      p1:{uid:'qa-host',name:'鋼鉄ネコ',character:'kyoryu',subweapon:'barrier',coopItem:'rescue-kit',ready:false,claimedAt:now,seenAt:now},
      e1:{uid:'qa-guest',name:'琥珀砲手',character:'medama',subweapon:'impact',coopItem:'healing-kit',ready:false,claimedAt:now,seenAt:now},
    };
    const room = {protocol:1,hostUid:'qa-host',phase:'results',expiresAt:now+600000,settings:{difficulty:'extreme',aiFill:true,revision:3},slots,round:{id:roundId,status:'results',deadlineAt:now+15000,wind:{direction:-1,strength:7},nextWind:{direction:1,strength:3}},rounds:{}};
    const bridge = {
      serverNow:()=>Date.now(),pushId:()=>`qa-${Date.now()}`,setBattleAudio:()=>{},
      request:async(path,_auth,options={})=>{
        if(!options.method) return room;
        const body=options.body?JSON.parse(options.body):null;
        if(path.endsWith('/phase')){room.phase=body;return body}
        if(path.includes('/slots/')){const seat=path.split('/').pop();room.slots[seat]={...room.slots[seat],...body,seenAt:Date.now()};return room.slots[seat]}
        return body;
      },
    };
    const characters = [
      {id:'kyoryu',name:'ディラノ',maxHp:100,color:'#76d64b',assetPath:'assets/characters/runtime/dirano.webp'},
      {id:'medama',name:'アイボルト',maxHp:90,color:'#ffd24a',assetPath:'assets/characters/runtime/eyebolt.webp'},
      {id:'iwa',name:'ゴーロッカ',maxHp:130,color:'#9a9086',assetPath:'assets/characters/runtime/gorocca.webp'},
      {id:'tori',name:'フェニーチェ',maxHp:75,color:'#ff8c3a',assetPath:'assets/characters/runtime/fenice.webp'},
    ];
    KatamonCoopBattle.startBrowser({session:{role:'host',seat:'p1',code:'QA345678',auth:{uid:'qa-host',serverTimeOffset:0},room},bridge,characters});
  </script>
</body>
</html>
