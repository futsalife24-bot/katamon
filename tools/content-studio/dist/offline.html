<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Content Studio - オフライン</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#070b14; color:#f8fafc; }
      body { min-height:100dvh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
      main { max-width:420px; background:#111827; border:1px solid #334155; border-radius:20px; padding:24px; }
      button { min-height:48px; width:100%; border:0; border-radius:12px; background:#d7a443; color:#111827; font-weight:800; font-size:16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>オフラインです</h1>
      <p>一度開いた下書きは端末内に残っています。通信が戻ったら再読み込みしてください。</p>
      <button type="button" onclick="location.reload()">再試行</button>
    </main>
  </body>
</html>
