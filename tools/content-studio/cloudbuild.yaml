steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - tools/content-studio/Dockerfile
      - --build-arg
      - SOURCE_SHA=${COMMIT_SHA}
      - -t
      - us-central1-docker.pkg.dev/${PROJECT_ID}/content-studio/server:${COMMIT_SHA}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/${PROJECT_ID}/content-studio/server:${COMMIT_SHA}
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - gcloud
      - run
      - deploy
      - katamon-content-studio
      - --image
      - us-central1-docker.pkg.dev/${PROJECT_ID}/content-studio/server:${COMMIT_SHA}
      - --region
      - europe-west1
      - --platform
      - managed
      - --quiet
images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/content-studio/server:${COMMIT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
