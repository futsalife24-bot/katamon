    if (flash > 0) {
      ctx.save();
      ctx.globalAlpha = alpha * flash;
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2 + 0.6;
        const spread = (1 - flash) * 150 + 62;
        const px = VW / 2 + Math.cos(a) * spread * (0.6 + (i % 3) * 0.28);
        const py = VS_CENTER_Y + Math.sin(a) * spread * 0.5 * (0.6 + (i % 3) * 0.28);
        ctx.fillStyle = i % 2 ? '#ffd15c' : '#ff8a3c';
        ctx.beginPath();
        ctx.arc(px, py, 2.6 + flash * 3.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    drawOutlinedText(cutIn.left.length > 1 || cutIn.right.length > 1 ? '2 vs 2' : '1 vs 1', VW / 2, 706, {
      font: `900 14px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
    });
    ctx.restore();
  }

  function drawCutIn() {
    if (!cutIn) return;
    if (cutIn.kind === 'matchup') {
      drawMatchupCutIn();
      return;
    }
    const elapsed = cutIn.duration - cutIn.timer;
    const fadeIn = Math.min(1, elapsed / 0.15);
    const fadeOut = Math.min(1, cutIn.timer / 0.25);
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, VH * 0.4, VW, 120);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, VH * 0.4, VW, 120);
    // 見出しは陣営の色で出す。文字を読む前に「自分側か相手側か」が分かる。
    ctx.fillStyle = cutIn.color || '#fff';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(cutIn.text, VW / 2, VH * 0.4 + 62);
    if (cutIn.sub) {
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText(cutIn.sub, VW / 2, VH * 0.4 + 92);
    }
    ctx.restore();
  }

  function drawBossBanner() {
    if (bossBannerTimer <= 0) return;
    ctx.save();
    const alpha = Math.min(1, bossBannerTimer / 0.5);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(60,10,10,0.65)';
    ctx.fillRect(0, VH * 0.32, VW, 70);
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('強敵出現!', VW / 2, VH * 0.32 + 45);
    ctx.restore();
  }

    const chargeRatio = me.specialCharge / SPECIAL_CHARGE_MAX;

    // 台座の影
    ctx.beginPath();

        specialBtn.y,

  function drawParticles() {
    for (const ring of empRings) {
      const progress = 1 - ring.life / ring.maxLife;
      ctx.save();
      ctx.globalAlpha = Math.max(0, ring.life / ring.maxLife) * 0.75;
      ctx.strokeStyle = '#66e8ff';
      ctx.shadowColor = '#66e8ff';
      ctx.shadowBlur = 14;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.radius * (0.28 + progress * 0.72), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    for (const pt of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFloatTexts() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    for (const ft of floatTexts) {
      const t = 1 - Math.max(0, ft.life / FLOAT_TEXT_LIFE);
      // 出た瞬間だけ大きく弾ませてから、本来の大きさへ落ち着かせる
      const pop = 1 + 0.45 * Math.max(0, 1 - t * 5);
      ctx.globalAlpha = Math.min(1, Math.max(0, ft.life / FLOAT_TEXT_LIFE) * 1.6);
      ctx.save();
      ctx.translate(ft.x, ft.y);
      ctx.scale(pop, pop);
      ctx.font = `900 ${ft.size}px ${UI_FONT_HEAVY}`;
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.lineWidth = Math.max(4, ft.size * 0.24);
      ctx.strokeText(ft.text, 0, 0);
      ctx.shadowColor = ft.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#fff';
      ctx.fillText(ft.text, 0, 0);
      ctx.shadowBlur = 0;
      ctx.fillStyle = ft.color;
      ctx.globalAlpha *= 0.55;
      ctx.fillText(ft.text, 0, 0);
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // カットイン左側の顔アップ。読み込み済みのキャラ画像を切り出して円窓に描くだけなので負荷は軽い。
  // 描けた場合だけtrueを返し、呼び出し側が文字の配置を切り替える。
  function drawSpecialFlashPortrait(key, cx, cy, r, color, progress) {
    const def = key ? CHARACTERS[key] : null;
    const img = key ? charImages[key] : null;
    if (!def || !img || !img.complete || !img.naturalWidth) return false;
    const [fx, fy, fw] = CHARACTER_FACES[key] || DEFAULT_FACE;
    const sw = img.naturalWidth * fw;
    const sh = sw;
    const sx = Math.max(0, Math.min(img.naturalWidth - sw, img.naturalWidth * fx - sw / 2));
    const sy = Math.max(0, Math.min(Math.max(0, img.naturalHeight - sh), img.naturalHeight * fy - sh / 2));
    // 登場時に少しだけ寄る。止まった絵より勢いが出る。
    const zoom = 1.16 - 0.16 * Math.min(1, progress * 3);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    const back = ctx.createRadialGradient(cx, cy - r * 0.3, 4, cx, cy, r);
    back.addColorStop(0, `${color}55`);
    back.addColorStop(1, 'rgba(2,6,14,0.95)');
    ctx.fillStyle = back;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    const d = r * 2 * zoom;
    if (def.facesLeft) {
      // 元画像が左向きのキャラは、ゲーム中の表示と同じ向きに揃える
      ctx.translate(cx, cy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, sx, sy, sw, sh, -d / 2, -d / 2, d, d);
    } else {
      ctx.drawImage(img, sx, sy, sw, sh, cx - d / 2, cy - d / 2, d, d);
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    return true;
  }

  function drawSpecialFlash() {
    if (specialFlash.timer <= 0) return;
    const duration = 1.12;
    const progress = Math.max(0, Math.min(1, 1 - specialFlash.timer / duration));
    const alpha = Math.sin(Math.min(1, progress * 3.4) * Math.PI / 2) * Math.min(1, specialFlash.timer * 3.1);
    const color = specialFlash.color || '#ff9d42';
    const bandY = VH * 0.33;
    const bandH = 166;
    ctx.save();
    ctx.globalAlpha = alpha;

    // 画面全体のフラッシュと、中央に寄る斜めのスピードライン。
    const glow = ctx.createRadialGradient(VW / 2, VH * 0.42, 8, VW / 2, VH * 0.42, VW * 0.76);
    glow.addColorStop(0, `${color}55`);
    glow.addColorStop(0.46, `${color}1d`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = 'rgba(1,4,12,0.64)';
    ctx.fillRect(0, bandY, VW, bandH);
    ctx.strokeStyle = `${color}dd`;
    ctx.lineWidth = 2;
    ctx.strokeRect(0, bandY + 1, VW, bandH - 2);
    ctx.strokeStyle = `${color}88`;
    ctx.lineWidth = 1;
    for (let i = -4; i <= 4; i++) {
      const offset = i * 58 + progress * 190;
      ctx.beginPath();
      ctx.moveTo(offset - 110, bandY + bandH);
      ctx.lineTo(offset + 125, bandY);
      ctx.stroke();
    }
    const centerGlow = ctx.createLinearGradient(0, bandY, VW, bandY + bandH);
    centerGlow.addColorStop(0, 'rgba(0,0,0,0)');
    centerGlow.addColorStop(0.5, `${color}35`);
    centerGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = centerGlow;
    ctx.fillRect(0, bandY, VW, bandH);

    // 顔アップを左に置けた時だけ、文字を右へ寄せて左揃えにする。
    const portrait = drawSpecialFlashPortrait(specialFlash.key, 92, bandY + bandH / 2, 56, color, progress);
    const textLeft = portrait ? 170 : 0;
    const textCx = portrait ? textLeft + (VW - textLeft - 16) / 2 : VW / 2;

    ctx.textAlign = 'center';
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#050914';
    ctx.lineWidth = 5;
    // 技名が長い時にはみ出さないよう、収まる大きさまで詰める
    let titleSize = 29;
    ctx.font = `900 ${titleSize}px sans-serif`;
    const maxTitleW = VW - textLeft - 24;
    while (titleSize > 17 && ctx.measureText(specialFlash.text).width > maxTitleW) {
      titleSize -= 1;
      ctx.font = `900 ${titleSize}px sans-serif`;
    }
    ctx.strokeText(specialFlash.text, textCx, bandY + 78);
    ctx.fillText(specialFlash.text, textCx, bandY + 78);
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText('SPECIAL ATTACK', textCx, bandY + 102);
    if (specialFlash.sub) {
      ctx.fillStyle = 'rgba(255,255,255,0.86)';
      ctx.font = '11px sans-serif';
      ctx.fillText(specialFlash.sub, textCx, bandY + 124);
    }
    ctx.restore();
  }

  // ===== オンラインランキング =====
  // GASのウェブアプリを叩く。応答に2〜3秒かかるので、待っている間の表示を必ず出す。
  const RANKING_API = 'https://script.google.com/macros/s/AKfycbyFxQKTuCylftKIDWJnQXIp4LaHMlMA0D5EBpO3sZuZQsp90evJ95EjvWiP_wxAK69t/exec';
  const RANKING_KEY = 'katamon_ranking_v1';
  const RANKING_TIMEOUT_MS = 12000;

  let rankingProfile = { deviceId: '', name: '' };
  let pendingScore = null;   // 送信できなかったスコア。次の機会に送り直す
  let rankingBoard = null;   // { period, total, top[], me }
  let rankingState = 'idle'; // 'idle' | 'loading' | 'ready' | 'error'
  let rankingError = '';

  // 敗北画面で「◯位入賞!」を出すための、直前の送信の結果。
  // GASの応答は2〜3秒かかるので、結果画面を出しながら裏で待って後から差し込む。
  let submitState = 'idle'; // 'idle' | 'sending' | 'done' | 'failed' | 'noname'
  let submitRank = 0;
  let submitUpdated = false;
  let submitRevealTimer = 0; // 順位が届いた瞬間の演出用

  function makeDeviceId() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let id = '';
    for (let i = 0; i < 16; i++) id += chars[Math.floor(Math.random() * chars.length)];
    return id;
  }

  function loadRankingProfile() {
    try {
      const raw = localStorage.getItem(RANKING_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d.deviceId === 'string') rankingProfile.deviceId = d.deviceId;
        if (d && typeof d.name === 'string') rankingProfile.name = d.name;
        if (d && d.pending && typeof d.pending === 'object') pendingScore = d.pending;
      }
    } catch (err) { /* 読めなければ新規扱いでよい */ }
    if (!rankingProfile.deviceId) {
      rankingProfile.deviceId = makeDeviceId();
      saveRankingProfile();
    }
  }

  function saveRankingProfile() {
    try {
      localStorage.setItem(RANKING_KEY, JSON.stringify({
        deviceId: rankingProfile.deviceId,
        name: rankingProfile.name,
        pending: pendingScore
      }));
    } catch (err) { /* 保存できなくてもゲームは続行できる */ }
  }

  function hasRankingName() {
    return !!rankingProfile.name;
  }

  // GASは別ドメインへリダイレクトするが、単純なGETなのでCORSは通る(実機で確認済み)。
  async function callRanking(params) {
    const query = Object.keys(params)
      .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`)
      .join('&');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), RANKING_TIMEOUT_MS);
    try {
      const res = await fetch(`${RANKING_API}?${query}`, { signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = JSON.parse(await res.text());
      if (!data || data.ok !== true) throw new Error((data && data.error) || 'ランキングの応答が不正です');
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  function applyBoard(data) {
    rankingBoard = { period: data.period, total: data.total, top: data.top || [], me: data.me || null };
    rankingState = 'ready';
    rankingError = '';
  }

  async function fetchRankingBoard() {
    rankingState = 'loading';
    rankingError = '';
    try {
      applyBoard(await callRanking({ action: 'top', id: rankingProfile.deviceId }));
    } catch (err) {
      rankingState = 'error';
      rankingError = err && err.name === 'AbortError' ? '通信がタイムアウトしました' : '通信に失敗しました';
    }
  }

  // 連勝が途切れた瞬間に呼ぶ。失敗しても捨てずに貯めておき、次の機会に送り直す。
  async function submitScore(streak, efficiency, character) {
    if (!hasRankingName()) {
      submitState = 'noname';
      return;
    }
    submitState = 'sending';
    submitRank = 0;
    submitUpdated = false;
    pendingScore = { streak, efficiency, character };
    saveRankingProfile();
    try {
      const data = await callRanking({
        action: 'submit',
        id: rankingProfile.deviceId,
        name: rankingProfile.name,
        streak,
        eff: efficiency,
        char: character || ''
      });
      applyBoard(data);
      pendingScore = null;
      saveRankingProfile();
      submitRank = data.me ? data.me.rank : 0;
      submitUpdated = data.updated === true;
      submitState = 'done';
      submitRevealTimer = 0.9;
    } catch (err) {
      // 貯めたまま残す。次回の送信時か起動時に再挑戦する。
      submitState = 'failed';
    }
  }

  function flushPendingScore() {
    if (!pendingScore || !hasRankingName()) return;
    const queued = pendingScore;
    submitScore(queued.streak, queued.efficiency, queued.character);
  }

  // ===== 名前入力(HTMLのオーバーレイ)=====
  const nameOverlay = document.getElementById('nameOverlay');
  const nameInput = document.getElementById('nameInput');
  let nameDialogDone = null;

  function openNameDialog(onDone) {
    nameDialogDone = onDone || null;
    nameInput.value = rankingProfile.name || '';
    nameOverlay.classList.add('open');
    // スマホでキーボードを確実に出すため、表示が確定してから焦点を当てる
    setTimeout(() => { try { nameInput.focus(); nameInput.select(); } catch (err) { /* noop */ } }, 30);
  }

  function closeNameDialog(saved) {
    nameOverlay.classList.remove('open');
    try { nameInput.blur(); } catch (err) { /* noop */ }
    const done = nameDialogDone;
    nameDialogDone = null;
    if (done) done(saved);
  }

  document.getElementById('nameOk').addEventListener('click', () => {
    const value = nameInput.value.replace(/[\r\n\t]/g, ' ').trim().slice(0, 12);
    rankingProfile.name = value || 'ななし';
    saveRankingProfile();
    playUiSound();
    closeNameDialog(true);
  });
  document.getElementById('nameCancel').addEventListener('click', () => {
    playUiSound();
    closeNameDialog(false);
  });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('nameOk').click();
  });

  // ===== オンラインロビー(HTML) =====
  // テスト用DOMにはロビー要素が無いので、実ブラウザにだけイベントを登録する。
  if (onlineRoomInput) {
    onlineRoomInput.addEventListener('input', () => {
      const normalized = normalizeRoomCode(onlineRoomInput.value);
      if (onlineRoomInput.value !== normalized) onlineRoomInput.value = normalized;

  const SOUND_SLIDER_W = 300;
  const SOUND_SEGMENTS = 20;              // インジケーターの目盛り数
  const SOUND_STEP = 1 / SOUND_SEGMENTS;  // 5%刻み。目盛り1個=1段階に揃える

  function soundRowAtPoint(p) {
    if (p.x < SOUND_SLIDER_X - 28 || p.x > SOUND_SLIDER_X + SOUND_SLIDER_W + 28) return null;
    for (const key of Object.keys(soundRows)) {
      if (Math.abs(p.y - soundRows[key].y) <= 26) return key;
    }
    return null;
  }
  function volumeOf(key) { return key === 'bgm' ? bgmVolume : sfxVolume; }
  function setVolumeFromPoint(key, p) {
    const raw = (p.x - SOUND_SLIDER_X) / SOUND_SLIDER_W;
    const snapped = Math.round(Math.min(1, Math.max(0, raw)) / SOUND_STEP) * SOUND_STEP;
    const v = Math.min(1, Math.max(0, Math.round(snapped * 100) / 100));
    if (volumeOf(key) === v) return;
    if (key === 'bgm') bgmVolume = v; else sfxVolume = v;
    applyAudioVolumes();
    // BGMは音量0で止め、0から上げた時に鳴り直す必要がある
    if (key === 'bgm') syncBgm();
  }

    // 別のボタンへ化けて見えた。ON/OFFは色と明るさで示す(Codex引き継ぎ書§6 #10)。
    // 消音中は落とした灰色、鳴っている時は真鍮の明るい色。
    drawOutlinedText('♪', soundBtn.x, soundBtn.y + 6, {
      font: `900 16px ${UI_FONT_HEAVY}`,

    if (muted) {

  // 段階式インジケーター1本ぶん
  function drawVolumeRow(key) {
    const row = soundRows[key];
    const value = volumeOf(key);
    const live = soundOn && value > 0;
    drawOutlinedText(`${row.label}  ${row.sub}`, SOUND_SLIDER_X, row.y - 20, {
      align: 'left', font: `900 12px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
    });
    drawOutlinedText(value <= 0 ? 'OFF' : `${Math.round(value * 100)}%`, SOUND_SLIDER_X + SOUND_SLIDER_W, row.y - 20, {
      align: 'right', font: `900 14px ${UI_FONT_HEAVY}`,
      color: live ? UI.parchment : 'rgba(226,232,240,0.5)', lineWidth: 3
    });

    ctx.save();
    // 溝
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(SOUND_SLIDER_X - 5, row.y - 10, SOUND_SLIDER_W + 10, 24);
    ctx.strokeStyle = 'rgba(199,131,53,0.72)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(SOUND_SLIDER_X - 5.5, row.y - 10.5, SOUND_SLIDER_W + 11, 25);

    // 目盛り(点灯するほど真鍮が明るくなる)
    const gap = 3;
    const segW = (SOUND_SLIDER_W - gap * (SOUND_SEGMENTS - 1)) / SOUND_SEGMENTS;
    for (let i = 0; i < SOUND_SEGMENTS; i++) {
      const t = (i + 1) / SOUND_SEGMENTS;
      const on = live && value >= t - 1e-6;
      const x = SOUND_SLIDER_X + i * (segW + gap);
      if (on) {
        const hot = t > 0.8;
        ctx.fillStyle = hot ? '#ffd08a' : '#e0aa55';
        ctx.shadowColor = hot ? '#ffd9a0' : 'rgba(224,170,85,0.9)';
        ctx.shadowBlur = 7;
      } else {
        ctx.fillStyle = 'rgba(255,226,161,0.12)';
        ctx.shadowBlur = 0;
      }
      ctx.fillRect(x, row.y - 6, segW, 16);
    }
    ctx.shadowBlur = 0;

    // つまみ(ドラッグできることを示す)
    const knobX = SOUND_SLIDER_X + SOUND_SLIDER_W * value;
    const knob = ctx.createLinearGradient(knobX - 7, 0, knobX + 7, 0);
    knob.addColorStop(0, '#7d5219');
    knob.addColorStop(0.4, '#ffe6b0');
    knob.addColorStop(0.7, '#c08c3c');
    knob.addColorStop(1, '#5c3c18');
    ctx.fillStyle = knob;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(knobX - 7, row.y - 15, 14, 34, 4);
    else ctx.rect(knobX - 7, row.y - 15, 14, 34);
    ctx.fill();
    ctx.strokeStyle = '#2a1a06';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }

  // 端末に残った古いPWAキャッシュを捨て、ネットワークからゲーム本体を取り直す。
  // URLにも毎回一意の値を付けるので、スマホブラウザの強いキャッシュもすり抜けられる。
  async function forceGameUpdate() {
    if (updateRequestInFlight) return;
    updateRequestInFlight = true;
    try {
      if ('serviceWorker' in navigator) {
        const registration = await navigator.serviceWorker.getRegistration();
        if (registration) {
          await registration.update();
          if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys
          .filter(key => key.startsWith('katamon-pwa-'))
          .map(key => caches.delete(key)));
      }
    } catch (_) {
      // 更新確認に失敗しても、下のキャッシュバスター付き再読み込みは実行する。
    }
    const latestUrl = new URL(location.href);
    latestUrl.searchParams.set('v', BUILD_ID);
    latestUrl.searchParams.set('refresh', Date.now().toString());
    location.replace(latestUrl.href);
  }

  function drawFireButton() {
    if (gamePhase !== 'battle') return;
    const active = isLocalTurn() && !awaitingResolve && !matchOver && !cutIn && !netInputLocked() && localUnit().grounded;
    const cx = FIRE_BTN.x, cy = FIRE_BTN.y, r = FIRE_BTN.r;

    // 引っ張り量から「パワー%」と「仰角」を算出して数値で見せる。
    // ポトリス/ガンバウンドの角度・パワー表示にあたるもので、感覚頼みだった照準を再現しやすくする。
    let power = 0, elevDeg = 0, aiming = false, cancelling = false;
    if (aimState) {
      const dx = aimState.curX - aimState.origin.x;
      const dy = aimState.curY - aimState.origin.y;
      const dist = Math.min(MAX_DRAG, Math.hypot(dx, dy));
      power = Math.round((dist / MAX_DRAG) * 100);
      // 発射方向は引っ張りの逆向きなので、仰角は引っ張りの下向き成分から求まる
      elevDeg = Math.round(Math.atan2(dy, Math.abs(dx)) * 180 / Math.PI);
      aiming = dist >= FIRE_MIN_DRAG;
      cancelling = isInCancelZone(aimState.curX, aimState.curY);
    }

    ctx.save();
    // 台座の影
    ctx.beginPath();
    ctx.arc(cx, cy + 5, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fill();

    // 砲座本体(状態で色味が変わる:通常=鉄、照準中=熱を帯びた金、キャンセル=赤)
    const body = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.42, r * 0.08, cx, cy, r);
    if (cancelling) {
      body.addColorStop(0, '#63292a'); body.addColorStop(0.6, '#3b1618'); body.addColorStop(1, '#1a0a0b');
    } else if (aiming) {
      body.addColorStop(0, '#4d4430'); body.addColorStop(0.6, '#2d2b1d'); body.addColorStop(1, '#14150f');
    } else if (active) {
      body.addColorStop(0, '#3d4850'); body.addColorStop(0.6, '#222a31'); body.addColorStop(1, '#0e1318');
    } else {
      body.addColorStop(0, '#262c31'); body.addColorStop(0.6, '#181d22'); body.addColorStop(1, '#0b0e12');
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = body;
    ctx.fill();

    // 真鍮の外輪
    const ring = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    ring.addColorStop(0, '#f2cd8b');
    ring.addColorStop(0.34, '#a9722f');
    ring.addColorStop(0.62, '#dda85a');
    ring.addColorStop(1, '#573916');
    ctx.strokeStyle = active ? ring : 'rgba(126,116,99,0.5)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 3.5, 0, Math.PI * 2);
    ctx.stroke();

    // 内側の刻み目盛り(砲の照準環らしさ)
    ctx.strokeStyle = active ? 'rgba(255,226,161,0.34)' : 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2 - Math.PI / 2;
      const long = i % 6 === 0;
      const r1 = r - 12, r2 = r - (long ? 22 : 17);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      ctx.stroke();
    }

    // パワーゲージ(真上から時計回りに溜まる)
    if (aiming && !cancelling) {
      const gr = r - 15;
      ctx.lineCap = 'round';
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.42)';
      ctx.beginPath();
      ctx.arc(cx, cy, gr, -Math.PI / 2, Math.PI * 1.5);
      ctx.stroke();
      const t = power / 100;
      const gaugeColor = t > 0.85 ? '#ff6a4d' : t > 0.55 ? UI.gold : '#8fe07a';
      ctx.strokeStyle = gaugeColor;
      ctx.shadowColor = gaugeColor;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(cx, cy, gr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.lineCap = 'butt';
    }
    ctx.restore();

    // 中央の表示
    if (cancelling) {
      // 中心付近はキャンセル圏のリングと指の位置が重なるため、文字はリングの外へ逃がす
      drawOutlinedText('キャンセル', cx, cy + 56, { font: `900 21px ${UI_FONT_HEAVY}`, color: '#ff9c9c' });
      drawOutlinedText('離すと中止', cx, cy + 76, { font: `900 11px ${UI_FONT_HEAVY}`, color: 'rgba(255,180,180,0.85)', lineWidth: 3 });
    } else if (aiming) {
      drawOutlinedText('POWER', cx, cy - 36, { font: `900 11px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3 });
      drawOutlinedText(String(power), cx, cy + 6, { font: `900 46px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 5 });
      drawOutlinedText(`仰角 ${elevDeg}°`, cx, cy + 34, { font: `900 15px ${UI_FONT_HEAVY}`, color: UI.brassLight, lineWidth: 3.5 });
    } else if (active) {
      drawOutlinedText('引いて発射', cx, cy + 5, { font: `900 17px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3.5 });
      drawOutlinedText('PULL & RELEASE', cx, cy + 26, { font: `900 9px ${UI_FONT_HEAVY}`, color: 'rgba(255,226,161,0.6)', lineWidth: 3 });
    } else {
      // 自分の手番でない理由が分かるようにしておく(以前は暗くなるだけだった)
      // 既定を「相手の手番」にしていたため、自分の手番でもカットイン中は
      // ターンバーが「あなたのターン」なのにここが「相手の手番」になり矛盾して見えた。
      // 無効な理由は自分の手番かどうかで分けて出す。
      const reason = matchOver ? '試合終了'
        : !localUnit().grounded ? '落下中'
        : awaitingResolve ? '着弾を待っています'
        : cutIn ? 'まもなく開始'
        : netInputLocked() ? '相手を待っています'
        : isLocalTurn() ? 'まもなく開始'
        : '相手の手番';
      drawOutlinedText(reason, cx, cy + 5, { font: `900 15px ${UI_FONT_HEAVY}`, color: 'rgba(226,232,240,0.5)', lineWidth: 3.5 });
    }
  }

  function drawMenuButton() {
    if (gamePhase !== 'battle') return;
    const active = canOpenMenu();
    ctx.save();
    ctx.beginPath();
    ctx.arc(menuBtn.x, menuBtn.y, menuBtn.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.strokeStyle = active ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = active ? '#fff' : 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    for (const dy of [-5, 0, 5]) {
      ctx.beginPath();
      ctx.moveTo(menuBtn.x - 8, menuBtn.y + dy);
      ctx.lineTo(menuBtn.x + 8, menuBtn.y + dy);
      ctx.stroke();
    }
    ctx.restore();
  }

    if (!confirmDialog) return;
    ctx.save();
    ctx.fillStyle = 'rgba(2,4,7,0.82)';
    ctx.fillRect(0, 0, VW, VH);
    // 背後のキャラカードが明るく透けて読みにくいので、下地を一枚敷く。
    ctx.translate(confirmPanel.x - confirmPanel.w / 2, confirmPanel.y - confirmPanel.h / 2);

    face.addColorStop(0, UI.plateTop);

  function drawMenuOverlay() {

    ctx.save();
    ctx.fillStyle = 'rgba(2,4,7,0.8)';
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();

    // 見出しはプレートを敷かない(「プレート=押せる」と読めるようにするため)。

      font: `900 26px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 5
    });

    for (const [dy, alpha] of [[-112, 0.85], [-72, 0.5]]) {
      const rule = ctx.createLinearGradient(VW / 2 - 120, 0, VW / 2 + 120, 0);
      rule.addColorStop(0, 'rgba(199,131,53,0)');
      rule.addColorStop(0.5, `rgba(240,200,128,${alpha})`);
      rule.addColorStop(1, 'rgba(199,131,53,0)');
      ctx.fillStyle = rule;
      ctx.fillRect(VW / 2 - 120, VH / 2 + dy, 240, 2);

    const exitButton = battleMode === 'free' ? menuSuspendFreeBtn : menuSuspendBtn;

      [menuResumeBtn, 'ゲームに戻る', '']
    ];
    if (battleMode === 'free') items.push([menuRestartBtn, 'リスタート', '演習を最初からやり直します']);
    items.push([exitButton, isOnline() ? 'タイトルへ戻る' : '中断してタイトルへ', isOnline() ? 'オンライン対戦を退出します' : '進行状況を保存します']);
    for (const [b, label, sub] of items) {

      });

      });

        drawOutlinedText(sub, b.x, b.y + 16, {

  function drawCancelZone() {
    if (!aimState) return;
    const inCancel = isInCancelZone(aimState.curX, aimState.curY);
    ctx.save();
    ctx.strokeStyle = inCancel ? 'rgba(255,90,90,0.9)' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(FIRE_BTN.x, FIRE_BTN.y, CANCEL_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = inCancel ? '#ff5a5a' : 'rgba(255,255,255,0.55)';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(inCancel ? 'ここで離すとキャンセル' : '', FIRE_BTN.x, FIRE_BTN.y - FIRE_BTN.r - 10);
    ctx.restore();
  }

  function drawMoveButtons() {
    const me = localUnit();
    const active = isLocalTurn() && me.moveLockTurns <= 0 && !awaitingResolve && !matchOver && !cutIn && !netInputLocked();
    const size = BTN_R * 2;
    // 残り燃料を移動ボタン側にも出しておくと、動かす前に「あと何歩ぶんか」が判断できる
    const fuelRatio = me.fuelMax > 0 ? Math.max(0, me.fuel / me.fuelMax) : 0;
    const canMove = active && fuelRatio > 0;

    for (const [btn, dir] of [[leftBtn, -1], [rightBtn, 1]]) {
      const held = canMove && moveDir === dir;
      ctx.save();
      // 押し込み感:押している間だけ少し沈める
      const dy = held ? 2 : 0;
      ctx.beginPath();
      angularPlatePath(btn.x, btn.y + 4, size, size, 18);
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      ctx.fill();
      ctx.restore();

      drawIronPlate(btn.x, btn.y + dy, size, size, {
        cut: 18,
        edge: canMove ? (held ? '#ffd98f' : UI.brass) : 'rgba(120,112,96,0.5)',
        lineWidth: held ? 3.4 : 2.6,
        glow: held ? 'rgba(255,205,110,0.75)' : null,
        fill: held
          ? 'rgba(74,63,38,0.98)'
          : canMove ? null : 'rgba(18,22,26,0.96)',
        rivets: true,
        rivetInset: 15,
        rivetRadius: 3.6
      });

      // 真鍮の山形(シェブロン)。押下時は明るく光らせる
      ctx.save();
      ctx.translate(btn.x + dir * 3, btn.y + dy);
      ctx.scale(dir, 1);
      ctx.strokeStyle = canMove ? (held ? '#fff3cf' : UI.brassLight) : 'rgba(200,196,186,0.34)';
      ctx.lineWidth = held ? 6.5 : 5.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (held) { ctx.shadowColor = '#ffdc9a'; ctx.shadowBlur = 10; }
      for (const ox of [-9, 4]) {
        ctx.beginPath();
        ctx.moveTo(ox - 5, -13);
        ctx.lineTo(ox + 8, 0);
        ctx.lineTo(ox - 5, 13);
        ctx.stroke();
      }
      ctx.restore();

      // 燃料の残量バー(プレート下辺)
      const barW = size - 34;
      const barX = btn.x - barW / 2;
      const barY = btn.y + dy + BTN_R - 15;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(barX, barY, barW, 5);
      ctx.fillStyle = canMove ? UI.fuel : 'rgba(140,150,160,0.45)';
      ctx.fillRect(barX, barY, barW * fuelRatio, 5);
      ctx.strokeStyle = 'rgba(255,226,161,0.42)';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX + 0.5, barY + 0.5, barW - 1, 4);
      ctx.restore();
    }
  }

  function render() {
    // 地形名・テーマ表示は対戦中だけ見せ、タイトルやキャラ選択では内部情報を隠す。
    debugPanel.style.display = 'none';
    ctx.save();
    if (shakeTimer > 0) {
      const mag = shakeMag * (shakeTimer / 0.3);
      ctx.translate((Math.random() * 2 - 1) * mag, (Math.random() * 2 - 1) * mag);
    }

    if (gamePhase === 'loading' && areCoreImagesReady()) gamePhase = 'press';
    if (gamePhase === 'loading') {
      drawLoadingScreen();
      ctx.restore();
      return;
    }
    if (gamePhase === 'title') {
      drawSky();
      drawParallax();
      ctx.save();
      applyWorldCamera();
      drawTerrain();
      ctx.restore();
      drawTitleScreen();
      drawSoundToggle();
      drawSoundPanel();
      ctx.restore();
      return;
    }
    if (gamePhase === 'press') {
      drawLoadingScreen();
      ctx.restore();
      return;
    }
    if (gamePhase === 'breaking' && wallBreak) {
      // 奥に描くのは本物のタイトル画面。TAP TO START が出る時点でロゴも背景も
      // 読み込み済みなので、フェードでごまかす必要がない。
      drawSky();
      drawParallax();
      ctx.save();
      applyWorldCamera();
      drawTerrain();
      ctx.restore();
      drawTitleScreen();
      drawFortressWall(wallBreak);
      drawWallCannonball(wallBreak);
      drawWallImpactFlash(wallBreak);
      ctx.restore();
      return;
    }
    if (gamePhase === 'select') {
      drawCharacterSelect();
      drawSoundToggle();
      drawSoundPanel();
      drawConfirmDialog();
      ctx.restore();
      return;
    }
    if (gamePhase === 'freeSetup') {
      drawFreeSetupScreen();
      drawSoundToggle();
      drawSoundPanel();
      drawConfirmDialog();
      ctx.restore();
      return;
    }
    if (gamePhase === 'ranking') {
      drawRankingScreen();
      drawSoundToggle();
      drawSoundPanel();
      ctx.restore();
      return;
    }

    drawSky();
    drawParallax();

    // ワールドレイヤー(カメラの影響を受ける)
    ctx.save();
    applyWorldCamera();
    drawTerrain();
    drawArenaObstacles();
    drawTrajectoryPreview();
    drawProjectile();
    drawParticles();
    for (const u of units) drawUnit(u);
    drawFloatTexts();
    ctx.restore();

    // UIレイヤー(スクリーン固定)
    drawDeadLine();
    drawOffscreenIndicator();
    drawBattleHudBackdrop();
    drawWindMeter();
    // 名前カードはキャラが実際に立っている側に置く。以前は自分のカードを必ず左に
    // 置いていたため、ゲスト(e1)は「名前が左・自キャラは右」という食い違いを見ていた。
    // 判定は位置ではなく席で行う。試合中に左右をすれ違ってもカードが飛ばないように。
    drawUnitPanels();
    drawMinimap();
    drawTurnInfo();
    drawControlPanel();
    drawCameraSlider();
    drawJumpButton();
    drawMoveButtons();
    drawFireButton();
    drawPullLine();
    drawCancelZone();
    drawSpecialButton();
    drawSoundToggle();
    drawMenuButton();
    drawMatchEndReason();
    drawOnlineOverlay();
    drawResultBanner();
    drawBossBanner();
    drawSpecialFlash();
    drawTutorialOverlay();
    drawCutIn();

  function updateDebug() {
    debugPanel.textContent =
      `${currentPattern}${startOnIsland ? '(浮島スタート)' : ''} / テーマ:${currentThemeKey}`;
  }

  // ===== 入力(引っ張り照準) =====
  function canvasPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const scaleX = VW / rect.width;
    const scaleY = VH / rect.height;
    return { x: cx * scaleX, y: cy * scaleY };
  }

  function beginPinchIfPossible() {
    const touches = [...activeTouchPoints.entries()].filter(([, p]) => p.y < CONTROL_PANEL_Y);
    if (touches.length < 2) return false;
    const [first, second] = touches.slice(-2);
    const a = first[1], b = second[1];
    const distance = Math.hypot(b.x - a.x, b.y - a.y);
    if (distance < 12) return false;
    const midpointX = (a.x + b.x) / 2;

    // 1本目で始まっていたパンを2本指ズームへ切り替える。
    if (inputMode === 'aim') aimState = null;
    if (inputMode === 'moveL' || inputMode === 'moveR') moveDir = 0;
    inputMode = 'pinch';
    inputPointerId = null;
    pinchState = {
      ids: [first[0], second[0]],
      startDistance: distance,
      startZoom: cameraZoom,
      anchorWorldX: cameraX + midpointX / cameraZoom
    };
    return true;
  }

  function hitButton(p, btn) {
    return Math.hypot(p.x - btn.x, p.y - btn.y) <= BTN_R + 12;
  }

  function onPointerDown(e) {
    e.preventDefault();
    // 通常はカットイン中の操作を止める。ただし通信の致命的エラー画面だけは、
    // 演出より「タップでタイトルへ戻る」を優先し、閉じ込めない。
    const fatalOnlineExit = isOnline() && (online.protocolError || online.peerLeft || online.versionMismatch);
    if (cutIn && !fatalOnlineExit) return;
    const p0 = canvasPointFromEvent(e);
    if (gamePhase === 'loading' || gamePhase === 'breaking') return;
    if (gamePhase === 'press') {
      // 指を離した瞬間を、スマホで確実な音声再生トリガーとして使う。
      inputMode = 'start';
      inputPointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    ensureBgmGraph();
    syncBgm();
    retryBgmOnUserGesture();

    // チュートリアルの「とばす」。手番でも演出中でもいつでも押せるようにする。
    if (tutorialActive() && gamePhase === 'battle' && hitRect(p0, tutorialSkipBtn)) {
      playUiSound();
      skipTutorial();
      return;
    }

    // 確認ダイアログが最優先。開いている間は他の入力を一切通さない。
    if (confirmDialog) {
      if (hitRect(p0, confirmYesBtn)) {
        const onYes = confirmDialog.onYes;
        confirmDialog = null;
        playUiSound();
        if (onYes) onYes();
        return;
      }
      // いいえ、およびダイアログ外のタップはどちらも取り消し扱い(安全側)
      if (hitRect(p0, confirmNoBtn) || !hitRect(p0, confirmPanel)) {
        confirmDialog = null;
        playUiSound();
      }
      return;
    }

    // サウンド設定は全画面共通で扱う。パネルが開いている間は他の入力を通さない。
    if (soundPanelOpen) {
      if (hitRect(p0, soundCloseBtn)) {
        soundPanelOpen = false;
        saveAudioSettings();
        playUiSound();
        return;
      }
      if (hitRect(p0, soundMasterBtn)) {
        soundOn = !soundOn;
        applyAudioVolumes();
        syncBgm();
        saveAudioSettings();
        if (soundOn) playUiSound();
        return;
      }
      const row = soundRowAtPoint(p0);
      if (row) {
        inputMode = 'volumeSlider';
        inputPointerId = e.pointerId;
        volumeDragKey = row;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* 合成イベント等では捕捉できない */ }
        setVolumeFromPoint(row, p0);
        return;
      }
      // パネル外をタップしたら閉じる
      if (!hitRect(p0, soundPanel)) {
        soundPanelOpen = false;
        saveAudioSettings();
      }
      return;
    }
    // ポーズメニュー表示中は♪が覆い隠されているので、見えないボタンには反応させない。
    if (!menuOpen && Math.hypot(p0.x - soundBtn.x, p0.y - soundBtn.y) <= soundBtn.r + 10) {
      soundPanelOpen = true;
      playUiSound();
      return;
    }

    if (gamePhase === 'title') {
      if (hitRect(p0, titleVsCpuBtn)) {
        playUiSound();
        battleMode = 'normal';
        selectWheelPosition = 0;
        selectWheelVelocity = 0;
        selectWheelDragging = false;
        gamePhase = 'select';
      } else if (hitRect(p0, titleOnlineBtn)) {
        playUiSound();
        openOnlineLobby();
      } else if (hitRect(p0, titleBonusBtn)) {
        playUiSound();
        // iOS対策のWebAudio経路は、確実なユーザー操作の中で用意する必要がある。
        ensureBgmGraph();
        // 押すたび 1曲目 → 2曲目 → 停止(タイトル曲へ戻る) を繰り返す。
        bonusBgmTrack = (bonusBgmTrack + 1) % BONUS_BGM_TRACKS.length;
        syncBgm();
      } else if (hitRect(p0, titleRankingBtn)) {
        playUiSound();
        gamePhase = 'ranking';
        fetchRankingBoard();
      } else if (hitRect(p0, titleTutorialBtn)) {
        playUiSound();
        startTutorial();
      } else if (hitRect(p0, titleFreeBtn)) {
        playUiSound();
        gamePhase = 'freeSetup';
      } else if (hitRect(p0, titleUpdateBtn)) {
        playUiSound();
        forceGameUpdate();
      }
      return;
    }
    if (gamePhase === 'ranking') {
      if (hitRect(p0, rankingBackBtn)) {
        playUiSound();
        gamePhase = 'title';
        return;
      }
      if (hitRect(p0, rankingNameBtn)) {
        playUiSound();
        openNameDialog(saved => {
          // 名前を決めた直後に、貯めてある記録があれば送って一覧を更新する
          if (!saved) return;
          if (pendingScore) flushPendingScore();
          else fetchRankingBoard();
        });
        return;
      }
      if (rankingState === 'error' && hitRect(p0, rankingRetryBtn)) {
        playUiSound();
        fetchRankingBoard();
      }
      return;
    }
    if (gamePhase === 'freeSetup') {
      if (hitRect(p0, freeStartBtn)) {
        playUiSound();
        startFreeMatch();
        return;
      }
      if (hitRect(p0, freeBackBtn)) {
        playUiSound();
        gamePhase = 'title';
        return;
      }
      for (const [kind, row] of Object.entries(freeRows)) {
        if (Math.abs(p0.y - (row.y + 7)) > row.h / 2) continue;
        if (p0.x <= 86) {
          changeFreeOption(kind, -1);
          return;
        }
        if (p0.x >= VW - 86) {
          changeFreeOption(kind, 1);
          return;
        }
      }
      return;
    }
    if (gamePhase === 'select') {
      // 確認中は他の操作をすべて飲み込む。裏のホイールが回ると、何を確認しているのか
      // 分からなくなるため。枠の外を叩いた時は取り消し扱い。
      if (pendingNewMatchKey) {
        playUiSound();
        if (hitRect(p0, newMatchResumeBtn)) resolveNewMatchConfirm('resume');
        else if (hitRect(p0, newMatchStartBtn)) resolveNewMatchConfirm('start');
        else resolveNewMatchConfirm('cancel');
        return;
      }
      if (hitRect(p0, selectBackBtn)) {
        playUiSound();
        leaveSelectToTitle();
        return;
      }
      if (hasSuspendedSave && hitRect(p0, resumeBtn)) {
        resumeSuspendedMatch();
        return;
      }
      const tappedCard = getSelectCardAtPoint(p0);
      selectWheelDragging = true;
      selectWheelLastY = p0.y;
      selectWheelLastTime = e.timeStamp;
      selectWheelTravel = 0;
      selectWheelTapKey = tappedCard?.key || null;
      selectWheelVelocity = 0;
      inputMode = 'selectWheel';
      inputPointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      return;
    }

    if (menuOpen) {
      if (hitRect(p0, menuResumeBtn)) { menuOpen = false; return; }
      if (battleMode === 'free' && hitRect(p0, menuRestartBtn)) {
        playUiSound();
        menuOpen = false;
        gamePhase = 'battle';
        winStreak = 0;
        runStats = { damageDealt: 0, shots: 0 };
        resetMatch(false);
        return;
      }
      const exitButton = battleMode === 'free' ? menuSuspendFreeBtn : menuSuspendBtn;
      if (hitRect(p0, exitButton)) {
        if (isOnline()) {
          exitOnlineFromMenu();
          return;
        }
        saveSuspendedMatch();
        menuOpen = false;
        gamePhase = 'title';
        hasSuspendedSave = true;
        syncBgm(); // ステージ曲を止めてタイトル曲へ戻す判断はdirector側に任せる
        return;
      }
      return; // メニュー表示中は他の操作を無視
    }

    if (canOpenMenu() && Math.hypot(p0.x - menuBtn.x, p0.y - menuBtn.y) <= menuBtn.r + 10) {
      menuOpen = true;
      return;
    }

    // 通信エラーの画面だけは、ログコピー用のボタンを先に拾ってから「どこでもタイトルへ」にする。
    if (isOnline() && online.protocolError && !matchOver) {
      if (hitRect(p0, onlineLogCopyBtn)) { copyOnlineLog(); return; }
      releaseFirebaseRoomOnFatalExit();
      endOnline(false);
      returnToTitleFromResult();
      return;
    }
    // 相手が消えた/通信バージョンが違うときは、どこをタップしてもタイトルへ抜けられるようにする。
    if (isOnline() && (online.peerLeft || online.versionMismatch) && !matchOver) {
      releaseFirebaseRoomOnFatalExit();
      endOnline(false);
      returnToTitleFromResult();
      return;
    }

    if (matchOver) {
      if (matchEndPause > 0) return; // 決着理由を見せている間は誤タップで飛ばさせない
      const shift = resultButtonShift();
      const b = continueBtn;
      if (firebaseResultChoiceVisible()) {
        if (firebaseHasResultVote()) return; // 投票済み。相手の返事を待つ
        if (Math.abs(p0.x - b.x) <= b.w / 2 && Math.abs(p0.y - b.y - shift) <= b.h / 2) { requestFirebaseRematch(); return; }
        if (hitRect({ x: p0.x, y: p0.y - shift }, resultTitleBtn)) { requestFirebaseReturnLobby(); }
        return;
      }
      if (!isOnline() && Math.abs(p0.x - b.x) <= b.w / 2 && Math.abs(p0.y - b.y - shift) <= b.h / 2) {
        resetMatch(true);
        return;
      }
      if (hitRect({ x: p0.x, y: p0.y - shift }, resultTitleBtn)) {
        if (isOnline()) endOnline(true);
        if (keepsRunOnExit()) suspendRunToTitle();
        else returnToTitleFromResult();
      }
      return;
    }

    // コントローラー右上のスライダーは常に自分の視点だけを変える。オンラインでも送信しない。
    if (isInCameraSlider(p0)) {
      inputMode = 'cameraSlider';
      inputPointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      setCameraZoomFromSlider(p0);
      return;
    }

    // ミニマップはタップ/ドラッグした地点へ即座に視点移動する。
    if (isInMinimap(p0)) {
      moveCameraFromMinimap(p0, true);
      inputMode = 'minimap';
      inputPointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      return;
    }

    // 戦場エリアの2本指操作。指を広げると等倍へ、縮めると全景へ戻る。
    if (e.pointerType === 'touch' && p0.y < CONTROL_PANEL_Y) {
      activeTouchPoints.set(e.pointerId, p0);
      canvas.setPointerCapture(e.pointerId);
      if (beginPinchIfPossible()) return;
    }

    // 移動ボタン・必殺ボタン・発射ボタンは自分のターンでのみ
    if (isLocalTurn() && !awaitingResolve && !netInputLocked()) {
      const me = localUnit();
      if (me.moveLockTurns <= 0 && hitButton(p0, leftBtn)) {
        inputMode = 'moveL'; inputPointerId = e.pointerId; moveDir = -1;
        canvas.setPointerCapture(e.pointerId);
        return;
      }
      if (me.moveLockTurns <= 0 && hitButton(p0, rightBtn)) {
        inputMode = 'moveR'; inputPointerId = e.pointerId; moveDir = 1;
        canvas.setPointerCapture(e.pointerId);
        return;
      }
      if (me.jumpAvailable !== false && me.moveLockTurns <= 0 && Math.hypot(p0.x - jumpBtn.x, p0.y - jumpBtn.y) <= jumpBtn.r + 10) {
        jumpArmed = !jumpArmed;
        if (jumpArmed) pushFloatText(me.x, me.y - UNIT_RADIUS - 28, '着地後 移動不能 1ターン', '#8ee7ff', 16);
        return;
      }
      if (isSpecialReady(me) && Math.hypot(p0.x - specialBtn.x, p0.y - specialBtn.y) <= specialBtn.r + 10) {
        specialArmed = !specialArmed;
        return;
      }
      if (me.grounded && Math.hypot(p0.x - FIRE_BTN.x, p0.y - FIRE_BTN.y) <= FIRE_BTN.r + 10) {
        // 固定アンカー式:発射ボタンの中心から引っ張った分だけ飛ぶ
        inputMode = 'aim'; inputPointerId = e.pointerId;
        aimState = { anchor: unitAnchor(me), origin: { x: FIRE_BTN.x, y: FIRE_BTN.y }, curX: p0.x, curY: p0.y };
        canvas.setPointerCapture(e.pointerId);
        return;
      }
    }

    // それ以外は画面を直接スライドして視点移動(どちらのターン中でも可・離しても位置はそのまま)
    if (p0.y < CONTROL_PANEL_Y) {
      inputMode = 'pan'; inputPointerId = e.pointerId;
      panLastX = p0.x;
      canvas.setPointerCapture(e.pointerId);
    }
  }

  function onPointerMove(e) {
    const p = canvasPointFromEvent(e);
    if (e.pointerType === 'touch' && activeTouchPoints.has(e.pointerId)) {
      activeTouchPoints.set(e.pointerId, p);
    }
    if (pinchState && pinchState.ids.includes(e.pointerId)) {
      const a = activeTouchPoints.get(pinchState.ids[0]);
      const b = activeTouchPoints.get(pinchState.ids[1]);
      if (a && b) {
        const distance = Math.max(12, Math.hypot(b.x - a.x, b.y - a.y));
        const midpointX = (a.x + b.x) / 2;
        cameraZoom = clampCameraZoom(pinchState.startZoom * distance / pinchState.startDistance);
        saveCameraZoom();
        cameraX = clampCameraX(pinchState.anchorWorldX - midpointX / cameraZoom);
        cameraTargetX = null;
      }
      return;
    }
    if (e.pointerId !== inputPointerId) return;
    if (inputMode === 'volumeSlider') {
      if (volumeDragKey) setVolumeFromPoint(volumeDragKey, p);
      return;
    }
    if (inputMode === 'cameraSlider') {
      setCameraZoomFromSlider(p);
      return;
    }
    if (inputMode === 'selectWheel' && gamePhase === 'select') {
      const dy = p.y - selectWheelLastY;
      const elapsed = Math.max(8, e.timeStamp - selectWheelLastTime) / 1000;
      selectWheelPosition = wrapSelectWheelPosition(selectWheelPosition - dy / SELECT_WHEEL_DRAG_STEP);
      selectWheelVelocity = Math.max(-9, Math.min(9, (-dy / SELECT_WHEEL_DRAG_STEP) / elapsed));
      selectWheelTravel += Math.abs(dy);
      selectWheelLastY = p.y;
      selectWheelLastTime = e.timeStamp;
    } else if (inputMode === 'aim' && aimState) {
      aimState.curX = p.x;
      aimState.curY = p.y;
    } else if (inputMode === 'minimap') {
      moveCameraFromMinimap(p);
    } else if (inputMode === 'pan') {
      cameraX = clampCameraX(cameraX - (p.x - panLastX) / cameraZoom);
      cameraTargetX = null;
      panLastX = p.x;
    }
  }

  function onPointerUp(e) {
    if (e.pointerType === 'touch') activeTouchPoints.delete(e.pointerId);
    if (inputMode === 'volumeSlider' && e.pointerId === inputPointerId) {
      const key = volumeDragKey;
      inputMode = null;
      inputPointerId = null;
      volumeDragKey = null;
      saveAudioSettings();
      // 決めた音量を耳で確認できるよう、離した瞬間に一度だけ鳴らす
      if (key === 'sfx') playUiSound();
      return;
    }
    if (inputMode === 'start' && e.pointerId === inputPointerId) {
      inputMode = null;
      inputPointerId = null;
      if (e.type === 'pointerup' && gamePhase === 'press') {
        // このユーザー操作の中で直接play()を呼ぶ。音源待ちが止まっても安全弁でタイトルへ進む。
        const aim = canvasPointFromEvent(e);
        enterTitleFromTap();
        playUiSound();
        // 砲弾を撃ち込むのは enterTitleFromTap の後。先に切り替えると
        // finishTitleStart の 'press' 判定と噛み合わなくなる。
        beginWallBreak(aim);
      }
      return;
    }
    if (inputMode === 'selectWheel' && e.pointerId === inputPointerId) {
      const p = canvasPointFromEvent(e);
      selectWheelDragging = false;
      if (e.type === 'pointerup' && selectWheelTravel < 10) {
        const tappedCard = getSelectCardAtPoint(p);
        if (tappedCard && tappedCard.key === selectWheelTapKey) {
          if (tappedCard.index === getFocusedSelectIndex() && Math.abs(getSelectWheelDelta(tappedCard.index)) < 0.15) {
            if (hitRect(p, selectSortieBtn)) {
              playUiSound();
              inputMode = null;
              inputPointerId = null;
              selectWheelTapKey = null;
              // 中断データがある時は、消える前に一度止める。selectCharacterAndStart() は
              // 入口で clearSuspendedMatch() を呼ぶので、ここを通すともう戻せない。
              requestNewMatch(tappedCard.key);
              return;
            }
          } else {
            focusSelectWheelIndex(tappedCard.index);
            playUiSound();
          }
        }
      }
      selectWheelTapKey = null;
      inputMode = null;
      inputPointerId = null;
      return;
    }
    if (pinchState && pinchState.ids.includes(e.pointerId)) {
      pinchState = null;
      inputMode = null;
      inputPointerId = null;
      return;
    }
    if (e.pointerId !== inputPointerId) return;
    if (inputMode === 'aim' && aimState) {
      if (!isInCancelZone(aimState.curX, aimState.curY)) {
        let dx = aimState.curX - aimState.origin.x;
        let dy = aimState.curY - aimState.origin.y;
        const dist = Math.min(MAX_DRAG, Math.hypot(dx, dy));
        if (dist >= FIRE_MIN_DRAG) {
          const ang = Math.atan2(dy, dx);
          dx = Math.cos(ang) * dist;
          dy = Math.sin(ang) * dist;
          const me = localUnit();
          const def = CHARACTERS[me.character];
          const { vx0, vy0 } = computeLaunchVelocity(dx, dy, def);
          netSendFire(me, aimState.anchor, vx0, vy0, specialArmed, jumpArmed && me.jumpAvailable !== false && me.moveLockTurns <= 0);
          launchShot(me, aimState.anchor, vx0, vy0, specialArmed, false, jumpArmed);
          runStats.shots++;
          specialArmed = false;
          jumpArmed = false;
          awaitingResolve = true;
        }
      }
      aimState = null;
    } else if (inputMode === 'moveL' || inputMode === 'moveR') {
      moveDir = 0;
    }
    inputMode = null;
    inputPointerId = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('wheel', (e) => {
    if (gamePhase !== 'select') return;
    e.preventDefault();
    selectWheelDragging = false;
    selectWheelVelocity = Math.max(-8, Math.min(8, selectWheelVelocity + e.deltaY * 0.018));
  }, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('dragstart', (e) => e.preventDefault());
  window.addEventListener('pointercancel', onPointerUp);

  function resetMatch(carrySpecialCharge) {
    // 必殺チャージの持ち越しは人数ぶん保持する(1vs1でも2vs2でも同じ扱い)。
    const carriedCharge = {};
    for (const u of units) carriedCharge[u.id] = carrySpecialCharge ? u.specialCharge : 0;
    // VS:CPUの10連勝ごとのボス戦は、中央が奈落になった専用の闘技場マップで行う。
    isBossMatch = battleMode === 'normal' && winStreak > 0 && winStreak % 10 === 0;
    const lobbySettings = battleMode === 'normal' && online && online.kind === 'firebase' ? online.settings : null;
    const freeWind = activeFixedWind();
    calmBattle = freeWind ? freeWind.key === 'calm' : Math.random() < CALM_BATTLE_CHANCE;
    calmWind = false;
    const freeTerrain = battleMode === 'free' ? FREE_TERRAIN_OPTIONS[freeModeConfig.terrainIndex]
      : (lobbySettings ? FREE_TERRAIN_OPTIONS.find(option => option.key === lobbySettings.terrain) : null);
    // チュートリアルの地形は固定する。ランダムだと闘技場のように中央が奈落の地形を引き、
    // 的が足場の無い場所へ置かれて落ちてしまう(そのまま「当てた」と誤判定していた)。
    // なだらかな地形なら、誰がやっても同じ手触りで覚えられる。
    const selectedTerrain = battleMode === 'tutorial'
      ? 'rolling'
      : (isBossMatch
        ? 'tieredBasin'
        : (freeTerrain && freeTerrain.key !== 'random' ? freeTerrain.key : undefined));
    newTerrain(selectedTerrain);
    simTimeMs = 0;
    for (const u of units) applyCharacter(u, u.character);
    // 闘技場マップは外壁の天辺ではなく、左右から内側へ伸びる上段棚を開始位置にする。
    const mortarShelfStart = currentPattern === 'tieredBasin';
    // 陣営ごとに外側から内側へ並べ、2vs2でも左右対称にする。
    const spawnRatio = mortarShelfStart
      ? { p1: 0.18, p2: 0.32, e1: 0.82, e2: 0.68 }
      : { p1: 0.15, p2: 0.30, e1: 0.85, e2: 0.70 };
    const placed = [];
    for (const u of units) {
      u.x = spawnXNear(STAGE_W * (spawnRatio[u.id] != null ? spawnRatio[u.id] : 0.5), placed);
      initUnitOnGround(u);
      placed.push(u);
    }
    projectiles = [];
    aimState = null;
    moveDir = 0;
    inputMode = null;
    inputPointerId = null;
    activeTouchPoints.clear();
    pinchState = null;
    specialArmed = false;
    for (const u of units) u.specialCharge = Math.max(0, Math.min(SPECIAL_CHARGE_MAX, carriedCharge[u.id] || 0));
    matchOver = false;
    matchEndPause = 0;
    matchEndReason = '';
    turnSettle = TURN_SETTLE_SEC;
    winner = null;
    awaitingResolve = false;
    submitState = 'idle';
    submitRank = 0;
    submitRevealTimer = 0;
    turnCount = 0;
    turnOrder = units.map(u => u.id);
    activeIndex = 0;
    for (const u of units) { u.jumpAvailable = true; u.jumpShot = false; }
    cpuMoveDir = 0;
    cpuMoveRemaining = 0;
    cpuPhase = 'aim';
    // 前の試合の思考時間を持ち越さない。0のまま残ると、手番へ入った最初の1フレームで撃つ。
    cpuThinkTimer = 0;
    // 開始カットインが終わるまで手番は始めない。オンラインのホストはこのあと
    // 通信を4往復してからカットインを出すので、その間ずっと止めておく必要がある。
    battleIntroPending = true;
    particles = [];
    empRings = [];
    lightningBeams = [];
    floatTexts = [];
    shakeTimer = 0;
    specialFlash = { timer: 0, text: '' };
    pendingShot = null;
    confirmDialog = null;
    cutIn = null;
    focusCameraOn(localUnit().x, true);
    menuOpen = false;
    bossBannerTimer = isBossMatch ? 2.2 : 0;
    startTurn();
    // Firebaseホストは、このあと開始スナップショットの保存・送信を待つ。その間も
    // ロビーの裏でgameLoopが進むので、closeOnlineLobby後に改めて表示する。
    if (!(isOnline() && online.kind === 'firebase')) showBattleStartCutIn();
    // 戦闘開始・再戦・連戦(ボス連勝)のすべてがここを通る。gamePhaseがbattle以外なら
    // syncBgm内部のdesiredBgmが'stage'を返さないので、実質的に何もしない
    // (例:suspendRunToTitleはresetMatch呼び出し前にgamePhaseをtitleへ戻して抑止している)。
    if (gamePhase === 'battle') syncBgm({ restartStage: true });
  }

  window.addEventListener('keydown', (e) => {
    if ((e.key === 'r' || e.key === 'R') && gamePhase === 'battle') resetMatch(false);
  });

  window.addEventListener('resize', resize);
  // スリープ・アプリ切り替え・タブ移動でBGMを止め、戻ってきたら鳴らし直す
  document.addEventListener('visibilitychange', () => {
    resetFirebasePendingTerminalClocks();
    if (document.hidden) suspendAudioForHidden();
    else {
      resumeAudioAfterVisible();
      // 裏に居る間はタイマーが絞られるので、戻った時点で一度取り戻しておく。
      // 期限切れは戻ってからでは間に合わない(部屋ごと消える)ため、ここは待たずに投げる。
      renewFirebaseRoomLease();
      scheduleFirebaseRoomLease();
    }
  });
  // iOSなどvisibilitychangeが来ない経路(bfcache行き)の保険
  window.addEventListener('pagehide', () => {
    // ホストだけは部屋を残さないよう、終了通知と削除をベストエフォートで投げる。
    // ここで待つとbfcache/終了処理を妨げるため、失敗は次の期限切れに任せる。
    if (online && online.kind === 'firebase' && online.role === 'host') endOnline(true, true, true);
    suspendAudioForHidden();
  });
  window.addEventListener('pageshow', () => {
    if (!document.hidden) resumeAudioAfterVisible();
  });

  // ===== 端末の「戻る」操作 =====
  // Androidの戻るボタンやiOSのスワイプバックは、そのままだとバトル中にアプリごと終了してしまう。
  // 履歴にダミーを1つ積んでおき、戻る操作をpopstateで受け取ってメニュー表示に振り替える。
  let backTrapDepth = 0;     // 積んであるダミーの数(0か1)
  let ignoringBackPop = false; // 自分でhistory.back()した分のpopstateを無視するため

  function armBackTrap() {
    if (backTrapDepth > 0) return;
    try {
      history.pushState({ katamonGuard: true }, '');
      backTrapDepth = 1;
    } catch (err) { /* 履歴を触れない環境では戻る操作の制御を諦める */ }
  }

  function disarmBackTrap() {
    if (backTrapDepth <= 0) return;
    backTrapDepth = 0;
    ignoringBackPop = true;
    try {
      history.back();
    } catch (err) { ignoringBackPop = false; }
  }

  // バトル中と各選択画面で捕まえる。タイトルでは戻る操作でそのまま終了できるようにしておく。
  function backTrapWanted() {
    return gamePhase === 'battle' || gamePhase === 'select'
      || gamePhase === 'freeSetup' || gamePhase === 'ranking';
  }

  function syncBackTrap() {
    if (backTrapWanted()) armBackTrap();
    else disarmBackTrap();
  }

  window.addEventListener('popstate', () => {
    if (ignoringBackPop) { ignoringBackPop = false; return; }
    backTrapDepth = 0; // ブラウザ側でダミーが1つ消費された
    if (!backTrapWanted()) return;
    // 捕まえたら必ず積み直す。これを忘れると次の戻る操作でアプリが終了する。
    armBackTrap();
    if (confirmDialog) {
      confirmDialog = null;
      playUiSound();
      return;
    }
    if (gamePhase === 'ranking') {
      // 見るだけの画面なので、確認を挟まずそのままタイトルへ返す
      gamePhase = 'title';
      playUiSound();
      return;
    }
    if (gamePhase === 'select') {
      openConfirmDialog('メニューに戻りますか?', 'キャラクター選択をやめます', leaveSelectToTitle);
      return;
    }
    if (gamePhase === 'freeSetup') {
      openConfirmDialog('メニューに戻りますか?', 'フリーモードの設定をやめます', () => { gamePhase = 'title'; });
      return;
    }
    if (soundPanelOpen) {
      soundPanelOpen = false;
      saveAudioSettings();
      playUiSound();
      return;
    }
    if (menuOpen) {
      menuOpen = false;
      playUiSound();
      return;
    }
    if (canOpenMenu()) {
      menuOpen = true;
      playUiSound();
      return;
    }
    // 発射中やカットイン中はメニューを開けない。握りつぶすだけにして終了だけは防ぐ。
  });

  // ===== ゲームループ =====
  let lastTime = 0;

  // ===== 固定刻みの物理(Issue #9) =====
  // 描画フレーム間隔をそのまま物理へ渡すと、端末のリフレッシュレートが違うだけで
  // 弾が別の場所を通る。その差が「DEAD LINEは1pxで即死」「壁に当たるか否か」という
  // 全か無かの判定を通って、勝敗の食い違いや座標364pxのズレになった(実機で再現)。
  // ここに載せてよいのは「両端末で完全に一致しなければならない計算」だけ。
  // カメラ・演出・入力・CPU思考は従来どおり描画フレーム基準のままにする。
  const PHYSICS_DT = 1 / 120;      // 秒。全端末共通の刻み
  const MAX_PHYSICS_SUBSTEPS = 8;  // 1フレームで進める上限(gameLoop側のdt上限0.033で実質4)
  let physicsAccumulator = 0;
  // 進める刻み数だけを先に確定する。余りは破棄せず次フレームへ繰り越す
  // (破棄すると端末ごとに進行量が変わり、固定刻みにした意味がなくなる)。
  function takePhysicsSteps(frameDt) {
    physicsAccumulator += frameDt;
    let steps = 0;
    while (physicsAccumulator >= PHYSICS_DT && steps < MAX_PHYSICS_SUBSTEPS) {
      physicsAccumulator -= PHYSICS_DT;
      steps++;
    }
    return steps;
  }
  function resetPhysicsClock() { physicsAccumulator = 0; }

  function update(dt) {
    // 相手待ちの再送と受信キューの消化は、画面がタイトルでも回す必要がある。
    updateOnline(dt);
    // 画面の揺れは描画側の効果であって対戦の状態ではない。**どの画面でも必ず減らす。**
    // 以前はこれを対戦中の分岐の内側でやっていたため、起動演出(着弾で揺らす)のあと
    // タイトルへ移ると減衰が一度も走らず、画面が永久に震え続けた。
    if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
    if (gamePhase === 'breaking') { updateWallBreak(dt); return; }
    updateTutorial(dt);
    if (gamePhase === 'select') {
      updateSelectWheel(dt);
      return;
    }
    if (gamePhase !== 'battle') return;
    if (menuOpen) return; // メニュー表示中はゲーム進行を止める

    // 物理を何刻み進めるかを先に確定する。実際の弾と落下の計算は、
    // カットイン判定の後で同じ回数だけ回す(カットイン中は従来どおり進めない)。
    const physicsSteps = takePhysicsSteps(dt);
    // 対戦内の経過時間。壁時計ではなくこれを使うことで、障害物の揺れが
    // 「端末をいつ起動したか」に左右されなくなる(中断再開でも位相が続く)。
    simTimeMs += physicsSteps * PHYSICS_DT * 1000;

    // カメラ:飛翔中は弾を追い、手番開始時は次のキャラへ滑らかに戻る。
    if (projectiles.length) {
      const target = centerCameraOn(projectiles[0].x);
      cameraX += (target - cameraX) * Math.min(1, dt * 5);
      cameraTargetX = null;
    } else if (cameraTargetX !== null) {
      cameraX += (cameraTargetX - cameraX) * Math.min(1, dt * 6);
      if (Math.abs(cameraTargetX - cameraX) < 0.5) {
        cameraX = cameraTargetX;
        cameraTargetX = null;
      }
    }

    // 演出系の更新はカットイン中も続ける(残り続けて画面に出っぱなしになるのを防ぐ)
    // 画面の揺れだけは update の先頭で減らす。ここは対戦中しか通らないため。
    if (bossBannerTimer > 0) bossBannerTimer = Math.max(0, bossBannerTimer - dt);
    if (specialFlash.timer > 0) specialFlash.timer = Math.max(0, specialFlash.timer - dt);
    if (submitRevealTimer > 0) submitRevealTimer = Math.max(0, submitRevealTimer - dt);
    if (matchEndPause > 0) {
      const before = matchEndPause;
      matchEndPause = Math.max(0, matchEndPause - dt);
      // 「落下…」などの決まり手ではなく、次の勝敗画面が出る瞬間に一度だけ鳴らす。
      if (before > 0 && matchEndPause === 0) {
        if (localWon()) playVictorySound();
        else playDefeatSound();
        triggerShake(5, 0.2);
      }
    }
    // カットインが終わったところで、保留していた必殺の弾を発射する。
    if (pendingShot) {
      pendingShot.timer -= dt;
      if (pendingShot.timer <= 0) {
        const fire = pendingShot.fire;
        pendingShot = null;
        fire();
      }
    }
    for (let i = lightningBeams.length - 1; i >= 0; i--) {
      lightningBeams[i].life -= dt;
      if (lightningBeams[i].life <= 0) lightningBeams.splice(i, 1);
    }

    // パーティクル更新
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.vy += 400 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
    for (let i = empRings.length - 1; i >= 0; i--) {
      empRings[i].life -= dt;
      if (empRings[i].life <= 0) empRings.splice(i, 1);
    }
    // ダメージ数字ポップ更新
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i];
      ft.y += ft.vy * dt;
      ft.vy *= Math.pow(0.12, dt); // 勢いよく浮いてから、その場に留まって読ませる
      ft.life -= dt;
      if (ft.life <= 0) floatTexts.splice(i, 1);
    }

    if (cutIn) {
      cutIn.timer -= dt;
      if (cutIn.timer <= 0) {
        const done = cutIn.onDone;
        cutIn = null;
        if (done) done();
      }
      return; // カットイン表示中はターン進行・移動・CPU思考を止める
    }

    // 弾と落下だけを固定刻みで進める。ここが両端末で一致していないと、
    // 地形の削れ方も落下の可否も食い違い、対戦が中断する。
    for (let step = 0; step < physicsSteps; step++) {
      stepWorldPhysics(PHYSICS_DT);
      if (matchOver) break;
    }

    if (matchOver) return;
    updateAfterPhysics(dt);
  }

  // 弾と落下。必ず固定刻み(PHYSICS_DT)で呼ぶこと。ここへ描画フレームのdtを
  // 渡すと Issue #9 の不具合がそのまま戻る。
  function stepWorldPhysics(dt) {
    // 弾の物理(花火の本体弾と、地形を細く削る8方向の拡散弾に対応)
    let trailDirty = false;
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      const prevX = p.x;
      const prevY = p.y;
      p.prevX = prevX;
      p.prevY = prevY;
      const windAccel = wind.dir * wind.strength * WIND_ACCEL_MAX * p.windMul;
      p.vx += windAccel * dt;
      // gravityMulは0(無重力の電撃)を取り得るので、||でのフォールバックは使えない。
      p.vy += GRAVITY * (p.gravityMul != null ? p.gravityMul : 1) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (p.firework) p.fireworkTimer += dt;
      if (p.fireworkShard) {
        const stepX = p.vx * dt;
        const stepY = p.vy * dt;
        const stepLen = Math.sqrt(stepX * stepX + stepY * stepY);
        p.travelDistance += stepLen;
        // 爆発の位置はフレーム数ではなく「進んだ距離」で決める。毎フレーム基準だと
        // 削れ方も craterHistory の長さもフレームレート次第で変わってしまう。
        const stride = p.maxDistance / FIREWORK_SHARD_BLASTS.length;
        while (p.shardBlasts < FIREWORK_SHARD_BLASTS.length
               && p.travelDistance >= stride * (p.shardBlasts + 1)) {
          const back = stepLen > 0 ? (p.travelDistance - stride * (p.shardBlasts + 1)) / stepLen : 0;
          fireworkShardExplode(p, FIREWORK_SHARD_BLASTS[p.shardBlasts], p.x - stepX * back, p.y - stepY * back);
          p.shardBlasts++;
          trailDirty = true;
        }
        if (p.travelDistance >= p.maxDistance) {
          projectiles.splice(i, 1);
          continue;
        }
      }

      if (p.deathGateScythe) {
        const stepX = p.vx * dt;
        const stepY = p.vy * dt;
        const stepLen = Math.sqrt(stepX * stepX + stepY * stepY);
        p.travelDistance += stepLen;
        // 掘削位置はフレーム数ではなく進んだ距離で決める。端末性能で穴の形が変わらない。
        const carvedLimit = Math.min(p.travelDistance, p.maxDistance);
        while (p.deathGateCarves * DEATH_GATE_CARVE_STRIDE < carvedLimit) {
          const distance = Math.min((p.deathGateCarves + 1) * DEATH_GATE_CARVE_STRIDE, p.maxDistance);
          const back = stepLen > 0 ? (p.travelDistance - distance) / stepLen : 0;
          carveDeathGate(p, p.x - stepX * back, p.y - stepY * back, distance);
          p.deathGateCarves++;
          trailDirty = true;
        }
        if (p.travelDistance >= p.maxDistance) {
          projectiles.splice(i, 1);
          continue;
        }
      }

      // 空中炸裂は発射時に確定した頂点の時刻で起こす。
      const fireworkDue = p.firework && !p.fireworkShard && p.apexBurst && p.fireworkTimer >= p.apexBurst.t;

      let hit = false;
      // ユニットへの直撃判定(発射者自身は着弾するまで判定除外。誤射防止)
      // 拡散弾は素通りさせ、ダメージは進行中の爆発だけに任せる(二重取りの防止)。
      if (!p.fireworkShard && !p.deathGateScythe) {
        for (const u of units) {
          if (u.id === p.owner) continue;
          const a = unitHitCenter(u);
          const hitDx = a.x - p.x, hitDy = a.y - p.y, hitReach = UNIT_HIT_RADIUS + p.radius;
          if (hitDx * hitDx + hitDy * hitDy <= hitReach * hitReach) {
            if (p.jump) {
              teleportOwnerToImpact(p, p.x, p.y);
            } else if (p.deathGateMarker) {
              spawnDeathGate(p, p.x, p.y);
            } else if (p.emp) {
              emitEmp(p.x, p.y, p.empRadius, p.owner, p.empTurns);
            } else if (p.firework) {
              explodeAt(p.x, p.y, p.blastMul, p.owner, p.damageMul);
              spawnFireworkBurst(p);
            } else {
              explodeAt(p.x, p.y, p.blastMul, p.owner, p.damageMul);
            }
            if (p.lightning) spawnLightningRemnant(p);
        teleportOwnerToImpact(p, p.x, p.y);
        projectiles.splice(i, 1);
            hit = true;
            break;
          }
        }
      }
      if (hit) continue;

      // 闘技場の鎖には当たらず、先端の鉄球・鉄塊だけが砲弾を遮る。
      // 地形グリッドには入れないため、落下中のキャラが空中障害物へ着地することはない。
      const obstacleHit = (p.fireworkShard || p.ignoreObstacles) ? null : hitArenaObstacle(p.x, p.y, p.radius);
      if (obstacleHit) {
        if (p.jump) {
          teleportOwnerToImpact(p, obstacleHit.x, obstacleHit.y);
        } else if (p.deathGateMarker) {
          spawnDeathGate(p, obstacleHit.x, obstacleHit.y);
        } else if (p.emp) {
          emitEmp(obstacleHit.x, obstacleHit.y, p.empRadius, p.owner, p.empTurns);
        } else if (p.firework) {
          explodeAt(obstacleHit.x, obstacleHit.y, p.blastMul, p.owner, p.damageMul);
          spawnFireworkBurst(p);
        } else {
          explodeAt(obstacleHit.x, obstacleHit.y, p.blastMul, p.owner, p.damageMul);
        }
        triggerShake(2.5, 0.1);
        teleportOwnerToImpact(p, obstacleHit.x, obstacleHit.y);
        projectiles.splice(i, 1);
        continue;
      }

      if (fireworkDue) {
        // 刻みの都合で頂点を数px通り過ぎていることがある。炸裂位置は必ず
        // 発射時に確定した頂点そのものへ合わせる。
        p.x = p.apexBurst.x;
        p.y = p.apexBurst.y;
        spawnFireworkBurst(p);
        teleportOwnerToImpact(p, p.x, p.y);
        projectiles.splice(i, 1);
        continue;
      }

      if (!p.pierce && isSolidAt(p.x, p.y)) {
        if (p.jump) teleportOwnerToImpact(p, p.x, p.y, true);
        else if (p.deathGateMarker) spawnDeathGate(p, p.x, p.y);
        else if (p.emp) emitEmp(p.x, p.y, p.empRadius, p.owner, p.empTurns);
        else if (p.firework) {
          explodeAt(p.x, p.y, p.blastMul, p.owner, p.damageMul);
          spawnFireworkBurst(p);
        } else explodeAt(p.x, p.y, p.blastMul, p.owner, p.damageMul);
        if (p.lightning) spawnLightningRemnant(p);
        teleportOwnerToImpact(p, p.x, p.y);
        projectiles.splice(i, 1);
      } else if (p.x < -30 || p.x > STAGE_W + 30 || p.y > VH + 60) {
        projectiles.splice(i, 1); // 画面外(誤爆なしで消滅)
      }
    }
    if (trailDirty) rebuildTerrainRim();

    // 落下物理(常時判定)
    for (const u of units) updateFalling(dt, u);
  }

  // 入力・CPU思考・ターン進行。端末ごとに差が出ても実害がない処理なので、
  // 描画フレーム基準のままでよい(移動結果は move/fire パケットで座標を送る)。
  function updateAfterPhysics(dt) {
    // 移動(この端末の手番のみ・燃料制・長押しボタン)
    const me = localUnit();
    if (isLocalTurn() && me.moveLockTurns <= 0 && !awaitingResolve && !netInputLocked() && moveDir !== 0 && me.grounded && me.fuel > 0) {
      const dist = Math.min(MOVE_SPEED * dt, me.fuel);
      faceUnitTowardOpponent(me);
      let nx = Math.min(STAGE_W - UNIT_RADIUS - 4, Math.max(UNIT_RADIUS + 4, me.x + moveDir * dist));
      nx = limitMoveByClimb(me, nx);
      const moved = Math.abs(nx - me.x);
      me.x = nx;
      faceAllUnitsTowardOpponents();
      me.fuel -= moved;
      followGroundOrFall(me);
      // 移動中は一定間隔で位置を配信する。移動は立派な戦略なので相手にも見せる。
      if (moved > 0) moveSyncPending = true;
      moveSyncTimer += dt;
      if (moveSyncTimer >= MOVE_SYNC_INTERVAL_SEC && moveSyncPending) sendMoveUpdate(me);
    } else if (moveSyncPending && isLocalTurn()) {
      // ボタンを離した・燃料切れ・崖で止まった。最後の確定位置を必ず1回送る。
      // 自分の手番の時だけ。2vs2ではCPUの手番にも保留が立つので、ここで送ると
      // 動いていない自分のキャラの位置を、相手の移動として配ってしまう。
      sendMoveUpdate(me);
    }
    updateRemoteWalk(dt);
    // 移動完了後にも両者を再判定し、片方だけ古い向きが残らないようにする。
    faceAllUnitsTowardOpponents();

    // CPU移動→思考→発射
    const cpuActor = activeUnit();
    // 開始カットインが終わるまでは、まだ誰の手番も始まっていない。
    // ここを通すと、カットインが出る前や明けた直後にCPUが撃ってしまう。
    if (cpuActor.control === 'cpu' && !battleIntroPending && !awaitingResolve && cpuActor.grounded && !projectiles.length) {
      if (cpuPhase === 'move') {
        if (cpuMoveDir !== 0 && cpuMoveRemaining > 0 && cpuActor.fuel > 0) {
          const dist = Math.min(MOVE_SPEED * dt, cpuActor.fuel, cpuMoveRemaining);
          faceUnitTowardOpponent(cpuActor);
          let nx = Math.min(STAGE_W - UNIT_RADIUS - 4, Math.max(UNIT_RADIUS + 4, cpuActor.x + cpuMoveDir * dist));
          nx = limitMoveByClimb(cpuActor, nx);
          // 場外へ落ちる一歩は踏まない。踏みかけたらそこで移動を打ち切って狙いに移る。
          if (!cpuStepIsSafe(cpuActor, nx)) {
            cpuPhase = 'aim';
          } else {
            const moved = Math.abs(nx - cpuActor.x);
            cpuActor.x = nx;
            faceAllUnitsTowardOpponents();
            cpuActor.fuel -= moved;
            cpuMoveRemaining -= moved;
            followGroundOrFall(cpuActor);
            if (moved > 0) moveSyncPending = true;
            if (moved < 0.01) cpuPhase = 'aim'; // 端に到達して進めなくなったら打ち切り
          }
        } else {
          cpuPhase = 'aim';
        }
        // 2vs2で空席を埋めているCPUの移動も、人と同じ間隔で配ってやる。
        // 受け取った端末は updateRemoteWalk で同じ速さで歩かせるので、
        // 発射の瞬間に立ち位置が飛ぶのではなく、歩いて詰めたことが伝わる。
        if (moveSyncPending && netControlsUnit(cpuActor)) {
          moveSyncTimer += dt;
          if (cpuPhase !== 'move' || moveSyncTimer >= MOVE_SYNC_INTERVAL_SEC) sendMoveUpdate(cpuActor);
        }
      } else {
        cpuThinkTimer -= dt;
        if (cpuThinkTimer <= 0) cpuAutoTurn();
      }
    }

    // ターン解決(着弾+落下が収まったら手番交代)
    // pendingShotがある間はまだ弾が出ていないだけなので、ターンを終わらせてはいけない。
    // 着弾した瞬間に手番が変わると爆発や破片を見る間がないので、少し置いてから交代する。
    if (awaitingResolve && !pendingShot && !projectiles.length && units.every(u => u.grounded)) {
      turnSettle -= dt;
      if (turnSettle <= 0) {
        awaitingResolve = false;
        const acted = activeUnit();
        // 誰かが倒れているのに決着が確定していない = 相手の決着通知を待っている状態。
        // ここで手番を進めると、相手が落ちたのに「あなたのターン」が先に出てから
        // 「落下…」が届き、自分が落ちたように見えてしまう(実機で指摘された)。
        // 2vs2は1体倒れても試合は続く。「誰か倒れた」で待つと、そこから手番が
        // 一切進まなくなる。決着に届いているか(陣営の全滅)で判断する。
        const waitingForPeerResult = isOnline() && !matchOver && (!teamAlive('player') || !teamAlive('cpu'));
        if (!waitingForPeerResult) endTurn();
        if (isOnline() && online.kind === 'firebase' && acted.control === 'remote' && online.remoteAction && online.remoteAction.unitId === acted.id) {
          // state/resultは相手の発射をローカルで最後まで解決してからだけ受け入れる。
          // 決着待ちでもここは必ず通す。通さないと result が対応づけられず弾かれる。
          online.remoteAction.resolved = true;
        }
        if (!waitingForPeerResult) netSyncTurn(acted); // 行動した側だけが、切り替わったあとの状態を権威として送る
      }
    } else {
      turnSettle = TURN_SETTLE_SEC;
    }
  }

  function gameLoop(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min(0.033, (ts - lastTime) / 1000);
    lastTime = ts;
    syncBackTrap();
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
  }

  newTerrain(); // 選択画面の背景として地形だけ先に用意
  loadRankingProfile();
  // 前回オフラインで送れなかった記録があれば、起動時に送り直す
  flushPendingScore();



  resize();
  requestAnimationFrame(gameLoop);

  // GitHub PagesなどHTTPS環境では、ホーム画面追加とオフライン起動を有効にする。
  if ('serviceWorker' in navigator
      && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register(`./sw.js?build=${BUILD_ID}`, { updateViaCache: 'none' }).catch(() => {});
    });
  }
})();
</script>
