        // 全員が味方の近くなら、せめて一番味方から遠い敵を選ぶ。
        best = foe;
      }
    }
    return best;
  }

  function cpuAutoTurn() {
    if (matchOver || projectiles.length) return;
    const self = activeUnit();
    const foe = cpuPickTarget(self);
    if (!foe) return;
    const anchor = unitAnchor(self);
    const target = unitAnchor(foe);
    const def = CHARACTERS[self.character];
    const baseT = Math.min(2.2, Math.max(0.72, Math.abs(target.x - anchor.x) / 300)) * def.tBias;
    const tier = cpuAccuracyTier(winStreak);
    const useSpecial = isSpecialReady(self) && (tier.name === 'high' || tier.name === 'perfect');
    // 悪魔の必殺は重力も風も受けないので、逆算も直線で行わないと大きく外れる。
    const straightAim = useSpecial && def.key === 'akuma';
    const aimWindMul = straightAim ? 0 : (useSpecial && def.key === 'tori' ? def.windMul * 0.55 : (def.windMul || 1));
    const aimGravityMul = straightAim ? 0 : (def.gravityMul || 1);
    const launchSpeedMul = useSpecial ? (def.specialVelocityMul || 1) : 1;
    const { vx0, vy0 } = perfectAimVelocity(anchor, target, baseT, aimGravityMul, aimWindMul, launchSpeedMul);
    const jitter = tier.jitter;
    const vx = vx0 * (1 + (Math.random() * 2 - 1) * jitter);
    const vy = vy0 * (1 + (Math.random() * 2 - 1) * jitter);
    // 2vs2で空席を埋めているCPUは、ホストの端末が動かして結果を配る(Issue #26)。
    // 狙いに乱数が混ざるので、各端末で撃ち直させず、この1台の弾道をそのまま配る。
    netSendFire(self, anchor, vx, vy, useSpecial, false);
    launchShot(self, anchor, vx, vy, useSpecial);
    awaitingResolve = true;
  }

  // 高低差・現在の風を考慮して(anchor→target)を正確に結ぶ「理論上の正解弾道」を逆算
  function perfectAimVelocity(anchor, target, tHint, gravityMul = 1, windMul = 1, launchSpeedMul = 1) {
    const dx = target.x - anchor.x;
    const dy = target.y - anchor.y;
    const distAbs = Math.max(1, Math.abs(dx));
    const t = tHint || Math.min(2.2, Math.max(0.72, distAbs / 300));
    const windAccel = wind.dir * wind.strength * WIND_ACCEL_MAX * windMul;
    const gravity = GRAVITY * gravityMul;
    const vx0 = ((dx - 0.5 * windAccel * t * t) / t) / launchSpeedMul;
    const vy0 = ((dy - 0.5 * gravity * t * t) / t) / launchSpeedMul;
    return { vx0, vy0, t };
  }

  function eliminateAtDeadLine(u) {
    if (u.hp <= 0 || u.y + UNIT_RADIUS < DEAD_LINE_Y) return false;
    u.hp = 0;
    u.vy = 0;
    u.grounded = true;
    playDeadLineSound();
    triggerShake(5, 0.18);
    checkMatchEnd('落下');
    return true;
  }

  function updateFalling(dt, u) {
    // 地面が残っていても、車体下端がデッドラインへ触れた時点で敗北。
    if (eliminateAtDeadLine(u)) return;
    if (u.grounded) {
      const nearbyGround = walkableGroundYAt(u.x, u.y + UNIT_RADIUS);
      const groundY = (nearbyGround === null ? u.y + UNIT_RADIUS : nearbyGround) - UNIT_RADIUS;
      if (groundY > u.y + 2) {
        // 足場が崩れて落下開始
        u.grounded = false;
        u.vy = 0;
        u.fallStartY = u.y;
      } else {
        u.y = groundY; // 地形に追従(登り降りはそのまま歩ける)
      }
    } else {
      const previousFeetY = u.y + UNIT_RADIUS;
      u.vy += GRAVITY * dt;
      u.y += u.vy * dt;
      if (eliminateAtDeadLine(u)) return;
      const g2 = groundYBelow(u.x, previousFeetY) - UNIT_RADIUS;
      if (u.y >= g2) {
        const intoVoid = g2 >= FLOOR_Y - UNIT_RADIUS - 2; // クレーターが底まで貫通=場外
        const fallDist = g2 - u.fallStartY;
        u.y = g2;
        u.vy = 0;
        u.grounded = true;
        if (fallDist > 15) {
          triggerShake(3, 0.1);
        }
        if (u.hp > 0) {
          if (intoVoid) {
            u.hp = 0; // 場外落下は即死(落下ダメージ自体は計算しない)
          }
          checkMatchEnd();
        }
      }
    }
  }

  // ===== 描画 =====
  function drawSky() {
    const fx = THEME_FX[currentThemeKey];
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, currentTheme.sky[0]);
    g.addColorStop(0.55, currentTheme.sky[1]);
    g.addColorStop(1, currentTheme.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    const stageBackground = getReadyStageBackground();
    if (stageBackground) {
      ctx.drawImage(stageBackground, 0, 0, VW, VH);
      // HUD・弾道・キャラクターの視認性を保ちつつ、生成背景の色彩を残す。
      const readabilityShade = ctx.createLinearGradient(0, 0, 0, VH);
      readabilityShade.addColorStop(0, 'rgba(5,10,18,0.06)');
      readabilityShade.addColorStop(0.48, 'rgba(5,10,18,0.03)');
      readabilityShade.addColorStop(1, 'rgba(5,10,18,0.19)');
      ctx.fillStyle = readabilityShade;
      ctx.fillRect(0, 0, VW, VH);
    }

    if (!stageBackground) {
    // テーマごとの天体と地平線の光。背景画像を増やさず、試合ごとに位置が少し変わる。
    const orbX = 78 + ((parallaxSeed * 0.137) % (VW - 156));
    const orbY = currentThemeKey === 'desert' ? 168 : 92;
    const orbRadius = currentThemeKey === 'desert' ? 32 : currentThemeKey === 'volcanic' ? 22 : 20;
    const glow = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, orbRadius * 4.8);
    glow.addColorStop(0, fx.glow);
    glow.addColorStop(0.36, fx.glow);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(orbX - orbRadius * 5, orbY - orbRadius * 5, orbRadius * 10, orbRadius * 10);
    ctx.save();
    ctx.shadowColor = fx.orb;
    ctx.shadowBlur = 18;
    ctx.fillStyle = fx.orb;
    ctx.beginPath();
    ctx.arc(orbX, orbY, orbRadius, 0, Math.PI * 2);
    ctx.fill();
    if (currentThemeKey === 'grass' || currentThemeKey === 'snow') {
      ctx.fillStyle = currentTheme.sky[0];
      ctx.beginPath();
      ctx.arc(orbX + 8, orbY - 5, orbRadius * 0.92, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (currentThemeKey === 'snow') {
      // 淡いオーロラ。主張を抑えてUIと弾道を見やすく保つ。
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.lineCap = 'round';
      for (let band = 0; band < 3; band++) {
        const aurora = ctx.createLinearGradient(0, 0, VW, 0);
        aurora.addColorStop(0, 'rgba(76,255,208,0)');
        aurora.addColorStop(0.45, band === 1 ? 'rgba(96,196,255,0.65)' : 'rgba(98,255,195,0.55)');
        aurora.addColorStop(1, 'rgba(132,109,255,0)');
        ctx.strokeStyle = aurora;
        ctx.lineWidth = 16 - band * 3;
        ctx.beginPath();
        ctx.moveTo(-40, 105 + band * 28);
        ctx.bezierCurveTo(120, 35 + band * 22, 350, 210 - band * 18, VW + 40, 70 + band * 30);
        ctx.stroke();
      }
      ctx.restore();
    } else if (currentThemeKey === 'volcanic') {
      const lavaGlow = ctx.createRadialGradient(VW * 0.62, GROUND_MIN_Y + 10, 10, VW * 0.62, GROUND_MIN_Y, 260);
      lavaGlow.addColorStop(0, 'rgba(255,72,20,0.34)');
      lavaGlow.addColorStop(1, 'rgba(255,50,10,0)');
      ctx.fillStyle = lavaGlow;
      ctx.fillRect(0, 170, VW, GROUND_MIN_Y);
    }
    }

    // 星・火の粉・雪・砂埃をテーマ別に描き分ける。
    const t = performance.now() * 0.001;
    for (let i = 0; i < 44; i++) {
      let sx = (i * 137.5 + parallaxSeed * 0.19) % VW;
      let sy = (i * 71.3 + parallaxSeed * 0.07) % (GROUND_MIN_Y - 24);
      let size = 0.8 + (i % 4) * 0.45;
      let alpha = 0.35 + (i % 5) * 0.1;
      if (currentThemeKey === 'volcanic') {
        sx = (sx + Math.sin(t * 0.7 + i) * 18 + VW) % VW;
        sy = GROUND_MIN_Y - ((sy + t * (18 + i % 7)) % (GROUND_MIN_Y - 36));
        size += 0.6;
      } else if (currentThemeKey === 'snow') {
        sx = (sx + t * (5 + i % 4)) % VW;
        sy = (sy + t * (12 + i % 6)) % (GROUND_MIN_Y - 18);
      } else if (currentThemeKey === 'desert') {
        sx = (sx + t * (10 + i % 7)) % VW;
        sy = 145 + (sy % 185) + Math.sin(t + i) * 5;
        alpha *= 0.48;
      } else {
        alpha *= 0.72 + Math.sin(t * 2 + i) * 0.2;
      }
      ctx.globalAlpha = Math.max(0.08, alpha);
      ctx.fillStyle = fx.particle;
      ctx.beginPath();
      ctx.arc(sx, sy, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const vignette = ctx.createRadialGradient(VW / 2, VH * 0.4, 80, VW / 2, VH * 0.4, VW * 0.72);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, VW, VH);
  }

  // ===== 遠景パララックス(山のシルエット・雲。カメラより遅く動いて奥行きを出す) =====
  function bgHillY(x, seedOffset, baseY, amp) {
    const p = x + seedOffset;
    return baseY
      + Math.sin(p * 0.006) * amp
      + Math.sin(p * 0.017 + 1.3) * amp * 0.4
      + Math.sin(p * 0.041 + 2.7) * amp * 0.18;
  }

  function drawHillLayer(seedOffset, baseY, amp, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    const fromX = -200, toX = STAGE_W + 200, step = 24;
    ctx.moveTo(fromX, bgHillY(fromX, seedOffset, baseY, amp));
    for (let x = fromX + step; x <= toX; x += step) {
      ctx.lineTo(x, bgHillY(x, seedOffset, baseY, amp));
    }
    ctx.lineTo(toX, GROUND_MAX_Y + 50);
    ctx.lineTo(fromX, GROUND_MAX_Y + 50);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(fromX, bgHillY(fromX, seedOffset, baseY, amp));
    for (let x = fromX + step; x <= toX; x += step) {
      ctx.lineTo(x, bgHillY(x, seedOffset, baseY, amp));
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawCloudShape(cx, cy, r) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * 0.5, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - r * 0.6, cy + r * 0.15, r * 0.6, r * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + r * 0.6, cy + r * 0.1, r * 0.65, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawClouds() {
    ctx.save();
    ctx.fillStyle = currentTheme.cloud;
    const t = Date.now() * 0.008;
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 260 + t * 4 + parallaxSeed) % (STAGE_W + 400)) - 200;
      const cy = 60 + (i % 3) * 45;
      drawCloudShape(cx, cy, 34 + (i % 2) * 14);
    }
    ctx.restore();
  }

  function drawParallax() {
    // 専用背景が読み込めたテーマでは、画像内の遠景を活かして二重の山・雲を描かない。
    if (getReadyStageBackground()) return;
    ctx.save();
    applyWorldCamera(0.15);
    drawHillLayer(parallaxSeed, 220, 46, currentTheme.farHill);
    ctx.restore();
    ctx.save();
    applyWorldCamera(0.35);
    drawHillLayer(parallaxSeed + 500, 270, 60, currentTheme.nearHill);
    ctx.restore();
    ctx.save();
    applyWorldCamera(0.1);
    drawClouds();
    ctx.restore();
  }

  // 闘技場の外壁を画面の上端まで伸ばす(Codex引き継ぎ書§6 #11)。
  // 地形は y=0〜VH のキャンバスにしか描けないが、視点を引くと y<0 の領域が画面に入り、
  // そこで壁が途切れて空が覗いていた(視点78%なら画面の上から約145pxぶん)。
  // ここで足すのは絵だけ。solidGrid には触らないので当たり判定は一切変わらない。
  // 一番引いた視点(MIN_CAMERA_ZOOM = VW/STAGE_W = 0.375)で必要なのは世界座標で1100px。
  // 余白を持たせて1400にしてある。ここを削ると、引いた時だけ上端に空が覗く。
  const ARENA_WALL_SKY_EXTENSION = 1400;
  function drawArenaWallExtension() {
    if (currentPattern !== 'tieredBasin') return;
    const wallW = STAGE_W * ARENA_WALL_RATIO;
    const walls = [0, STAGE_W - wallW];
    const top = -ARENA_WALL_SKY_EXTENSION;
    ctx.save();
    for (const x of walls) {
      // 上へ行くほど暗くし、天井の闇へ溶かす。y=0 で地形側の壁と同じ明るさに合わせる。
      const grad = ctx.createLinearGradient(0, top, 0, 0);
      grad.addColorStop(0, '#12161d');
      grad.addColorStop(1, '#2b303a');
      ctx.fillStyle = grad;
      ctx.fillRect(x, top, wallW, ARENA_WALL_SKY_EXTENSION);
    }
    // 石組みの継ぎ目を、地形側と同じ30px間隔・同じ位相のまま上へ続ける。
    // ここがずれると、y=0 の境目に横一本の筋が見えてしまう。
    ctx.strokeStyle = 'rgba(8,10,14,0.62)';
    ctx.lineWidth = 2;
    for (let y = 16 - 30; y > top; y -= 30) {
      const offset = (Math.floor(y / 30) % 2) * 24;
      for (const x of walls) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + wallW, y);
        ctx.stroke();
        for (let vx = x + ((offset % 48) + 48) % 48; vx < x + wallW; vx += 48) {
          ctx.beginPath();
          ctx.moveTo(vx, y);
          ctx.lineTo(vx, y + 30);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function drawTerrain() {
    // 外壁の延長は地形より先に敷く。地形の縁取りや鉄柵が上に乗る順序を崩さないため。
    drawArenaWallExtension();
    // 地形マスク(ピクセル単位で穴があいた実体)をそのまま描画
    ctx.drawImage(terrainCanvas, 0, 0);
    // 地形マスクから生成した全周の境界線。浮島・縦崖・爆破穴も実際の形どおりに縁取る。
    ctx.drawImage(terrainRimCanvas, 0, 0);
    // 橋は既存の薄床地形に重ねた装飾。地形と一緒に爆破で削れる。
    ctx.drawImage(bridgeCanvas, 0, 0);
    // 闘技場だけの鉄柵・補強材。キャラクターより手前へ出ず、地形と一緒に爆破で欠ける。
    ctx.drawImage(arenaDecorationCanvas, 0, 0);
  }

  function drawArenaObstacles() {
    if (currentPattern !== 'tieredBasin' || !arenaObstacles.length) return;
    const now = simTimeMs; // 当たり判定と同じ時計。ズレると「見えている位置」で当たらなくなる
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (const obstacle of arenaObstacles) {
      const p = arenaObstaclePosition(obstacle, now);

      // 鎖は純粋な装飾。弾の判定は先端の鉄球・鉄塊だけに持たせる。
      const dx = p.x - obstacle.anchorX;
      const dy = p.y - obstacle.anchorY;
      const chainLength = Math.hypot(dx, dy);
      const links = Math.max(4, Math.floor(chainLength / 14));
      ctx.strokeStyle = '#1a2029';
      ctx.lineWidth = 4;
      for (let i = 0; i < links; i++) {
        const t = (i + 0.5) / links;
        const lx = obstacle.anchorX + dx * t;
        const ly = obstacle.anchorY + dy * t;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(Math.atan2(dy, dx) + (i % 2 ? Math.PI / 2 : 0));
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      const r = obstacle.radius;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.shadowColor = 'rgba(0,0,0,0.75)';
      ctx.shadowBlur = 10;
      if (obstacle.shape === 'ball') {
        ctx.fillStyle = '#202630';
        ctx.strokeStyle = '#9a6b31';
        ctx.lineWidth = 3;
        for (let i = 0; i < 12; i++) {
          const a = i * Math.PI * 2 / 12;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a - 0.09) * (r - 2), Math.sin(a - 0.09) * (r - 2));
          ctx.lineTo(Math.cos(a) * (r + 10), Math.sin(a) * (r + 10));
          ctx.lineTo(Math.cos(a + 0.09) * (r - 2), Math.sin(a + 0.09) * (r - 2));
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 2, 0, 0, r);
        g.addColorStop(0, '#69717d');
        g.addColorStop(0.45, '#343b46');
        g.addColorStop(1, '#11161d');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        const size = r * 1.55;
        ctx.rotate(Math.PI / 4);
        const g = ctx.createLinearGradient(-size, -size, size, size);
        g.addColorStop(0, '#606975');
        g.addColorStop(0.45, '#2b323c');
        g.addColorStop(1, '#10151c');
        ctx.fillStyle = g;
        ctx.strokeStyle = '#ad7937';
        ctx.lineWidth = 4;
        ctx.fillRect(-size / 2, -size / 2, size, size);
        ctx.strokeRect(-size / 2, -size / 2, size, size);
        ctx.strokeStyle = 'rgba(220,166,84,0.62)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-size * 0.34, 0);
        ctx.lineTo(size * 0.34, 0);
        ctx.moveTo(0, -size * 0.34);
        ctx.lineTo(0, size * 0.34);
        ctx.stroke();
      }
      ctx.fillStyle = '#d7a04e';
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.58, Math.sin(a) * r * 0.58, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawDeadLine() {
    const y = worldToScreenY(DEAD_LINE_Y);
    const pulse = 0.68 + Math.sin(performance.now() * 0.006) * 0.18;
    ctx.save();
    ctx.shadowColor = `rgba(255,45,55,${pulse})`;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = `rgba(255,72,72,${pulse + 0.12})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([13, 7]);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(VW, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,95,95,0.95)';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DEAD LINE', VW / 2, y - 6);
    ctx.restore();
  }

  // 接地点付近の地形傾斜(ラジアン)。急すぎる斜面は見た目が破綻しないようクランプ
  function groundSlopeAt(u) {
    const d = 14;
    const feetY = u.y + UNIT_RADIUS;
    const leftGround = walkableGroundYAt(Math.max(0, u.x - d), feetY);
    const rightGround = walkableGroundYAt(Math.min(STAGE_W, u.x + d), feetY);
    const y1 = leftGround === null ? feetY : leftGround;
    const y2 = rightGround === null ? feetY : rightGround;
    const MAX_TILT = 0.5; // 約28.6度
    return Math.max(-MAX_TILT, Math.min(MAX_TILT, Math.atan2(y2 - y1, 2 * d)));
  }

  // 当たり判定の可視化。**判定は全キャラ共通の円**で、中心はキャラの中心、
  // 半径は UNIT_HIT_RADIUS。絵の形も大きさも違うので、どこに当たるのかは絵からは読めない。
  // 主張しすぎない明るさにすること。ここが濃いと盤面がうるさくなって弾道が見えなくなる。
  function drawUnitHitCircle(u) {
    if (u.hp <= 0) return;
    const a = unitHitCenter(u);
    const active = activeUnit() === u;
    const tint = u.team === 'player' ? '120,190,255' : '255,150,120';
    // ゆっくり明滅させる。止まった輪より「判定がそこにある」ことが伝わる。
    const pulse = 0.82 + Math.sin(Date.now() / 520) * 0.18;
    const fill = (active ? 0.15 : 0.08) * pulse;
    const edge = (active ? 0.46 : 0.26) * pulse;
    ctx.save();
    const glow = ctx.createRadialGradient(a.x, a.y, UNIT_HIT_RADIUS * 0.45, a.x, a.y, UNIT_HIT_RADIUS);
    glow.addColorStop(0, `rgba(${tint},0)`);
    glow.addColorStop(0.86, `rgba(${tint},${fill})`);
    glow.addColorStop(1, `rgba(${tint},0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(a.x, a.y, UNIT_HIT_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(${tint},${edge})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(a.x, a.y, UNIT_HIT_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawUnit(u) {
    if (projectiles.some(p => p.jump && p.owner === u.id)) return;
    const a = unitAnchor(u);
    // 絵より先に描く。上に重ねるとキャラが霞む。
    drawUnitHitCircle(u);
    const isBossUnit = isBossMatch && u.team === 'cpu';
    const img = u.character ? charImages[u.character] : null;
    const imgReady = img && img.complete && img.naturalWidth > 0;
    // 向きと反転の変換は共通関数だけを通す(直接式を書くと向き判定側と食い違う)。
    const facingLeft = spriteFlipForFacing(u, unitFacesLeftInWorld(u));
    const tilt = u.grounded ? groundSlopeAt(u) : 0; // 空中では傾けない

    // 画像は接地ライン(groundY = a.y + UNIT_RADIUS)に底面を合わせて描画
    const h = SPRITE_SIZE * unitSpriteScale(u.character);
    const w = imgReady ? h * (img.naturalWidth / img.naturalHeight) : h;
    const imgTopAbs = a.y + UNIT_RADIUS - h;

    ctx.save();
    ctx.translate(a.x, a.y);
    if (isBossUnit) {
      ctx.beginPath();
      ctx.arc(0, UNIT_RADIUS - h / 2, h / 2 + 8, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    if (imgReady) {
      ctx.save();
      ctx.globalAlpha = unitDefeated(u) ? 0.4 : 1;
      // 接地点(0, UNIT_RADIUS)を軸に地形傾斜ぶんだけ回転。flipより外側に回転をかけることで
      // 反転していても傾き方向が世界座標基準(実際の地形)と一致するようにする
      ctx.translate(0, UNIT_RADIUS);
      ctx.rotate(tilt);
      if (facingLeft) ctx.scale(-1, 1);
      ctx.translate(0, -UNIT_RADIUS);
      ctx.drawImage(img, -w / 2, UNIT_RADIUS - h, w, h);
      ctx.restore();
    } else {
      // 画像読み込み中のフォールバック(色付き円)
      ctx.beginPath();
      ctx.arc(0, 0, UNIT_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = u.hp > 0 ? u.color : '#555';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(u.label, 0, 4);
    }
    ctx.restore();

    if (isBossUnit) {
      ctx.save();
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', a.x, imgTopAbs - 2);
      ctx.restore();
    }

    // HPバー
    const barW = 70, barX = a.x - barW / 2, barY = imgTopAbs - (isBossUnit ? 18 : 4);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX, barY, barW, 8);
    const ratio = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#7be07b' : ratio > 0.25 ? '#f0c860' : '#f06060';
    ctx.fillRect(barX, barY, barW * ratio, 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, 8);
    ctx.fillStyle = '#fff';
    ctx.font = '10px sans-serif';
    ctx.fillText(`${u.hp}/${u.maxHp}`, a.x, barY - 3);
  }

  function drawBattleHudBackdrop() {
    ctx.save();
    const hudBottom = 116 + hudShift();
    const bg = ctx.createLinearGradient(0, 0, 0, hudBottom);
    bg.addColorStop(0, 'rgba(28,34,39,0.97)');
    bg.addColorStop(0.06, 'rgba(16,21,26,0.96)');
    bg.addColorStop(0.72, 'rgba(11,16,21,0.94)');
    bg.addColorStop(1, 'rgba(8,12,16,0.84)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, VW, hudBottom);

    // 下端の真鍮レール(コントローラ側と対になる額縁)
    const rail = ctx.createLinearGradient(0, hudBottom - 4, 0, hudBottom + 2);
    rail.addColorStop(0, '#241608');
    rail.addColorStop(0.4, '#c89753');
    rail.addColorStop(0.72, '#8a5c25');
    rail.addColorStop(1, '#1c1207');
    ctx.fillStyle = rail;
    ctx.fillRect(0, hudBottom - 4, VW, 6);
    ctx.restore();

    // ステージ名の真鍮プレート
    const stageName = currentPattern === 'tieredBasin'
      ? '闘技場ステージ'
      : `${THEME_LABELS[currentThemeKey] || 'バトル'}ステージ`;
    drawIronPlate(VW / 2, 19, 178, 27, { cut: 9, lineWidth: 2 });
    drawOutlinedText(stageName, VW / 2, 24, {
      font: `900 13px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3.5
    });
  }

  function drawWindMeter() {
    const cx = VW / 2, cardY = 46, cardW = 164, cardH = 40;
    const accent = calmWind ? '#72e8ff' : UI.brassLight;
    drawIronPlate(cx, cardY + cardH / 2, cardW, cardH, {
      cut: 10,
      edge: calmWind ? 'rgba(114,232,255,0.75)' : UI.brass,
      lineWidth: 2
    });

    const windLevel = wind.strength < 0.34 ? '弱' : wind.strength < 0.67 ? '中' : '強';
    drawOutlinedText(calmWind ? '無風 / CALM' : `風力 ${windLevel}`, cx, cardY + 14, {
      font: `900 11px ${UI_FONT_HEAVY}`, color: accent, lineWidth: 3
    });

    ctx.save();
    const len = calmWind ? 28 : 16 + wind.strength * 42;
    const dir = calmWind ? 1 : wind.dir;
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - dir * len / 2, cardY + 29);
    ctx.lineTo(cx + dir * len / 2, cardY + 29);
    ctx.stroke();
    if (!calmWind) {
      // 矢じり
      const ax = cx + dir * len / 2;
      ctx.beginPath();
      ctx.moveTo(ax + dir * 2, cardY + 29);
      ctx.lineTo(ax - dir * 7, cardY + 25);
      ctx.lineTo(ax - dir * 7, cardY + 33);
      ctx.closePath();
      ctx.fillStyle = accent;
      ctx.fill();
    }
    ctx.restore();
  }

  // ===== プレイヤー/CPUのHP・燃料ゲージ(WINDの左右)。燃料はターン開始で満タンに戻るので
  // 「減った分=そのターンでどれだけ移動したか」が常に見える =====
  // 名前カードの寸法。2vs2は4枚を上下2段に積むので、1枚あたりを低くする。
  // 上端はメニュー/音量ボタンを避けて46から、下端はHUD背景の真鍮レール(112)まで。
  const PANEL_1V1 = { h: 40, rows: [46] };
  const PANEL_2V2 = { h: 34, rows: [46, 82] };
  // 2vs2はカードが2段になるので、その下に続くターン帯・ミニマップ・HUD背景を丸ごと下げる。
  // 世界はHUDの下に全画面で描かれているため、下げても隠れるのは空だけで戦場は狭くならない。
  const HUD_EXTRA_2V2 = 34;
  function hudShift() { return is2v2() ? HUD_EXTRA_2V2 : 0; }
  function minimapTop() { return MINIMAP.y + hudShift(); }

  function drawUnitPanel(u, edgeX, align, cardY, h) {
    const w = 168;
    const barX = align === 'left' ? edgeX : edgeX - w;
    // 低いカードは中身を詰めないと枠から溢れる。1vs1の見た目は一切変えない。
    const compact = h < 38;
    const tabY = compact ? cardY + 6 : cardY + 9;
    const tabH = compact ? 18 : 22;
    const labelY = compact ? cardY + 11 : cardY + 14;
    const hpBarY = compact ? cardY + 14 : cardY + 18;
    const hpBarH = compact ? 7 : 9;
    const fuelBarY = compact ? cardY + 23 : cardY + 30;
    const fuelBarH = compact ? 4 : 5;
    // 自分=青/相手=赤の陣営色は、どちらのカードか一目で分かるので残す。
    // カードが左右どちらに出るかは席で決まるので、色は「置いた側」ではなく持ち主で引く。
    // 2vs2では味方CPUも自分と同じ青にしたいので、判定はIDではなく陣営で行う
    // (1vs1は2体しか居ないので、この変更で色は変わらない)。
    const accent = u.team === localUnit().team ? UI.ally : UI.enemy;
    // 手番の判定はユニットIDで直接引く。
    const isTurn = activeUnit().id === u.id;

    // 手番側のカードだけ縁を光らせ、今どちらの番かカードでも分かるようにする
    drawIronPlate(barX + w / 2, cardY + h / 2, w, h, {
      cut: 10,
      edge: isTurn ? accent : UI.brass,
      lineWidth: isTurn ? 2.6 : 2,
      glow: isTurn ? accent : null
    });

    ctx.save();
    // 陣営色のタブ
    ctx.fillStyle = accent;
    ctx.fillRect(align === 'left' ? barX + 1 : barX + w - 4, tabY, 3, tabH);
    ctx.restore();

    drawOutlinedText(u.label, barX + 10, labelY, {
      align: 'left', font: `900 ${compact ? 11 : 12}px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3.5
    });
    drawOutlinedText(`${Math.max(0, Math.ceil(u.hp))} / ${u.maxHp}`, barX + w - 10, labelY, {
      align: 'right', font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLight, lineWidth: 3
    });

    const innerX = barX + 9;
    const innerW = w - 18;
    const hpRatio = Math.max(0, u.hp / u.maxHp);
    ctx.save();
    // HPゲージ(黒い溝に嵌った真鍮枠のバー)
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(innerX, hpBarY, innerW, hpBarH);
    const hpColor = hpRatio > 0.5 ? UI.hpHigh : hpRatio > 0.25 ? UI.hpMid : UI.hpLow;
    const hpGrad = ctx.createLinearGradient(0, hpBarY, 0, hpBarY + hpBarH);
    hpGrad.addColorStop(0, '#ffffff55');
    hpGrad.addColorStop(0.35, hpColor);
    hpGrad.addColorStop(1, '#00000055');
    ctx.fillStyle = hpColor;
    ctx.fillRect(innerX, hpBarY, innerW * hpRatio, hpBarH);
    ctx.fillStyle = hpGrad;
    ctx.fillRect(innerX, hpBarY, innerW * hpRatio, hpBarH);
    ctx.strokeStyle = 'rgba(255,226,161,0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(innerX + 0.5, hpBarY + 0.5, innerW - 1, hpBarH - 1);

    // 燃料ゲージ
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(innerX, fuelBarY, innerW, fuelBarH);
    const fuelRatio = Math.max(0, u.fuel / u.fuelMax);
    ctx.fillStyle = UI.fuel;
    ctx.fillRect(innerX, fuelBarY, innerW * fuelRatio, fuelBarH);
    ctx.strokeStyle = 'rgba(255,226,161,0.3)';
    ctx.strokeRect(innerX + 0.5, fuelBarY + 0.5, innerW - 1, fuelBarH - 1);
    ctx.restore();
  }

  // 名前カードの並べ方。左右は「陣営」で決め、席が右(e1)なら左右を入れ替える。
  // 2vs2は同じ陣営を縦に積むので、「左列=自陣営／右列=敵陣営」の読み方が1vs1と揃う。
  function unitPanelLayout() {
    const me = localUnit();
    const localOnLeft = me.id === 'p1';
    const mine = [me, ...units.filter(u => u.team === me.team && u.id !== me.id)];
    const theirs = units.filter(u => u.team !== me.team);
    const preset = is2v2() ? PANEL_2V2 : PANEL_1V1;
    const slots = [];
    const push = (list, align) => {
      const edgeX = align === 'left' ? 10 : VW - 10;
      for (let i = 0; i < list.length && i < preset.rows.length; i++) {
        slots.push({ unit: list[i], edgeX, align, cardY: preset.rows[i], h: preset.h });
      }
    };
    push(mine, localOnLeft ? 'left' : 'right');
    push(theirs, localOnLeft ? 'right' : 'left');
    return slots;
  }

  function drawUnitPanels() {
    for (const slot of unitPanelLayout()) {
      drawUnitPanel(slot.unit, slot.edgeX, slot.align, slot.cardY, slot.h);
    }
  }

  // 引っ張り線(スクリーン座標。カメラの影響を受けないUIレイヤー)
  function drawPullLine() {
    if (!aimState) return;
    const { origin, curX, curY } = aimState;
    const cancelled = isInCancelZone(curX, curY);
    ctx.save();
    ctx.strokeStyle = cancelled ? 'rgba(255,90,90,0.85)' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(curX, curY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(curX, curY, 10, 0, Math.PI * 2);
    ctx.fillStyle = cancelled ? 'rgba(255,90,90,0.85)' : 'rgba(255,255,255,0.8)';
    ctx.fill();
    ctx.restore();
  }

  // 弾道プレビュー(ワールド座標。カメラ変換の中で描画する)
  function drawTrajectoryPreview() {
    if (!aimState) return;
    const { anchor, origin, curX, curY } = aimState;
    if (isInCancelZone(curX, curY)) return;

    let dx = curX - origin.x;
    let dy = curY - origin.y;
    const dist = Math.min(MAX_DRAG, Math.hypot(dx, dy));
    if (dist < FIRE_MIN_DRAG) return;
    const ang = Math.atan2(dy, dx);
    dx = Math.cos(ang) * dist;
    dy = Math.sin(ang) * dist;

    // 発射方向は引っ張りの逆向き(自キャラの性能を反映)
    const me = localUnit();
    const def = CHARACTERS[me.character];
    const { vx0, vy0 } = computeLaunchVelocity(dx, dy, def);
    // 悪魔の必殺を構えている間は弾が直進するので、ガイドも重力・風を切って直線にする。
    const straightGuide = specialArmed && isSpecialReady(me) && def.key === 'akuma';
    const gravity = straightGuide ? 0 : GRAVITY * (def.gravityMul || 1);
    const previewT = trajectoryPreviewDuration(vx0, vy0, gravity) * (def.guideMul || 1);
    const steps = 14;
    const windAccel = straightGuide ? 0 : wind.dir * wind.strength * WIND_ACCEL_MAX * def.windMul;

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 1; i <= steps; i++) {
      const t = (previewT * i) / steps;
      const px = anchor.x + vx0 * t + 0.5 * windAccel * t * t;
      const py = anchor.y + vy0 * t + 0.5 * gravity * t * t;
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 花火は弧の頂点で開く。どこで開くかがそのまま狙う場所なので、撃つ前に見せる。
    // 印が出ない時は空中で開かず、着弾して開く(頂点が近すぎる/水平・下向きに撃った)。
    // 実際の炸裂と同じ関数で求めるので、表示と結果がずれることはない。
    if (specialArmed && isSpecialReady(me) && def.key === 'sumoeru') {
      const burst = fireworkApexBurst(anchor, vx0, vy0, windAccel, gravity);
      if (burst) {
        ctx.strokeStyle = 'rgba(255,214,120,0.95)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, 11, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(burst.x, burst.y, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,214,120,0.95)';
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // 画面外の敵の方向インジケータ(スクリーン座標)
  function drawOffscreenIndicator() {
    const foe = foeUnit();
    const sx = worldToScreenX(foe.x);
    if (sx >= -UNIT_RADIUS && sx <= VW + UNIT_RADIUS) return;
    const onRight = sx > VW;
    const ix = onRight ? VW - 16 : 16;
    // 上限はミニマップの下端。2vs2でミニマップが下がると、この線も一緒に下がる。
    const iy = Math.max(minimapTop() + MINIMAP.h + 4, Math.min(CONTROL_PANEL_Y - 30, worldToScreenY(foe.y)));
    ctx.save();
    ctx.fillStyle = 'rgba(255,107,107,0.9)';
    ctx.beginPath();
    if (onRight) {
      ctx.moveTo(ix + 10, iy);
      ctx.lineTo(ix - 6, iy - 9);
      ctx.lineTo(ix - 6, iy + 9);
    } else {
      ctx.moveTo(ix - 10, iy);
      ctx.lineTo(ix + 6, iy - 9);
      ctx.lineTo(ix + 6, iy + 9);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('敵', ix + (onRight ? -14 : 14), iy + 4);
    ctx.restore();
  }

  // 発射点から現在地(着弾点)までを一本の電撃ビームとして描く。
  // 影(shadowBlur)は長い線に掛けると重いので使わず、太さ違いの3本重ねで発光に見せる。
  function drawLightningPath(x0, y0, x1, y1, alpha, headRadius) {
    const dx = x1 - x0;
    const dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    if (len < 2) return;
    const nx = -dy / len;
    const ny = dx / len;
    const segments = Math.max(4, Math.min(72, Math.round(len / 26)));
    const now = performance.now();
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // 外側2層は加算合成にして、明るい地形の上でも発光が沈まないようにする。
    const layers = [
      { w: 18, c: 'rgba(120,60,235,0.5)', add: true },
      { w: 8, c: 'rgba(196,150,255,0.95)', add: true },
      { w: 2.4, c: '#ffffff', add: false }
    ];
    for (const layer of layers) {
      ctx.globalCompositeOperation = layer.add ? 'lighter' : 'source-over';
      ctx.strokeStyle = layer.c;
      ctx.lineWidth = layer.w;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      for (let s = 1; s < segments; s++) {
        const t = s / segments;
        // 両端は軸上に固定し、中ほどだけ大きく振れさせると雷らしい形になる
        const sway = Math.sin(s * 2.3 + now * 0.021) * 8 * Math.sin(t * Math.PI);
        ctx.lineTo(x0 + dx * t + nx * sway, y0 + dy * t + ny * sway);
      }
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    if (headRadius > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const head = ctx.createRadialGradient(x1, y1, 0, x1, y1, headRadius * 3.4);
      head.addColorStop(0, 'rgba(255,255,255,1)');
      head.addColorStop(0.32, 'rgba(214,170,255,0.85)');
      head.addColorStop(1, 'rgba(120,60,235,0)');
      ctx.fillStyle = head;
      ctx.beginPath();
      ctx.arc(x1, y1, headRadius * 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawJumpProjectile(p) {
    const u = unitById(p.owner);
    if (!u) return;
    const img = u.character ? charImages[u.character] : null;
    const imgReady = img && img.complete && img.naturalWidth > 0;
    // 跳躍中のキャラ画像。地上の描画と同じ変換を使う。
    const facingLeft = spriteFlipForFacing(u, unitFacesLeftInWorld(u));
    const h = SPRITE_SIZE * unitSpriteScale(u.character);
    const w = imgReady ? h * (img.naturalWidth / img.naturalHeight) : h;
    const angle = Math.atan2(p.vy, p.vx);
    ctx.save();
    // 本体は立ち姿のまま、弾道方向へ光の尾だけを伸ばす。
    ctx.translate(p.x, p.y);
    ctx.save();
    ctx.rotate(angle);
    ctx.strokeStyle = 'rgba(142,231,255,0.78)';
    ctx.shadowColor = '#8ee7ff';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-42, 0);
    ctx.lineTo(-12, 0);
    ctx.stroke();
    ctx.restore();
    ctx.shadowColor = '#8ee7ff';
    ctx.shadowBlur = 18;
    ctx.globalAlpha = 0.98;
    if (imgReady) {
      if (facingLeft) ctx.scale(-1, 1);
      ctx.drawImage(img, -w / 2, UNIT_RADIUS - h, w, h);
    } else {
      ctx.fillStyle = '#8ee7ff';
      ctx.beginPath();
      ctx.arc(0, 0, UNIT_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawProjectile() {
    for (const b of lightningBeams) {
      drawLightningPath(b.x0, b.y0, b.x1, b.y1, Math.max(0, b.life / b.maxLife) * 0.9, 0);
    }
    for (const p of projectiles) {
      if (p.jump) {
        drawJumpProjectile(p);
        continue;
      }
      if (p.lightning) {
        drawLightningPath(p.originX, p.originY, p.x, p.y, 1, 4.6);
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));

      if (p.deathGateMarker) {
        const pulse = 0.72 + Math.sin(simTimeMs * 0.018) * 0.22;
        ctx.rotate(simTimeMs * 0.004);
        ctx.shadowColor = '#a955ff';
        ctx.shadowBlur = 18;
        ctx.fillStyle = `rgba(174,92,255,${pulse})`;
        ctx.beginPath();
        ctx.moveTo(0, -10); ctx.lineTo(10, 0); ctx.lineTo(0, 10); ctx.lineTo(-10, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#f2dcff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, 2.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.deathGateScythe) {
        // 飛翔方向へ伸びる紫の鎌。地面に触れても止まらず、射程まで縦穴を刻む。
        ctx.shadowColor = '#9c4dff';
        ctx.shadowBlur = 18;
        const trail = ctx.createLinearGradient(-28, 0, 14, 0);
        trail.addColorStop(0, 'rgba(111,47,235,0)');
        trail.addColorStop(0.5, '#a55cff');
        trail.addColorStop(1, '#f2dcff');
        ctx.strokeStyle = trail;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-28, 0);
        ctx.lineTo(12, 0);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#e9d8ff';
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.quadraticCurveTo(4, -15, -8, -11);
        ctx.quadraticCurveTo(1, -4, 6, 0);
        ctx.quadraticCurveTo(1, 4, -8, 11);
        ctx.quadraticCurveTo(4, 15, 14, 0);
        ctx.fill();
        ctx.strokeStyle = '#51306e';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else if (p.fireworkShard) {
        ctx.shadowColor = '#ff9d42';
        ctx.shadowBlur = 12;
        const spark = ctx.createLinearGradient(-24, 0, 10, 0);
        spark.addColorStop(0, 'rgba(255,116,40,0)');
        spark.addColorStop(0.55, '#ffb84a');
        spark.addColorStop(1, '#fff3b0');
        ctx.strokeStyle = spark;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-24, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();
        ctx.fillStyle = '#fff5bb';
        ctx.beginPath();
        ctx.arc(10, 0, 3.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.pierce) {
        // 貫通弾は高密度のエネルギーボルト。芯・外光・速度線を分けて描く。
        ctx.shadowColor = '#5de8ff';
        ctx.shadowBlur = 18;
        const beam = ctx.createLinearGradient(-32, 0, 13, 0);
        beam.addColorStop(0, 'rgba(79,195,247,0)');
        beam.addColorStop(0.55, 'rgba(79,195,247,0.48)');
        beam.addColorStop(1, '#dfffff');
        ctx.strokeStyle = beam;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(-32, 0);
        ctx.lineTo(12, 0);
        ctx.stroke();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-20, 0);
        ctx.lineTo(15, 0);
        ctx.stroke();
        ctx.fillStyle = '#eaffff';
        ctx.beginPath();
        ctx.moveTo(17, 0);
        ctx.lineTo(7, -6);
        ctx.lineTo(7, 6);
        ctx.closePath();
        ctx.fill();
      } else {
        // 通常弾は金属製の砲弾。飛翔方向に合わせた尾・胴・帯・先端で立体感を出す。
        const hot = p.blastMul > 1.45;
        const trail = ctx.createLinearGradient(-30, 0, -4, 0);
        trail.addColorStop(0, 'rgba(255,120,36,0)');
        trail.addColorStop(0.55, hot ? 'rgba(255,80,20,0.45)' : 'rgba(255,192,74,0.30)');
        trail.addColorStop(1, hot ? 'rgba(255,223,112,0.92)' : 'rgba(255,238,170,0.72)');
        ctx.strokeStyle = trail;
        ctx.lineWidth = hot ? 7 : 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-30, 0);
        ctx.lineTo(-4, 0);
        ctx.stroke();

        ctx.shadowColor = hot ? '#ff5b22' : '#ffd45c';
        ctx.shadowBlur = hot ? 16 : 9;
        const shell = ctx.createLinearGradient(0, -6, 0, 6);
        shell.addColorStop(0, '#fff2b0');
        shell.addColorStop(0.28, hot ? '#d85a24' : '#9a7541');
        shell.addColorStop(0.72, hot ? '#71301f' : '#40372e');
        shell.addColorStop(1, '#17191d');
        ctx.fillStyle = shell;
        ctx.beginPath();
        ctx.moveTo(11, 0);
        ctx.quadraticCurveTo(6, -6, -5, -5);
        ctx.lineTo(-9, -3);
        ctx.lineTo(-9, 3);
        ctx.lineTo(-5, 5);
        ctx.quadraticCurveTo(6, 6, 11, 0);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0,0,0,0.78)';
        ctx.lineWidth = 1.3;
        ctx.stroke();
        ctx.fillStyle = hot ? '#ff9d42' : '#d0a451';
        ctx.fillRect(-4, -5, 3, 10);
        ctx.strokeStyle = 'rgba(255,255,255,0.48)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-3, -3.2);
        ctx.lineTo(5.5, -2.4);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  const continueBtn = { x: VW / 2, y: VH / 2 + 72, w: 210, h: 46 };
  const resultTitleBtn = { x: VW / 2, y: VH / 2 + 132, w: 210, h: 42 };
  // ランキング送信の行を出す時は、その分だけボタンを下げる(描画と当たり判定の両方で使う)
  const RESULT_BUTTON_SHIFT = 44;
  function submitResultVisible() {
    return matchOver && winner !== 'player' && battleMode !== 'free' && submitState !== 'idle';
  }
  function resultButtonShift() {
    return submitResultVisible() ? RESULT_BUTTON_SHIFT : 0;
  }

  function drawResultButton(rawButton, label, primary) {
    const shift = resultButtonShift();
    const button = shift ? { ...rawButton, y: rawButton.y + shift } : rawButton;
    if (primary) {
      // 主要ボタンは磨いた真鍮そのもの
      const fill = ctx.createLinearGradient(0, button.y - button.h / 2, 0, button.y + button.h / 2);
      fill.addColorStop(0, '#ffe6b0');
      fill.addColorStop(0.38, '#e0aa55');
      fill.addColorStop(0.62, '#b9812f');
      fill.addColorStop(1, '#7d5219');
      drawIronPlate(button.x, button.y, button.w, button.h, {
        cut: 12, fill, edge: '#fff1cd', lineWidth: 2.4, glow: 'rgba(255,205,110,0.6)',
        rivets: true, rivetInset: 15, rivetRadius: 3.4
      });
      drawOutlinedText(label, button.x, button.y + 6, {
        font: `900 16px ${UI_FONT_HEAVY}`, color: '#2a1a06', outline: 'rgba(255,240,205,0.9)', lineWidth: 3
      });
    } else {
      drawIronPlate(button.x, button.y, button.w, button.h, {
        cut: 12, lineWidth: 2.2, rivets: true, rivetInset: 15, rivetRadius: 3.4
      });
      drawOutlinedText(label, button.x, button.y + 6, {
        font: `900 15px ${UI_FONT_HEAVY}`, color: UI.brassLight, lineWidth: 3.5
      });
    }
  }

  // 決着直後、結果画面を出す前に「何で決まったか」を見せる。
  // 撃破と落下では立ち回りの反省点が違うので、区別が付かないと学べない。
  const MATCH_END_LABELS = {
    '撃破': { sub: 'KNOCKOUT', color: '#ff9d42' },
    '落下': { sub: 'RING OUT', color: '#59c9ff' },
    '時間切れ': { sub: 'TIME UP', color: '#ffd24a' },
    '相討ち': { sub: 'DRAW', color: '#d6b8ff' }
  };

  // 収まらない名前は末尾を「…」に詰める。詰めないと右隣のキャラ名に重なる。
  function fitText(text, font, maxWidth) {
    ctx.save();
    ctx.font = font;
    let s = String(text == null ? '' : text);
    if (ctx.measureText(s).width <= maxWidth) { ctx.restore(); return s; }
    while (s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
    ctx.restore();
    return s + '…';
  }

  // 記録に残っているキャラのキーから表示名を引く。未登録の古い記録は「−」。
  function characterLabel(key) {
    const def = key && CHARACTERS[key];
    return def ? def.name : '−';
  }

  function drawRankingRow(y, rank, name, streak, eff, highlight, character) {
    const w = 466;
    const left = VW / 2 - w / 2;
    ctx.save();
    ctx.fillStyle = highlight ? 'rgba(199,131,53,0.26)' : (rank % 2 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.16)');
    ctx.fillRect(left, y - 15, w, 30);
    if (highlight) {
      ctx.strokeStyle = UI.gold;
      ctx.lineWidth = 1.6;
      ctx.strokeRect(left + 0.8, y - 14.2, w - 1.6, 28.4);
    }
    ctx.restore();
    // 上位3人は色を変えて一目で分かるようにする
    const rankColor = rank === 1 ? '#ffd24a' : rank === 2 ? '#dfe6ef' : rank === 3 ? '#e0a26a' : UI.brassLabel;
    drawOutlinedText(String(rank), left + 30, y + 5, {
      font: `900 ${rank <= 3 ? 19 : 15}px ${UI_FONT_HEAVY}`, color: rankColor, lineWidth: 3.5
    });
    const nameFont = `900 15px ${UI_FONT_HEAVY}`;
    drawOutlinedText(fitText(name, nameFont, 168), left + 56, y + 5, {
      font: nameFont, color: highlight ? '#fff' : UI.parchment, lineWidth: 3.5, align: 'left'
    });
    const charFont = `900 12px ${UI_FONT_HEAVY}`;
    drawOutlinedText(fitText(characterLabel(character), charFont, 98), left + 240, y + 5, {
      font: charFont, color: highlight ? '#ffe3ab' : UI.brassLabel, lineWidth: 3, align: 'left'
    });
    drawOutlinedText(`${streak}`, left + w - 96, y + 5, {
      font: `900 17px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3.5
    });
    drawOutlinedText(`${eff}`, left + w - 32, y + 5, {
      font: `900 13px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
    });
  }

  function drawRankingScreen() {
    ctx.save();
    const bg = ctx.createLinearGradient(0, 0, 0, VH);
    bg.addColorStop(0, '#0b1420');
    bg.addColorStop(1, '#05080d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();

    drawOutlinedText('ランキング', VW / 2, 104, {
      font: `900 26px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 5
    });
    const periodLabel = rankingBoard ? `${rankingBoard.period} の記録` : '今月の記録';
    drawOutlinedText(periodLabel, VW / 2, 132, {
      font: `900 11px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
    });

    // 戻る・名前変更
    for (const [b, label] of [[rankingBackBtn, '‹  戻る'], [rankingNameBtn, hasRankingName() ? '名前を変更' : '名前を登録']]) {
      drawIronPlate(b.x, b.y, b.w, b.h, { cut: 8, lineWidth: 2 });
      drawOutlinedText(label, b.x, b.y + 4, {
        font: `900 12px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3
      });
    }

    if (rankingState === 'loading') {
      drawOutlinedText('読み込み中…', VW / 2, VH / 2, {
        font: `900 17px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 4
      });
      return;
    }
    if (rankingState === 'error') {
      drawOutlinedText(rankingError || '通信に失敗しました', VW / 2, VH / 2 - 30, {
        font: `900 15px ${UI_FONT_HEAVY}`, color: '#ff8a8a', lineWidth: 4
      });
      drawOutlinedText('電波の届く場所でもう一度お試しください', VW / 2, VH / 2 - 4, {
        font: `900 11px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
      drawIronPlate(rankingRetryBtn.x, rankingRetryBtn.y, rankingRetryBtn.w, rankingRetryBtn.h, {
        cut: 10, lineWidth: 2.4, rivets: true, rivetInset: 14, rivetRadius: 3.4
      });
      drawOutlinedText('再読み込み', rankingRetryBtn.x, rankingRetryBtn.y + 5, {
        font: `900 15px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 4
      });
      return;
    }
    if (!rankingBoard) return;

    // 見出し
    const headerY = 168;
    const w = 466;
    const left = VW / 2 - w / 2;
    drawOutlinedText('順位', left + 30, headerY, { font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3 });
    drawOutlinedText('なまえ', left + 56, headerY, { font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3, align: 'left' });
    drawOutlinedText('カタモン', left + 240, headerY, { font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3, align: 'left' });
    drawOutlinedText('連勝', left + w - 96, headerY,{ font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3 });
    drawOutlinedText('効率', left + w - 32, headerY, { font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3 });

    if (!rankingBoard.top.length) {
      drawOutlinedText('まだ誰も記録を残していません', VW / 2, VH / 2 - 40, {
        font: `900 15px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 4
      });
      drawOutlinedText('CPUバトルで連勝すると記録されます', VW / 2, VH / 2 - 14, {
        font: `900 11px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
    } else {
      const myRank = rankingBoard.me ? rankingBoard.me.rank : -1;
      for (let i = 0; i < rankingBoard.top.length; i++) {
        const e = rankingBoard.top[i];
        drawRankingRow(190 + i * 31, e.rank, e.name, e.streak, e.efficiency, e.rank === myRank, e.character);
      }
    }

    // 自分が20位より下なら、下部に自分の行を別枠で出す
    if (rankingBoard.me && rankingBoard.me.rank > rankingBoard.top.length) {
      const y = VH - 96;
      drawOutlinedText('あなたの順位', VW / 2, y - 26, {
        font: `900 11px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
      drawRankingRow(y, rankingBoard.me.rank, rankingBoard.me.name, rankingBoard.me.streak, rankingBoard.me.efficiency, true, rankingBoard.me.character);
    } else if (!rankingBoard.me) {
      drawOutlinedText(hasRankingName()
        ? '今月はまだ記録がありません'
        : '名前を登録すると記録が残せます', VW / 2, VH - 96, {
        font: `900 12px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
    }

    if (pendingScore) {
      drawOutlinedText('未送信の記録があります', VW / 2, VH - 52, {
        font: `900 10px ${UI_FONT_HEAVY}`, color: '#ffb45e', lineWidth: 3
      });
    }
  }

  // 敗北画面に、ランキング送信の顛末を出す。
  // 通信は結果画面が出てから終わるので、ここは「送信中→順位」と後から書き換わる。
  function drawSubmitResult(y) {
    if (submitState === 'idle') return;
    if (submitState === 'sending') {
      drawOutlinedText('記録を送信中…', VW / 2, y, {
        font: `900 12px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
      return;
    }
    if (submitState === 'noname') {
      drawOutlinedText('名前を登録するとランキングに残せます', VW / 2, y, {
        font: `900 12px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
      return;
    }
    if (submitState === 'failed') {
      drawOutlinedText('記録を送れませんでした', VW / 2, y, {
        font: `900 12px ${UI_FONT_HEAVY}`, color: '#ff9a9a', lineWidth: 3
      });
      drawOutlinedText('次に電波が届いた時に送り直します', VW / 2, y + 18, {
        font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
      return;
    }
    if (!submitRank) return;

    // 届いた瞬間だけ少し大きく出して、見逃さないようにする
    const pop = 1 + 0.5 * Math.max(0, Math.min(1, submitRevealTimer / 0.9));
    ctx.save();
    ctx.translate(VW / 2, y);
    ctx.scale(pop, pop);
    if (submitUpdated) {
      drawOutlinedText(`${submitRank}位 入賞!`, 0, 0, {
        font: `900 26px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 5
      });
    } else {
      drawOutlinedText(`現在 ${submitRank}位`, 0, 0, {
        font: `900 18px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 4
      });
    }
    ctx.restore();
    if (!submitUpdated) {
      drawOutlinedText('自己ベストの更新はなし', VW / 2, y + 20, {
        font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
      });
    }
  }

  function drawMatchEndReason() {
    if (!matchEndBannerVisible()) return;
    const style = MATCH_END_LABELS[matchEndReason] || MATCH_END_LABELS['撃破'];
    const progress = 1 - matchEndPause / MATCH_END_BANNER;
    // 出だしで素早く現れ、最後に軽く消える
    const alpha = Math.min(1, progress * 6) * Math.min(1, matchEndPause * 4);
    const bandY = VH * 0.34;
    const bandH = 130;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(2,5,10,0.72)';
    ctx.fillRect(0, bandY, VW, bandH);
    ctx.strokeStyle = `${style.color}cc`;
    ctx.lineWidth = 2;
    ctx.strokeRect(0, bandY + 1, VW, bandH - 2);
    // 出だしだけ少し大きく見せて衝撃を出す
    const scale = 1 + 0.16 * Math.max(0, 1 - progress * 4);
    ctx.translate(VW / 2, bandY + bandH / 2);
    ctx.scale(scale, scale);
    drawOutlinedText(matchEndReason, 0, -12, {
      font: `900 40px ${UI_FONT_HEAVY}`, color: '#fff', lineWidth: 6
    });
    drawOutlinedText(style.sub, 0, 26, {
      font: `900 14px ${UI_FONT_HEAVY}`, color: style.color, lineWidth: 4
    });
    ctx.restore();
  }

  // 通信の途中経過を控えておき、拒否された時にまとめてコピーできるようにするボタン。
  const onlineLogCopyBtn = { x: VW / 2, y: VH * 0.36 + 96, w: 220, h: 34 };
  let onlineLogCopyStatus = '';
  async function copyOnlineLog() {
    if (!online || !online.log || !online.log.length) { onlineLogCopyStatus = 'ログがありません'; return; }
    const text = JSON.stringify({ room: online.room, role: online.role, seat: online.seat, log: online.log });
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        onlineLogCopyStatus = 'コピーしました';
        return;
      }
      throw new Error('unsupported');
    } catch (_) { /* 下の手段へ落とす */ }
    // navigator.clipboard は権限や文脈で失敗することがある(実機で発生)。
    // 選択済みのテキストエリアを一時的に置き、旧APIでコピーし直す。
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(area);
      onlineLogCopyStatus = ok ? 'コピーしました' : 'コピーできません。共有ボタンをお試しください';
      if (ok) return;
    } catch (_) { /* 最後の手段へ */ }
    // それも駄目なら共有シートに載せる。スマホではこれが一番通りやすい。
    try {
      if (navigator.share) { await navigator.share({ title: 'カタモン 通信ログ', text }); onlineLogCopyStatus = '共有しました'; return; }
    } catch (_) { /* ユーザーが閉じただけの場合も含む */ }
    onlineLogCopyStatus = 'コピーできません。localStorage の katamon_online_log_v1 を確認してください';
  }
  function onlineErrorTitle(matchStarted) {
    return matchStarted ? '対戦を中断しました' : 'オンライン対戦を開始できません';
  }
  // オンライン対戦の状態表示。相手待ち・退出・バージョン不一致をここで知らせる。
  function drawOnlineOverlay() {
    if (!isOnline() || matchOver) return;
    let title = null;
    let sub = '';
    if (online.protocolError) {
      // 開始前の失敗と対戦中の切断を同じ見出しにしていたため、2ターン目まで進んだ試合が
      // 切れても「開始できません」と出ていた。中断された側には何が起きたのか分からない。
      title = onlineErrorTitle(online.matchStarted);
      sub = online.protocolError;
    } else if (online.versionMismatch) {
      title = 'アプリを更新してください';
      sub = '相手と通信のバージョンが違います';
    } else if (online.peerLeft) {
      title = '相手が退出しました';
      sub = '画面をタップしてタイトルへ';
    } else if (online.phase === 'waiting') {
      title = '相手を待っています…';
      sub = online.role === 'host' ? 'HOST' : 'GUEST';
    } else if (online.phase === 'selecting') {
      title = 'モンスターを確認しています…';
      sub = firebasePeersCommitted() ? '相手の公開を待っています' : '相手の選択を待っています';
    }
    if (!title) return;
    const showLogButton = !!online.protocolError;
    ctx.save();
    ctx.fillStyle = 'rgba(4,7,11,0.72)';
    ctx.fillRect(0, VH * 0.36, VW, showLogButton ? 160 : 96);
    drawOutlinedText(title, VW / 2, VH * 0.36 + 44, {
      font: `900 22px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 5
    });
    drawOutlinedText(sub, VW / 2, VH * 0.36 + 72, {
      font: `900 12px ${UI_FONT_HEAVY}`, color: UI.brassLight, lineWidth: 3
    });
    if (showLogButton) {
      drawIronPlate(onlineLogCopyBtn.x, onlineLogCopyBtn.y, onlineLogCopyBtn.w, onlineLogCopyBtn.h, { cut: 8, lineWidth: 2 });
      drawOutlinedText('通信ログをコピー', onlineLogCopyBtn.x, onlineLogCopyBtn.y + 4, {
        font: `900 12px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3
      });
      if (onlineLogCopyStatus) {
        drawOutlinedText(onlineLogCopyStatus, VW / 2, onlineLogCopyBtn.y + 30, {
          font: `900 10px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
        });
      }
      // 実際はどこをタップしてもタイトルへ戻れる(タップ処理側で先にログボタンを拾っている)。
      // 案内が無いと「相手を待っています」のホイールと相まって詰まったように見える。
      drawOutlinedText('画面をタップしてタイトルへ', VW / 2, onlineLogCopyBtn.y + 52, {
        font: `900 11px ${UI_FONT_HEAVY}`, color: UI.brassLight, lineWidth: 3
      });
    }
    ctx.restore();
  }

  // 対人戦の結果画面に「このまま再戦 / ロビーへ戻る」を出してよい状態か。
  // 観戦者は選べないので従来どおりロビーのポップアップに任せる。
  function firebaseResultChoiceVisible() {
    return !!(matchOver && isOnline() && online && online.kind === 'firebase'
      && online.phase === 'results' && isFirebasePlayer());
  }
  function firebaseHasResultVote() {
    return !!(online && online.rematchVotes
      && Object.prototype.hasOwnProperty.call(online.rematchVotes, online.seat));
  }

  function drawResultBanner() {
    if (!matchOver || matchEndPause > 0) return;
    const won = localWon();
    const draw = isDraw();
    const bandY = VH / 2 - 130;
    const bandH = (won || draw ? 280 : 330) + resultButtonShift();
    ctx.save();
    // 石版のような帯(上下を真鍮で締める)
    const band = ctx.createLinearGradient(0, bandY, 0, bandY + bandH);
    band.addColorStop(0, 'rgba(6,9,12,0.9)');
    band.addColorStop(0.5, 'rgba(14,19,24,0.93)');
    band.addColorStop(1, 'rgba(6,9,12,0.9)');
    ctx.fillStyle = band;
    ctx.fillRect(0, bandY, VW, bandH);
    for (const ry of [bandY, bandY + bandH - 4]) {
      const rail = ctx.createLinearGradient(0, ry, 0, ry + 4);
      rail.addColorStop(0, '#3a2510');
      rail.addColorStop(0.45, won ? '#f0c274' : draw ? '#bda8e6' : '#b98a6a');
      rail.addColorStop(1, '#241608');
      ctx.fillStyle = rail;
      ctx.fillRect(0, ry, VW, 4);
    }
    ctx.restore();

    const foeName = foeUnit().control === 'cpu' ? 'CPU' : '相手';
    drawOutlinedText(draw ? '相討ち!' : won ? `${foeName}を撃破!` : 'あなたの負け...', VW / 2, VH / 2 - 70, {
      font: `900 25px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 5
    });

    if (isOnline()) {
      // 対人戦は連勝にもランキングにも含めないので、連勝表示は出さない。
      drawOutlinedText(draw ? '引き分け' : won ? '対戦に勝利!' : '対戦に敗北', VW / 2, VH / 2 - 22, {
        font: `900 31px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 5
      });
    } else if (battleMode === 'free') {
      drawOutlinedText(draw ? '演習引き分け' : won ? '演習勝利!' : '演習敗北', VW / 2, VH / 2 - 22, {
        font: `900 31px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 5
      });
    } else if (draw) {
      drawOutlinedText('連勝維持', VW / 2, VH / 2 - 22, {
        font: `900 31px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 5
      });
    } else if (won) {
      drawOutlinedText(`${winStreak}連勝!`, VW / 2, VH / 2 - 22, {
        font: `900 42px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 6
      });
      if (winStreak > 0 && winStreak % 10 === 0) {
        drawOutlinedText('節目達成の大金星!', VW / 2, VH / 2 + 4, {
          font: `900 16px ${UI_FONT_HEAVY}`, color: '#ff8a3a', lineWidth: 4
        });
      }
    } else {
      drawOutlinedText(`最終 ${lastRunStreak}連勝`, VW / 2, VH / 2 - 22, {
        font: `900 31px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 5
      });
    }

    ctx.save();
    ctx.textAlign = 'center';
    const effShown = (battleMode === 'free' || isOnline())
      ? currentEfficiency()
      : (won ? currentEfficiency() : lastRunEfficiency);
    drawOutlinedText(`与ダメ効率: ${effShown} / 発射`, VW / 2, VH / 2 + 20, {
      font: `900 13px ${UI_FONT_HEAVY}`, color: 'rgba(255,245,220,0.9)', lineWidth: 3
    });

    if (!won && !draw && battleMode !== 'free' && !isOnline()) drawSubmitResult(VH / 2 + 56);

    // 決着直後に見たいのは勝敗であって、合言葉や部屋の設定ではない。
    // 対人戦の続行はこの結果画面で選ばせ、ロビーのポップアップは開かない。
    if (firebaseResultChoiceVisible()) {
      const voted = firebaseHasResultVote();
      drawResultButton(continueBtn, 'このまま再戦', !voted);
      drawResultButton(resultTitleBtn, 'ロビーへ戻る', false);
      if (voted) {
        drawOutlinedText('相手の返事を待っています…', VW / 2, resultTitleBtn.y + resultButtonShift() + 40, {
          font: `900 12px ${UI_FONT_HEAVY}`, color: UI.brassLabel, lineWidth: 3
        });
      }
    } else {
      if (!isOnline()) {
        drawResultButton(
          continueBtn,
          battleMode === 'free' ? '同じ条件でもう一戦' : (won || draw ? 'つぎのバトルへ' : 'もう一度挑戦'),
          true
        );
      }
      drawResultButton(
        resultTitleBtn,
        isOnline() ? '退出してタイトルへ' : (keepsRunOnExit() ? '中断してタイトルへ' : 'タイトルへ戻る'),
        isOnline()
      );
    }
    ctx.restore();
  }

  // 勝利画面から抜けるときは、連勝を捨てずに済ませる。
  // 「タイトルへ戻る」の誤タップで連勝がゼロになるのが一番痛いので、
  // 勝った直後だけは「つぎのバトルへ」と同じ状態を作ってから中断セーブする。
  // 敗北時は連勝が既に0でランキング送信も済んでおり、守るものが無いので従来どおり。
  function keepsRunOnExit() {
    return matchOver && battleMode !== 'free' && !isOnline() && (localWon() || isDraw());
  }

  function suspendRunToTitle() {
    // resetMatch の末尾はステージBGMを鳴らし直すので、先にタイトルへ移してから呼ぶ。
    gamePhase = 'title';
    resetMatch(true);      // つぎの試合(ボス戦の判定・地形・キャラ・必殺チャージの持ち越し)を用意
    saveSuspendedMatch();  // winStreak / runStats / isBossMatch ごと保存される
    hasSuspendedSave = true;
    returnToTitleFromResult();
  }

  function returnToTitleFromResult() {
    projectiles = [];
    aimState = null;
    moveDir = 0;
    inputMode = null;
    awaitingResolve = false;
    matchOver = false;
    matchEndPause = 0;
    matchEndReason = '';
    turnSettle = TURN_SETTLE_SEC;
    winner = null;
    cutIn = null;
    gamePhase = 'title';
    syncBgm(); // ステージ曲を止めてタイトル曲へ戻す判断はdirector側に任せる
  }

  function exitOnlineFromMenu() {
    if (online && online.kind === 'firebase') {
      const leaving = online;
      menuOpen = false;
      // メニューに「オンライン対戦を退出します」と明記しているので、その場で退出させる。
      // 通知とFirebaseの片付けは裏で続け、端末側は通信不調でも必ずタイトルへ戻す。
      const bye = netSend({ t: 'bye' });
      Promise.resolve(bye).catch(() => false).then(() => {
        const path = leaving.role === 'host' ? `rooms/${leaving.room}` : `rooms/${leaving.room}/slots/${leaving.seat}`;
        return firebaseRequest(path, leaving.auth, { method: 'DELETE' });
      }).catch(() => {});
      endOnline(false, false);
      hasSuspendedSave = false;
      returnToTitleFromResult();
      return;
    }
    // loopbackは従来どおり即時終了。
    endOnline(true);
    menuOpen = false;
    hasSuspendedSave = false;
    returnToTitleFromResult();
  }

  function drawTurnInfo() {
    // 帯の左右はHPパネルの並び(左=自分の席)に合わせるので、陣営ではなく席で見る。
    const isPlayer = isLocalTurn();
    const accent = isPlayer ? UI.ally : UI.enemy;
    const barY = 94 + hudShift();
    ctx.save();
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(8, barY, VW - 16, 19, 5) : ctx.rect(8, barY, VW - 16, 19);
    const bar = ctx.createLinearGradient(0, barY, 0, barY + 19);
    bar.addColorStop(0, isPlayer ? 'rgba(30,62,86,0.92)' : 'rgba(92,36,42,0.92)');
    bar.addColorStop(1, isPlayer ? 'rgba(12,26,38,0.92)' : 'rgba(44,16,20,0.92)');
    ctx.fillStyle = bar;
    ctx.fill();
    ctx.strokeStyle = UI.brass;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // 手番側を示す色帯
    ctx.fillStyle = accent;
    ctx.fillRect(isPlayer ? 9 : VW - 15, barY + 3, 6, 13);
    ctx.restore();

    const actingUnit = activeUnit();
    // 2vs2は4体居るので「CPUのターン」だけでは、味方のCPUなのか敵のCPUなのかも
    // 4体のうちどれなのかも分からなかった(実機で指摘)。HPカードと同じ呼び名を添える。
    const turnLabel = turnCutInLines(actingUnit).short;
    const lockLabel = actingUnit.moveLockTurns > 0 ? `　⚡移動封印 ${actingUnit.moveLockTurns}手` : '';
    // チュートリアルは時間切れが無いので、あるように見える「TURN n/15」は出さない。
    const turnCounter = battleMode === 'tutorial' ? 'れんしゅう'
      : `TURN ${Math.min(turnCount + 1, maxTurnsTotal())}/${maxTurnsTotal()}`;
    drawOutlinedText(
      `${turnLabel}　${turnCounter}${lockLabel}`,
      20, barY + 14, { align: 'left', font: `900 11px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3 }
    );
    drawOutlinedText(battleMode === 'free' ? '演習' : `${winStreak}連勝`, VW - 20, barY + 14, {
      align: 'right', font: `900 11px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 3
    });
    // 段D。応答の途切れた席を確認している間だけ、その旨を全端末に出す。
    // 出さないと「相手の手番のまま何も起きない」時間が90秒近く続き、固まったように見える。
    // 置き場所はミニマップの下。ターンバーとミニマップの間は7pxしか空いておらず、
    // そこへ出すとミニマップの枠と「MAP」の行に重なる(実ブラウザで確認済み)。
    const checkingSeats = firebaseMatchTakeoverSeats().filter(firebaseMatchSeatSuspect);
    if (checkingSeats.length) {
      const who = checkingSeats.length === 1 ? firebaseSeatLabel(checkingSeats[0]) : '一部の席';
      const text = `${who}の切断を確認中…`;
      const y = minimapTop() + MINIMAP.h + 13;
      ctx.save();
      ctx.font = `900 11px ${UI_FONT_HEAVY}`;
      const w = ctx.measureText(text).width + 22;
      // 地形も空も背景になり得るので、必ず暗い下敷きを敷いてから文字を置く。
      ctx.fillStyle = 'rgba(10,14,22,0.72)';
      ctx.beginPath();
      // 角丸は古い端末に無いことがある。ほかのHUDと同じく、無ければ四角で描く。
      if (ctx.roundRect) ctx.roundRect(VW / 2 - w / 2, y - 11, w, 18, 9);
      else ctx.rect(VW / 2 - w / 2, y - 11, w, 18);
      ctx.fill();
      ctx.strokeStyle = UI.brass;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      drawOutlinedText(text, VW / 2, y + 3, {
        align: 'center', font: `900 11px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 3
      });
    }
  }

  // ===== ミニマップ(ステージ全体とカメラの可視範囲を表示) =====
  const MINIMAP = { x: 13, y: 120, w: VW - 26, h: 56 };
  const MINIMAP_PAD = 4;
  // 地形は爆発・生成・中断復元の時しか変わらない。ここへ地形部分を焼いておけば、
  // 通常の1フレームでは巨大なsolidGridを走査せず、完成画像を1回貼るだけで済む。
  const minimapTerrainCanvas = document.createElement('canvas');
  minimapTerrainCanvas.width = MINIMAP.w - MINIMAP_PAD * 2;
  minimapTerrainCanvas.height = MINIMAP.h - MINIMAP_PAD * 2;
  const minimapTerrainCtx = minimapTerrainCanvas.getContext('2d');
  let minimapTerrainDirty = true;
  function isInMinimap(p) {
    return p.x >= MINIMAP.x && p.x <= MINIMAP.x + MINIMAP.w
      && p.y >= minimapTop() && p.y <= minimapTop() + MINIMAP.h;
  }
  function moveCameraFromMinimap(point, snapToMarker = false) {
    const pad = 4;
    const innerX = MINIMAP.x + pad;
    const innerY = minimapTop() + pad;
    const innerW = MINIMAP.w - pad * 2;
    const innerH = MINIMAP.h - pad * 2;
    const mapWorldTop = 260;
    const mapWorldBottom = Math.max(CONTROL_PANEL_Y + 8, GROUND_MAX_Y + 44);
    const mapWorldH = mapWorldBottom - mapWorldTop;
    const toMapX = x => innerX + (Math.max(0, Math.min(STAGE_W, x)) / STAGE_W) * innerW;
    const toMapY = y => innerY + Math.max(0, Math.min(1, (y - mapWorldTop) / mapWorldH)) * innerH;

    // P/Eマーカーを直接タップした時は、圧縮座標の誤差を挟まず本人の中心へ合わせる。
    if (snapToMarker) {
      for (const unit of units) {
        if (Math.hypot(point.x - toMapX(unit.x), point.y - toMapY(unit.y)) <= 18) {
          focusCameraOn(unit.x, true);
          return;
        }
      }
    }

    const ratio = Math.max(0, Math.min(1, (point.x - innerX) / innerW));
    cameraX = centerCameraOn(ratio * STAGE_W);
    cameraTargetX = null;
  }
  function rebuildMinimapTerrain() {
    const innerW = minimapTerrainCanvas.width;
    const innerH = minimapTerrainCanvas.height;
    const mapWorldTop = 260;
    const mapWorldBottom = Math.max(CONTROL_PANEL_Y + 8, GROUND_MAX_Y + 44);
    const mapWorldH = mapWorldBottom - mapWorldTop;
    const toMapX = x => (Math.max(0, Math.min(STAGE_W, x)) / STAGE_W) * innerW;
    const toMapY = y => Math.max(0, Math.min(1, (y - mapWorldTop) / mapWorldH)) * innerH;
    const startRow = Math.max(0, Math.floor(mapWorldTop / ROW_H));
    const endRow = Math.min(ROWS - 1, Math.ceil(mapWorldBottom / ROW_H));
    const mapCtx = minimapTerrainCtx;

    mapCtx.clearRect(0, 0, innerW, innerH);
    const terrainFill = mapCtx.createLinearGradient(0, 0, 0, innerH);
    terrainFill.addColorStop(0, 'rgba(235,243,255,0.30)');
    terrainFill.addColorStop(1, 'rgba(78,116,155,0.54)');
    mapCtx.fillStyle = terrainFill;
    mapCtx.beginPath();
    for (let c = 0; c < TERRAIN_COLS; c++) {
      const x0 = c / TERRAIN_COLS * innerW;
      const x1 = (c + 1) / TERRAIN_COLS * innerW;
      let runStart = -1;
      for (let r = startRow; r <= endRow + 1; r++) {
        const solid = r <= endRow && solidGrid[r * TERRAIN_COLS + c] === 1;
        if (solid && runStart < 0) runStart = r;
        if (!solid && runStart >= 0) {
          const y0 = toMapY(runStart * ROW_H);
          const y1 = toMapY(r * ROW_H);
          mapCtx.rect(x0, y0, Math.max(1, x1 - x0 + 0.25), Math.max(1, y1 - y0));
          runStart = -1;
        }
      }
    }
    mapCtx.fill();

    // 各地形塊の上面と下面を細く縁取りし、浮島であることを判別しやすくする。
    mapCtx.beginPath();
    for (let c = 0; c < TERRAIN_COLS; c++) {
      const x0 = c / TERRAIN_COLS * innerW;
      const x1 = (c + 1) / TERRAIN_COLS * innerW;
      for (let r = startRow; r <= endRow; r++) {
        if (solidGrid[r * TERRAIN_COLS + c] !== 1) continue;
        const aboveSolid = r > startRow && solidGrid[(r - 1) * TERRAIN_COLS + c] === 1;
        const belowSolid = r < endRow && solidGrid[(r + 1) * TERRAIN_COLS + c] === 1;
        if (!aboveSolid) {
          const y = toMapY(r * ROW_H);
          mapCtx.moveTo(x0, y);
          mapCtx.lineTo(x1, y);
        }
        if (!belowSolid) {
          const y = toMapY((r + 1) * ROW_H);
          mapCtx.moveTo(x0, y);
          mapCtx.lineTo(x1, y);
        }
      }
    }
    mapCtx.strokeStyle = 'rgba(255,255,255,0.82)';
    mapCtx.lineWidth = 1;
    mapCtx.stroke();
    minimapTerrainDirty = false;
  }

  // 世界全体を圧縮する縦長ミニマップ。地形画像だけをキャッシュし、動く物だけを毎フレーム重ねる。
  function drawMinimap() {
    const map = { ...MINIMAP, y: minimapTop() }; // 2vs2は名前カード2段ぶん下へ
    const pad = MINIMAP_PAD;
    const innerX = map.x + pad;
    const innerY = map.y + pad;
    const innerW = map.w - pad * 2;
    const innerH = map.h - pad * 2;
    const mapWorldTop = 260;
    const mapWorldBottom = Math.max(CONTROL_PANEL_Y + 8, GROUND_MAX_Y + 44);
    const mapWorldH = mapWorldBottom - mapWorldTop;
    const toMapX = x => innerX + (Math.max(0, Math.min(STAGE_W, x)) / STAGE_W) * innerW;
    const toMapY = y => innerY + Math.max(0, Math.min(1, (y - mapWorldTop) / mapWorldH)) * innerH;

    ctx.save();
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(map.x, map.y, map.w, map.h, 6) : ctx.rect(map.x, map.y, map.w, map.h);
    ctx.fillStyle = 'rgba(3,9,19,0.34)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(199,131,53,0.85)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.rect(innerX, innerY, innerW, innerH);
    ctx.clip();

    if (minimapTerrainDirty) rebuildMinimapTerrain();
    ctx.drawImage(minimapTerrainCanvas, innerX, innerY);

    // 鎖は省き、実際に砲弾判定を持つ先端障害物だけをミニマップへ表示する。
    if (currentPattern === 'tieredBasin') {
      const now = simTimeMs;
      ctx.fillStyle = '#d7a04e';
      ctx.strokeStyle = '#fff2c2';
      ctx.lineWidth = 0.8;
      for (const obstacle of arenaObstacles) {
        const p = arenaObstaclePosition(obstacle, now);
        ctx.beginPath();
        ctx.arc(toMapX(p.x), toMapY(p.y), 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    // 現在カメラに映っている横幅を淡く表示して、ズーム時の位置を把握しやすくする。
    const cameraMapX = toMapX(cameraX);
    const cameraMapW = Math.min(STAGE_W, visibleWorldWidth()) / STAGE_W * innerW;
    ctx.fillStyle = 'rgba(121,214,255,0.13)';
    ctx.fillRect(cameraMapX, innerY, cameraMapW, innerH);
    ctx.strokeStyle = 'rgba(143,229,255,0.88)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(cameraMapX + 0.5, innerY + 0.5, Math.max(1, cameraMapW - 1), innerH - 1);
    const drawUnitMark = (u, color, label) => {
      const x = toMapX(u.x), y = toMapY(u.y);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.24;
      ctx.beginPath(); ctx.moveTo(x, innerY); ctx.lineTo(x, y); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, x, Math.max(innerY + 8, y - 6));
    };
    // 2vs2でも全員の位置が分かるよう、席の陣営で色を分けて全ユニットを打つ。
    // 自分の席は大文字P、味方CPUは小文字p…と字で区別する(色だけだと重なると読めない)。
    const myTeam = localUnit().team;
    let foeIndex = 0;
    for (const u of units) {
      if (u.hp <= 0) continue;
      const mine = u.team === myTeam;
      const label = mine ? (u.id === localUnit().id ? 'P' : 'p') : (foeIndex++ === 0 ? 'E' : 'e');
      drawUnitMark(u, mine ? '#4fc3f7' : '#ff6b6b', label);
    }
    ctx.restore();

    const heightGap = Math.round(Math.abs(localUnit().y - foeUnit().y));
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MAP', map.x + 7, map.y + 11);
    ctx.textAlign = 'right';
    ctx.fillText(`ΔH ${heightGap}`, map.x + map.w - 7, map.y + 11);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText(`${Math.round(cameraZoom * 100)}%`, map.x + map.w / 2, map.y + map.h - 6);
    ctx.restore();
  }

  // ===== 対戦開始のVSカットイン(砲弾ネームプレート) =====
  // 左右から砲弾が飛んできて中央でぶつかり、そこにVSの紋章が出る。
  // 絵はユーザー提供の1枚のシートから切り出したもの(assets/vs-plate-*.png、vs-badge.png)。
  //
  // 配置は素材の見本(bullet image)の比率から起こしてある。
  // 自陣営の砲弾が上、相手陣営の砲弾が下で、少し斜めに構えて中央で重なる。
  const VS_TILT = -0.23;              // 砲弾の傾き(ラジアン)。上下とも同じ角度で平行に見せる
  const VS_PLATE_W = 430;             // 砲弾の長さ(仮想座標)
  const VS_CENTER_Y = 495;            // composition 全体の中心
  // 左右にずらして、VSの紋章が顔ではなく窓と窓の境目へ落ちるようにする。
  const VS_ALLY_OFFSET = { x: -42, y: -68 };
  const VS_FOE_OFFSET = { x: 30, y: 54 };
  const VS_BADGE_W = 104;
  const VS_FLY_SEC = 0.42;            // 飛んでくる時間。ここを過ぎた瞬間が衝突
  const VS_EXIT_SEC = 0.52;           // 最後にお互いを撃ち抜けて画面の外へ出るまで

  // 砲弾1本を描く。窓の中にキャラの顔と名前を入れる。
  // mirror=true は相手陣営。素材の先端は右向きなので、反転して中央へ向ける。
  function drawVsPlate(entries, mirror, slideX, flash) {
    const two = entries.length > 1;
    const img = vsPlateImages[mirror ? (two ? 'foe2' : 'foe1') : (two ? 'ally2' : 'ally1')];
    const slots = VS_PLATE_SLOTS[mirror ? (two ? 'foe2' : 'foe1') : (two ? 'ally2' : 'ally1')];
    const off = mirror ? VS_FOE_OFFSET : VS_ALLY_OFFSET;
    const ratio = vsPlateReady(img) ? img.naturalHeight / img.naturalWidth : 173 / 726;
    const pw = VS_PLATE_W;
    const ph = pw * ratio;

    ctx.save();
    ctx.translate(VW / 2 + off.x, VS_CENTER_Y + off.y);
    ctx.rotate(VS_TILT);
    // 進むのは砲弾が向いている方向。回転より後に動かすことで、真横ではなく
    // 先端の向きへ飛ぶ。傾いたまま真横へ滑ると、飛んでいるように見えない。
    ctx.translate(slideX, 0);

    if (vsPlateReady(img)) {
      ctx.save();
      if (mirror) ctx.scale(-1, 1);
      ctx.drawImage(img, -pw / 2, -ph / 2, pw, ph);
      ctx.restore();
    } else {
      // 画像が届いていない端末でも、顔と名前は必ず出す。
      ctx.fillStyle = mirror ? 'rgba(74,18,18,0.94)' : 'rgba(14,52,38,0.94)';
      ctx.strokeStyle = UI.gold;
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 16);
      else ctx.rect(-pw / 2, -ph / 2, pw, ph);
      ctx.fill(); ctx.stroke();
    }

    entries.forEach((entry, index) => {
      const raw = slots[Math.min(index, slots.length - 1)];
      // 反転して描いた砲弾では、窓も左右が入れ替わる。
      const x0 = mirror ? 1 - raw[2] : raw[0];
      const x1 = mirror ? 1 - raw[0] : raw[2];
      const rect = {
        x: -pw / 2 + x0 * pw, y: -ph / 2 + raw[1] * ph,
        w: (x1 - x0) * pw, h: (raw[3] - raw[1]) * ph
      };
      // 1vs1は窓が1つで横に広い。顔を窓の真ん中へ置くと中央のVS紋章の下に隠れるので、
      // 砲弾の外側(紋章から遠い方)へ寄せる。2vs2は窓が2つなので真ん中でよい。
      const anchor = entries.length > 1 ? 0.5 : (mirror ? 0.68 : 0.32);
      drawVsPlateFace(entry, rect, mirror, anchor);
      // 1vs1は窓が広く、顔を外側へ寄せた残りが大きく空く(実機で指摘)。
      // そこへ「何と戦うのか」が分かるものを入れる。2vs2は窓が狭いので入れない。
      if (entries.length === 1) drawVsPlateInfo(entry, rect, mirror, anchor);
    });

    // ぶつかった瞬間だけ、砲弾の縁を光らせる。
    if (flash > 0) {
      ctx.save();
      ctx.globalAlpha = flash * 0.32;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = mirror ? '#ff9a6b' : '#8fe6b0';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 16);
      else ctx.rect(-pw / 2, -ph / 2, pw, ph);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // 1vs1の窓の空きに出す、相手を測るための3行。
  // 役割・最大HP・必殺技の名前は、どの端末でもキャラだけで決まるので表示がずれない。
  // 名前や戦績のような端末ごとに変わる値はここへ入れないこと。
  function drawVsPlateInfo(entry, rect, mirror, anchor) {
    const def = entry && CHARACTERS[entry.character];
    if (!def) return;
    // 顔が寄っている側の反対に置く。顔の幅ぶんは避ける。
    const faceHalf = (rect.h - Math.min(19, rect.h * 0.3)) * 0.62;
    const faceCx = rect.x + rect.w * anchor;
    const x0 = mirror ? rect.x + 8 : faceCx + faceHalf + 8;
    const x1 = mirror ? faceCx - faceHalf - 8 : rect.x + rect.w - 8;
    const w = x1 - x0;
    if (w < 60) return;
    // 紋章は自陣営の右下・相手陣営の左上から食い込むので、横も少しだけ逃がす。
    const cx = (x0 + x1) / 2 + (mirror ? 10 : -6);
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 9);
    else ctx.rect(rect.x, rect.y, rect.w, rect.h);
    ctx.clip();
    // 顔との境目に細い仕切りを入れて、絵と文字がぶつかって見えないようにする。
    ctx.strokeStyle = 'rgba(255,226,150,0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const lineX = mirror ? x1 + 5 : x0 - 5;
    ctx.moveTo(lineX, rect.y + rect.h * 0.16);
    ctx.lineTo(lineX, rect.y + rect.h * 0.84);
    ctx.stroke();
    ctx.restore();

    const roleFont = `900 ${Math.round(Math.min(12, w * 0.115))}px ${UI_FONT_HEAVY}`;
    const lineFont = `900 ${Math.round(Math.min(11, w * 0.105))}px ${UI_FONT_HEAVY}`;
    // 中央のVS紋章は、自陣営の砲弾の「下」と相手陣営の砲弾の「上」にかぶる。
    // 紋章から遠い側へ3行を寄せる(実機で相手側の1行目が隠れていた)。
    const top = rect.y + rect.h * (mirror ? 0.46 : 0.22);
    const step = rect.h * 0.19;
    drawOutlinedText(fitText(def.role || '', roleFont, w), cx, top, {
      font: roleFont, color: UI.gold, lineWidth: 3.5
    });
    drawOutlinedText(fitText(`HP ${def.maxHp}`, lineFont, w), cx, top + step, {
      font: lineFont, color: UI.parchment, lineWidth: 3
    });
    drawOutlinedText(fitText(`必殺 ${def.special || '—'}`, lineFont, w), cx, top + step * 2, {
      font: lineFont, color: UI.brassLight, lineWidth: 3
    });
  }

  // 窓1つぶん。顔は窓を埋める大きさに切り出し、はみ出した分は窓で切る。
  function drawVsPlateFace(entry, rect, mirror, anchor) {
    const def = entry && CHARACTERS[entry.character];
    const img = entry && charImages[entry.character];
    const ready = def && img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0;
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 9);
    else ctx.rect(rect.x, rect.y, rect.w, rect.h);
    ctx.clip();

    if (ready) {
      const [fx, fy, fw] = MATCHUP_FACES[entry.character] || CHARACTER_FACES[entry.character] || DEFAULT_FACE;
      const sw = img.naturalWidth * fw;
      const sh = sw;
      const sx = Math.max(0, Math.min(img.naturalWidth - sw, img.naturalWidth * fx - sw / 2));
      const sy = Math.max(0, Math.min(Math.max(0, img.naturalHeight - sh), img.naturalHeight * fy - sh / 2));
      // 窓は横長。長辺に合わせると顔が拡大されすぎて目だけになるので、高さに合わせる。
      // 左右に窓の紺色が残るが、見本の絵もそうなっている。
      // 名前の帯のぶんを避けて、その上の範囲で中央に置く。
      // 窓の真ん中に置くと、あごから下が帯に隠れる(実機で確認)。
      const band = Math.min(19, rect.h * 0.3);
      const d = (rect.h - band) * 1.16;
      const cx = rect.x + rect.w * anchor;
      const cy = rect.y + (rect.h - band) / 2;
      // facesLeft=true は元素材が左向き。自陣営は右を、相手陣営は左を向かせる。
      const flip = mirror ? !def.facesLeft : !!def.facesLeft;
      ctx.save();
      ctx.translate(cx, cy);
      if (flip) ctx.scale(-1, 1);
      ctx.drawImage(img, sx, sy, sw, sh, -d / 2, -d / 2, d, d);
      ctx.restore();
    }

    // 名前は顔の真下に敷く。窓の中央に置くと、1vs1では顔から離れて紋章の下へ入る。
    const nameH = Math.min(19, rect.h * 0.3);
    const nameW = Math.min(rect.w, rect.h * 1.5);
    const nameX = Math.max(rect.x, Math.min(rect.x + rect.w - nameW, rect.x + rect.w * anchor - nameW / 2));
    ctx.fillStyle = 'rgba(3,10,16,0.72)';
    ctx.fillRect(nameX, rect.y + rect.h - nameH, nameW, nameH);
    ctx.restore();

    const font = `900 ${Math.round(Math.min(13, nameW * 0.13))}px ${UI_FONT_HEAVY}`;
    drawOutlinedText(fitText(def ? def.name : '？', font, nameW - 8), nameX + nameW / 2,
      rect.y + rect.h - nameH / 2 + 4,
      { font, color: '#fff4d6', lineWidth: 3.5 });
  }

  function drawMatchupCutIn() {
    const elapsed = cutIn.duration - cutIn.timer;
    // 飛んでくる → ぶつかる → 見せる、の3段。ぶつかる瞬間を VS_FLY_SEC に置く。
    const fly = Math.min(1, elapsed / VS_FLY_SEC);
    const eased = 1 - Math.pow(1 - fly, 3);
    const sinceHit = elapsed - VS_FLY_SEC;
    const flash = sinceHit >= 0 ? Math.max(0, 1 - sinceHit / 0.26) : 0;
    const fadeOut = Math.min(1, cutIn.timer / 0.24);
    const alpha = Math.max(0, Math.min(1, elapsed / 0.1, fadeOut));
    // 最後はお互いを撃ち抜けて、そのまま画面の外へ出ていく。
    // だんだん速くなる曲線にして、止まってから消えるのではなく撃ち抜けたように見せる。
    const exitStart = cutIn.duration - VS_EXIT_SEC;
    const exit = elapsed <= exitStart ? 0 : Math.min(1, (elapsed - exitStart) / VS_EXIT_SEC);
    const exitSlide = exit * exit * exit * (VW + VS_PLATE_W) * 1.15;
    // 画面の外から飛び込ませる。ぶつかった後はわずかに押し戻される。
    const recoil = sinceHit >= 0 ? Math.sin(Math.min(1, sinceHit / 0.26) * Math.PI) * 7 : 0;
    const allySlide = -(1 - eased) * (VW + VS_PLATE_W) + recoil * -1 + exitSlide;
    const foeSlide = (1 - eased) * (VW + VS_PLATE_W) + recoil - exitSlide;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(2,5,12,0.94)';
    ctx.fillRect(0, 0, VW, VH);

    // 奥行きの集中線。ぶつかる瞬間に一番強くなる。
    ctx.save();
    ctx.globalAlpha = alpha * ((1 - eased) * 0.2 + flash * 0.5 + exit * 0.32);
    ctx.strokeStyle = '#ffd98a';
    ctx.lineWidth = 1;
    for (let i = 0; i < 26 && ctx.globalAlpha > 0.004; i++) {
      const a = (i / 26) * Math.PI * 2 + 0.2;
      const inner = 74 + flash * 26;
      ctx.beginPath();
      ctx.moveTo(VW / 2 + Math.cos(a) * inner, VS_CENTER_Y + Math.sin(a) * inner);
      ctx.lineTo(VW / 2 + Math.cos(a) * 560, VS_CENTER_Y + Math.sin(a) * 560);
      ctx.stroke();
    }
    ctx.restore();

    // チュートリアルは対戦ではないので、見出しも「対戦開始」とは言わない。
    drawOutlinedText(battleMode === 'tutorial' ? 'TUTORIAL START!' : 'BATTLE START', VW / 2, 250, {
      font: `900 25px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 5
    });

    // 相手陣営を先に描き、自陣営を上に重ねる(見本と同じ重なり)。
    drawVsPlate(cutIn.right, true, foeSlide, flash);
    drawVsPlate(cutIn.left, false, allySlide, flash);

    // VSの紋章。ぶつかった瞬間に大きく出て、少し縮んで落ち着く。
    if (sinceHit >= -0.02) {
      const pop = Math.min(1, Math.max(0, (sinceHit + 0.02) / 0.2));
      const scale = 0.4 + 0.75 * (1 - Math.pow(1 - pop, 3)) + Math.sin(pop * Math.PI) * 0.16;
      const badge = vsPlateImages.badge;
      ctx.save();
      ctx.translate(VW / 2, VS_CENTER_Y);
      ctx.scale(scale, scale);
      if (vsPlateReady(badge)) {
        const bw = VS_BADGE_W;
        const bh = bw * (badge.naturalHeight / badge.naturalWidth);
        ctx.drawImage(badge, -bw / 2, -bh / 2, bw, bh);
      } else {
        drawOutlinedText('VS', 0, 16, {
          font: `900 46px ${UI_FONT_HEAVY}`, color: '#ffb43c', lineWidth: 7
        });
      }
      ctx.restore();
    }

    // 火花。ぶつかった直後だけ、中央から散る。
