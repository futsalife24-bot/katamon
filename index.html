    // 同じ行で埋まり、肝心の直前のやり取りが消えてしまう事故を実際に起こした。
    if (online.protocolError) return;
    logOnlineEvent({ type: 'reject', reason });
    online.protocolError = reason;
    online.phase = 'ended';
    persistOnlineLog();
    // 対戦開始前はCanvasのエラー表示が見えないので、ロビーにも理由を出す。
    // 要素はidから暗黙に生えるグローバル(window.onlineLobby)ではなく、明示した定数で参照する。
    // 暗黙のグローバルはブラウザ以外では存在せず、ここが例外を投げると中断理由が出せなくなる。
    if (onlineLobbyEl && !onlineLobbyEl.classList.contains('hidden')) onlineLobbyStatus(reason);
    try { online.transport.close(); } catch (_) { /* noop */ }
  }
  // 詰まりの保険。ここまで待たされたメッセージは、多少演出が切れても適用してしまう。
  const NET_QUEUE_MAX_HOLD = 5;

  // ===== 移動の配信 =====
  // 移動は立派な戦略なので相手にも見せる。以前は移動をまったく送っておらず、
  // fire が運ぶ着弾直前の座標でしか相手の位置が分からなかった。そのせいで
  // 「燃料が合わない」「撃たずに落下死しても伝わらない」という切断が続いた。
  // 送信量は燃料が頭打ちにする。1ターンの移動距離は最大でも fuelMax(約138px)、
  // MOVE_SPEED 95px/s なので最長1.45秒。この間隔なら1ターン十数通で収まる。
  const MOVE_SYNC_INTERVAL_SEC = 0.12;
  const MOVE_SYNC_MIN_DELTA = 1.5; // これ未満の移動は送らない(静止中の無駄打ちを防ぐ)
  let moveSyncTimer = 0;
  let moveSyncPending = false;  // 前回送信後に動いたか。停止時の最終送信に使う
  let lastSentMoveX = null;

  function resetMoveSync() {
    moveSyncTimer = 0;
    moveSyncPending = false;
    lastSentMoveX = null;
  }

  function sendMoveUpdate(unit) {
    moveSyncTimer = 0;
    if (!isOnline() || !netControlsUnit(unit)) { moveSyncPending = false; return; }
    if (lastSentMoveX !== null && Math.abs(unit.x - lastSentMoveX) < MOVE_SYNC_MIN_DELTA) { moveSyncPending = false; return; }
    lastSentMoveX = unit.x;
    moveSyncPending = false;
    netSend({ t: 'move', unitId: unit.id, x: unit.x, fuel: unit.fuel });
  }

  // 受信した位置へ、実際の歩行と同じ速さ・同じ地形追従で寄せる。
  // 瞬間移動させず歩かせることで、崖際の駆け引きが相手にも伝わる。
  function updateRemoteWalk(dt) {
    for (const u of units) {
      if (u.control !== 'remote' || u.netWalkTargetX == null) continue;
      if (!u.grounded) continue; // 落下中は物理に任せる
      const diff = u.netWalkTargetX - u.x;
      if (Math.abs(diff) <= 0.5) { u.x = u.netWalkTargetX; u.netWalkTargetX = null; faceAllUnitsTowardOpponents(); continue; }
      // 遅延で溜まった分は少し速めに詰める。離れすぎている時だけ効く。
      const speed = MOVE_SPEED * (Math.abs(diff) > 60 ? 2 : 1);
      const step = Math.min(Math.abs(diff), speed * dt) * Math.sign(diff);
      faceUnitTowardOpponent(u);
      let nx = Math.min(STAGE_W - UNIT_RADIUS - 4, Math.max(UNIT_RADIUS + 4, u.x + step));
      nx = limitMoveByClimb(u, nx);
      if (Math.abs(nx - u.x) < 0.01) { u.netWalkTargetX = null; continue; } // 崖などで進めない
      u.x = nx;
      faceAllUnitsTowardOpponents();
      followGroundOrFall(u);
    }
  }

  function enqueueNetMessage(msg) {
    const item = { msg, held: 0 };
    if (!online) return;
    online.queue.push(item);
  }
  function firebaseCompletedTerminalStatus(msg) {
    const completed = online && online.completedRemoteActions && online.completedRemoteActions.get(msg.actionId);
    if (!completed) return '';
    if (completed.from === msg.from && completed.t === 'result' && msg.t === 'result') return 'duplicate-result';
    return 'mismatch';
  }
  function rememberFirebaseTerminal(msg) {
    if (!online.completedRemoteActions) online.completedRemoteActions = new Map();
    online.completedRemoteActions.set(msg.actionId, { from: msg.from, t: msg.t });
    while (online.completedRemoteActions.size > 16) online.completedRemoteActions.delete(online.completedRemoteActions.keys().next().value);
  }
  function receiveFirebaseTerminal(msg) {
    const completed = firebaseCompletedTerminalStatus(msg);
    if (completed === 'duplicate-result') return true;
    if (completed === 'mismatch') {
      rejectFirebaseMessage('不正な通信順序です（terminal.actionId）');
      return true;
    }
    // 敗北宣言は対応する fire を持たない(撃たずに落下死した場合など)。
    // 保留に積むと相手の発射をいつまでも待ち、15秒後に誤って切断してしまう。
    if (!online.remoteAction && firebaseResultConcedes(msg)) {
      enqueueNetMessage(msg);
      return true;
    }
    if (online.remoteAction) {
      if (!firebaseActionMatches(msg, online.remoteAction)) {
        rejectFirebaseMessage('不正な通信順序です（terminal.actionId）');
        return true;
      }
      enqueueNetMessage(msg);
      return true;
    }
    const existing = online.pendingRemoteTerminals.get(msg.actionId);
    const buffered = bufferFirebaseTerminal(existing && existing.msg, msg);
    if (!buffered.ok) {
      rejectFirebaseMessage('不正な通信順序です（terminal.actionId）');
      return true;
    }
    if (!buffered.duplicate) online.pendingRemoteTerminals.set(msg.actionId, {
      msg: buffered.pending, visibleMs: 0, checkedAt: firebaseMonotonicNow()
    });
    if (online.pendingRemoteTerminals.size > 16) rejectFirebaseMessage('不正な通信順序です（terminal.buffer）');
    return true;
  }

  // 進行を書き換えるメッセージは即座に適用しない。カットイン中や弾が飛んでいる最中に
  // 状態を差し替えると、演出が切れたり必殺の保留が二重発射になるため、いったんキューに積む。
  // 受信処理が例外で落ちると、そのパケットだけが黙って消える。
  // 実際、STAGE_H という未定義の名前を参照していたせいで fire だけが永久に届かず、
  // 「相手の行動通知が届かない」という原因の分からない中断になっていた。
  // 例外は握り潰さず、必ず画面に出して止める。
  function netReceive(msg) {
    try {
      netReceiveInner(msg);
    } catch (err) {
      const detail = err && err.message ? err.message : String(err);
      if (online && online.kind === 'firebase') rejectFirebaseMessage(`受信処理でエラーが発生しました（${detail}）`);
      else if (online) { online.protocolError = `受信処理でエラーが発生しました（${detail}）`; online.phase = 'ended'; }
      throw err; // 開発中に気付けるよう、コンソールへは残す
    }
  }

  // 席ごとに送ってよいメッセージ種別。ここで false になると対戦を打ち切るため、
  // FIREBASE_MESSAGE_TYPES の全種別を必ず明示的に判定すること。
  // 以前は末尾が「ping以外は全部false」の落とし穴になっており、bye と観戦者の ping が
  // 「不正な送信席です」で対戦を切っていた。
  function firebasePacketSeatAllowed(msg) {
    if (!msg || !FIREBASE_SEATS.includes(msg.seat || '')) return false;
    // 進行に影響しない合図。観戦者も送るので席を問わず通す。
    // ここを対戦者限定にしていたため、観戦者のpingが「不正な送信席です」で対戦を切っていた。
    if (msg.t === 'ping' || msg.t === 'bye') return true;
    // presence は入室の合図。ホストは自分の入室を告げないので、p1から来るのは異常。
    if (msg.t === 'presence') return msg.seat !== 'p1';
    // ホストだけが部屋の状態を宣言できる。
    if (msg.t === 'lobbyState' || msg.t === 'settings' || msg.t === 'start') return msg.seat === 'p1';
    // 対戦者だけの合図。
    if (msg.t === 'commit' || msg.t === 'ready' || msg.t === 'reveal' || msg.t === 'rematchVote') return firebasePlayerSeats().includes(msg.seat);
    // 盤面を動かすものは、対戦者かつ自分のユニットについてのみ。
    // 席とユニットの対応は固定(p1→p1 / e1→e1 / s1→p2 / s2→e2)。ルール側も同じ表で縛っている。
    if (msg.t === 'move' || msg.t === 'fire' || msg.t === 'boom' || msg.t === 'state' || msg.t === 'result') {
      return firebasePlayerSeats().includes(msg.seat) && firebaseActionUnitAllowed(msg);
    }
    return false;
  }
  // 通信で名指しできるユニット。ここに無いIDは受け取った時点で捨てる。
  function isFirebaseUnitId(id) { return SNAPSHOT_UNIT_IDS_2V2.includes(id); }
  // 2vs2で誰も座っていない席のキャラはCPUが動かす(決定3)。乱数の同期という
  // 新しい壊れどころを作らないため、ホストの端末が1台で決めて結果を配る(Issue #26)。
  // database.rules.json の unitId の例外と同じ条件をここにも置く。片方だけ広げると、
  // 「ルールは通すのにクライアントが切る(またはその逆)」という食い違いになる。
  function firebaseHostActsForEmptySeat(seat, unitId) {
    if (seat !== 'p1' || !firebaseLobbyIs2v2()) return false;
    const owner = FIREBASE_SEATS.find(s => FIREBASE_SEAT_UNIT[s] === unitId);
    return !!owner && owner !== 'p1' && !firebaseSeatOccupied(owner);
  }
  // ターンの受け渡しの確認。1vs1は「相手が撃ち終わったら次は自分」で必ず決まる。
  // 2vs2は次が自分とは限らない(味方や敵のもう1体へ渡る)ので、確かめるのは
  // 「撃った本人に手番が残っていないこと」だけにする。
  function firebaseStateTurnHandoffOk(msg) {
    const nextUnitId = msg.snap.turnOrder[msg.snap.activeIndex];
    if (!firebaseLobbyIs2v2()) return nextUnitId === firebaseSeatUnitId(online.seat);
    return nextUnitId !== msg.unitId;
  }
  // 盤面を動かすパケットの unitId が、その席のものとして正しいか。
  function firebaseActionUnitAllowed(msg) {
    if (!msg || !isFirebaseUnitId(msg.unitId)) return false;
    return msg.unitId === firebaseSeatUnitId(msg.seat) || firebaseHostActsForEmptySeat(msg.seat, msg.unitId);
  }

  function netReceiveInner(msg) {
    if (!online || !msg || msg.from === online.clientId) return; // 自分の送信は無視
    if (online.kind === 'firebase') {
      if (msg.v !== FIREBASE_PROTO_VERSION) {
        // 版不一致が分かった時点で、演出待ちの通常メッセージも今後は適用しない。
        // 対戦開始カットイン中に受信キューが残っている場合でも、安全停止を最優先する。
        online.versionMismatch = true;
        online.queue.length = 0;
        return;
      }
      if (msg.t === 'start' || msg.t === 'state') msg = { ...msg, snap: normalizeFirebaseSnapshot(msg.snap) };
      const validation = validateFirebaseMessageDetail(msg);
      if (!validation.ok) {
        rejectFirebaseMessage(`不正な通信データを受信しました（${validation.reason}）`);
        return;
      }
      // 常設ロビーではSSEに過去ラウンドの履歴も届く。現在ラウンド以外は絶対に適用しない。
      // 席の判定より先に捨てる。古いラウンドの正当なパケットで対戦を切らないため。
      if (msg.roundId !== online.currentRoundId) return;
      if (!firebasePacketSeatAllowed(msg)) { rejectFirebaseMessage(`不正な送信席です（${msg.t}/${msg.seat}）`); return; }
      if (!ONLINE_LOG_SKIP.has(msg.t)) logOnlineEvent({ dir: 'in', t: msg.t, seat: msg.seat });
      // 生存確認を戻せるのは対戦者の通信だけ。観戦者のpingで相手の切断を見逃さないため。
      // 自分の送信は上で除外済みなので、対戦者から見ればこれは相手のパケットに等しい。
      // 観戦者から見ればどちらかの対戦者が生きていればよいので、この判定で両方に合う。
      if (firebasePlayerSeats().includes(msg.seat)) noteFirebasePeerMessage();
      // ロビー表示用の在席記録は観戦者も含めて全席ぶん取る(上の対戦者限定の判定とは別物)。
      noteFirebaseSeatSeen(msg.seat);
      // 試合中の席ごとの生存(段D)。上の2つとは数える対象も使い道も違うので分けてある。
      noteFirebaseMatchSeatMessage(msg.seat);
      if (online.participantRole === 'spectator') {
        if (msg.t === 'start' || msg.t === 'state') applyFirebaseSpectatorSnapshot(msg);
        else if (msg.t === 'result') receiveFirebaseSpectatorResult(msg);
        else if (msg.t === 'lobbyState') applyFirebaseLobbyState(msg);
        else if (msg.t === 'settings') { online.settings = normalizeLobbySettings(msg.settings); syncFirebaseParticipantRole(); renderFirebaseLobby(); }
        return;
      }
      if (msg.t === 'state' || msg.t === 'result') {
        receiveFirebaseTerminal(msg);
        return;
      }
      // start は前ラウンドの地形・死体・カットインが残っていても即時に扱う。
      // 通常の演出FIFOへ入れると、grounded=false の死体が残った再戦だけ永久に詰まる。
      // reveal のSHA-256確認が非同期で終わる前に届いた場合だけ、専用の1枠へ保留する。
      if (msg.t === 'start') {
        if (firebaseRevealsReady()) applyNetMessage(msg);
        else {
          online.pendingStart = msg;
          logOnlineEvent({ type: 'startBuffered', reason: 'revealPending' });
        }
        return;
      }
      // Firebase v3はここで必ず完結させる。v2の下流判定へ落とすと、v3を版不一致として
      // 切断してしまうため、ロビー制御は即時、試合演出はFIFOに分けてreturnする。
      if (msg.t === 'lobbyState' || msg.t === 'settings' || msg.t === 'ready' || msg.t === 'commit' || msg.t === 'reveal' || msg.t === 'rematchVote' || msg.t === 'presence' || msg.t === 'ping' || msg.t === 'move') {
        applyNetMessage(msg);
        return;
      }
      if (msg.t === 'fire' || msg.t === 'boom') {
        enqueueNetMessage(msg);
        return;
      }
      return;
    }
    if (msg.v !== PROTO_VERSION) {
      online.versionMismatch = true;
      online.queue.length = 0;
      return;
    }
    if (NET_CONTROL_TYPES.has(msg.t)) {
      applyNetMessage(msg);
      return;
    }
    enqueueNetMessage(msg);
  }

  // キューを流していい状態か。「弾が飛んでいない・落下していない・カットインも必殺の保留も無い」。
  function netCanApply() {
    return !cutIn && !pendingShot && !projectiles.length && units.every(u => u.grounded) && !(online && online.kind === 'firebase' && awaitingResolve);
  }

  function netDrainQueue(dt) {
    if (!online || !online.queue.length) return;
    while (online.queue.length) {
      const next = online.queue[0];
      next.held += dt || 0;
      const forced = next.held >= NET_QUEUE_MAX_HOLD && !(online.kind === 'firebase' && awaitingResolve);
      if (!netCanApply() && !forced) break;
      applyNetMessage(online.queue.shift().msg);
      if (!online || online.phase === 'ended') break;
    }
  }

  function applyNetMessage(msg) {
    // SSEではfireと直後のstateが同じイベント周期で届く。受信時ではなくFIFOキューから
    // fireを再生した後に順序を判定し、state/resultの単体注入だけを拒否する。
    if (online && online.kind === 'firebase' && (msg.t === 'state' || msg.t === 'result')) {
      const completed = firebaseCompletedTerminalStatus(msg);
      if (completed === 'duplicate-result') return;
      if (completed === 'mismatch') {
        rejectFirebaseMessage('不正な通信順序です（terminal.actionId）');
        return;
      }
    }
    if (online && online.kind === 'firebase' && !firebaseFlowAllows(msg, {
      activeId: activeUnit().id,
      remoteUnitId: unitById(msg.unitId || '') && unitById(msg.unitId).control === 'remote' ? msg.unitId : null,
      remoteAction: online.remoteAction
    })) {
      rejectFirebaseMessage(`不正な通信順序です（${msg.t}.flow）`);
      return;
    }
    switch (msg.t) {
      case 'lobbyState':
        if (online && online.kind === 'firebase') applyFirebaseLobbyState(msg);
        break;
      case 'settings':
        if (online && online.kind === 'firebase') { online.settings = normalizeLobbySettings(msg.settings); syncFirebaseParticipantRole(); renderFirebaseLobby(); }
        break;
      case 'rematchVote':
        if (online && online.kind === 'firebase' && firebasePlayerSeats().includes(msg.seat)) {
          online.rematchVotes[msg.seat] = !!msg.vote;
          renderFirebaseLobby();
          if (isFirebaseHost() && msg.vote === false) { resetFirebaseRound(false); break; }
          if (isFirebaseHost() && allFirebaseRematchVotesIn()) resetFirebaseRound(true);
        }
        break;
      case 'presence':
        rememberFirebaseName(msg);
        if (online && online.kind === 'firebase' && isFirebaseHost() && msg.seat !== 'p1') refreshFirebaseRoster(true);
        break;
      case 'join':
        // ゲストが来た。ホストだけが試合の実体を配る。
        if (online.role === 'host' && online.kind !== 'firebase') sendMatchStart();
        break;
      case 'hello':
        // ホストが先に開いて待っていた。まだ試合を受け取っていなければ参加を要求し、
        // 受け取り済みなら ready を撒き直す(ackが落ちてホストが待ち続けるのを防ぐ)。
        if (online.role !== 'guest') break;
        netSend({ t: online.phase === 'waiting' ? 'join' : 'ready' });
        break;
      case 'start':
        if (online && online.kind === 'firebase' && online.participantRole === 'spectator') { applyFirebaseSpectatorSnapshot(msg); break; }
        if (online.role !== 'guest') break;
        if (online.kind === 'firebase' && (online.phase === 'playing' || online.phase === 'ended')) break; // SSE再送/リプレイは無害に捨てる
        if (online.kind === 'firebase' && !firebaseRevealsReady()) {
          online.protocolError = 'キャラクター確認が完了していません';
          break;
        }
        if (online.kind === 'firebase') { applyFirebaseStart(msg); break; }
        applySnapshot(msg.snap);
        setOnlineSeat(online.seat);
        battleMode = 'normal';
        gamePhase = 'battle';
        showBattleStartCutIn();
        syncBgm({ restartStage: true });
        online.phase = 'playing';
        netSend({ t: 'ready' });
        break;
      case 'ready':
        // ゲストが試合を受け取ってから、はじめてホストの操作を解禁する。
        // ここを待たないと、遅延の大きい回線でホストが先に撃ててしまう。
        if (online && online.kind === 'firebase') {
          // value を省いた旧形式は「準備完了」とみなす。
          // 2vs2は4人ぶん要るので席ごとに覚える。1vs1の peerReady は従来どおり残す
          // (開始条件や表示が peerReady を見ている箇所を変えずに済ませるため)。
          if (!online.seatReady) online.seatReady = {};
          online.seatReady[msg.seat] = msg.value !== false;
          if (msg.seat === online.peerSeat) online.peerReady = msg.value !== false;
          // startを受け取った側のackで、ホストも初めて入力解禁する。2vs2では
          // 座っている人ぜんぶが受け取るまで待つ。1人でも取りこぼしたまま撃つと、
          // その人だけ違う盤面から始まってしまう。空席のCPUはackを返さないので数えない。
          if (online.role === 'host' && online.phase === 'starting') {
            online.startAcks[msg.seat] = true;
            if (firebaseOccupiedPlayerSeats().every(seat => seat === online.seat || online.startAcks[seat])) online.phase = 'playing';
          }
          renderFirebaseLobby();
          maybeAutoStartFirebaseRound();
          break;
        }
        if (online.role === 'host') online.phase = 'playing';
        break;
      case 'fire': {
        const u = unitById(msg.unitId);
        if (!u || u.control !== 'remote') break;
        // 前の行動の記録が権威ある値を受け取れずに残っていることがある。次の炸裂が
        // 古い基準を使わないよう、行動の頭で捨てる。
        online.pendingRemoteDamage = null;
        logOnlineEvent({ type: 'fire', unitId: msg.unitId, actionId: msg.actionId });
        // 移動そのものは送っていないので、撃つ直前の立ち位置をここで合わせる。
        u.x = msg.x;
        u.y = msg.y;
        faceAllUnitsTowardOpponents();
        // state/result を受けるまでの紐付けを先に確立する。非アクティブタブでSSEだけが
        // 先行しても、後続パケットを正しい行動へ結び付けられる。
        if (online.kind === 'firebase') {
          online.remoteAction = { unitId: msg.unitId, actionId: msg.actionId, from: msg.from, sentAt: msg.sentAt, resolved: false };
          const bufferedEntry = online.pendingRemoteTerminals.get(msg.actionId);
          const buffered = bufferedEntry && bufferedEntry.msg;
          if (buffered) {
            if (!firebaseActionMatches(buffered, online.remoteAction)) {
              rejectFirebaseMessage('不正な通信順序です（terminal.actionId）');
              break;
            }
            online.pendingRemoteTerminals.delete(msg.actionId);
            enqueueNetMessage(buffered);
          }
        }
        launchShot(u, msg.anchor, msg.vx0, msg.vy0, msg.useSpecial, false, msg.useJump);
        awaitingResolve = true;
        break;
      }
      case 'move': {
        const u = unitById(msg.unitId);
        if (!u || u.control !== 'remote') break;
        // 目標だけ受け取り、そこまでは自分の端末で歩かせる(updateRemoteWalk)。
        // 燃料は相手が権威なのでそのまま反映する。
        u.netWalkTargetX = Math.min(STAGE_W - UNIT_RADIUS - 4, Math.max(UNIT_RADIUS + 4, Number(msg.x)));
        if (Number.isFinite(msg.fuel)) u.fuel = Math.max(0, Math.min(u.fuelMax, Number(msg.fuel)));
        faceAllUnitsTowardOpponents();
        break;
      }
      case 'boom':
        // 手動起爆は廃止した(炸裂点は発射時に確定する)。更新前の端末から届くことが
        // あるので、受け取っても何もしない。検証と再送の除外だけ従来どおり通す。
        break;
      case 'state':
        // ターン境界の権威。ここで完全に揃う。
        if (online.phase !== 'playing') break;
        if (online.kind === 'firebase') {
          let mismatch = '';
          if (!online.remoteAction || !online.remoteAction.resolved) mismatch = 'remoteAction';
          else if (!firebaseStateTurnHandoffOk(msg)) mismatch = 'turnOrder.activeIndex';
          else mismatch = firebaseStateMismatchReason(msg.snap);
          if (mismatch) {
            rejectFirebaseMessage(`相手の行動と一致しない状態更新です（${mismatch}）`);
            break;
          }
          rememberFirebaseTerminal(msg);
          online.remoteAction = null;
        }
        logOnlineEvent({ type: 'state', ok: true, units: msg.snap.units.map(u => ({ id: u.id, hp: u.hp })) });
        applySnapshot(msg.snap);
        setOnlineSeat(online.seat);
        flushRemoteDamageText();
        break;
      case 'result':
        if (online.phase !== 'playing') break;
        if (online.kind === 'firebase') {
          const playerAlive = teamAlive('player');
          const cpuAlive = teamAlive('cpu');
          const localWinner = playerAlive && !cpuAlive ? 'player' : !playerAlive && cpuAlive ? 'cpu' : !playerAlive && !cpuAlive ? 'draw' : null;
          // 送信者が「自分の負け」を宣言している場合は、こちらの再現結果と食い違っていても受理する。
          // 移動は通信していないため、相手が自分のターンに落下死したことはこちらでは再現できない。
          // 負けを譲る側に不正の動機は無く、相手を害することもないので信用してよい。
          const concedes = firebaseResultConcedes(msg);
          if (!concedes && (!online.remoteAction || !online.remoteAction.resolved || !localWinner || localWinner !== msg.winner)) {
            rejectFirebaseMessage('ローカル結果と一致しない決着通知です');
            break;
          }
          rememberFirebaseTerminal(msg);
          online.remoteAction = null;
          // 敗北宣言はこちらで再現できていないので、決着時のHPを相手の申告で揃える。
          if (concedes) {
            for (const u of msg.units) {
              const target = unitById(u.id);
              if (target) target.hp = u.hp;
            }
          }
          logOnlineEvent({ type: 'result', ok: true, winner: msg.winner, reason: msg.reason });
          // 決着打も同じ扱い。ここで出さないと、とどめの一撃だけ数字が出ない。
          flushRemoteDamageText();
          projectiles = [];
          awaitingResolve = false;
          matchOver = true;
          winner = msg.winner;
          beginMatchEnd(msg.reason);
          online.phase = 'results';
          scheduleFirebaseResultsLobby();
          break;
        }
        for (const u of msg.units) {
          const target = unitById(u.id);
          if (target) target.hp = u.hp;
        }
        flushRemoteDamageText();
        projectiles = [];
        awaitingResolve = false;
        matchOver = true;
        winner = msg.winner;
        beginMatchEnd(msg.reason);
        online.phase = online.kind === 'firebase' ? 'results' : 'ended';
        if (online.kind === 'firebase') scheduleFirebaseResultsLobby();
        break;
      case 'bye':
        online.peerLeft = true;
        online.phase = 'ended';
        break;
      case 'commit':
        if (online.kind !== 'firebase' || online.phase === 'ended' || typeof msg.hash !== 'string') break;
        // 2vs2は3人ぶん届く。席ごとに覚え、相手の席ぶんは従来の peer* にも写す。
        if (msg.seat === online.seat || !firebaseSeatIsPlayer(msg.seat)) break;
        {
          const decision = acceptPeerCommit(online.seatCommit[msg.seat], msg.hash, !!online.seatRevealSeen[msg.seat], online.seatCommitAt[msg.seat], msg.sentAt);
          if (decision.error) { rejectFirebaseMessage(decision.error); break; }
          if (decision.duplicate) break; // 同じpushの再送は無害に無視する
          if (decision.stale) break;     // 押し直しの古いコミットが後から届いただけ
          online.seatCommit[msg.seat] = decision.hash;
          online.seatCommitAt[msg.seat] = decision.at;
          if (msg.seat === online.peerSeat) { online.peerCommit = decision.hash; online.peerCommitAt = decision.at; online.peerCommitted = true; }
        }
        onlineLobbyStatus(firebaseLobbyIs2v2()
          ? `${firebaseSeatLabel(msg.seat)}がモンスターを確定しました。`
          : '相手がモンスターを確定しました。確認中…');
        maybeRevealCharacter();
        maybeAutoStartFirebaseRound();
        break;
      case 'reveal':
        if (online.kind !== 'firebase' || online.phase === 'ended') break;
        if (msg.seat === online.seat || !firebaseSeatIsPlayer(msg.seat)) break;
        verifyPeerReveal(msg);
        break;
      case 'ping':
        // Firebase限定の生存確認。進行状態やロビー状態を変えない。
        break;
    }
  }

  // ホストが試合の実体(地形・キャラ・手番)を作って配る。join のたびに現在の状態を送るので、
  // 取りこぼしても次の join で追いつける。解禁は ready が返ってきてから。
  function sendMatchStart() {
    // ループバックは既存どおりjoinの再送でstartも再送する。Firebaseは永続SSEのpush keyで
    // 重複を除き、commit/reveal後の開始を一度だけにする。
    if (!online || (online.kind === 'firebase' && online.matchStarted)) return;
    if (online.kind === 'firebase') online.matchStarted = true;
    const snap = buildSnapshot();
    if (online.kind === 'firebase' && online.transport.saveSnapshot) online.transport.saveSnapshot(snap).catch(() => {});
    netSend({ t: 'start', snap });
  }

  // 発射の配信。人が撃った時も、2vs2で空席のCPUをホストが撃たせた時も必ずここを通す。
  // 相手には「誰がどこからどう撃ったか」だけを送り、演出は受け取った側で再生させる。
  function netSendFire(unit, anchor, vx0, vy0, useSpecial, useJump) {
    if (!isOnline() || !netControlsUnit(unit)) return;
    let actionId = null;
    if (online.kind === 'firebase') {
      actionId = secureNonce();
      online.localAction = { unitId: unit.id, actionId };
    }
    // 撃つ前に未送信の移動を確定させる。fire は座標を運ぶが燃料は move でしか伝わらない。
    if (moveSyncPending) sendMoveUpdate(unit);
    logOnlineEvent({ type: 'sendFire', unitId: unit.id, actionId });
    netSend({
      t: 'fire', unitId: unit.id, x: unit.x, y: unit.y,
      anchor: { x: anchor.x, y: anchor.y },
      vx0, vy0, useSpecial: !!useSpecial, useJump: !!useJump,
      ...(actionId ? { actionId } : {})
    });
  }

  // ターンの切れ目に、行動した側が権威として状態を送る。
  function netSyncTurn(actedUnit) {
    if (!isOnline() || online.phase !== 'playing') return;
    if (!netControlsUnit(actedUnit)) return;
    if (online.kind === 'firebase') {
      const action = online.localAction;
      if (!action || action.unitId !== actedUnit.id || !FIREBASE_ACTION_ID_RE.test(action.actionId || '')) {
        rejectFirebaseMessage('ローカル行動IDを確認できません');
        return;
      }
      const snap = buildSnapshot();
      if (online.transport.saveSnapshot) online.transport.saveSnapshot(snap).catch(() => {});
      netSend({ t: 'state', snap, actionId: action.actionId, unitId: action.unitId });
      online.localAction = null;
      return;
    }
    netSend({ t: 'state', snap: buildSnapshot() });
  }

  // 決着も行動側が決める。両者が独立に判定するとHPが1違うだけで勝敗が食い違う。
  function netSyncResult(reason) {
    // 送信側の記録。これが無いと「相手に何も届かなかった」時に、送っていないのか
    // 送って弾かれたのかが実機ログから分からない(2026-07-27に実際に追えなくなった)。
    if (!isOnline()) return;
    if (online.resultSent) { logOnlineEvent({ type: 'sendResult', ok: false, why: 'alreadySent' }); return; }
    let actionId = null;
    let actionUnitId = null;
    if (online.kind === 'firebase') {
      const action = online.localAction;
      if (action && FIREBASE_ACTION_ID_RE.test(action.actionId || '')) {
        actionId = action.actionId;
        actionUnitId = action.unitId;
      } else if (isFirebasePlayer()) {

    const leaving = online;
    endOnline(false, false);
    // 結果ロビーからの退出も戦闘画面を経由している。gamePhaseをtitleへ戻してからsyncBgmを呼べば
    // ステージ曲を止めてタイトル曲へ戻す判断は director 側がやってくれる。
    gamePhase = 'title'; syncBgm();
    const cleanup = leaving.role === 'host'
      ? firebaseRequest(`rooms/${leaving.room}`, leaving.auth, { method: 'DELETE' })
      : firebaseRequest(`rooms/${leaving.room}/slots/${leaving.seat}`, leaving.auth, { method: 'DELETE' });
    cleanup.catch(() => {});
  }

  // 通信エラー・版不一致・相手の退出でタイトルへ抜ける経路は「終点」で、ここから再戦は無い。
  // 明示的なロビー退出と同じように席/部屋を返す。返さないと round.status が playing のまま
  // 部屋が残り、席の確保は status==='lobby' を条件にしているので誰も入れなくなる。
  // 固定コードの簡単対戦がこれで期限切れまで使えなくなっていた(2026-07-28に実際に発生)。
  // 結果画面(matchOver)からは呼ばない。あちらは再戦のために部屋を残す必要がある。
  // 投げ捨てで送る。ここで待つとタイトルへ戻れなくなり、失敗しても部屋の期限が拾ってくれる。
  function releaseFirebaseRoomOnFatalExit() {
    if (!online || online.kind !== 'firebase') return;
    const leaving = online;
    const path = leaving.role === 'host' ? `rooms/${leaving.room}` : `rooms/${leaving.room}/slots/${leaving.seat}`;
    firebaseRequest(path, leaving.auth, { method: 'DELETE' }).catch(() => {});
  }

  function beginOnline(role) {
    const transport = makeTransport(LOOPBACK_ROOM);
    if (!transport) return false; // BroadcastChannelが無い環境では黙って諦める
    online = {
      kind: 'loopback', role,
      transport,
      clientId: `${role}-${Math.random().toString(36).slice(2, 10)}`,
      seat: role === 'host' ? 'p1' : 'e1',
      phase: 'waiting',
      queue: [],
      retryTimer: 0,
      resultSent: false,
      peerLeft: false,
      versionMismatch: false, matchStarted: false
    };
    transport.onMessage(netReceive);
    setOnlineSeat(online.seat);
    if (role === 'host') {
      // 地形とキャラはホストが決める。キャラ選択の同期はStage 3の課題なので、いまは両方ランダム。
      battleMode = 'normal';
      winStreak = 0;
      runStats = { damageDealt: 0, shots: 0 };
      player.character = CHARACTER_LIST[Math.floor(Math.random() * CHARACTER_LIST.length)];
      cpu.character = CHARACTER_LIST[Math.floor(Math.random() * CHARACTER_LIST.length)];
      // BGMの停止/開始は resetMatch 末尾の syncBgm({ restartStage: true }) がまとめて処理する
      gamePhase = 'battle';
      resetMatch(false);
    }
    netSend({ t: role === 'host' ? 'hello' : 'join' });
    return true;
  }

  function endOnline(sendBye, cleanup = true, skipDeferredCleanup = false) {
    if (!online) return;
    const leaving = online;
    if (leaving.authRefreshTimer) clearTimeout(leaving.authRefreshTimer);
    if (leaving.authRetryTimer) clearTimeout(leaving.authRetryTimer);
    if (leaving.roomLeaseTimer) clearTimeout(leaving.roomLeaseTimer);
    if (leaving.seatHeartbeatTimer) clearTimeout(leaving.seatHeartbeatTimer);
    // どの抜け方でもここを通るので、すぐ対戦の案内の取り下げは1箇所にまとめる。
    // 間に合わなくても案内は期限で消え、拾った側は席の確保に失敗して次へ進むだけ。
    if (leaving.kind === 'firebase' && leaving.quickListed) unpublishOpenRoom(leaving.room, leaving.auth);
    // v3 Firebaseは試合終了・ページ離脱で部屋を消さない。明示的なロビー退出だけが席/部屋を消す。
    if (sendBye && leaving.kind !== 'firebase') { netSend({ t: 'bye' }); netSend({ t: 'bye' }); }
    leaving.transport.close();
    if (cleanup && !skipDeferredCleanup && leaving.kind === 'firebase' && leaving.role === 'host' && leaving.protocol === 2) {
      // sendChainに積んだbye POSTよりDELETEが先着しないよう少しだけ待つ。
      // pagehideはタイマーが停止しうるため、そこではskipDeferredCleanup=trueとしてTTLに任せる。
      setTimeout(() => firebaseRequest(`rooms/${leaving.room}`, leaving.auth, { method: 'DELETE' }).catch(() => {}), 1000);
    }
    online = null;
    setLocalSeat('p1');
    if (onlineLobbyEl) onlineLobbyEl.classList.remove('in-room', 'host', 'results');
    cancelLeaveFirebaseLobbyConfirm();
    closeOnlineLobby();
    syncBgm();
  }

  // 開発用の入口はタイトルに着いてから開く。読み込み中に試合へ飛ばすと
  // 画像が揃う前に描き始めてしまい、音も端末のロック解除前で鳴らない。
  let pendingLoopback = null;
  function startPendingLoopback() {
    if (!pendingLoopback || gamePhase !== 'title') return;
    const role = pendingLoopback;
    pendingLoopback = null;
    beginOnline(role);
  }

  // 開発用パラメータの適用。devParams は席の切り替えと同じところで作ってある。
  if (devParams) {
    const lb = devParams.get('loopback');
    if (lb === 'host' || lb === 'guest') pendingLoopback = lb;
    netSim.delayMs = Math.max(0, Number(devParams.get('netdelay')) || 0);
    netSim.lossRate = Math.min(0.9, Math.max(0, Number(devParams.get('netloss')) || 0));
  }

  // 相手が来るまでは join/hello を撒き続ける。どちらが先に開いても繋がるようにするため。
  function updateOnline(dt) {
    startPendingLoopback();
    if (!online) return;
    updateFirebaseResultsLobby();
    // 既に終わっている接続を毎フレーム再判定しない。保留中の通知は放棄する。
    if (online.phase === 'ended' || online.protocolError) return;
    updateFirebasePendingTerminals();
    if (!online || online.phase === 'ended') return;
    // 席ごとの生存は、対戦全体の生存より先に見る。順が逆だと、引き継げるはずの席の
    // 疑いがまだ立っていない一瞬に、全体の判定が試合を切ってしまう。
    updateFirebaseMatchSeatTakeover();
    if (!online || online.phase === 'ended') return;
    updateFirebasePeerLiveness();
    if (!online || online.phase === 'ended') return;
    updateFirebaseLobbyLiveness();
    if (!online || online.phase === 'ended') return;
    netDrainQueue(dt);
    if (online.phase !== 'waiting') return;
    online.retryTimer -= dt;
    if (online.retryTimer <= 0) {
      online.retryTimer = NET_RETRY_SEC;
      netSend({ t: online.role === 'host' ? 'hello' : 'join' });
    }
  }

  function wrapText(text, x, y, maxWidth, lineHeight) {
    let line = '';
    let cy = y;
    for (const ch of text) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, cy);
        line = ch;
        cy += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, cy);
  }

  function angularPlatePath(x, y, w, h, cut = 14) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + cut, y - h / 2);
    ctx.lineTo(x + w / 2 - cut, y - h / 2);
    ctx.lineTo(x + w / 2, y - h / 2 + cut);
    ctx.lineTo(x + w / 2, y + h / 2 - cut);
    ctx.lineTo(x + w / 2 - cut, y + h / 2);
    ctx.lineTo(x - w / 2 + cut, y + h / 2);
    ctx.lineTo(x - w / 2, y + h / 2 - cut);
    ctx.lineTo(x - w / 2, y - h / 2 + cut);
    ctx.closePath();
  }

  function drawRivet(x, y, r = 5.5) {
    const rivet = ctx.createRadialGradient(x - r * 0.36, y - r * 0.36, r * 0.18, x, y, r * 1.1);
    rivet.addColorStop(0, '#fff1a3');
    rivet.addColorStop(0.42, '#b47728');
    rivet.addColorStop(1, '#35200e');
    ctx.fillStyle = rivet;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#160e08';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ===== 戦闘UI共用:真鍮縁の黒鉄プレート =====
  // opts: cut(角の落とし幅) / edge(縁色) / lineWidth / fill(塗りの上書き) /
  //       rivets(四隅に鋲) / rivetInset / glow(縁の発光色)
  function drawIronPlate(x, y, w, h, opts = {}) {
    const cut = opts.cut != null ? opts.cut : 12;
    ctx.save();
    angularPlatePath(x, y, w, h, cut);
    let fill = opts.fill;
    if (!fill) {
      const g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
      g.addColorStop(0, UI.plateTop);
      g.addColorStop(0.12, UI.plateMid);
      g.addColorStop(1, UI.plateBottom);
      fill = g;
    }
    ctx.fillStyle = fill;
    ctx.fill();
    if (opts.glow) {
      ctx.shadowColor = opts.glow;
      ctx.shadowBlur = 12;
    }
    ctx.strokeStyle = opts.edge || UI.brass;
    ctx.lineWidth = opts.lineWidth != null ? opts.lineWidth : 2.5;
    ctx.stroke();
    ctx.restore();
    if (opts.rivets) {
      const ins = opts.rivetInset != null ? opts.rivetInset : 13;
      const rr = opts.rivetRadius != null ? opts.rivetRadius : 4;
      drawRivet(x - w / 2 + ins, y - h / 2 + ins, rr);
      drawRivet(x + w / 2 - ins, y - h / 2 + ins, rr);
      drawRivet(x - w / 2 + ins, y + h / 2 - ins, rr);
      drawRivet(x + w / 2 - ins, y + h / 2 - ins, rr);
    }
  }

  // ===== 戦闘UI共用:縁取り文字(小さくても潰れない視認性重視) =====
  function drawOutlinedText(text, x, y, opts = {}) {
    ctx.save();
    ctx.textAlign = opts.align || 'center';
    ctx.font = opts.font || `900 16px ${UI_FONT_HEAVY}`;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = opts.outline || UI.ink;
    ctx.lineWidth = opts.lineWidth != null ? opts.lineWidth : 4;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = opts.color || UI.parchment;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // タイトルの CPU BATTLE の説明文。告知は吹き出し(drawSuspendedSaveBubble)が担うので、
  // ここは常に通常の説明のまま。両方に出すと同じことを二度言うことになる。
  function titleCpuButtonSub() {
    return 'モンスターを選んで連勝へ挑め';
  }

  // 中断データの告知。**あえて世界観から浮かせる**のが狙い。
  // 最初は他のUIと同じ黒鉄+真鍮で作ったが、背景に完全に溶けて気づけなかった(実機で確認)。
  // マンガの吹き出しに寄せ、白地に黒縁の楕円+尻尾にしてある。ここだけ浮いて見えるのは
  // 意図した結果なので、「他と揃っていない」という理由で直さないこと。
  //
  // 置けるのはロゴとモードラベルの間の帯だけ(ボタンの上下は12px、左右の余白は79pxで
  // 文字が入らない)。尻尾は CPU BATTLE の文字へ向けて左下へ伸ばす。
  // 数値を触るならこの4つ。SAVE_BUBBLE_CY を下げすぎるとモードラベルに被る。
  const SAVE_BUBBLE_TEXT = '中断データあり';
  // タイトルへ戻された理由を、戻った先で読めるように持ち越す帯。
  // ロビーの赤帯は退出と同時に消えてしまうので、それだけだと何が起きたのか分からない。
  const TITLE_NOTICE_MS = 15000;
  // ロゴ(〜445)のすぐ下。中断データの吹き出し(SAVE_BUBBLE_CY=522の上下26px)と
  // 重ねないこと。中断データを持ったままオンラインで席を空けられると両方出る。
  const TITLE_NOTICE_Y = 468;
  const TITLE_NOTICE_H = 36;
  let titleNotice = '';
  let titleNoticeUntil = 0;
  function showTitleNotice(text) {
    titleNotice = text || '';
    titleNoticeUntil = Date.now() + TITLE_NOTICE_MS;
  }
  function activeTitleNotice() {
    if (!titleNotice || Date.now() > titleNoticeUntil) return '';
    return titleNotice;
  }
  function drawTitleNotice() {
    const text = activeTitleNotice();
    if (!text) return;
    ctx.save();
    ctx.font = `900 12px ${UI_FONT_HEAVY}`;
    const w = Math.min(VW - 40, ctx.measureText(text).width + 36);
    angularPlatePath(VW / 2, TITLE_NOTICE_Y, w, TITLE_NOTICE_H, 8);
    ctx.fillStyle = 'rgba(78,22,22,0.94)';
    ctx.fill();
    ctx.strokeStyle = '#e08a72';
    ctx.lineWidth = 2;
    ctx.stroke();
    drawOutlinedText(text, VW / 2, TITLE_NOTICE_Y + 5, {
      font: `900 12px ${UI_FONT_HEAVY}`, color: '#ffe2d6', lineWidth: 3
    });
    ctx.restore();
  }

  const TITLE_MODE_LABEL_Y = 566;     // SELECT A BATTLE MODE の帯。吹き出しはこれに被らせない
  const SAVE_BUBBLE_CY = 522;         // 楕円の中心の高さ
  const SAVE_BUBBLE_RY = 26;          // 楕円の縦半径
  const SAVE_BUBBLE_TAIL_AT = 0.42 * Math.PI;   // 尻尾が出る位置(楕円上の角度。0.5πが真下、それ未満で右寄り)
  const SAVE_BUBBLE_TAIL_SPREAD = 0.09 * Math.PI; // 付け根の広さ
  const SAVE_BUBBLE_TAIL_LEN = 40;    // 尻尾の長さ
  const SAVE_BUBBLE_TAIL_DIR = { x: -0.452, y: 0.892 }; // 伸びる向き(左下・CPU BATTLEの文字side)
  // 位置とサイズは描画と検査で同じものを使う。画面外へ出ていないか、ボタンやロゴに
  // 被っていないかは、目で見られない代わりに resulttest 側で数値として押さえている。
  function suspendedSaveBubbleRect(textW) {
    // 右端をボタンの右端に合わせ、幅は左の余白(18px)を割らない範囲までしか広げない。
    // 幅だけを VW 基準で丸めると、文言が長い時に左へはみ出す(検査で捕まえた)。
    const right = Math.min(VW - 18, titleVsCpuBtn.x + titleVsCpuBtn.w / 2);
    const w = Math.min(textW + 48, right - 18);
    return { x: right - w, y: SAVE_BUBBLE_CY - SAVE_BUBBLE_RY, w, h: SAVE_BUBBLE_RY * 2 };
  }
  // 尻尾の付け根と先端。楕円上の角度で取るので、大きさを変えても付け根がずれない。
  function suspendedSaveBubbleTail(box) {
    const rx = box.w / 2;
    const cx = box.x + rx;
    const cy = SAVE_BUBBLE_CY;
    const at = [SAVE_BUBBLE_TAIL_AT - SAVE_BUBBLE_TAIL_SPREAD, SAVE_BUBBLE_TAIL_AT + SAVE_BUBBLE_TAIL_SPREAD];
    const mouth = at.map(t => ({ x: cx + rx * Math.cos(t), y: cy + SAVE_BUBBLE_RY * Math.sin(t) }));
    const base = { x: (mouth[0].x + mouth[1].x) / 2, y: (mouth[0].y + mouth[1].y) / 2 };
    return {
      cx, cy, rx, at, base,
      tip: {
        x: base.x + SAVE_BUBBLE_TAIL_DIR.x * SAVE_BUBBLE_TAIL_LEN,
        y: base.y + SAVE_BUBBLE_TAIL_DIR.y * SAVE_BUBBLE_TAIL_LEN
      }
    };
  }
  function drawSuspendedSaveBubble() {
    if (!hasSuspendedSave) return;
    ctx.save();
    ctx.font = '900 16px ' + UI_FONT;
    const box = suspendedSaveBubbleRect(ctx.measureText(SAVE_BUBBLE_TEXT).width);
    const t = suspendedSaveBubbleTail(box);
    const INK = '#7a4412';
    const PAPER = '#ffdfb4';

    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;

    // 楕円と尻尾を**1本の輪郭**として描く。別々に描いて後から塗りで隠す方式だと、
    // 付け根に楕円の縁が線として残る(実機で確認)。口の角度ぶんだけ弧を欠かし、
    // そこから先端へ直線でつないで閉じれば、継ぎ目そのものが存在しなくなる。
    ctx.beginPath();
    ctx.ellipse(t.cx, t.cy, t.rx, SAVE_BUBBLE_RY, 0, t.at[1], t.at[0] + Math.PI * 2, false);
    ctx.lineTo(t.tip.x, t.tip.y);
    ctx.closePath();
    ctx.fillStyle = PAPER;
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.shadowOffsetY = 0;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4a2708';
    ctx.fillText(SAVE_BUBBLE_TEXT, t.cx, t.cy + 1);
    ctx.restore();
  }
  function drawTitleModeButton(button, label, sub, kind, highlight = false) {
    const isFree = kind === 'free';
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.82)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 8;
    angularPlatePath(button.x, button.y, button.w + 10, button.h + 10, 18);
    const timber = ctx.createLinearGradient(0, button.y - button.h / 2, 0, button.y + button.h / 2);
    timber.addColorStop(0, '#6d3b1c');
    timber.addColorStop(0.45, '#351b11');
    timber.addColorStop(1, '#170d09');
    ctx.fillStyle = timber;
    ctx.fill();
    ctx.strokeStyle = '#1b0e08';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.shadowColor = 'transparent';

    angularPlatePath(button.x, button.y - 2, button.w, button.h, 14);
    const steel = ctx.createLinearGradient(0, button.y - button.h / 2, 0, button.y + button.h / 2);
    if (isFree) {
      steel.addColorStop(0, '#315a58');
      steel.addColorStop(0.48, '#163c3e');
      steel.addColorStop(1, '#092326');
    } else if (kind === 'tutorial') {
      // 演習の隣に並ぶので、同じ緑系だと見分けが付かない。少し紫寄りにして分ける。
      steel.addColorStop(0, '#4b4470');
      steel.addColorStop(0.48, '#2b2747');
      steel.addColorStop(1, '#151329');
    } else if (kind === 'online') {
      // CPU BATTLE と同じ鋼色だったので、文字を読むまで見分けが付かなかった(実機で指摘)。
      // 大きさと位置は変えず、色味だけ真鍮寄りにして別物だと分かるようにする。
      steel.addColorStop(0, '#6a5a3a');
      steel.addColorStop(0.48, '#3d3320');
      steel.addColorStop(1, '#1c1710');
    } else {
      steel.addColorStop(0, '#46566a');
      steel.addColorStop(0.48, '#273747');
      steel.addColorStop(1, '#111b27');
    }
    ctx.fillStyle = steel;
    ctx.fill();
    // 中断データがある時だけ縁を明るくして光らせる。色を変えるのではなく光らせるだけなので、
    // ボタンの見た目の系統は崩れない。
    if (highlight) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,210,74,0.85)';
      ctx.shadowBlur = 16;
      ctx.strokeStyle = '#ffd76a';
      ctx.lineWidth = 3.4;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = isFree ? '#e28b37' : '#e6aa3b';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    drawRivet(button.x - button.w / 2 + 15, button.y - button.h / 2 + 14);
    drawRivet(button.x + button.w / 2 - 15, button.y - button.h / 2 + 14);
    drawRivet(button.x - button.w / 2 + 15, button.y + button.h / 2 - 14);
    drawRivet(button.x + button.w / 2 - 15, button.y + button.h / 2 - 14);

    // 紋章バッジを廃止したのでラベル・サブとも中央(button.x)基準へ。
    ctx.textAlign = 'center';
    ctx.fillStyle = UI.parchment;
    ctx.strokeStyle = '#090b0d';
    ctx.lineWidth = 5;
    ctx.font = '900 23px ' + UI_FONT_HEAVY;
    ctx.strokeText(label, button.x, button.y - 7);
    ctx.fillText(label, button.x, button.y - 7);
    // 案内文は、通常の説明より一段明るくして拾わせる。
    ctx.fillStyle = highlight ? '#ffe2a1' : UI.brassLabel;
    ctx.font = (highlight ? 'bold 11px ' : 'bold 10px ') + UI_FONT;
    ctx.fillText(sub, button.x, button.y + 18);
    ctx.restore();
  }

  function drawTitleScreen() {
    ctx.save();
    if (titleTimeBackgroundReady) {
      ctx.drawImage(titleTimeBackgroundImage, 0, 0, VW, VH);
    }
    const titleShade = ctx.createLinearGradient(0, 0, 0, VH);
    titleShade.addColorStop(0, 'rgba(4,8,20,0.20)');
    titleShade.addColorStop(0.45, 'rgba(4,8,20,0.34)');
    titleShade.addColorStop(1, 'rgba(4,8,20,0.72)');
    ctx.fillStyle = titleShade;
    ctx.fillRect(0, 0, VW, VH);

    // 透明余白を表示時にトリミングし、ロゴ本体を画面上部へ寄せる。
    const logo = { x: 15, y: 55, w: VW - 30, h: 390 };
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.75)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 10;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(logo.x, logo.y, logo.w, logo.h, 18);
    else ctx.rect(logo.x, logo.y, logo.w, logo.h);
    ctx.clip();
    if (titleLogoImage.complete && titleLogoImage.naturalWidth > 0) {
      const cropX = titleLogoImage.naturalWidth * 0.09;
      const cropY = titleLogoImage.naturalHeight * 0.10;
      const cropW = titleLogoImage.naturalWidth * 0.82;
      const cropH = titleLogoImage.naturalHeight * 0.78;

  function drawFreeArrow(x, y, direction) {
    ctx.save();
    ctx.fillStyle = 'rgba(16,27,34,0.96)';
    ctx.strokeStyle = '#c78335';
    ctx.lineWidth = 2;
    angularPlatePath(x, y, 48, 54, 9);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffe2a1';
    ctx.beginPath();
    if (direction < 0) {
      ctx.moveTo(x + 6, y - 11);
      ctx.lineTo(x - 9, y);
      ctx.lineTo(x + 6, y + 11);
    } else {
      ctx.moveTo(x - 6, y - 11);
      ctx.lineTo(x + 9, y);
      ctx.lineTo(x - 6, y + 11);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawFreeRow(row, label, value, sub, kind, imageKey) {
    const x = VW / 2;

    angularPlatePath(x, row.y, 458, row.h, 14);
    const fill = ctx.createLinearGradient(0, row.y - row.h / 2, 0, row.y + row.h / 2);
    fill.addColorStop(0, 'rgba(55,70,77,0.97)');
    fill.addColorStop(0.12, 'rgba(26,37,43,0.98)');
    fill.addColorStop(1, 'rgba(9,17,22,0.98)');

    ctx.strokeStyle = '#8c5b2c';

    // 背の低い行はラベルを「枠の上端」に置くと左右の矢印に潜り込んで文字が欠ける

    ctx.fillText(value, valueX, row.y + 1);

    ctx.fillText(sub, valueX, row.y + 24);

  // ===== 起動演出:砦の壁を砲弾で撃ち抜いてタイトルへ出る =====
  // 読み込み中はこの壁を背景に出し、TAP TO START の**タップした場所**へ砲弾を撃ち込む。
  // 砲弾は手前から奥へ縮みながら飛び、破片は逆に手前へ拡大して画面外へ抜ける。
  // すれ違うことで「壁の向こうへ出た」という視線移動になり、そのままタイトルへ着地する。
  //
  // 尺を足しているわけではない。タップ後はBGMの再生開始を最大1.5秒待つ作りで、
  // そこは今まで「STARTING BGM...」と出るだけの無音の間だった。そこへ入れている。
  //
  // **出るのは起動時の1回だけ。** 'press' からしか 'breaking' へ入らないので、
  // 対戦を終えてタイトルへ戻る時は従来どおり直接表示になる(毎回壊れたら必ず飽きる)。
  const WALL_IMPACT_SEC = 0.5;    // 砲弾が壁へ届くまで
  const WALL_BREAK_SEC = 1.5;     // 演出全体
  const WALL_SHOCK_SPEED = 2600;  // 崩れが外側へ広がる速さ(px/秒)
  const WALL_CLEAR_SEC = 0.3;     // 最後にすべて消しきる時間
  const WALL_ARC = 168;           // 砲弾の山なりの高さ
  const WALL_BLAST_RANGE = 330;   // 爆風が石を吹き飛ばす範囲。外側は崩れ落ちるだけ
  const WALL_GRAVITY = 3400;      // 崩れた石が落ちる加速度
  let wallBreak = null;           // { x, y, t, banged }
  let wallPieces = null;          // 壁の破片。毎フレーム作り直すと形が踊るので一度だけ組む
  let wallPiecesUseArt = false;   // いまの破片が絵から切り出したものか、手で描いたものか
  // 壁の絵。**コア画像の待ち合わせ(areCoreImagesReady)には入れない。**
  // 入れると「壁の絵を読み終わるまで読み込み画面が出せない」という順序の矛盾になる。
  // 届くまでは手続き的な壁を出し、届いた時点で組み直して差し替える。
  let wallImageReady = false;
  const wallImage = new Image();
  wallImage.fetchPriority = 'high';
  wallImage.onload = () => { wallImageReady = true; wallPieces = null; };
  wallImage.src = 'assets/wall.jpg';
  function wallArtReady() { return wallImageReady && wallImage.naturalWidth > 0; }
  // 撃ち込む砲弾の絵(ユーザー提供素材)。壁と同じく**待ち合わせには入れない**。
  // 間に合わなければ手描きの鉄球で出す。1回きりの演出のために起動を遅らせない。
  let introBallImageReady = false;
  const introBallImage = new Image();
  introBallImage.fetchPriority = 'high';
  introBallImage.onload = () => { introBallImageReady = true; };
  introBallImage.src = 'assets/intro-cannonball.png';
  function introBallArtReady() { return introBallImageReady && introBallImage.naturalWidth > 0; }
  // 画面いっぱいに覆う(cover)ための、画面座標→画像座標の対応。
  function wallArtMapping() {
    const scale = Math.max(VW / wallImage.naturalWidth, VH / wallImage.naturalHeight);
    return { scale, offX: (VW - wallImage.naturalWidth * scale) / 2, offY: (VH - wallImage.naturalHeight * scale) / 2 };
  }
  // 石ごとの色や傾きを固定するための擬似乱数。Math.randomだと毎フレーム別の壁になる。
  function wallNoise(index, salt) {
    const n = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }
  function buildWallPieces(impact) {
    const pieces = [];
    wallPiecesUseArt = wallArtReady();
    if (wallPiecesUseArt) {
      // **格子のまま切ると「賽の目にスライスされた」ようにしか見えない**(実機で指摘)。
      // 格子の頂点を先に散らしてから、その四隅で破片を作る。隣り合う破片は
      // ずらした同じ頂点を共有するので、隙間も重なりも出ないまま形だけが不揃いになる。
      const cols = 7, rows = 13;
      const bw = VW / cols, bh = VH / rows;
      const vertex = [];
      for (let row = 0; row <= rows; row++) {
        vertex[row] = [];
        for (let col = 0; col <= cols; col++) {
          // 画面の縁の頂点は動かさない。動かすと外周に隙間が空いて奥が透ける。
          const edge = row === 0 || col === 0 || row === rows || col === cols;
          const jx = edge ? 0 : (wallNoise(row * 97 + col, 41) - 0.5) * bw * 0.72;
          const jy = edge ? 0 : (wallNoise(row * 97 + col, 42) - 0.5) * bh * 0.72;
          vertex[row][col] = { x: col * bw + jx, y: row * bh + jy };
        }
      }
      const map = wallArtMapping();
      const addFragment = (corners) => {
        let cx = 0, cy = 0;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const corner of corners) {
          cx += corner.x / corners.length;
          cy += corner.y / corners.length;
          minX = Math.min(minX, corner.x); maxX = Math.max(maxX, corner.x);
          minY = Math.min(minY, corner.y); maxY = Math.max(maxY, corner.y);
        }
        pieces.push({
          kind: 'art', cx, cy, x: minX, y: minY, w: maxX - minX, h: maxY - minY,
          local: corners.map(corner => ({ x: corner.x - cx, y: corner.y - cy })),
          bx: minX - cx, by: minY - cy,
          sx: (minX - map.offX) / map.scale, sy: (minY - map.offY) / map.scale,
          sw: (maxX - minX) / map.scale, sh: (maxY - minY) / map.scale,
          tone: wallNoise(pieces.length, 1), seed: wallNoise(pieces.length, 2)
        });
      };
      const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const tl = vertex[row][col], tr = vertex[row][col + 1];
          const br = vertex[row + 1][col + 1], bl = vertex[row + 1][col];
          // 着弾のすぐそばだけ、さらに4つへ割る。**近いほど細かく砕ける**のが自然で、
          // 全部を同じ大きさにすると、どこが当たったのか分からなくなる。
          // 割るのは辺の中点なので、割らない隣の破片との境目に隙間はできない。
          const centerX = (tl.x + tr.x + br.x + bl.x) / 4;
          const centerY = (tl.y + tr.y + br.y + bl.y) / 4;
          const shattered = impact
            && Math.hypot(centerX - impact.x, centerY - impact.y) < WALL_BLAST_RANGE * 0.62;
          if (!shattered) { addFragment([tl, tr, br, bl]); continue; }
          const top = mid(tl, tr), right = mid(tr, br), bottom = mid(br, bl), left = mid(bl, tl);
          const core = { x: centerX, y: centerY };
          addFragment([tl, top, core, left]);
          addFragment([top, tr, right, core]);
          addFragment([core, right, br, bottom]);
          addFragment([left, core, bottom, bl]);
        }
      }
    } else {
    const bw = VW / 6;
    const bh = VH / 12;
    // 石積み。段ごとに半個ずらす(いわゆる馬目地)。真っ直ぐ並べると壁に見えない。
    for (let row = 0; row < 12; row++) {
      const offset = (row % 2) ? -bw / 2 : 0;
      for (let x = offset; x < VW; x += bw) {
        // 隙間を空けない。空けると継ぎ目から奥のタイトルが透けて壁に見えなくなる。
        // 目地は石ごとの縁取りで表現する。
        pieces.push({ kind: 'stone', x, y: row * bh, w: bw, h: bh,
          tone: wallNoise(pieces.length, 1), seed: wallNoise(pieces.length, 2) });
      }
    }
    // 横木と鋲。石だけだと単調で、タイトルの世界観(石と木と鉄)から外れる。
    // 1本の梁のままだと崩れずに残ってしまうので、最初から柱ごとに割っておく。
    for (const beamY of [VH * 0.2, VH * 0.615]) {
      for (let x = 0; x < VW; x += bw) {
        pieces.push({ kind: 'beam', x, y: beamY, w: bw, h: 34,
          tone: wallNoise(pieces.length, 3), seed: wallNoise(pieces.length, 4) });
      }
    }
    // 垂れ幕は**代役の壁のときだけ**出す。手で描いた石は単調なので布で変化を付ける意味があるが、
    // 絵の壁に重ねるとそこだけ質が落ちて浮く(実際に浮いた)。絵は単体で壁として完成している。
    pieces.push({ kind: 'banner', x: VW * 0.11, y: VH * 0.245, w: 76, h: 268, tone: 0, seed: wallNoise(900, 5) });
    pieces.push({ kind: 'banner', x: VW * 0.73, y: VH * 0.285, w: 76, h: 244, tone: 1, seed: wallNoise(901, 5) });
    }
    for (const piece of pieces) {
      if (piece.cx === undefined) { piece.cx = piece.x + piece.w / 2; piece.cy = piece.y + piece.h / 2; }
    }
    return pieces;
  }
  // 破片1つを原点中心で描く。呼ぶ側が位置・拡大・回転を持つ。
  function drawWallPiece(piece) {
    const w = piece.w, h = piece.h;
    if (piece.kind === 'art') {
      // 不揃いな多角形で切り抜いてから絵を貼る。矩形のまま貼ると賽の目になる。
      ctx.beginPath();
      ctx.moveTo(piece.local[0].x, piece.local[0].y);
      for (let n = 1; n < piece.local.length; n++) ctx.lineTo(piece.local[n].x, piece.local[n].y);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(wallImage, piece.sx, piece.sy, piece.sw, piece.sh, piece.bx, piece.by, w, h);
      return;
    }
    if (piece.kind === 'banner') {
      const purple = piece.tone === 0;
      // 裾は裂けさせる。きれいな三角のままだと新品の旗に見えてしまう。
      // 旗の下は石なので、切り欠いても背景が透けることはない。
      ctx.beginPath();
      ctx.moveTo(-w / 2, -h / 2);
      ctx.lineTo(w / 2, -h / 2);
      ctx.lineTo(w / 2, h / 2 - 26);
      for (let n = 0; n < 5; n++) {
        const fx = w / 2 - (n + 1) * (w / 5);
        const notch = wallNoise(piece.seed * 700 + n, 11);
        ctx.lineTo(fx + w / 10, h / 2 - 6 - notch * 26);
        ctx.lineTo(fx, h / 2 - 26 + notch * 16);
      }
      ctx.lineTo(-w / 2, h / 2 - 26);
      ctx.closePath();
      if (!piece.grad) {
        piece.grad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
        piece.grad.addColorStop(0, purple ? '#2c1436' : '#4a1a10');
        piece.grad.addColorStop(0.45, purple ? '#57306e' : '#8c3a20');
        piece.grad.addColorStop(1, purple ? '#24102c' : '#3d150c');
      }
      ctx.fillStyle = piece.grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(199,131,53,.55)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,210,74,.22)';
      ctx.fillRect(-w * 0.14, -h / 2 + 12, w * 0.28, h - 46);
      // 擦れと穴。日に焼けた縦の褪せと、破れを2つ。
      ctx.fillStyle = 'rgba(255,238,210,.09)';
      ctx.fillRect(-w / 2 + 6 + piece.seed * 12, -h / 2 + 8, 9, h - 52);
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      for (let n = 0; n < 2; n++) {
        const hx = -w / 2 + 14 + wallNoise(piece.seed * 700 + n, 12) * (w - 30);
        const hy = -h / 2 + 40 + wallNoise(piece.seed * 700 + n, 13) * (h - 100);
        ctx.beginPath();
        ctx.ellipse(hx, hy, 4 + wallNoise(piece.seed + n, 14) * 5, 6 + wallNoise(piece.seed + n, 15) * 6, 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }
    if (piece.kind === 'beam') {
      if (!piece.grad) {
        piece.grad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
        piece.grad.addColorStop(0, '#4e2c15');
        piece.grad.addColorStop(0.42, '#331c0e');
        piece.grad.addColorStop(1, '#150b06');
      }
      ctx.fillStyle = piece.grad;
      ctx.fillRect(-w / 2, -h / 2, w, h);
      // 木目。無地だと板チョコに見える。
      ctx.strokeStyle = 'rgba(0,0,0,.32)';
      ctx.lineWidth = 1;
      for (let g = 0; g < 3; g++) {
        const gy = -h / 2 + h * (0.24 + g * 0.26 + piece.seed * 0.06);
        ctx.beginPath();
        ctx.moveTo(-w / 2 + 3, gy);
        ctx.lineTo(w / 2 - 3, gy + (piece.seed - 0.5) * 4);
        ctx.stroke();
      }
      // 割れ。縦に一本入るだけで古材に見える。
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.lineWidth = 2;
      const crackX = -w / 2 + 16 + piece.seed * (w - 32);
      ctx.beginPath();
      ctx.moveTo(crackX, -h / 2 + 2);
      ctx.lineTo(crackX + 3, 0);
      ctx.lineTo(crackX - 2, h / 2 - 2);
      ctx.stroke();
      ctx.strokeStyle = '#0d0704';
      ctx.lineWidth = 2;
      ctx.strokeRect(-w / 2, -h / 2, w, h);
      drawRivet(-w / 2 + 13, 0, 5);
      drawRivet(w / 2 - 13, 0, 5);
      return;
    }
    // 石。継ぎ目は縁取りで作り、面取りとざらつきで厚みを出す。
    if (!piece.grad) {
      const base = 34 + Math.round(piece.tone * 22);
      piece.grad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      piece.grad.addColorStop(0, `rgb(${base + 21},${base + 19},${base + 16})`);
      piece.grad.addColorStop(0.5, `rgb(${base},${base - 2},${base - 5})`);
      piece.grad.addColorStop(1, `rgb(${base - 15},${base - 17},${base - 19})`);
    }
    ctx.fillStyle = piece.grad;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    // 面取り。上と左を明るく、下と右を落とす。これだけで平板が石になる。
    ctx.fillStyle = 'rgba(255,244,224,.10)';
    ctx.fillRect(-w / 2 + 2, -h / 2 + 2, w - 4, 3);
    ctx.fillRect(-w / 2 + 2, -h / 2 + 2, 3, h - 4);
    ctx.fillStyle = 'rgba(0,0,0,.34)';
    ctx.fillRect(-w / 2 + 2, h / 2 - 5, w - 4, 3);
    ctx.fillRect(w / 2 - 5, -h / 2 + 2, 3, h - 4);
    // ざらつき。規則的な模様にならないよう seed で位置と数を散らす。
    ctx.fillStyle = 'rgba(0,0,0,.24)';
    for (let n = 0; n < 3; n++) {
      const nx = -w / 2 + 10 + wallNoise(piece.seed * 900 + n, 7) * (w - 24);
      const ny = -h / 2 + 10 + wallNoise(piece.seed * 900 + n, 8) * (h - 22);
      ctx.fillRect(nx, ny, 5 + wallNoise(piece.seed * 900 + n, 9) * 9, 3);
    }
    // 角の欠け。**切り抜かずに描く。** 実際に削ると継ぎ目に穴が開き、奥のタイトルが
    // 透けてしまう(一度それで失敗している)。落ちた面を明るく見せて凹みに見せる。
    if (piece.seed > 0.42) {
      const corner = Math.floor(wallNoise(piece.seed * 311, 21) * 4);
      const chip = 10 + wallNoise(piece.seed * 311, 22) * 14;
      const sx = (corner === 0 || corner === 3) ? -w / 2 : w / 2;
      const sy = (corner < 2) ? -h / 2 : h / 2;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - Math.sign(sx) * chip, sy);
      ctx.lineTo(sx, sy - Math.sign(sy) * chip * 0.9);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fill();
      // 割れ口。ここだけ明るくすると、影ではなく「欠けた面」に見える。
      ctx.strokeStyle = 'rgba(226,216,196,.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sx - Math.sign(sx) * chip, sy);
      ctx.lineTo(sx, sy - Math.sign(sy) * chip * 0.9);
      ctx.stroke();
    }
    // ひび。同じ形が並ぶと模様に見えるので、走る向き・長さ・始点の辺を石ごとに変える。
    if (wallNoise(piece.seed * 533, 23) > 0.52) {
      const fromTop = wallNoise(piece.seed * 533, 24) > 0.45;
      const sway = (wallNoise(piece.seed * 533, 25) - 0.5) * w * 0.5;
      const len = 0.4 + wallNoise(piece.seed * 533, 26) * 0.5;
      const x0 = -w / 2 + 10 + wallNoise(piece.seed * 533, 27) * (w - 20);
      const y0 = fromTop ? -h / 2 + 3 : h / 2 - 3;
      const dir = fromTop ? 1 : -1;
      ctx.strokeStyle = `rgba(0,0,0,${0.28 + wallNoise(piece.seed * 533, 28) * 0.24})`;
      ctx.lineWidth = 1 + wallNoise(piece.seed * 533, 29) * 1.2;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + sway * 0.45, y0 + dir * h * len * 0.5);
      ctx.lineTo(x0 + sway, y0 + dir * h * len);
      ctx.stroke();
    }
    // 苔。四角く塗ると帯に見えるので、丸を重ねて縁を崩す。全部の石には付けない。
    if (piece.seed > 0.76) {
      ctx.fillStyle = 'rgba(96,116,70,.20)';
      for (let n = 0; n < 3; n++) {
        const mx = -w / 2 + 10 + wallNoise(piece.seed * 177 + n, 30) * (w * 0.55);
        ctx.beginPath();
        ctx.ellipse(mx, h / 2 - 6 - wallNoise(piece.seed * 177 + n, 31) * 5,
          7 + wallNoise(piece.seed * 177 + n, 32) * 9, 5 + wallNoise(piece.seed * 177 + n, 33) * 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // 目地。石どうしの境目はここだけで作る。
    ctx.strokeStyle = 'rgba(9,8,7,.9)';
    ctx.lineWidth = 3;
    ctx.strokeRect(-w / 2, -h / 2, w, h);
  }
  function drawFortressWall(breakState) {
    // 絵が後から届いたら組み直す。崩れている最中に入れ替えると破片が飛ぶので、その時はしない。
    if (!wallPieces || (!breakState && wallPiecesUseArt !== wallArtReady())) wallPieces = buildWallPieces();
    // 崩していない間は1枚で描く。128枚を毎フレーム貼る意味がない(読み込み中はずっと出ている)。
    if (!breakState && wallPiecesUseArt) {
      const map = wallArtMapping();
      ctx.drawImage(wallImage, map.offX, map.offY,
        wallImage.naturalWidth * map.scale, wallImage.naturalHeight * map.scale);
      return;
    }
    const shatter = breakState ? breakState.t - WALL_IMPACT_SEC : -1;
    // 終わり際は残っている破片を必ず消しきる。距離の遠い石は飛びきる前に演出が終わるため、
    // これが無いとタイトルへ切り替わった瞬間に瓦礫がパッと消える。
    const clearing = breakState
      ? Math.max(0, Math.min(1, (WALL_BREAK_SEC - breakState.t) / WALL_CLEAR_SEC)) : 1;
    for (const piece of wallPieces) {
      let cx = piece.cx, cy = piece.cy, scale = 1, rot = 0, alpha = clearing;
      if (shatter > 0) {
        const dx = piece.cx - breakState.x;
        const dy = piece.cy - breakState.y;
        const distance = Math.hypot(dx, dy);
        // 着弾点から外へ、輪のように順番に崩れる。全部を同時に飛ばすと爆散に見える。
        const local = shatter - distance / WALL_SHOCK_SPEED;
        if (local > 0) {
          // 崩れ方を2つに分ける。**近い石は吹き飛び、遠い石は支えを失って落ちる。**
          // 全部を放射状に飛ばすと爆発にしか見えず、壁が崩れたようにならない。
          const blast = Math.pow(1 - Math.min(1, distance / WALL_BLAST_RANGE), 2);
          const angle = distance < 1 ? piece.seed * Math.PI * 2 : Math.atan2(dy, dx);
          // 着弾点より上の石は下の支えを失う。落ちる向きに強く寄せて、穴が上へ広がる形にする。
          // 下側にも少し効かせる。壁全体が沈まないと、穴だけ空いて周りが残ったままになる。
          const unsupported = piece.cy < breakState.y ? 210 : 70;
          const vx = Math.cos(angle) * (170 + 820 * blast);
          const vy = Math.sin(angle) * (70 + 640 * blast) + unsupported;
          cx += vx * local;
          cy += vy * local + 0.5 * WALL_GRAVITY * local * local;
          // 手前へ抜けてくるのは爆風に巻かれた石だけ。遠い石は落ちるだけで拡大しない。
          scale = 1 + blast * 2.8 * local;
          rot = (piece.seed - 0.5) * (2.5 + 8 * blast) * local;
          alpha = clearing * Math.max(0, 1 - Math.max(0, scale - 1.9) / 1.5);
        }
      }
      if (alpha <= 0) continue;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      if (scale !== 1) ctx.scale(scale, scale);
      if (rot) ctx.rotate(rot);
      drawWallPiece(piece);
      ctx.restore();
    }
  }
  function drawWallCannonball(breakState) {
    const progress = breakState.t / WALL_IMPACT_SEC;
    if (progress >= 1) return;
    const startX = VW / 2, startY = VH + 40, startScale = 2.9;
    for (let ghost = 4; ghost >= 0; ghost--) {
      const u = progress - ghost * 0.055;
      if (u <= 0) continue;
      // 位置は手前ほど速く、大きさは指数で縮める。等速で縮めると奥行きが出ない。
      const travel = Math.pow(u, 0.62);
      const x = startX + (breakState.x - startX) * travel;
      // 山なりにする。真っ直ぐ縮むだけだと「飛んでいる」ようには見えない。
      const y = startY + (breakState.y - startY) * travel - Math.sin(travel * Math.PI) * WALL_ARC;
      const radius = 26 * startScale * Math.pow(0.075, u);
      ctx.save();
      // 尾を引く炎は**弾の後ろ**へ描く。手描きの鉄球の頃は上へ重ねていたが、
      // 絵に替えると鉄球の質感がオレンジで塗り潰されて見えなくなる(実測)。
      if (ghost === 0) {
        ctx.globalAlpha = 0.5;
        const flame = ctx.createRadialGradient(x, y + radius * 0.5, radius * 0.1, x, y + radius * 0.5, radius * 1.15);
        flame.addColorStop(0, 'rgba(255,214,140,.95)');
        flame.addColorStop(0.5, 'rgba(255,150,60,.55)');
        flame.addColorStop(1, 'rgba(255,120,30,0)');
        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.arc(x, y + radius * 0.5, radius * 1.15, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = ghost === 0 ? 1 : 0.5 / ghost;
      if (introBallArtReady()) {
        // 絵は正方形。直径ぶんの正方形に収めるので、半径の使い方は手描きの時と同じ。
        ctx.drawImage(introBallImage, x - radius, y - radius, radius * 2, radius * 2);
      } else {
        // 絵が間に合わない時の代わり。**起動直後に必ず出る演出なので、絵を待たない。**
        const iron = ctx.createRadialGradient(x - radius * 0.4, y - radius * 0.45, radius * 0.15, x, y, radius);
        iron.addColorStop(0, '#9aa6b0');
        iron.addColorStop(0.45, '#404a54');
        iron.addColorStop(1, '#0d1114');
        ctx.fillStyle = iron;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }
  function drawWallImpactFlash(breakState) {
    const since = breakState.t - WALL_IMPACT_SEC;
    if (since < 0 || since > 0.32) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - since / 0.32) * 0.9;
    const flash = ctx.createRadialGradient(breakState.x, breakState.y, 0, breakState.x, breakState.y, 460);
    flash.addColorStop(0, 'rgba(255,246,214,.95)');
    flash.addColorStop(0.28, 'rgba(255,178,71,.55)');
    flash.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = flash;
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
  }
  function beginWallBreak(point) {
    // 端をタップされても破壊が画面外へ寄らないよう、少しだけ内側へ寄せる。
    // 寄せすぎると「タップした場所が当たる」感触が消えるので、この幅に留める。
    wallBreak = {
      x: Math.max(VW * 0.15, Math.min(VW * 0.85, point.x)),
      y: Math.max(VH * 0.18, Math.min(VH * 0.8, point.y)),
      t: 0, banged: false
    };
    // 着弾点が決まってから組み直す。近いほど細かく砕くので、場所が要る。
    wallPieces = buildWallPieces(wallBreak);
    gamePhase = 'breaking';
  }
  function updateWallBreak(dt) {
    if (!wallBreak) return;
    wallBreak.t += dt;
    if (!wallBreak.banged && wallBreak.t >= WALL_IMPACT_SEC) {
      wallBreak.banged = true;
      triggerShake(9, 0.32);
      playExplosionSound(1.6);
    }
    if (wallBreak.t >= WALL_BREAK_SEC) {
      wallBreak = null;
      gamePhase = 'title';
    }
  }

  function drawLoadingScreen() {
    ctx.save();
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, VW, VH);
    drawFortressWall(null);
    // 壁の上に直接文字を置くと読めない。中央だけ暗く落として文字の居場所を作る。
    const veil = ctx.createLinearGradient(0, VH * 0.28, 0, VH * 0.78);
    veil.addColorStop(0, 'rgba(6,8,10,0)');
    veil.addColorStop(0.4, 'rgba(6,8,10,.82)');
    veil.addColorStop(0.72, 'rgba(6,8,10,.82)');
    veil.addColorStop(1, 'rgba(6,8,10,0)');
    ctx.fillStyle = veil;
    ctx.fillRect(0, VH * 0.28, VW, VH * 0.5);

    const angle = (Date.now() % 3600) / 3600 * Math.PI * 2;
    const spinnerY = VH / 2 - 100;
    const spinnerX = VW / 2;
    if (loadingEmblemReady) {
      const emblemSize = 112;
      ctx.save();
      ctx.translate(spinnerX, spinnerY);
      ctx.rotate(angle);
      ctx.shadowColor = 'rgba(255,210,74,0.35)';
      ctx.shadowBlur = 14;
      ctx.drawImage(loadingEmblemImage, -emblemSize / 2, -emblemSize / 2, emblemSize, emblemSize);
      ctx.restore();
    } else {
      // エンブレムが間に合わない瞬間だけ、軽量な円弧を予備表示する。
      ctx.beginPath();
      ctx.arc(VW / 2, spinnerY, 28, angle, angle + Math.PI * 1.45);
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    const readyToStart = gamePhase === 'press';
    const pulse = 0.55 + Math.sin(Date.now() / 260) * 0.28;
    ctx.textAlign = 'center';
    if (readyToStart) {
      ctx.fillStyle = titleStartPending ? 'rgba(255,255,255,0.78)' : `rgba(255,210,74,${Math.min(1, pulse + 0.18)})`;
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(titleStartPending ? 'STARTING BGM...' : 'TAP TO START', VW / 2, VH / 2 + 30);
      ctx.fillStyle = 'rgba(255,255,255,0.70)';
      ctx.font = '11px sans-serif';
      ctx.fillText(titleStartPending ? 'タイトルを準備しています' : (titleStartFailed ? 'BGMを開始できませんでした。もう一度タップしてください' : '画面をタップしてタイトルBGMを開始'), VW / 2, VH / 2 + 53);
    } else {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('NOW LOADING...', VW / 2, VH / 2 + 30);
      ctx.fillStyle = 'rgba(255,255,255,0.62)';
      ctx.font = '11px sans-serif';
      ctx.fillText(`ゲーム画像を準備しています ${getCoreImageProgress()}/${CHARACTER_LIST.length + 2}`, VW / 2, VH / 2 + 53);
    }
    ctx.restore();
  }

  function selectRoundedRect(x, y, w, h, radius) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, radius);
    else ctx.rect(x, y, w, h);
  }

  function drawSelectStat(label, value, x, y, color) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = 'bold 8px ' + UI_FONT;
    ctx.textAlign = 'left';
    ctx.fillText(label, x, y);
    // 目盛りの中の隙間(3px)より群と群の間(64-62=2px)の方が狭く、隣の項目とつながって
    // 「耐久と火力で1本の10段メーター」に見えていた。群を詰めて間を空け、
    // 群の間(12px)が中の隙間(3px)より明らかに広くなるようにする(2026-07-28)。
    for (let i = 0; i < 5; i++) {
      selectRoundedRect(x + i * 11, y + 6, 8, 4, 2);
      ctx.fillStyle = i < value ? color : 'rgba(255,255,255,0.13)';
      ctx.fill();
    }
  }

  function spawnEmpPulse(x, y, radius) {
    empRings.push({ x, y, radius, life: 0.55, maxLife: 0.55 });
    const count = 18;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = radius * (0.2 + Math.random() * 0.8);
      particles.push({
        x: x + Math.cos(ang) * dist,
        y: y + Math.sin(ang) * dist,
        vx: Math.cos(ang) * 22,
        vy: Math.sin(ang) * 22,
        life: 0.45 + Math.random() * 0.3,
        maxLife: 0.75,
        color: Math.random() < 0.55 ? '#66e8ff' : '#b38cff',
        size: 2 + Math.random() * 2
      });
    }
  }

  function drawWheelSelectCard(card, def) {
    const main = { x: card.x, y: card.y, w: card.w, h: card.h };
    const left = main.x - main.w / 2;
    const top = main.y - main.h / 2;

    ctx.save();
    ctx.globalAlpha = card.alpha;
    ctx.shadowColor = card.focused ? `${def.color}aa` : 'rgba(0,0,0,0.72)';
    ctx.shadowBlur = card.focused ? 28 : 16;
    ctx.shadowOffsetY = card.focused ? 0 : 7;
    selectRoundedRect(left, top, main.w, main.h, 18);
    // ネオン紺地をやめて黒鉄プレート(UI.plateTop→Mid→Bottom)へ。キャラ色は右下角だけ弱く残すアクセント。
    const cardFill = ctx.createLinearGradient(left, top, left + main.w, top + main.h);
    cardFill.addColorStop(0, UI.plateTop);
    cardFill.addColorStop(0.5, UI.plateMid);
    cardFill.addColorStop(0.85, UI.plateBottom);
    cardFill.addColorStop(1, `${def.color}2e`);
    ctx.fillStyle = cardFill;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = card.focused ? UI.gold : UI.brass;
    ctx.lineWidth = card.focused ? 3 : 2;
    ctx.stroke();

    selectRoundedRect(left + 5, top + 5, main.w - 10, main.h - 10, 14);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 左側のキャラクター表示枠
    const imageBox = { x: left + 10, y: top + 10, w: 112, h: main.h - 20 };
    selectRoundedRect(imageBox.x, imageBox.y, imageBox.w, imageBox.h, 13);
    const imageGlow = ctx.createRadialGradient(
      imageBox.x + imageBox.w / 2, imageBox.y + 72, 5,
      imageBox.x + imageBox.w / 2, imageBox.y + 72, 82
    );
    imageGlow.addColorStop(0, `${def.color}48`);
    imageGlow.addColorStop(0.62, 'rgba(8,17,31,0.78)');
    imageGlow.addColorStop(1, 'rgba(3,7,16,0.96)');
    ctx.fillStyle = imageGlow;
    ctx.fill();
    ctx.strokeStyle = `${def.color}88`;
    ctx.stroke();

    const cImg = charImages[card.key];
    const cReady = cImg && cImg.complete && cImg.naturalWidth > 0;
    const imageCx = imageBox.x + imageBox.w / 2;
    const imageCy = imageBox.y + 74;
    if (cReady) {
      const imageScale = Math.min(104 / cImg.naturalWidth, 112 / cImg.naturalHeight);
      const iw = cImg.naturalWidth * imageScale;
      const ih = cImg.naturalHeight * imageScale;
      if (def.facesLeft) {
        ctx.save();
        ctx.translate(imageCx, imageCy);
        ctx.scale(-1, 1);
        ctx.drawImage(cImg, -iw / 2, -ih / 2, iw, ih);
        ctx.restore();
      } else {
        ctx.drawImage(cImg, imageCx - iw / 2, imageCy - ih / 2, iw, ih);
      }
    } else {
      ctx.beginPath();
      ctx.arc(imageCx, imageCy, 31, 0, Math.PI * 2);
      ctx.fillStyle = def.color;
      ctx.fill();

  // 直撃>至近>爆風減衰のダメージ計算(blastMulでキャラの爆風サイズを反映)
  //
  // v63で「帯ごとの固定値」にしたが、これは公平性を壊すので v66 で戻した。
  // 直撃の境界は20px、キャラ中心から足元までは16px。足元に撃つと距離は16〜25pxに
  // 散らばって境界をまたぐため、固定値だとそこが10ダメージの崖になる。立ち位置と
  // 地面の傾きでどちら側に落ちるかが決まるので、片方は毎回45・もう片方は毎回35という
  // 差が出た(2026-07-28、恐竜同士の対戦で実測)。傾斜なら同じ状況で45と42程度に収まる。
  //
  // オンラインで同期のたびにHPの小修正が見えるのは、この傾斜が原因ではあるが、
  // 帯で潰すのは副作用が大きすぎる。直すなら撃った側のダメージ値を正として配る。
  function computeDamage(dist, blastMul, damageMul = 1) {
    const DIRECT = 20 * blastMul, CLOSE = 48 * blastMul, BLAST = 100 * blastMul;
    if (dist <= DIRECT) return Math.round(45 * damageMul);
    if (dist <= CLOSE) return Math.round((45 - (dist - DIRECT) / (CLOSE - DIRECT) * 20) * damageMul);
    if (dist <= BLAST) return Math.round((25 - (dist - CLOSE) / (BLAST - CLOSE) * 25) * damageMul);
    return 0;
  }

  function emitEmp(x, y, radius, owner, turns) {
    spawnEmpPulse(x, y, radius);
    triggerShake(2.5, 0.16);
    // 通常の爆発(explodeAt)は昔から撃った本人も味方も巻き込む。電磁波だけが
    // 敵専用だったため、2vs2で「味方に当たる/当たらない」が技ごとに変わってしまう。
    // 判定の例外をなくし、当たった者は陣営に関係なく食らう形へ統一する。
    for (const u of units) {
      if (unitDefeated(u)) continue;
      const dist = simDistance(u.x, u.y, x, y);
      if (dist > radius) continue;
      const baseDamage = dist <= radius * 0.35 ? 20 : 10;
      const damage = Math.max(1, Math.round(baseDamage * (CHARACTERS[u.character]?.damageTakenMul || 1)));
      u.hp = Math.max(0, u.hp - damage);
      u.moveLockTurns = Math.max(u.moveLockTurns || 0, turns);
      spawnDamageText(u.x, u.y - UNIT_RADIUS - 10, damage);
      creditDamage(owner, u, damage);
    }
    triggerSpecialFlash(`電磁波: 移動封印 ${turns}手`);
    playExplosionSound(0.8);
    checkMatchEnd();
  }

  // 相手の弾による被弾では、こちらで見積もった数字をポップさせない。
  // 撃った側の値が正として直後に届き、HPはそちらで上書きされるため、先に自前の数字を
  // 見せると表示が後から動く(実機で10動いた。2026-07-28)。ズレの原因は弾道の再現差で、
  // フレームレートを揃えても消えない。数字を出す場所を1つに絞るのが確実な直し方。
  // 記録はその行動の最初の炸裂だけ。必殺の拡散弾のように何度も炸裂しても、
  // 合計を1回の差分としてまとめて出したいため。
  function noteRemoteDamageBaseline() {
    if (!online || online.pendingRemoteDamage) return;
    const baseline = {};
    for (const u of units) baseline[u.id] = u.hp;
    online.pendingRemoteDamage = baseline;
  }
  // 権威ある値が届いた後に、その差分だけをポップさせる。
  function flushRemoteDamageText() {
    if (!online || !online.pendingRemoteDamage) return;
    const before = online.pendingRemoteDamage;
    online.pendingRemoteDamage = null;
    for (const u of units) {
      const prev = before[u.id];
      if (!Number.isFinite(prev)) continue;
      const dealt = Math.round(prev - u.hp);
      if (dealt > 0) spawnDamageText(u.x, u.y - UNIT_RADIUS - 10, dealt);
    }
  }

  function explodeAt(x, y, blastMul, owner, damageMul = 1) {
    blastMul = blastMul || 1;
    const remoteShot = !!(isOnline() && owner && owner.control === 'remote');
    if (remoteShot) noteRemoteDamageBaseline();
    carveCrater(x, y, 44 * blastMul);
    spawnExplosion(x, y, blastMul);
    triggerShake(4 + 4 * blastMul, 0.12 + 0.08 * blastMul);
    playExplosionSound(blastMul);
    for (const u of units) {
      if (unitDefeated(u)) continue;
      const a = unitAnchor(u);
      const dist = simDistance(a.x, a.y, x, y);
      const dmg = computeDamage(dist, blastMul, damageMul);
      if (dmg > 0) {
        const takenMul = CHARACTERS[u.character]?.damageTakenMul || 1;
        const actualDamage = Math.max(1, Math.round(dmg * takenMul));
        u.hp = Math.max(0, u.hp - actualDamage);
        if (!remoteShot) spawnDamageText(a.x, a.y - UNIT_RADIUS - 10, actualDamage);
        creditDamage(owner, u, actualDamage);
      }
    }
    checkMatchEnd();
  }

  function estimateFlightTime(vx0, vy0, gravity = GRAVITY) {
    // ほぼ水平(vy0が±1px/s程度)なドラッグはatan2/sinの浮動小数点誤差で
    // vy0がごく僅かな負値になり得るため、しきい値を設けてフォールバックに逃がす
    if (vy0 < -1) return Math.min(3, (2 * Math.abs(vy0)) / gravity);
    return 0.6;
  }

  // 水平付近では「発射高度へ戻るまでの時間」がほぼ0になるため、時間だけで
  // ガイド長を決めると点が発射位置に固まる。角度に関係なく最低限の距離を見せる。
  const TRAJECTORY_PREVIEW_MIN_DISTANCE = 100;
  const TRAJECTORY_PREVIEW_MAX_MIN_TIME = 0.45;
  function trajectoryPreviewDuration(vx0, vy0, gravity = GRAVITY) {
    const normalPreviewTime = estimateFlightTime(vx0, vy0, gravity) * 0.2;
    const speed = Math.max(1, Math.hypot(vx0, vy0));
    const minimumVisibleTime = Math.min(
      TRAJECTORY_PREVIEW_MAX_MIN_TIME,
      TRAJECTORY_PREVIEW_MIN_DISTANCE / speed
    );
    return Math.max(normalPreviewTime, minimumVisibleTime);
  }

  // 決着後の流れは2段階。まず何も出さずに着弾の余韻を見せ、そのあとで決まり手を宣告する。
  // 決まった瞬間に文字をかぶせると、何が起きたのかを見る間がなくなる。
  const MATCH_END_HOLD = 1;      // 余韻(戦場だけを見せる)
  const MATCH_END_BANNER = 1.3;  // 決まり手の表示
  const MATCH_END_PAUSE = MATCH_END_HOLD + MATCH_END_BANNER;
  let matchEndPause = 0;
  let matchEndReason = '';

  // 余韻が明けて、決まり手を出している最中か
  function matchEndBannerVisible() {
    return matchEndPause > 0 && matchEndPause <= MATCH_END_BANNER;
  }

  function beginMatchEnd(reason) {
    matchEndReason = reason;
    matchEndPause = MATCH_END_PAUSE;
  }

  // オンライン対戦では、決着を宣言していいのは「その手番を持っていた側」だけ。
  // 両者が独立に判定すると、演出のズレでHPが1違うだけで勝敗が食い違う。
  function canDeclareMatchEnd() {
    // 決着を宣言できるのは、いま動いているキャラを配信している端末だけ。
    // 2vs2では空席のCPUもホストが配信しているので、その手番の決着もホストが宣言する。
    return !isOnline() || netControlsUnit(activeUnit());
  }

  function checkMatchEnd(reason) {
    if (matchOver) return;
    // チュートリアルは勝ち負けを付けない。的が落ちたかどうかは updateTutorial が見る。
    if (tutorialActive()) return;
    const playerAlive = teamAlive('player');
    const cpuAlive = teamAlive('cpu');
    if (playerAlive && cpuAlive) return;
    if (!canDeclareMatchEnd()) {
      // 自分の手番でない時の決着は相手が権威。待ちに入ったことを記録する。
      logOnlineEvent({ type: 'matchEnd', declared: false, reason: reason || '撃破', active: activeUnit().id });
      return;
    }
    matchOver = true;
    winner = playerAlive ? 'player' : cpuAlive ? 'cpu' : 'draw';
    const resultReason = isDraw() ? '相討ち' : (reason || '撃破');
    logOnlineEvent({ type: 'matchEnd', declared: true, reason: resultReason, winner });
    beginMatchEnd(resultReason);
    applyStreakResult();
    netSyncResult(resultReason);
  }

  // 陣営の残存率。2vs2ではチーム合計で比べる。
  function teamHpRatio(team) {
    let hp = 0;
    let max = 0;
    for (const u of units) {
      if (u.team !== team) continue;
      hp += u.hp;
      max += u.maxHp;
    }
    return max > 0 ? hp / max : 0;
  }

  function judgeByHp() {
    // 時間切れの判定も行動側が計算して送る(endTurn は手番を進める前に抜けるので、
    // ここでの activeUnit() はまだ「最後に動いた側」を指している)。
    if (!canDeclareMatchEnd()) return;
    matchOver = true;
    const playerRatio = teamHpRatio('player');
    const cpuRatio = teamHpRatio('cpu');
    winner = playerRatio > cpuRatio ? 'player' : playerRatio < cpuRatio ? 'cpu' : 'draw';
    beginMatchEnd('時間切れ');
    applyStreakResult();
    netSyncResult('時間切れ');
  }

  let lastRunStreak = 0;
  let lastRunEfficiency = 0;
  // 連勝やスコアの集計は決着した瞬間に確定させる。
  // 勝敗音は着弾と同時だと早すぎるので、決まり手の宣告に合わせて別途鳴らす。
  function applyStreakResult() {
    if (battleMode === 'free') return;
    // 2vs2は味方CPUの働きで勝敗が変わるので、腕前の指標にならない。連勝もランキングも数えない。
    if (is2v2()) return;
    // 対人戦は連勝にもランキングにも含めない(勝ちの譲り合いの温床になるため)。
    if (isOnline()) return;
    if (isDraw()) return;
    if (winner === 'player') {
      winStreak++;
    } else {
      lastRunStreak = winStreak;
      lastRunEfficiency = currentEfficiency();
      winStreak = 0;
      runStats = { damageDealt: 0, shots: 0 }; // 連勝が途切れたら次の挑戦は与ダメ効率もリセット
      // ランキングへ送るのは「連勝が途切れた瞬間」。1勝もしていない挑戦は送らない。
      // 連勝中はキャラを変えずに戦い続けるので、負けた時のキャラ=その挑戦のキャラ。
      if (lastRunStreak > 0) submitScore(lastRunStreak, lastRunEfficiency, player.character);
    }
  }

  function startTurn() {
    resetMoveSync();
    for (const u of units) u.netWalkTargetX = null;
    // 風は全員が2巡するごとに切り替える(1vs1では従来どおり4ターンごと)
    // チュートリアルは項目ごとに風を決めているので、勝手に振り直さない。
    if (battleMode !== 'tutorial' && turnCount % (turnOrder.length * 2) === 0) rollWind();
    const acting = activeUnit();
    acting.fuel = acting.fuelMax;
    focusCameraOn(acting.x);
    if (acting.control === 'cpu') beginCpuTurnPlan(acting);
  }
  // CPUの手番の入り口。startTurn だけでなく、開始カットインが明けた時(v121)と、
  // 試合中に落ちた席をCPUが引き継いだ時(段D)にも呼ぶ。どちらも startTurn を
  // 通らない場面なので、ここを通さないと行動計画が無いまま止まる/即撃ちする。
  function beginCpuTurnPlan(acting) {
    cpuThinkTimer = CPU_THINK_MIN_SEC + Math.random() * CPU_THINK_RANGE_SEC;
    const plan = planCpuMove(acting);
    cpuMoveDir = plan.dir;
    cpuMoveRemaining = plan.distance;
    cpuPhase = cpuMoveRemaining > 0 ? 'move' : 'aim';
  }

  function endTurn() {
    if (matchOver) return;
    const acting = activeUnit();
    if (acting.moveLockTurns > 0) acting.moveLockTurns--;
    // そのキャラが1手番を終えるごとに1段階。使用した手番の終了時から再充填を始める。
    advanceSpecialCharge(acting);
    turnCount++;
    // チュートリアルは時間切れで終わらせない。当てるまで何度でも撃たせる。
    if (battleMode !== 'tutorial' && turnCount >= maxTurnsTotal()) {
      showCutIn('タイムアップ!', '判定は…', 1.6, () => { judgeByHp(); });
      return;
    }
    // 倒れたユニットの手番は飛ばす。1vs1では倒れた時点で決着なので通らないが、
    // 2vs2ではここが無いと死体に手番が渡って進行が止まる。
    for (let i = 0; i < turnOrder.length; i++) {
      activeIndex = (activeIndex + 1) % turnOrder.length;
      if (activeUnit().hp > 0) break;
    }
    startTurn();
    const lines = turnCutInLines(activeUnit());
    showCutIn(lines.text, lines.sub, TURN_CUTIN_DURATION, null, lines.color);
  }

  // ===== CPU AI(精度成長型)=====
  // 連勝数が伸びるほど理論弾道からの誤差が縮む。20連勝〜はほぼ正解弾道。
  function cpuAccuracyTier(streak) {
    if (streak < 3) return { name: 'low', jitter: 0.38 };
    if (streak < 10) return { name: 'mid', jitter: 0.20 };
    if (streak < 20) return { name: 'high', jitter: 0.09 };
    return { name: 'perfect', jitter: 0.02 };
  }

  // CPUの移動計画:危機回避(近すぎる)・攻撃調整(遠すぎる)の時だけ動く。むやみに動かない。
  let cpuMoveDir = 0;
  let cpuMoveRemaining = 0;
  let cpuPhase = 'aim'; // 'move' | 'aim'

  function planCpuMove(self) {
    const tier = cpuAccuracyTier(winStreak);
    if (self.moveLockTurns > 0) return { dir: 0, distance: 0 };
    if (tier.name === 'low') return { dir: 0, distance: 0 }; // 1〜3連勝は動かない

    // 撃つ相手と寄る相手は同じでないと、間合いを詰めてから別の敵を撃つことになる。
    const foe = cpuPickTarget(self);
    if (!foe) return { dir: 0, distance: 0 };
    const dist = Math.abs(foe.x - self.x);
    const NEAR = 150;  // 近すぎ(自爆や反撃のリスク)→離れる
    const FAR = 760;   // 横長ステージでは遠距離戦を基本にし、極端に遠い時だけ寄る

    let dir = 0;
    if (dist < NEAR) dir = self.x < foe.x ? -1 : 1;
    else if (dist > FAR) dir = self.x < foe.x ? 1 : -1;
    if (dir === 0) return { dir: 0, distance: 0 };

    // 中ティアは必要な時でも半分の確率でしか動かない(様子見)
    if (tier.name === 'mid' && Math.random() < 0.5) return { dir: 0, distance: 0 };

    const willingness = tier.name === 'perfect' ? 1 : tier.name === 'high' ? 0.85 : 0.6;
    return { dir, distance: self.fuelMax * willingness };
  }

  // CPUが自分から場外へ歩き込まないための足元確認。
  // limitMoveByClimb が止めるのは急な「上り」だけで、下りと足場の切れ目は素通りする。
  // 闘技場(tieredBasin)は中央が奈落なので、寄る判断をした瞬間にCPUが落ちて自滅していた。
  // プレイヤーには適用しない。自分の意思で降りる・落ちるのは操作の自由なので奪わない。
  function cpuStepIsSafe(u, toX) {
    const feetY = u.y + UNIT_RADIUS;
    const ground = walkableGroundYAt(toX, feetY);
    if (ground === null) return false;
    // 落下扱いになる段差で、かつ落ちた先が死線に届くなら踏み込ませない。
    // 生き残れる高さの段差は今までどおり降りる(降りること自体は正当な選択なので)。
    // 接地すると足元(u.y + UNIT_RADIUS)がちょうど地面のYになるので、地面のYを死線と直接比べる。
    return !(ground - feetY > FALL_TRIGGER && ground >= DEAD_LINE_Y);
  }

  // 味方を巻き込みそうな敵は狙わない。爆風はおよそ44px、必殺で広がる分を見込んで
  // このくらい離れていれば「撃っても味方には届かない」と判断する。
  const CPU_FRIENDLY_FIRE_RADIUS = 90;

  // CPUが狙う敵を選ぶ。1vs1では味方が居ないので nearestEnemy と完全に同じ結果になる。
  function cpuPickTarget(self) {
    const enemies = units.filter(u => u.team !== self.team && u.hp > 0);
    if (!enemies.length) return null;
    const allies = units.filter(u => u.team === self.team && u.id !== self.id && u.hp > 0);
    // 敵ごとに「一番近い味方までの距離」を測る。遠いほど撃ちやすい。
    const clearanceOf = foe => {
      let min = Infinity;
      for (const a of allies) min = Math.min(min, Math.abs(a.x - foe.x));
      return min;
    };
    const safe = enemies.filter(foe => clearanceOf(foe) > CPU_FRIENDLY_FIRE_RADIUS);
    const pool = safe.length ? safe : enemies;
    let best = pool[0];
    for (const foe of pool) {
      if (safe.length) {
        // 巻き込まない相手が居るなら、その中で一番近い敵を殴る。
        if (Math.abs(foe.x - self.x) < Math.abs(best.x - self.x)) best = foe;
      } else if (clearanceOf(foe) > clearanceOf(best)) {
