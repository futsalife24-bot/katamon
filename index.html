<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>カタモン - カタパルトモンスター</title>
<meta name="description" content="モンスターを選び、風と地形を読んで砲撃するカタパルト対戦ゲーム。">
<meta name="theme-color" content="#070a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カタモン">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/loading-emblem.png" fetchpriority="high">
<link rel="preload" as="image" href="assets/wall.jpg" fetchpriority="high">
<link rel="preload" as="image" href="assets/intro-cannonball.png" fetchpriority="high">
<link rel="preload" as="image" href="assets/title-logo.png" fetchpriority="high">
<link rel="preload" as="image" href="assets/kyoryu.png">
<link rel="preload" as="image" href="assets/medama.png">
<link rel="preload" as="image" href="assets/iwa.png">
<link rel="preload" as="image" href="assets/tori.png">
<link rel="preload" as="audio" href="assets/title-bgm.mp3?v=2" type="audio/mpeg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0d17;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    background: #000;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    -webkit-tap-highlight-color: transparent;
  }
  #debugPanel {
    display: none;
    position: fixed;
    top: 4px;
    left: 4px;
    color: #9effa8;
    font: 12px/1.4 monospace;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border-radius: 6px;
    pointer-events: none;
    white-space: pre;
  }
  /* 名前入力のオーバーレイ。ゲーム本体の真鍮×黒鉄の意匠に寄せてある。 */
  #nameOverlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(2, 5, 10, 0.82);
    z-index: 20;
    padding: 16px;
  }
  #nameOverlay.open { display: flex; }
  #nameBox {
    width: min(360px, 100%);
    box-sizing: border-box;
    padding: 22px 20px 18px;
    background: linear-gradient(180deg, rgba(55,70,77,0.97), rgba(26,37,43,0.98) 55%, rgba(9,17,22,0.98));
    border: 2px solid #c78335;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif;
    text-align: center;
  }
  #nameTitle { color: #fff5dc; font-size: 18px; font-weight: 900; }
  #nameNote { color: #d39b4b; font-size: 11px; margin-top: 6px; }
  #nameInput {
    width: 100%;
    box-sizing: border-box;
    margin-top: 14px;
    padding: 12px 10px;
    font-size: 18px;
    text-align: center;
    color: #fff5dc;
    background: rgba(6,12,18,0.9);
    border: 2px solid rgba(199,131,53,0.7);
    border-radius: 4px;
    outline: none;
  }
  #nameInput:focus { border-color: #ffd24a; }
  #nameButtons { display: flex; gap: 10px; margin-top: 16px; }
  #nameButtons button {
    flex: 1;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 900;
    font-family: inherit;
    color: #fff5dc;
    background: linear-gradient(180deg, rgba(55,70,77,0.97), rgba(9,17,22,0.98));
    border: 2px solid #c78335;
    border-radius: 4px;
    cursor: pointer;
  }
  #nameButtons #nameOk { border-color: #ffd24a; color: #ffe2a1; }
  /* Firebase対戦ロビー。Canvas外の全画面DOMスクリーンとして重ねることで、スマホのIME・共有・コピーを素直に使える。 */
  #onlineLobby {
    position: fixed; inset: 0; display: none; z-index: 24;
    background: #0b0d17;
    font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  #onlineLobby.open { display: flex; justify-content: center; }
  #onlineLobbyBox {
    width: 100%; max-width: 540px; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; color: #fff5dc;
    background: linear-gradient(180deg, #37464d, #16252b 46%, #070b0d);
    border-left: 2px solid rgba(199,131,53,.55); border-right: 2px solid rgba(199,131,53,.55);
    box-shadow: 0 0 60px rgba(0,0,0,.5);
    overflow: hidden;
  }
  /* ヘッダ:入口はタイトル+閉じる、ルームは合言葉+共有/退出。状態でどちらの組が見えるかが変わる。 */
  #onlineLobbyHeader {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: max(14px, env(safe-area-inset-top)) 16px 12px;
    border-bottom: 2px solid #c78335;
    background: linear-gradient(180deg, rgba(55,70,77,.94), rgba(9,17,22,.6));
  }
  #onlineLobbyTitle { font-weight: 900; font-size: 19px; letter-spacing: .04em; }
  #onlineLobby.in-room #onlineLobbyTitle { display: none; }
  #onlineRoomCodeRow { display: none; align-items: center; justify-content: center; gap: 8px; }
  #onlineLobby.in-room #onlineRoomCodeRow { display: flex; }
  /* v101までのすぐ対戦は全員が同じ固定合言葉だったので隠していた。v102からは部屋ごとに
     別の合言葉になるため、待っている間こそ見せる。呼びたい相手へ直接伝えられる。 */
  /* 数字と英字の並びだけでは何なのか分からない、という指摘。見出しを1つ添える。 */
  #onlineRoomCodeLabel {
    flex: 0 0 auto; font: 900 10px/1 "Yu Gothic UI", sans-serif; letter-spacing: .12em; color: #d39b4b;
    border: 1px solid rgba(199,131,53,.7); border-radius: 3px; padding: 4px 5px;
  }
  #onlineRoomCode { color: #ffd24a; font: 900 22px/1 monospace; letter-spacing: .14em; }
  /* コピーは合言葉の真横に小さく置く。大きなボタンで場所を取らない。 */
  #onlineCopy {
    flex: 0 0 auto; width: 32px; height: 32px; min-height: 0; padding: 0; display: none;
    align-items: center; justify-content: center; border-radius: 6px; cursor: pointer;
    color: #ffe2a1; border: 2px solid #c78335; background: linear-gradient(180deg,#37464d,#091116);
  }
  #onlineLobby.in-room #onlineCopy { display: flex; }
  #onlineCopy svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 閉じる(入口)/退出(ルーム)はヘッダ右上に小さく置く。誤タップ圏外。 */
  #onlineCancel, #onlineLeave {
    flex: 0 0 auto; min-height: 0; padding: 8px 12px; font: 900 12px "Yu Gothic UI", sans-serif;
    color: #ffe2a1; border: 2px solid #c78335; border-radius: 4px; cursor: pointer;
    background: linear-gradient(180deg,#37464d,#091116);
  }
  #onlineLobby.in-room #onlineCancel { display: none; }
  #onlineLeave { display: none; }
  #onlineLobby.in-room #onlineLeave { display: block; }
  #onlineLobby.in-room.results #onlineLeave { display: none; }
  #onlineLeaveConfirm { display: none; flex: 0 0 auto; gap: 6px; }
  #onlineLeaveConfirmYes, #onlineLeaveConfirmNo {
    flex: 0 0 auto; min-height: 0; padding: 8px 10px; font: 900 12px "Yu Gothic UI", sans-serif;
    border-radius: 4px; cursor: pointer; background: linear-gradient(180deg,#37464d,#091116);
  }
  #onlineLeaveConfirmYes { color: #ffe2a1; border: 2px solid #f06060; }
  #onlineLeaveConfirmNo { color: #ffe2a1; border: 2px solid #c78335; }
  /* 本文:入口はエンブレム+案内、ルームは席・設定・キャラ選択。縦スクロールに逃がす。 */
  #onlineLobbyBody {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: stretch;
    padding: 18px 18px 8px; text-align: center;
  }
  #onlineLobbyEmblem { width: min(140px, 32vh); height: auto; margin: 4px auto 14px; display: block; opacity: .92; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  #onlineLobby.in-room #onlineLobbyEmblem { display: none; }
  #onlineLobbyNote, #onlineLobbyStatus { font-size: 12px; line-height: 1.55; }
  #onlineLobbyNote { color: #d39b4b; margin-bottom: 10px; }
  #onlineLobby.in-room #onlineLobbyNote { display: none; }
  #onlineLobbyStatus { min-height: 2.9em; color: #e8edf2; margin-top: auto; padding-top: 10px; }
  /* online.protocolErrorが立っている間、ステータス行を赤系にしてCanvas側のエラー表示と一貫させる。 */
  #onlineLobby.error #onlineLobbyStatus { color: #f06060; }
  /* 入室後は合言葉を1行だけ見せる。入力欄と入力時の注意書きは用済み。 */
  #onlineRoomInput, #onlineRoomHint, #onlineCreate, #onlineJoin { display: none; }
  #onlineLobby.code-entry:not(.in-room) #onlineRoomInput { display: block; }
  #onlineLobby.code-entry:not(.in-room) #onlineRoomHint { display: block; }
  #onlineLobby.code-entry:not(.in-room) #onlineCreate, #onlineLobby.code-entry:not(.in-room) #onlineJoin { display: block; }
  #onlineLobby.in-room #onlineRoomInput, #onlineLobby.in-room #onlineRoomHint { display: none; }
  #onlineRoomInput, #onlineCharacter {
    width: 100%; box-sizing: border-box; padding: 11px 10px; color: #fff5dc; text-align: center;
    font: 700 17px "Yu Gothic UI", sans-serif; background: rgba(6,12,18,.92);
    border: 2px solid rgba(199,131,53,.7); border-radius: 4px; outline: none; margin-top: 4px;
  }
  #onlineRoomInput:focus, #onlineCharacter:focus { border-color: #ffd24a; }
  /* 除外文字は無言で消えるため、打つ前に理由が分かるよう常時出しておく */
  #onlineRoomHint { margin: 5px 0 4px; font-size: 11px; line-height: 1.5; color: #9fb0bd; }
  #onlineRoomHint b { color: #ffd24a; font-weight: 900; letter-spacing: .08em; }
  #onlineRoomInput[readonly] { opacity: .72; border-style: dashed; }
  /* フッタ外へ移したので #onlineLobbyButtons button の装飾が届かない。ここで単体に持たせる。
     合言葉モードでは実質の主ボタンなので、金色のアクセントも付ける。 */
  #onlineCreate, #onlineJoin {
    width: 100%; box-sizing: border-box; margin-top: 8px; min-height: 45px; padding: 10px 6px;
    color: #ffe2a1; font: 900 15px "Yu Gothic UI", sans-serif; cursor: pointer;
    border: 2px solid #ffd24a; border-radius: 4px; background: linear-gradient(180deg,#37464d,#091116);
  }
  /* キャラ選択はルームに入ってから。合言葉を打つ画面では選ぶ意味がない。 */
  #onlineCharacter { display: none; }
  #onlineLobby.in-room #onlineCharacter { display: block; }
  #onlineLobby.in-room #onlineRoomPanel { display: block; }
  #onlineLobby.in-room #onlineCreate, #onlineLobby.in-room #onlineJoin { display: none; }
  #onlineRoomPanel { display: none; margin-top: 2px; padding: 9px; border: 1px solid rgba(255,210,74,.45); background: rgba(0,0,0,.22); text-align: left; }
  /* 席ボード:1席=1行カード。renderFirebaseLobby() が seat ごとに組み立てる(innerHTML不使用)。 */
  #onlineSlots { margin: 7px 0; display: flex; flex-direction: column; gap: 4px; }
  .onlineSeatRow {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px;
    border-radius: 4px; background: rgba(255,255,255,.03);
    font-size: 12px; line-height: 1.4; color: #e8edf2;
  }
  /* 自分の行だけ背景をわずかに明るくして強調する。 */
  .onlineSeatRow.mine { background: rgba(255,210,74,.14); }
  .onlineSeatRow .seatMark { flex: 0 0 auto; width: 13px; text-align: center; font-size: 13px; color: #4a5560; }
  /* 在席の●は席の種別で色分け:対戦者=真鍮系、観戦=控えめなグレー。 */
  .onlineSeatRow.occupied.player .seatMark { color: #ffd24a; }
  .onlineSeatRow.occupied.spectator .seatMark { color: #9fb0bd; }
  .onlineSeatRow .seatLabel { flex: 0 0 auto; min-width: 62px; font-weight: 900; color: #d39b4b; }
  .onlineSeatRow .seatName { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .onlineSeatRow .seatBadgeYou {
    flex: 0 0 auto; font-size: 10px; font-weight: 900; color: #0b0d17;
    background: #ffd24a; border-radius: 3px; padding: 1px 5px;
  }
  .onlineSeatRow .seatState { flex: 0 0 auto; font-size: 11px; font-weight: 900; }
  .onlineSeatRow .seatState.ready { color: #ffd24a; }
  .onlineSeatRow .seatState.picking { color: #9fb0bd; }
  .onlineSeatRow .seatState.stale { color: #ff8a6a; }
  .onlineSeatRow .seatState.cpu { color: #8fb6c8; }
  /* 応答が途切れた席。名前を落として、居るのに動いていないことが一目で分かるようにする */
  .onlineSeatRow.stale .seatMark, .onlineSeatRow.stale .seatName { opacity: .5; }
  /* ホストだけに出る「この席を空ける」。押し間違いが効かないよう、他の要素と間を空ける */
  .onlineSeatRow .seatReleaseBtn {
    flex: 0 0 auto; margin-left: 6px; font-size: 10px; font-weight: 900; color: #ffe2d6;
    background: #6d2320; border: 1px solid #e08a72; border-radius: 3px; padding: 3px 7px; cursor: pointer;
  }
  .onlineSeatRow .seatReleaseBtn:active { background: #8c2e2a; }
  #onlineSettings { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 7px; }
  #onlineSettings select { min-width: 0; padding: 5px 2px; color: #fff5dc; background: #101b20; border: 1px solid #c78335; }
  /* フッタ:全幅の主導線を最下段=親指圏に固定する。 */
  #onlineLobbyButtons {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 9px;
    padding: 10px 16px max(14px, env(safe-area-inset-bottom));
    border-top: 1px solid rgba(199,131,53,.35);
    background: linear-gradient(180deg, rgba(9,17,22,.35), rgba(9,17,22,.9));
  }
  #onlineLobbyButtons button {
    width: 100%; box-sizing: border-box; min-height: 48px; padding: 10px 6px;
    color: #fff5dc; font: 900 15px "Yu Gothic UI", sans-serif;
    border: 2px solid #c78335; border-radius: 4px; background: linear-gradient(180deg,#37464d,#091116); cursor: pointer;
  }
  #onlineReady, #onlineStart, #onlineRematch, #onlineReturnLobby, #onlineLeave { display: none; }
  #onlineLobby.in-room #onlineReady, #onlineLobby.in-room #onlineLeave { display: block; }
  #onlineLobby.in-room.host #onlineStart { display: block; }
  #onlineLobby.in-room.results #onlineRematch { display: block; }
  #onlineLobby.in-room.results #onlineReturnLobby { display: block; }
  #onlineLobby.in-room.results #onlineReady, #onlineLobby.in-room.results #onlineStart, #onlineLobby.in-room.results #onlineLeave { display: none; }
  #onlineLobby.in-room #onlineQuick, #onlineLobby.in-room #onlineCodeToggle { display: none; }
  /* ボタンの序列。押してほしい順に、塗り・高さ・幅を変えて一目で分かるようにする。
       主役   = 対戦開始 / このまま再戦 / すぐ対戦する … 塗りつぶし + いちばん大きい
       次点   = 準備完了                              … 縁取りのまま中くらい
       控えめ = ロビーへ戻る                          … 小さく、幅も詰めて主役と並べない
     **セレクタは必ず #onlineLobbyButtons から書くこと。** 直前の一括指定が
     `#onlineLobbyButtons button`(id+要素)で、`#onlineStart` 単体では詳細度で負ける。
     以前ここが `#onlineQuick, #onlineReady { min-height: 54px }` と書かれていて、
     実測では全ボタンが 376x48px・15px の完全に同じ見た目のままだった(実機で指摘)。 */
  #onlineLobbyButtons #onlineStart,
  #onlineLobbyButtons #onlineRematch,
  #onlineLobbyButtons #onlineQuick {
    min-height: 64px; font-size: 19px; letter-spacing: .1em;
    color: #2a1706;
    border-color: #ffe9a8;
    background: linear-gradient(180deg, #ffdf95, #f0a92e 52%, #c2701a);
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
    box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 7px 20px rgba(240,169,46,.3);
  }
  #onlineLobbyButtons #onlineStart:active,
  #onlineLobbyButtons #onlineRematch:active,
  #onlineLobbyButtons #onlineQuick:active {
    background: linear-gradient(180deg, #f0a92e, #b3670f); box-shadow: 0 0 0 1px rgba(0,0,0,.5);
  }
  #onlineLobbyButtons #onlineReady { min-height: 52px; font-size: 16px; border-color: #ffd24a; color: #ffe2a1; }
  /* 準備完了を押した後は「取り消す」に変わる。主役から降りたことを色でも示す。 */
  #onlineLobbyButtons #onlineReady.is-ready { border-color: #7d94a1; color: #cfe0ea; }
  #onlineLobbyButtons #onlineReturnLobby {
    width: 74%; margin: 2px auto 0; min-height: 40px; font-size: 13px; border-color: #7d94a1; color: #cfe0ea;
  }
  /* 押せない時は押せないと分かるようにする。今までは押せる時と見た目が同じで、
     「間違っていないか探してから押す」状態になっていた。 */
  #onlineLobbyButtons button:disabled { opacity: .32; box-shadow: none; cursor: default; }
  #onlineCodeToggle {
    border: none !important; background: none !important; min-height: 0 !important; padding: 4px !important;
    color: #d39b4b !important; font: 700 12px "Yu Gothic UI", sans-serif !important; letter-spacing: .04em; text-decoration: underline;
  }
  #onlineLobby.busy button { opacity: .56; pointer-events: none; }
  @media (max-height: 660px) {
    #onlineLobbyHeader { padding-top: 10px; padding-bottom: 8px; }
    #onlineLobbyTitle { font-size: 17px; }
    #onlineLobbyEmblem { margin-bottom: 8px; }
    #onlineRoomCode { font-size: 19px; }
  }
  /* 退出はネイティブconfirm()をやめ、画面内の2択に置き換える(要件6)。leave-confirm状態では
     #onlineLeaveを隠し、代わりにこの2択を出す。5秒操作が無ければ自動で戻す。
     #onlineLeaveの表示指定は上に2箇所あり(ヘッダ用・フッタボタン共通指定用)、同specificityの
     カスケードで確実に上書きするため、スタイルシートの最後に置く。 */
  #onlineLobby.leave-confirm #onlineLeave { display: none; }
  #onlineLobby.leave-confirm #onlineLeaveConfirm { display: flex; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<div id="debugPanel">M1: 地形生成+描画+破壊テスト(タップでクレーター)</div>
<!-- 名前入力だけはCanvasではなくHTMLで受ける。日本語入力(IME)を自前で作るのは非現実的なため。 -->
<div id="nameOverlay">
  <div id="nameBox">
    <div id="nameTitle">ランキング用の名前</div>
    <div id="nameNote">12文字まで。あとから変更できます。</div>
    <input id="nameInput" type="text" maxlength="12" autocomplete="off" placeholder="ななし">
    <div id="nameButtons">
      <button id="nameCancel" type="button">やめる</button>
      <button id="nameOk" type="button">決定</button>
    </div>
  </div>
</div>
<!-- 実対戦はIME/クリップボード/共有を使うため、タイトルCanvasの上に全画面のHTMLロビーを重ねる。 -->
<div id="onlineLobby" aria-live="polite">
  <div id="onlineLobbyBox" role="dialog" aria-modal="true" aria-labelledby="onlineLobbyTitle">
    <div id="onlineLobbyHeader">
      <div id="onlineLobbyTitle">ONLINE BATTLE</div>
      <div id="onlineRoomCodeRow">
        <span id="onlineRoomCodeLabel">部屋ID</span>
        <div id="onlineRoomCode"></div>
        <button id="onlineCopy" type="button" aria-label="部屋IDをコピー / 共有" title="部屋IDをコピー / 共有">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
        </button>
      </div>
      <button id="onlineLeave" type="button">ロビーを退出</button>
      <div id="onlineLeaveConfirm">
        <button id="onlineLeaveConfirmYes" type="button">退出する</button>
        <button id="onlineLeaveConfirmNo" type="button">やめる</button>
      </div>
      <button id="onlineCancel" type="button">タイトルへ戻る</button>
    </div>
    <div id="onlineLobbyBody">
      <img id="onlineLobbyEmblem" src="assets/loading-emblem.png" alt="" aria-hidden="true">
      <div id="onlineLobbyNote">そのまま対戦相手を待てます。部屋IDを使いたい時だけ設定を開いてください</div>
      <input id="onlineRoomInput" type="text" inputmode="text" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="相手の部屋ID 8文字" aria-describedby="onlineRoomHint">
      <div id="onlineRoomHint">見間違いを防ぐため <b>I・O・1・0</b> は使いません</div>
      <button id="onlineCreate" type="button">部屋を作る</button>
      <button id="onlineJoin" type="button">部屋に入る</button>
      <div id="onlineRoomPanel">
        <div id="onlineSlots"></div>
        <div id="onlineSettings">
          <select id="onlineTerrain" aria-label="地形"></select>
          <select id="onlineWind" aria-label="風"></select>
          <select id="onlineTurns" aria-label="手番数"><option value="10">10手番</option><option value="15" selected>15手番</option><option value="20">20手番</option></select>
          <select id="onlineFormat" aria-label="対戦方式"><option value="1v1" selected>1 vs 1</option><option value="2v2">2 vs 2</option></select>
        </div>
      </div>
      <select id="onlineCharacter" aria-label="使用モンスター"></select>
      <div id="onlineLobbyStatus">通信を準備します。通信できない時もCPU・演習は遊べます。</div>
    </div>
    <div id="onlineLobbyButtons">
      <button id="onlineStart" type="button">対戦開始</button>
      <button id="onlineReady" type="button">準備完了</button>
      <button id="onlineRematch" type="button">このまま再戦</button>
      <button id="onlineReturnLobby" type="button">ロビーへ戻る</button>
      <button id="onlineQuick" type="button">すぐ対戦する</button>
      <button id="onlineCodeToggle" type="button">部屋IDを使う</button>
    </div>
  </div>
</div>
<audio id="titleBgm" preload="auto">
  <source src="assets/title-bgm.mp3?v=2" type="audio/mpeg">
</audio>
<audio id="stageBgm" preload="none"></audio>
<audio id="roomBgm" preload="none" loop src="assets/room-bgm.mp3?v=1"></audio>
<!-- おまけ曲。srcはボタンを押した時に初めて入れる(タイトル表示を重くしないため) -->
<audio id="bonusBgm" preload="none" loop></audio>

<script>
(() => {
  'use strict';

  // ===== 仮想解像度(9:16縦画面) =====
  const VW = 540;
  const VH = 960;

  // 下部コントローラパネルの境界と死線。地形の生成側(GROUND_MAX_Y/TERRAIN_BOTTOM_Y)が
  // 参照するため、パネル描画の定義より前に置く。値の意味は変えていない。
  const CONTROL_PANEL_Y = 660; // 旧比1.5倍の高さ(960-660=300)
  const DEAD_LINE_Y = CONTROL_PANEL_Y - 24; // キャラ下端が触れた時点で場外負け

  // ===== UI意匠トークン(真鍮×黒鉄) =====
  // タイトル/フリーモード画面で確立した「重厚な鉄板に真鍮の縁と鋲」の意匠を、
  // 戦闘画面のHUD・コントローラでも共通で使うための定義。
  // 色を直書きせずここを参照することで、全画面の配色を一箇所で調整できる。
  const UI = {
    brass: '#c78335',        // プレートの縁
    brassDark: '#8c5b2c',    // 縁の影側
    brassLabel: '#d39b4b',   // 小見出し・ラベル
    brassLight: '#ffe2a1',   // 明るい装飾・アイコン
    parchment: '#fff5dc',    // 主要な文字色
    ink: '#070a0c',          // 文字の縁取り
    gold: '#ffd24a',         // 強調・発光系
    plateTop: 'rgba(55,70,77,0.97)',
    plateMid: 'rgba(26,37,43,0.98)',
    plateBottom: 'rgba(9,17,22,0.98)',
    hpHigh: '#7be07b',
    hpMid: '#f0c860',
    hpLow: '#f06060',
    fuel: '#8ad0ff',
    ally: '#4fc3f7',
    enemy: '#ff6b6b'
  };
  const UI_FONT = '"Yu Gothic UI", sans-serif';
  const UI_FONT_HEAVY = '"Arial Black", "Yu Gothic UI", sans-serif';

  // ===== ビルド番号 =====
  // 端末がどの版を掴んでいるかを目で確かめるための番号。sw.js の CACHE_VERSION と必ず揃えること。
  // 不具合報告の時、双方が同じ版で動いているかをここ一箇所で確認できる。
  const BUILD_ID = 'v128';

  // ===== 最終更新日(サーバー側のファイル更新日時から自動取得。手動更新不要) =====
  const LAST_UPDATED_TEXT = (() => {
    const d = new Date(document.lastModified);
    if (isNaN(d.getTime())) return `build ${BUILD_ID}`;
    const pad = n => String(n).padStart(2, '0');
    return `最終更新: ${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}　build ${BUILD_ID}`;
  })();

  // ===== ステージ(横長)とカメラ =====
  // 通常はキャラ周辺を見せ、ミニマップとピンチインで全景を確認する。
  const STAGE_W = 1440;
  const MIN_CAMERA_ZOOM = VW / STAGE_W;
  const DEFAULT_CAMERA_ZOOM = 0.78;
  const MAX_CAMERA_ZOOM = 1;
  const CAMERA_ZOOM_KEY = 'katamon_camera_zoom_v1';
  function loadCameraZoom() {
    try {
      const value = Number(localStorage.getItem(CAMERA_ZOOM_KEY));
      return Number.isFinite(value) ? clampCameraZoom(value) : DEFAULT_CAMERA_ZOOM;
    } catch (err) {
      return DEFAULT_CAMERA_ZOOM;
    }
  }
  function saveCameraZoom() {
    try { localStorage.setItem(CAMERA_ZOOM_KEY, String(cameraZoom)); } catch (err) { /* 保存できなくても視点操作は続行可能 */ }
  }
  let cameraZoom = loadCameraZoom();
  let cameraX = 0;
  let cameraTargetX = null;
  function clampCameraZoom(zoom) {
    return Math.min(MAX_CAMERA_ZOOM, Math.max(MIN_CAMERA_ZOOM, zoom));
  }
  function visibleWorldWidth() {
    return VW / cameraZoom;
  }
  function clampCameraX(x) {
    return Math.min(Math.max(0, STAGE_W - visibleWorldWidth()), Math.max(0, x));
  }
  function centerCameraOn(worldX) {
    return clampCameraX(worldX - visibleWorldWidth() / 2);
  }
  function focusCameraOn(worldX, immediate = false) {
    const target = centerCameraOn(worldX);
    if (immediate) {
      cameraX = target;
      cameraTargetX = null;
    } else {
      cameraTargetX = target;
    }
  }
  function applyWorldCamera(parallaxFactor = 1) {
    ctx.translate(0, CONTROL_PANEL_Y);
    ctx.scale(cameraZoom, cameraZoom);
    ctx.translate(-cameraX * parallaxFactor, -CONTROL_PANEL_Y);
  }
  function worldToScreenX(worldX) {
    return (worldX - cameraX) * cameraZoom;
  }
  function worldToScreenY(worldY) {
    return CONTROL_PANEL_Y + (worldY - CONTROL_PANEL_Y) * cameraZoom;
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const debugPanel = document.getElementById('debugPanel');

  // ===== 効果音(WebAudio合成・音源ファイル不要) =====
  // 音量はBGMと効果音を別系統で0〜100%保持し、localStorageに永続化する。
  // 各音の設計上のバランス(BGMは控えめ等)は基準値として残し、ユーザー設定は倍率として掛ける。
  const AUDIO_KEY = 'katamon_audio_v1';
  const TITLE_BGM_BASE_VOLUME = 0.34;
  const STAGE_BGM_BASE_VOLUME = 0.28;
  const ROOM_BGM_BASE_VOLUME = 0.34; // まずタイトル曲と同じ値。実機で聴いて必要なら調整する。
  // おまけ曲の既定音量。曲ごとの実測値からBONUS_BGM_TRACKS側で個別に上書きする。
  const BONUS_BGM_BASE_VOLUME = 0.52;
  const STAGE_BGM_DUCK_RATIO = 0.39; // カットイン等で一時的に下げる割合
  const SFX_MASTER_BASE = 0.78;
  let soundOn = true;
  let bgmVolume = 1;
  let sfxVolume = 1;
  let stageBgmDucked = false;
  let sfxMasterGain = null;

  (function loadAudioSettings() {
    try {
      const raw = localStorage.getItem(AUDIO_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (typeof d.soundOn === 'boolean') soundOn = d.soundOn;
      if (typeof d.bgm === 'number') bgmVolume = Math.min(1, Math.max(0, d.bgm));
      if (typeof d.sfx === 'number') sfxVolume = Math.min(1, Math.max(0, d.sfx));
    } catch (err) { /* 読めなければ既定値のまま */ }
  })();
  function saveAudioSettings() {
    try {
      localStorage.setItem(AUDIO_KEY, JSON.stringify({ soundOn, bgm: bgmVolume, sfx: sfxVolume }));
    } catch (err) { /* 保存できなくてもゲームは続行できる */ }
  }
  // 音量0はミュートと同義に扱い、無音の再生を続けないようにする。
  function bgmAudible() { return soundOn && bgmVolume > 0; }
  function sfxAudible() { return soundOn && sfxVolume > 0; }
  // スライダーの位置(0〜1)を実際の音量倍率へ変換する。
  // 人間の音量感覚は対数的なので、位置をそのまま倍率にすると上半分がほとんど効かず
  // 「絞っても大して小さくならない」と感じる。全域が効くようdBで等間隔に配る。
  // 全開=0dB、下げるほど急に小さくなり、下限は-40dB(ほぼ無音)。
  const VOLUME_RANGE_DB = 40;
  function volumeCurve(position) {
    if (position <= 0) return 0;
    if (position >= 1) return 1;
    return Math.pow(10, (position - 1) * VOLUME_RANGE_DB / 20);
  }
  function applyAudioVolumes() {
    const on = soundOn ? 1 : 0;
    const bgmGain = volumeCurve(bgmVolume) * on;
    const sfxGain = volumeCurve(sfxVolume) * on;
    const duck = stageBgmDucked ? STAGE_BGM_DUCK_RATIO : 1;
    if (titleBgmGain && stageBgmGain && roomBgmGain && bonusBgmGain) {
      // WebAudio経由に切り替わっている場合(iOS等)は、GainNodeが最終音量を決める。
      // 要素側は素通し(1.0)に固定しないと、切替前の音量が残って二重に減衰してしまう。
      titleBgm.volume = 1;
      stageBgm.volume = 1;
      roomBgm.volume = 1;
      bonusBgm.volume = 1;
      titleBgmGain.gain.value = TITLE_BGM_BASE_VOLUME * bgmGain;
      stageBgmGain.gain.value = STAGE_BGM_BASE_VOLUME * bgmGain * duck;
      roomBgmGain.gain.value = ROOM_BGM_BASE_VOLUME * bgmGain;
      bonusBgmGain.gain.value = bonusBgmBaseVolume() * bgmGain;
    } else {
      titleBgm.volume = TITLE_BGM_BASE_VOLUME * bgmGain;
      stageBgm.volume = STAGE_BGM_BASE_VOLUME * bgmGain * duck;
      roomBgm.volume = ROOM_BGM_BASE_VOLUME * bgmGain;
      bonusBgm.volume = bonusBgmBaseVolume() * bgmGain;
    }
    if (sfxMasterGain) sfxMasterGain.gain.value = SFX_MASTER_BASE * sfxGain;
  }

  // ===== iOS対策:audio要素の音量が変えられない端末ではWebAudio経由にする =====
  // iOS Safariは HTMLMediaElement.volume への代入を黙って無視する(音量は本体ボタンのみ)。
  // そのままだとBGMのスライダーだけ全く効かないため、判定して経路を切り替える。
  let titleBgmGain = null;
  let stageBgmGain = null;
  let roomBgmGain = null;
  let bonusBgmGain = null;
  let bgmSourceNodes = { title: null, stage: null, room: null, bonus: null };
  let mediaVolumeSupported = true;
  // iOS/iPadOSは volume を代入しても音量に反映されない。
  // 厄介なことにバージョンによっては「値は保持して読み戻せるが音は変わらない」ため、
  // 読み戻しによる判定では見抜けない。iOS系はUAで判断して無条件にWebAudio経由にする。
  function isIosLike() {
    const ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    // iPadOS 13以降はMacintoshを名乗るので、タッチ対応の有無で見分ける
    if (/Macintosh/.test(ua) && typeof document.ontouchend !== 'undefined') return true;
    return false;
  }
  function detectMediaVolumeSupport() {
    if (isIosLike()) {
      mediaVolumeSupported = false;
      return;
    }
    try {
      const original = titleBgm.volume;
      const probe = original === 0.5 ? 0.25 : 0.5;
      titleBgm.volume = probe;
      mediaVolumeSupported = Math.abs(titleBgm.volume - probe) < 0.01;
      titleBgm.volume = original;
    } catch (err) {
      mediaVolumeSupported = false;
    }
  }
  // BGMをWebAudioへ繋ぎ直す。ユーザー操作の中から呼ぶこと(iOSはAudioContextの作成/再開に操作が要る)。
  function ensureBgmGraph() {
    if (mediaVolumeSupported) return;            // 通常の端末は従来経路のまま触らない
    if (titleBgmGain && stageBgmGain && roomBgmGain && bonusBgmGain) {
      // 構築済みでも、復帰直後などにcontextが止まっていると無音になる。
      // WebAudio経由の時はBGMの生命線なので、操作のたびに起こしておく。
      if (audioCtx && audioCtx.state === 'suspended') {
        const resumed = audioCtx.resume();
        if (resumed && typeof resumed.catch === 'function') resumed.catch(() => {});
      }
      return;
    }
    try {
      const ac = getAudioCtx();
      if (!titleBgmGain) { titleBgmGain = ac.createGain(); titleBgmGain.connect(ac.destination); }
      if (!stageBgmGain) { stageBgmGain = ac.createGain(); stageBgmGain.connect(ac.destination); }
      if (!roomBgmGain) { roomBgmGain = ac.createGain(); roomBgmGain.connect(ac.destination); }
      if (!bonusBgmGain) { bonusBgmGain = ac.createGain(); bonusBgmGain.connect(ac.destination); }
      // createMediaElementSourceは1要素につき1回しか呼べないので、個別に記録しておく
      if (!bgmSourceNodes.title) {
        bgmSourceNodes.title = ac.createMediaElementSource(titleBgm);
        bgmSourceNodes.title.connect(titleBgmGain);
      }
      if (!bgmSourceNodes.stage) {
        bgmSourceNodes.stage = ac.createMediaElementSource(stageBgm);
        bgmSourceNodes.stage.connect(stageBgmGain);
      }
      if (!bgmSourceNodes.room) {
        bgmSourceNodes.room = ac.createMediaElementSource(roomBgm);
        bgmSourceNodes.room.connect(roomBgmGain);
      }
      if (!bgmSourceNodes.bonus) {
        bgmSourceNodes.bonus = ac.createMediaElementSource(bonusBgm);
        bgmSourceNodes.bonus.connect(bonusBgmGain);
      }
      applyAudioVolumes();
    } catch (err) {
      // 途中で失敗しても再生自体は続けたいので、以後は諦めて従来経路に任せる
      mediaVolumeSupported = true;
      titleBgmGain = null;
      stageBgmGain = null;
      roomBgmGain = null;
      bonusBgmGain = null;
    }
  }

  // ブラウザの自動再生制限に合わせ、タイトル画面での最初のタップから再生する。
  // タイトル→キャラ選択は同じ再生を維持し、出撃時に停止する。
  const titleBgm = document.getElementById('titleBgm');
  titleBgm.volume = TITLE_BGM_BASE_VOLUME;
  const TITLE_BGM_LOOP_GAP_MS = 2000;
  const TITLE_START_MAX_WAIT_MS = 1500;
  let titleBgmLoopTimer = null;
  let titleStartTimeout = null;
  let titleStartPending = false;
  let titleStartFailed = false;
  // BGMはバックグラウンドで先読みする。端末によっては全曲バッファリング通知が来ないため、
  // ロード完了条件には含めず、TAP後に実際の再生開始とタイトル遷移を同期する。
  titleBgm.load();
  function clearTitleBgmLoopTimer() {
    if (titleBgmLoopTimer === null) return;
    clearTimeout(titleBgmLoopTimer);
    titleBgmLoopTimer = null;
  }
  function playTitleBgm(restart = false) {
    if (!bgmAudible()) return Promise.resolve();
    if (restart) {
      clearTitleBgmLoopTimer();
      titleBgm.pause();
      if (titleBgm.readyState > HTMLMediaElement.HAVE_NOTHING) titleBgm.currentTime = 0;
    }
    const result = titleBgm.play();
    const promise = result && typeof result.then === 'function' ? result : Promise.resolve();
    // 呼び出し元のPromiseチェーンはそのまま返す。自動再生ブロックの再試行フラグは脇で拾うだけ。
    promise.then(() => { bgmRetryTarget = null; }, () => { bgmRetryTarget = titleBgm; });
    return promise;
  }
  function startTitleBgm() {
    if (!bgmAudible() || (gamePhase !== 'title' && gamePhase !== 'select')) return;
    if (titleBgmLoopTimer !== null) return;
    playTitleBgm().catch(() => {});
  }
  titleBgm.addEventListener('ended', () => {
    clearTitleBgmLoopTimer();
    if (!bgmAudible() || (gamePhase !== 'title' && gamePhase !== 'select')) return;
    titleBgmLoopTimer = setTimeout(() => {
      titleBgmLoopTimer = null;
      if (!bgmAudible() || (gamePhase !== 'title' && gamePhase !== 'select')) return;
      playTitleBgm(true).catch(() => {});
    }, TITLE_BGM_LOOP_GAP_MS);
  });
  function finishTitleStart(failed = false) {
    if (!titleStartPending) return;
    if (titleStartTimeout !== null) {
      clearTimeout(titleStartTimeout);
      titleStartTimeout = null;
    }
    titleStartPending = false;
    titleStartFailed = failed;
    if (gamePhase === 'press') gamePhase = 'title';
  }
  function enterTitleFromTap() {
    if (titleStartPending) return;
    // 最初のタップ(確実なユーザー操作)のうちにWebAudio経路を用意しておく
    ensureBgmGraph();
    titleStartPending = true;
    titleStartFailed = false;
    // 通常は実際の再生開始と同時にタイトルへ進む。端末側の音源準備が停止しても、
    // 最大1.5秒で必ず画面遷移し、以後のタップでBGM再生を再試行できるようにする。
    titleStartTimeout = setTimeout(() => {
      finishTitleStart(titleBgm.paused);
    }, TITLE_START_MAX_WAIT_MS);
    try {
      playTitleBgm(true)
        .then(() => { finishTitleStart(false); })
        .catch(() => { finishTitleStart(true); });
    } catch (_) {
      finishTitleStart(true);
    }
  }
  function stopTitleBgm(reset = true) {
    clearTitleBgmLoopTimer();
    titleBgm.pause();
    if (reset && titleBgm.readyState > HTMLMediaElement.HAVE_NOTHING) titleBgm.currentTime = 0;
  }
  const stageBgm = document.getElementById('stageBgm');
  const STAGE_BGM_SOURCES = {
    grass: 'assets/stage-grass.mp3?v=1',
    desert: 'assets/stage-desert.mp3?v=1',
    snow: 'assets/stage-snow.mp3?v=1',
    volcanic: 'assets/stage-volcanic.mp3?v=1',
    arena: 'assets/stage-boss-arena.mp3?v=1'
  };
  stageBgm.volume = STAGE_BGM_BASE_VOLUME;
  stageBgm.loop = true;
  let stageBgmTheme = null;
  let stageBgmRestoreTimer = null;
  // ルーム専用BGM。ループはaudio要素のloop属性任せ(タイトル曲のようなギャップ付きループは不要)。
  const roomBgm = document.getElementById('roomBgm');
  roomBgm.volume = ROOM_BGM_BASE_VOLUME;
  // タイトルの「おまけ」ボタンで鳴らす曲。押すたびに 1曲目 → 2曲目 → 停止 と切り替える。
  // srcは押されるまで入れない。タイトル表示のために数MBを先読みさせないため。
  const bonusBgm = document.getElementById('bonusBgm');
  bonusBgm.volume = BONUS_BGM_BASE_VOLUME;
  // 曲ごとに録音レベルが違う(実測で-16.8〜-18.7dBFS)ので、体感音量が揃うよう個別に
  // 基準音量を持たせる。水準はタイトル曲より約2dB大きいところに合わせた。
  // 聴かせるための機能なので、背景として流すタイトル曲より少し前へ出す。
  // 再生時のピークはいずれも0.35前後で、歪む(1.0)までは十分な余裕がある。
  const BONUS_BGM_TRACKS = [
    null,
    // URL末尾の ?v=N はキャッシュの鍵。同じURLのまま中身を差し替えると、ブラウザは
    // 保存済みの古い曲を鳴らし続ける。実際にv98で bonus-bgm-2 をCeltic版へ差し替えた際、
    // ?v=1 のままだったため2曲目に旧Hard Rock版が鳴っていた。
    // ファイルの中身を入れ替えたら必ずここの番号も上げること。
    { src: 'assets/bonus-bgm-1.mp3?v=1', volume: 0.53 },
    { src: 'assets/bonus-bgm-2.mp3?v=2', volume: 0.56 },
    { src: 'assets/bonus-bgm-3.mp3?v=1', volume: 0.45 },
    { src: 'assets/bonus-bgm-4.mp3?v=1', volume: 0.54 }
  ];
  let bonusBgmTrack = 0;        // 0=止まっている / 1〜4=その曲を選んでいる
  let bonusBgmLoadedTrack = 0;  // いまaudio要素に読み込んである曲
  function bonusBgmBaseVolume() {
    const track = BONUS_BGM_TRACKS[bonusBgmTrack];
    return track ? track.volume : BONUS_BGM_BASE_VOLUME;
  }
  // 保存済みの音量設定をここで初回反映する(titleBgm/stageBgm/roomBgm/bonusBgmが揃った時点)。
  detectMediaVolumeSupport();
  applyAudioVolumes();
  function playStageBgm(themeKey, restart = false) {
    if (!bgmAudible() || gamePhase !== 'battle') return;
    const bgmKey = currentPattern === 'tieredBasin' ? 'arena' : themeKey;
    const src = STAGE_BGM_SOURCES[bgmKey] || STAGE_BGM_SOURCES.grass;
    if (stageBgmTheme !== bgmKey) {
      stageBgm.pause();
      stageBgm.src = src;
      stageBgmTheme = bgmKey;
      stageBgm.load();
      restart = true;
    }
    if (restart && stageBgmRestoreTimer !== null) {
      clearTimeout(stageBgmRestoreTimer);
      stageBgmRestoreTimer = null;
    }
    if (restart) {
      stageBgmDucked = false;
      applyAudioVolumes();
    }
    if (restart && stageBgm.readyState > HTMLMediaElement.HAVE_NOTHING) stageBgm.currentTime = 0;
    const result = stageBgm.play();
    const promise = result && typeof result.then === 'function' ? result : Promise.resolve();
    // 呼び出し元には何も返さない(従来どおり)。自動再生ブロックの再試行フラグだけ脇で拾う。
    promise.then(() => { bgmRetryTarget = null; }, () => { bgmRetryTarget = stageBgm; });
  }
  function stopStageBgm(reset = true) {
    if (stageBgmRestoreTimer !== null) {
      clearTimeout(stageBgmRestoreTimer);
      stageBgmRestoreTimer = null;
    }
    stageBgmDucked = false;
    applyAudioVolumes();
    stageBgm.pause();

  const terrainRimLayer = document.createElement('canvas');
  terrainRimLayer.width = STAGE_W;
  terrainRimLayer.height = VH;
  const terrainRimLayerCtx = terrainRimLayer.getContext('2d');

  function paintTerrainRimLayer(color, radius) {
    terrainRimLayerCtx.save();
    terrainRimLayerCtx.clearRect(0, 0, STAGE_W, VH);
    terrainRimLayerCtx.globalCompositeOperation = 'source-over';
    terrainRimLayerCtx.imageSmoothingEnabled = true;
    for (let i = 0; i < 16; i++) {
      const angle = i * Math.PI * 2 / 16;
      terrainRimLayerCtx.drawImage(terrainCanvas, Math.cos(angle) * radius, Math.sin(angle) * radius);
    }
    terrainRimLayerCtx.globalCompositeOperation = 'source-in';
    terrainRimLayerCtx.fillStyle = color;
    terrainRimLayerCtx.fillRect(0, 0, STAGE_W, VH);
    terrainRimLayerCtx.globalCompositeOperation = 'destination-out';
    terrainRimLayerCtx.drawImage(terrainCanvas, 0, 0);
    terrainRimLayerCtx.restore();
    terrainRimCtx.drawImage(terrainRimLayer, 0, 0);
  }

  function rebuildTerrainRim() {
    terrainRimCtx.clearRect(0, 0, STAGE_W, VH);
    const arena = currentPattern === 'tieredBasin';
    paintTerrainRimLayer(arena ? '#090c11' : currentTheme.rimShadow, 6);
    paintTerrainRimLayer(arena ? '#b98238' : currentTheme.rim, 3);
  }

  // 既存の薄床地形を土台にして、橋だと一目で分かる装飾だけを別レイヤーに描く。
  // 地形と同じクレーターで削るため、爆破後に絵だけ宙へ残ることもない。
  const bridgeCanvas = document.createElement('canvas');
  bridgeCanvas.width = STAGE_W;
  bridgeCanvas.height = VH;
  const bridgeCtx = bridgeCanvas.getContext('2d');

  // 闘技場専用の鉄柵・鋲・補強材。地形とは別レイヤーにして、爆風で地面と一緒に欠けるようにする。
  const arenaDecorationCanvas = document.createElement('canvas');
  arenaDecorationCanvas.width = STAGE_W;
  arenaDecorationCanvas.height = VH;
  const arenaDecorationCtx = arenaDecorationCanvas.getContext('2d');

  function rebuildArenaDecoration() {
    arenaDecorationCtx.clearRect(0, 0, STAGE_W, VH);
    if (currentPattern !== 'tieredBasin') return;

    const wallEdge = STAGE_W * ARENA_WALL_RATIO;
    const drawFence = (startX, endX, y) => {
      const posts = [];
      for (let x = startX; x <= endX; x += 42) posts.push(x);
      if (!posts.length || posts[posts.length - 1] < endX - 8) posts.push(endX);

      arenaDecorationCtx.save();
      arenaDecorationCtx.lineCap = 'round';
      arenaDecorationCtx.lineJoin = 'round';
      arenaDecorationCtx.shadowColor = 'rgba(0,0,0,0.55)';
      arenaDecorationCtx.shadowBlur = 3;
      arenaDecorationCtx.strokeStyle = '#171d25';
      arenaDecorationCtx.lineWidth = 6;
      for (const x of posts) {
        arenaDecorationCtx.beginPath();
        arenaDecorationCtx.moveTo(x, y + 2);
        arenaDecorationCtx.lineTo(x, y - 29);
        arenaDecorationCtx.stroke();
      }
      arenaDecorationCtx.strokeStyle = '#59616d';
      arenaDecorationCtx.lineWidth = 3;
      for (const railY of [y - 22, y - 10]) {
        arenaDecorationCtx.beginPath();
        arenaDecorationCtx.moveTo(startX, railY);
        arenaDecorationCtx.lineTo(endX, railY);
        arenaDecorationCtx.stroke();
      }
      arenaDecorationCtx.fillStyle = '#d39a45';
      for (const x of posts) {
        arenaDecorationCtx.beginPath();
        arenaDecorationCtx.arc(x, y - 22, 2.3, 0, Math.PI * 2);
        arenaDecorationCtx.fill();
        arenaDecorationCtx.beginPath();
        arenaDecorationCtx.moveTo(x - 4, y - 29);
        arenaDecorationCtx.lineTo(x, y - 36);
        arenaDecorationCtx.lineTo(x + 4, y - 29);
        arenaDecorationCtx.closePath();
        arenaDecorationCtx.fill();
      }
      arenaDecorationCtx.restore();
    };

    for (const shelf of ARENA_SHELVES) {
      const shelfEdge = STAGE_W * shelf.reach;
      // 中央側はキャラ1体分以上あけ、柵の切れ目から能動的に一段下へ降りられる見た目にする。
      const exitGap = 54;
      drawFence(wallEdge + 18, shelfEdge - exitGap, shelf.y);
      drawFence(STAGE_W - shelfEdge + exitGap, STAGE_W - wallEdge - 18, shelf.y);
    }
  }

  function rebuildBridgeDecoration() {
    bridgeCtx.clearRect(0, 0, STAGE_W, VH);
    if (!currentBridge) return;
    const { startX, endX, y, style } = currentBridge;
    const length = endX - startX;
    const plankStep = style === 'rope' ? 11 : 15;
    const postStep = style === 'rope' ? 44 : 38;

    bridgeCtx.save();
    bridgeCtx.lineCap = 'round';
    bridgeCtx.lineJoin = 'round';

    // 橋桁と板張り
    bridgeCtx.fillStyle = '#6b3f24';
    bridgeCtx.fillRect(startX - 8, y - 6, length + 16, 19);
    bridgeCtx.fillStyle = '#b8793f';
    bridgeCtx.fillRect(startX - 5, y - 5, length + 10, 11);
    bridgeCtx.strokeStyle = '#3b2418';
    bridgeCtx.lineWidth = 2;
    for (let x = startX; x <= endX; x += plankStep) {
      bridgeCtx.beginPath();
      bridgeCtx.moveTo(x, y - 5);
      bridgeCtx.lineTo(x + Math.sin(x * 0.17 + currentBridge.seed) * 2, y + 7);
      bridgeCtx.stroke();
    }
    bridgeCtx.strokeStyle = '#2b1a12';
    bridgeCtx.lineWidth = 5;
    bridgeCtx.beginPath();
    bridgeCtx.moveTo(startX - 5, y + 13);
    bridgeCtx.lineTo(endX + 5, y + 13);
    bridgeCtx.stroke();

    // 支柱・手すり。ロープ橋は上の線を少したるませる。
    const posts = [];
    for (let x = startX; x <= endX + 1; x += postStep) posts.push(Math.min(x, endX));
    if (posts[posts.length - 1] !== endX) posts.push(endX);
    bridgeCtx.strokeStyle = '#4a2b1b';
    bridgeCtx.lineWidth = 5;
    for (const x of posts) {
      bridgeCtx.beginPath();
      bridgeCtx.moveTo(x, y + 10);
      bridgeCtx.lineTo(x, y - 32);
      bridgeCtx.stroke();
    }
    bridgeCtx.strokeStyle = style === 'rope' ? '#d3b27a' : '#7e512e';
    bridgeCtx.lineWidth = style === 'rope' ? 3 : 5;
    bridgeCtx.beginPath();
    bridgeCtx.moveTo(posts[0], y - 29);
    for (let i = 1; i < posts.length; i++) {
      if (style === 'rope') {
        const midX = (posts[i - 1] + posts[i]) / 2;
        bridgeCtx.quadraticCurveTo(midX, y - 20, posts[i], y - 29);
      } else {
        bridgeCtx.lineTo(posts[i], y - 29);
      }
    }
    bridgeCtx.stroke();

    // 地面の表面に見える補強材。長い橋ほど三角形が増えて橋らしく見える。
    bridgeCtx.strokeStyle = 'rgba(62,34,20,0.9)';
    bridgeCtx.lineWidth = 4;
    for (let x = startX; x + postStep <= endX; x += postStep) {
      bridgeCtx.beginPath();
      bridgeCtx.moveTo(x, y + 15);
      bridgeCtx.lineTo(x + postStep / 2, y + 40);
      bridgeCtx.lineTo(x + postStep, y + 15);
      bridgeCtx.stroke();
    }

    // 両端の橋台
    bridgeCtx.fillStyle = '#51483f';
    bridgeCtx.fillRect(startX - 12, y - 3, 10, 28);
    bridgeCtx.fillRect(endX + 2, y - 3, 10, 28);
    bridgeCtx.restore();
  }

  // 地形の質感用ノイズタイル(1度だけ生成し、繰り返しパターンとして焼き込む。点描だとムラや塊が
  // 出てしまうため、ピクセル単位のノイズタイルの方が均一な粒立ちになる)
  const noiseTile = document.createElement('canvas');
  noiseTile.width = 28;
  noiseTile.height = 28;
  (() => {
    const ntCtx = noiseTile.getContext('2d');
    const img = ntCtx.createImageData(28, 28);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() < 0.5 ? 0 : 255;
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v;
      img.data[i + 3] = Math.round(Math.random() * 46);
    }
    ntCtx.putImageData(img, 0, 0);
  })();

  // 判定用のグリッド(見た目のキャンバスとは別に、ロジック側で正確に持つ実体データ)。1=地面,0=空気
  let solidGrid = new Uint8Array(TERRAIN_COLS * ROWS);
  // 列ごとの「一番上にある地面のY」キャッシュ(接地判定・描画の草ラインに使用。掘削のたびに該当範囲だけ再走査)
  let surfaceY = new Float64Array(TERRAIN_COLS).fill(FLOOR_Y);

  function clampGround(y) {
    return Math.min(GROUND_MAX_Y, Math.max(GROUND_MIN_Y, y));
  }

  function drawTerrainDetails() {
    if (currentPattern === 'tieredBasin') {
      terrainCtx.save();
      terrainCtx.globalCompositeOperation = 'source-atop';

      // 黒鉄を埋め込んだ石造り。通常ステージの土・小石とは明確に見分けられる質感にする。
      const steelShade = terrainCtx.createLinearGradient(0, 0, STAGE_W, 0);
      steelShade.addColorStop(0, 'rgba(9,13,18,0.50)');
      steelShade.addColorStop(0.5, 'rgba(74,80,88,0.18)');
      steelShade.addColorStop(1, 'rgba(9,13,18,0.50)');
      terrainCtx.fillStyle = steelShade;
      terrainCtx.fillRect(0, 0, STAGE_W, VH);

      // 石組みの継ぎ目。
      terrainCtx.strokeStyle = 'rgba(8,10,14,0.62)';
      terrainCtx.lineWidth = 2;
      for (let y = 16; y < VH; y += 30) {
        terrainCtx.beginPath();
        terrainCtx.moveTo(0, y);
        terrainCtx.lineTo(STAGE_W, y);
        terrainCtx.stroke();
        const offset = (Math.floor(y / 30) % 2) * 24;
        for (let x = offset; x < STAGE_W; x += 48) {
          terrainCtx.beginPath();
          terrainCtx.moveTo(x, y - 30);
          terrainCtx.lineTo(x, y);
          terrainCtx.stroke();
        }
      }

      // 三段棚の上面は真鍮の縁と鋲で補強する。
      for (const shelf of ARENA_SHELVES) {
        terrainCtx.fillStyle = 'rgba(202,143,58,0.72)';
        terrainCtx.fillRect(0, shelf.y, STAGE_W, 4);
        terrainCtx.fillStyle = 'rgba(246,192,91,0.82)';
        for (let x = 12; x < STAGE_W; x += 28) {
          terrainCtx.beginPath();
          terrainCtx.arc(x, shelf.y + 8, 2, 0, Math.PI * 2);
          terrainCtx.fill();
        }
      }

      // 壁面の斜め補強帯。source-atopなので地形の内側だけに残る。
      terrainCtx.strokeStyle = 'rgba(116,126,139,0.32)';
      terrainCtx.lineWidth = 7;
      for (let x = -VH; x < STAGE_W + VH; x += 96) {
        terrainCtx.beginPath();
        terrainCtx.moveTo(x, VH);
        terrainCtx.lineTo(x + VH * 0.42, 0);
        terrainCtx.stroke();
      }
      terrainCtx.restore();
      return;
    }

    const fx = THEME_FX[currentThemeKey];
    const detailTop = 220;
    terrainCtx.save();
    terrainCtx.globalCompositeOperation = 'source-atop';

    // 地層の流れ。太いベタ線ではなく、ゆるい曲線を重ねて岩肌の奥行きを出す。
    terrainCtx.lineCap = 'round';
    terrainCtx.strokeStyle = fx.strata;
    terrainCtx.lineWidth = 2;
    for (let band = 0; band < 9; band++) {
      const baseY = detailTop + 26 + band * 44;
      terrainCtx.beginPath();
      for (let x = -20; x <= STAGE_W + 20; x += 18) {
        const y = baseY
          + Math.sin(x * 0.012 + band * 1.7 + parallaxSeed * 0.001) * 6
          + Math.sin(x * 0.031 + band) * 2;
        if (x === -20) terrainCtx.moveTo(x, y);
        else terrainCtx.lineTo(x, y);
      }
      terrainCtx.stroke();
    }

    // 小石と埋まった岩片。生成シードから位置を固定して、再描画時にも形が変わらないようにする。
    for (let i = 0; i < 150; i++) {
      const x = (i * 73.37 + parallaxSeed * 0.41) % STAGE_W;
      const y = detailTop + 18 + ((i * 47.19 + parallaxSeed * 0.17) % (VH - detailTop - 22));
      const rw = 2.4 + (i % 5) * 0.9;
      const rh = 1.5 + (i % 3) * 0.8;
      terrainCtx.save();
      terrainCtx.translate(x, y);
      terrainCtx.rotate(Math.sin(i * 2.13) * 0.75);
      terrainCtx.fillStyle = i % 3 === 0 ? fx.stoneLight : fx.stoneDark;
      terrainCtx.beginPath();
      terrainCtx.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2);
      terrainCtx.fill();
      if (i % 11 === 0) {
        terrainCtx.strokeStyle = fx.stoneLight;
        terrainCtx.lineWidth = 0.8;
        terrainCtx.beginPath();
        terrainCtx.moveTo(-rw * 0.65, 0);
        terrainCtx.lineTo(0, -rh * 0.45);
        terrainCtx.lineTo(rw * 0.55, rh * 0.18);
        terrainCtx.stroke();
      }
      terrainCtx.restore();
    }

    // 表面直下を少し明るくし、地面が一枚絵ではなく厚みのある断面に見えるようにする。
    const surfaceGlow = terrainCtx.createLinearGradient(0, detailTop, 0, detailTop + 320);
    surfaceGlow.addColorStop(0, 'rgba(255,255,255,0.11)');
    surfaceGlow.addColorStop(1, 'rgba(255,255,255,0)');
    terrainCtx.fillStyle = surfaceGlow;
    terrainCtx.fillRect(0, detailTop, STAGE_W, 320);
    terrainCtx.restore();
  }

  function buildTerrainMask(segments, refreshRim = true) {
    terrainCtx.clearRect(0, 0, STAGE_W, VH);
    terrainCtx.globalCompositeOperation = 'source-over';
    const grad = terrainCtx.createLinearGradient(0, GROUND_MIN_Y, 0, TERRAIN_BOTTOM_Y);
    if (currentPattern === 'tieredBasin') {
      grad.addColorStop(0, '#4c535d');
      grad.addColorStop(0.35, '#2c323b');
      grad.addColorStop(1, '#11151b');
    } else {
      grad.addColorStop(0, currentTheme.dirtTop);
      grad.addColorStop(1, currentTheme.dirtBottom);
    }
    terrainCtx.fillStyle = grad;
    solidGrid.fill(0);
    for (let c = 0; c < TERRAIN_COLS; c++) {
      const x = c * COL_W;
      for (const seg of segments[c]) {
        const top = seg[0], bottom = seg[1];
        if (bottom <= top) continue;
        terrainCtx.fillRect(x, top, COL_W + 0.6, bottom - top);
        const r0 = Math.max(0, Math.floor(top / ROW_H));
        const r1 = Math.min(ROWS - 1, Math.ceil(bottom / ROW_H));
        for (let r = r0; r <= r1; r++) solidGrid[r * TERRAIN_COLS + c] = 1;
      }
    }
    // 質感付け:ピクセル単位のノイズタイルを繰り返し焼き込んで単色塗りっぽさを消す
    // (点描だと粒がランダムに寄り集まって「塊」に見えてしまうため、均一なタイルパターンにする)
    terrainCtx.save();
    terrainCtx.globalCompositeOperation = 'source-atop';
    terrainCtx.fillStyle = terrainCtx.createPattern(noiseTile, 'repeat');
    terrainCtx.fillRect(0, 0, STAGE_W, VH);
    terrainCtx.restore();
    drawTerrainDetails();
    rebuildBridgeDecoration();
    rebuildArenaDecoration();
    if (refreshRim) rebuildTerrainRim();
  }

  // グリッド上の地面から、列ごとの最上段Yを再計算する(軽量。掘削のたびに影響範囲だけ呼ぶ)
  function rescanColumnsFromGrid(colFrom, colTo) {
    colFrom = Math.max(0, colFrom);
    colTo = Math.min(TERRAIN_COLS - 1, colTo);
    for (let c = colFrom; c <= colTo; c++) {
      let topRow = ROWS;
      for (let r = 0; r < ROWS; r++) {
        if (solidGrid[r * TERRAIN_COLS + c]) { topRow = r; break; }
      }
      surfaceY[c] = topRow >= ROWS ? FLOOR_Y : topRow * ROW_H;
    }
  }

  // 着弾クレーターの実処理:見た目(キャンバス)と判定(グリッド)の両方を円形にくり抜く
  function carveCraterInternal(cx, cy, radius, refreshRim = true) {
    terrainCtx.save();
    terrainCtx.globalCompositeOperation = 'destination-out';
    terrainCtx.beginPath();
    terrainCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    terrainCtx.fill();
    terrainCtx.restore();
    bridgeCtx.save();
    bridgeCtx.globalCompositeOperation = 'destination-out';
    bridgeCtx.beginPath();
    bridgeCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    bridgeCtx.fill();
    bridgeCtx.restore();
    arenaDecorationCtx.save();
    arenaDecorationCtx.globalCompositeOperation = 'destination-out';
    arenaDecorationCtx.beginPath();
    arenaDecorationCtx.arc(cx, cy, radius, 0, Math.PI * 2);
    arenaDecorationCtx.fill();
    arenaDecorationCtx.restore();

    const colFrom = Math.max(0, Math.floor((cx - radius) / COL_W));
    const colTo = Math.min(TERRAIN_COLS - 1, Math.ceil((cx + radius) / COL_W));
    const rowFrom = Math.max(0, Math.floor((cy - radius) / ROW_H));
    const rowTo = Math.min(ROWS - 1, Math.ceil((cy + radius) / ROW_H));
    const r2 = radius * radius;
    for (let c = colFrom; c <= colTo; c++) {
      const colCx = (c + 0.5) * COL_W;
      for (let r = rowFrom; r <= rowTo; r++) {
        const rowCy = (r + 0.5) * ROW_H;
        const dx = colCx - cx, dy = rowCy - cy;
        if (dx * dx + dy * dy <= r2) solidGrid[r * TERRAIN_COLS + c] = 0;
      }
    }
    rescanColumnsFromGrid(colFrom, colTo);
    if (refreshRim) rebuildTerrainRim();
    // ミニマップの地形は地形が変わった時だけ描き直す。毎フレームの全グリッド走査を避ける。
    minimapTerrainDirty = true;
  }

  let craterHistory = []; // 中断/再開のため、実発射で開いたクレーターを再生可能な形で記録
  function carveCrater(cx, cy, radius) {
    carveCraterInternal(cx, cy, radius);
    craterHistory.push({ x: cx, y: cy, r: radius });
  }

  function groundYAt(x) {
    const c = Math.min(TERRAIN_COLS - 1, Math.max(0, Math.floor(x / COL_W)));
    return surfaceY[c];
  }

  // 弾の直撃判定用:列の最上段ではなく、その座標そのものに地面があるかを正確に見る
  // (浮島の下の空間などで「列の最上段=島の上」を基準にすると何もない場所で爆発してしまうため)
  // 闘技場の外壁は画面上端まで絵で伸ばしてある(drawArenaWallExtension)。弾がそこを
  // すり抜けると、見えている壁を通り抜けたように見える。絵と同じ範囲を弾に対して塞ぐ。
  // 地形キャンバスは y=0 から下にしか無いので**ここは削れない**。上端より上は
  // 壊れない岩盤、という割り切り(2026-07-29にユーザーと合意)。
  // 定数はファイル後方で定義しているが、呼ばれるのは初期化後なので参照できる。
  function arenaWallSolidAbove(x, y) {
    if (currentPattern !== 'tieredBasin') return false;
    if (y >= 0 || y < -ARENA_WALL_SKY_EXTENSION) return false;
    const wallW = STAGE_W * ARENA_WALL_RATIO;
    return x < wallW || x >= STAGE_W - wallW;
  }
  function isSolidAt(x, y) {
    // 上端より上は元から早期returnしていた経路。ここに壁の判定を1つ足すだけなので、
    // 通常の飛行中や地上付近では比較が1つも増えない。
    if (y < 0) return arenaWallSolidAbove(x, y);
    if (y >= VH) return false;
    const c = Math.min(TERRAIN_COLS - 1, Math.max(0, Math.floor(x / COL_W)));
    const r = Math.min(ROWS - 1, Math.max(0, Math.floor(y / ROW_H)));
    return solidGrid[r * TERRAIN_COLS + c] === 1;
  }

  // 骨格パターン: 片方が高台/中央に山/谷底スタート/なだらか
  function baseCurve(pattern, t) {
    // t: 0..1 (左端から右端)。yは小さいほど浅い(高い地形)、大きいほど深い(低い地形)
    const mid = (GROUND_MIN_Y + GROUND_MAX_Y) / 2;
    const range = GROUND_MAX_Y - GROUND_MIN_Y;
    switch (pattern) {
      case 'plateauLeft':
        // 左が高台(浅い)、右が低地
        return GROUND_MIN_Y + range * smoothstep(t, 0.25, 0.75);
      case 'plateauRight':
        // 右が高台(浅い)、左が低地
        return GROUND_MAX_Y - range * smoothstep(t, 0.25, 0.75);
      case 'mountainCenter':
        // 中央が山(浅い)、両端が低地(深い)
        return GROUND_MAX_Y - range * Math.sin(Math.PI * t);
      case 'valley':
        // 中央が谷(深い)、両端が高台(浅い)
        return GROUND_MIN_Y + range * Math.sin(Math.PI * t);
      case 'tieredBasin': {
        // 横に広げた「臼」型。外周高台→中段テラス→中央谷底の順に下がる。
        const fromCenter = Math.abs(t - 0.5);
        const highY = GROUND_MIN_Y + range * 0.05;
        const terraceY = GROUND_MIN_Y + range * 0.43;
        const basinY = GROUND_MAX_Y - range * 0.03;
        if (fromCenter >= 0.38) return highY;
        // 斜面を短く、平らな段を長くして、ズーム中でも3階層を読み取りやすくする。
        if (fromCenter >= 0.34) {
          const blend = smoothstep(fromCenter, 0.34, 0.38);
          return terraceY + (highY - terraceY) * blend;
        }
        if (fromCenter >= 0.22) return terraceY;
        const blend = smoothstep(fromCenter, 0.15, 0.22);
        return basinY + (terraceY - basinY) * blend;
      }
      case 'bridge':
        // 橋用。左右の岸を近い高さにそろえ、中央へ細い足場を架けやすくする
        return mid + Math.sin(t * Math.PI * 2) * range * 0.045;
      case 'rolling':
      default:
        return mid;
    }
  }

  function smoothstep(t, a, b) {
    const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
    return x * x * (3 - 2 * x);
  }

  // 中点変位法で乱数揺らぎを加える(滑らかなノイズ)
  function midpointDisplacement(n, roughness) {
    const size = 1;
    let arr = new Float64Array(n + 1);
    arr[0] = (Math.random() - 0.5) * 2;
    arr[n] = (Math.random() - 0.5) * 2;
    let step = n;
    let scale = 1;
    while (step > 1) {
      const half = step / 2;
      for (let i = half; i < n; i += step) {
        const left = arr[i - half];
        const right = arr[i + half];
        arr[i] = (left + right) / 2 + (Math.random() - 0.5) * 2 * scale;
      }
      step = half;
      scale *= roughness;
    }
    return arr;
  }

  // スポーン地点(左15%/右85%)の列。ランダム地形イベントがここに重ならないよう避ける
  const SPAWN_COLS = [Math.round(STAGE_W * 0.15 / COL_W), Math.round(STAGE_W * 0.85 / COL_W)];
  function overlapsSpawn(start, len, margin) {
    const end = start + len;
    return SPAWN_COLS.some(sc => sc + margin >= start && sc - margin <= end);
  }

  function applyNaturalThinFloor(segments, hm, start, len, baseDepth) {
    const shoulder = Math.max(5, Math.floor(len * 0.3));
    const phase = Math.random() * Math.PI * 2;
    for (let i = 0; i < len; i++) {
      const c = start + i;
      if (c < 0 || c >= TERRAIN_COLS) continue;

      // 両端では通常の地面の厚さを保ち、中央へ向けて洞窟状になだらかに薄くする。
      const edgeDistance = Math.min(i, len - 1 - i);
      const thinBlend = smoothstep(edgeDistance, 0, shoulder);
      const organicDepth = baseDepth * (0.95 + Math.sin(i * 0.52 + phase) * 0.05);
      const fullDepth = TERRAIN_BOTTOM_Y - hm[c];
      const depth = fullDepth + (organicDepth - fullDepth) * thinBlend;
      segments[c] = [[hm[c], Math.min(TERRAIN_BOTTOM_Y, hm[c] + depth)]];
    }
  }

  const ISLAND_SHAPES = ['lens', 'long', 'jagged', 'mesa'];
  function addFloatingIsland(segments, start, len, islandTop, thickness, shape, phase) {
    for (let i = 0; i < len; i++) {
      const c = start + i;
      if (c < 0 || c >= TERRAIN_COLS) continue;
      const t = (i + 0.5) / len;
      const taper = Math.sin(t * Math.PI);
      if (taper < 0.08) continue;

      let topOffset = 0;
      let depth = thickness;
      if (shape === 'lens') {
        topOffset = (1 - taper) * thickness * 0.28;
        depth = Math.max(8, thickness * (0.35 + taper * 0.65));
      } else if (shape === 'long') {
        topOffset = Math.sin(t * Math.PI * 4 + phase) * 2;
        depth = Math.max(10, thickness * (0.7 + taper * 0.2) + Math.sin(t * 9 + phase) * 3);
      } else if (shape === 'jagged') {
        topOffset = (1 - taper) * 9 + Math.sin(t * 12 + phase) * 3.5;
        depth = Math.max(9, thickness * (0.52 + taper * 0.48) + Math.sin(t * 17 + phase) * 5);
      } else {
        // mesa:中央は平らで、両端だけ丸くすぼむ大型足場向け
        const edge = Math.max(0, (0.2 - Math.min(t, 1 - t)) / 0.2);
        topOffset = edge * 8;
        depth = Math.max(10, thickness * (0.72 + taper * 0.28));
      }

      const top = islandTop + topOffset;
      segments[c] = [[top, top + depth], ...segments[c]];
    }
  }

  const ARENA_WALL_RATIO = 0.095;
  const ARENA_SHELVES = Object.freeze([
    Object.freeze({ y: 365, bottom: 387, reach: 0.205 }),
    Object.freeze({ y: 445, bottom: 468, reach: 0.235 }),
    Object.freeze({ y: 525, bottom: 549, reach: 0.265 })
  ]);

  // 左右の外壁から3本ずつ棚が内側へ伸び、中央下部は完全な奈落になる闘技場マップ。
  // 高さ1本のハイトマップでは庇の下の空間を表現できないため、列ごとの複数区間で専用構築する。
  function buildMortarShelfTerrain(segments, hm) {
    // 外壁は画面上端より先まで続くため、上に乗れる「台座」にはならない。
    const wallTop = 0;
    const wallBottom = 625;
    // 上段＜中段＜下段の順で少しずつ長くし、中央へ歩けば一段下の棚へ降りられるようにする。

    for (let c = 0; c < TERRAIN_COLS; c++) {
      const t = c / (TERRAIN_COLS - 1);
      const edgeDistance = Math.min(t, 1 - t);
      const columnSegments = [];

      if (edgeDistance <= ARENA_WALL_RATIO) {
        // 外壁は画面上端から底まで一枚の塊。ここへ各棚が横からつながる。
        columnSegments.push([wallTop, wallBottom]);
      } else {
        for (const shelf of ARENA_SHELVES) {
          if (edgeDistance <= shelf.reach) columnSegments.push([shelf.y, shelf.bottom]);
        }
      }

      segments[c] = columnSegments;
      hm[c] = columnSegments.length ? columnSegments[0][0] : FLOOR_Y;
    }
  }

  function generateTerrain(pattern) {
    // 闘技場マップは少し出やすくして、横長ステージの階層戦を体験しやすくする。
    const patterns = ['plateauLeft', 'plateauRight', 'mountainCenter', 'valley', 'rolling', 'bridge', 'tieredBasin', 'tieredBasin'];
    const p = pattern || patterns[Math.floor(Math.random() * patterns.length)];

    // 中点変位のnは2の冪にする必要があるため、近い2の冪を使い後でリサンプル
    let pow = 1;
    while (pow < TERRAIN_COLS) pow *= 2;
    const noiseRaw = midpointDisplacement(pow, 0.55);
    const noiseAmp = p === 'bridge' ? 9 : p === 'tieredBasin' ? 11 : 26; // 橋と階層地形は輪郭を読みやすくする

    const hm = new Float64Array(TERRAIN_COLS);
    for (let i = 0; i < TERRAIN_COLS; i++) {
      const t = i / (TERRAIN_COLS - 1);
      const base = baseCurve(p, t);
      const noiseIdx = t * pow;
      const i0 = Math.floor(noiseIdx);
      const i1 = Math.min(pow, i0 + 1);
      const frac = noiseIdx - i0;
      const noiseVal = noiseRaw[i0] * (1 - frac) + noiseRaw[i1] * frac;
      hm[i] = clampGround(base + noiseVal * noiseAmp);
    }
    // 両端を少しなだらかに(プレイヤー初期足場を安定させる)
    for (let i = 0; i < 8; i++) {
      const wL = i / 8;
      hm[i] = hm[i] * wL + hm[8] * (1 - wL);
      const j = TERRAIN_COLS - 1 - i;
      hm[j] = hm[j] * wL + hm[TERRAIN_COLS - 9] * (1 - wL);
    }

    // 各列の中身(地面の実区間リスト)。基本は地表〜床までの単一の塊
    const segments = [];
    for (let c = 0; c < TERRAIN_COLS; c++) segments.push([[hm[c], TERRAIN_BOTTOM_Y]]);

    const midStart = 14, midEnd = TERRAIN_COLS - 14;
    let bridge = null;

    // 橋ステージ:既存の薄床地形に、長さが毎回変わる橋イラストを重ねる。
    if (p === 'bridge') {
      const bridgeLen = 30 + Math.floor(Math.random() * 61); // 約90〜270px
      const rawStart = Math.floor(TERRAIN_COLS / 2 - bridgeLen / 2 + (Math.random() - 0.5) * 28);
      const bridgeStart = Math.max(midStart + 18, Math.min(midEnd - bridgeLen - 18, rawStart));
      const leftY = hm[Math.max(0, bridgeStart - 1)];
      const rightY = hm[Math.min(TERRAIN_COLS - 1, bridgeStart + bridgeLen)];
      const bridgeY = clampGround((leftY + rightY) / 2 - 4);
      // 当たり判定に必要な最小限の薄さだけ残し、見た目は橋の板と桁が足場になる。
      const thinDepth = 8 + Math.random() * 5;
      for (let i = 0; i < bridgeLen; i++) {
        const c = bridgeStart + i;
        if (c < midStart || c >= midEnd) continue;
        hm[c] = bridgeY;
        segments[c] = [[bridgeY, bridgeY + thinDepth]];
      }
      bridge = {
        startX: bridgeStart * COL_W,
        endX: (bridgeStart + bridgeLen) * COL_W,
        y: bridgeY,
        style: Math.random() < 0.5 ? 'timber' : 'rope',
        seed: Math.random() * 1000
      };
    // 闘技場マップはランダムな斜面ではなく、中央が奈落になった左右三段棚の専用シルエットに置き換える。
    } else if (p === 'tieredBasin') {
      buildMortarShelfTerrain(segments, hm);
    } else if (Math.random() < 0.35) {
      const zoneLen = 18 + Math.floor(Math.random() * 20);
      const zoneStart = midStart + Math.floor(Math.random() * Math.max(1, midEnd - midStart - zoneLen));
      if (!overlapsSpawn(zoneStart, zoneLen, 20)) {
        const thinDepth = 34 + Math.random() * 22;
        const actualLen = Math.min(zoneLen, midEnd - zoneStart);
        applyNaturalThinFloor(segments, hm, zoneStart, actualLen, thinDepth);
      }
    }

    // 浮島ゾーン。崖・薄床の有無とは完全に独立して抽選し、連続した普通の地面の上にも出現する。
    // 下の地面は必ず残すので、島と同じ幅の縦穴や崖は作らない。
    const floatingIslandCount = p === 'tieredBasin'
      ? 0
      : (Math.random() < 0.58 ? (Math.random() < 0.22 ? 2 : 1) : 0);
    const floatingIslandRanges = [];
    for (let islandIndex = 0; islandIndex < floatingIslandCount; islandIndex++) {
      const sizeRoll = Math.random();
      const islandLen = sizeRoll < 0.22
        ? 10 + Math.floor(Math.random() * 10)
        : sizeRoll < 0.55
          ? 38 + Math.floor(Math.random() * 25)
          : 20 + Math.floor(Math.random() * 18);
      let islandStart = -1;
      for (let attempt = 0; attempt < 8; attempt++) {
        const candidate = midStart + Math.floor(Math.random() * Math.max(1, midEnd - midStart - islandLen));
        const overlapsOtherIsland = floatingIslandRanges.some(r => candidate < r.end + 10 && candidate + islandLen > r.start - 10);
        if (!overlapsSpawn(candidate, islandLen, 20) && !overlapsOtherIsland) {
          islandStart = candidate;
          break;
        }
      }
      if (islandStart >= 0) {
        let localMinY = Infinity;
        for (let c = islandStart; c < islandStart + islandLen && c < midEnd; c++) localMinY = Math.min(localMinY, hm[c]);
        const gap = 70 + Math.random() * 220; // 近い(二段地形)〜遠い(独立浮島)まで幅を持たせる
        const shape = ISLAND_SHAPES[Math.floor(Math.random() * ISLAND_SHAPES.length)];
        const islandThickness = shape === 'long' ? 18 + Math.random() * 20 : 24 + Math.random() * 34;
        const islandTop = Math.max(120, localMinY - gap - islandThickness);
        addFloatingIsland(segments, islandStart, islandLen, islandTop, islandThickness, shape, Math.random() * Math.PI * 2);
        floatingIslandRanges.push({ start: islandStart, end: islandStart + islandLen });
      }
    }

    // 空洞(山の内部の未露出の空間。着弾で偶然開通することがある)
    // レンズ状に丸くすぼませ、縁も波打たせることで、四角い穴に見えないようにする
    if (p !== 'tieredBasin' && Math.random() < 0.3) {
      const cavernLen = 22 + Math.floor(Math.random() * 16);
      const cavernStart = midStart + Math.floor(Math.random() * Math.max(1, midEnd - midStart - cavernLen));
      if (!overlapsSpawn(cavernStart, cavernLen, 20)) {
        const cavernCy = GROUND_MIN_Y + 100 + Math.random() * 80;
        const cavernHalfH = 42 + Math.random() * 26;
        const wobbleAmp = 8 + Math.random() * 8;
        const phase = Math.random() * Math.PI * 2;
        for (let i = 0; i < cavernLen; i++) {
          const c = cavernStart + i;
          if (c >= midEnd) break;
          const groundIndex = segments[c].length - 1;
          const seg = segments[c][groundIndex];
          const t = i / (cavernLen - 1);
          const taper = Math.sin(t * Math.PI); // 両端でゼロ→中央で1(レンズ状に丸くすぼめる)
          if (taper < 0.1) continue; // 端は開けずに閉じておく
          const wobble = Math.sin(t * 7 + phase) * wobbleAmp;
          const halfH = cavernHalfH * taper;
          const top = cavernCy - halfH + wobble * 0.5;
          const bottom = Math.min(seg[1] - 20, cavernCy + halfH + wobble * 0.5);
          if (bottom > top + 12 && top > seg[0] + 15) {
            segments[c] = [...segments[c].slice(0, groundIndex), [seg[0], top], [bottom, seg[1]]];
          }
        }
      }
    }

    // スタート地点浮島(たまにプレイヤー/CPUの出現位置そのものが浮島になる)。
    // 真下の通常地面は消さずに残し、不自然な島幅ぴったりの縦穴を作らない。
    let startOnIsland = false;
    if (p !== 'tieredBasin' && Math.random() < 0.18) {
      startOnIsland = true;
      for (const sx of [STAGE_W * 0.15, STAGE_W * 0.85]) {
        const cCenter = Math.round(sx / COL_W);
        const islandLen = 18 + Math.floor(Math.random() * 18);
        const islandStart = cCenter - Math.floor(islandLen / 2);
        const islandTop = GROUND_MIN_Y - 90 - Math.random() * 50;
        const islandThickness = 28 + Math.random() * 18;
        const shape = ['mesa', 'lens', 'jagged'][Math.floor(Math.random() * 3)];
        addFloatingIsland(segments, islandStart, islandLen, islandTop, islandThickness, shape, Math.random() * Math.PI * 2);
      }
    }

    return { pattern: p, segments, startOnIsland, bridge };
  }

  let currentPattern = null;
  let startOnIsland = false;
  let currentBridge = null;
  let currentSegments = null; // 中断/再開用に、生成直後(未破壊)の地形を保持しておく
  let arenaObstacles = []; // 闘技場中央に鎖で吊るす、砲弾だけを遮る障害物
  let simTimeMs = 0;       // 対戦開始からの経過時間。障害物の揺れの基準に使う

  function rebuildArenaObstacles() {
    arenaObstacles = [];
    if (currentPattern !== 'tieredBasin') return;

    // parallaxSeedから毎試合同じ配置を復元できる疑似乱数を作る。
    let state = (Math.floor(parallaxSeed * 1000) ^ 0x9e3779b9) >>> 0;
    const random = () => {
      state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
      return state / 4294967296;
    };
    const count = 2 + Math.floor(random() * 2);
    const minX = STAGE_W * 0.34;
    const maxX = STAGE_W * 0.66;
    const slotW = (maxX - minX) / count;
    for (let i = 0; i < count; i++) {
      const x = minX + slotW * (i + 0.28 + random() * 0.44);
      arenaObstacles.push({
        x,
        anchorX: x + (random() - 0.5) * 70,
        anchorY: 92 + random() * 34,
        y: 238 + random() * 188,
        radius: 22 + Math.floor(random() * 7),
        sway: 9 + random() * 9,
        phase: random() * Math.PI * 2,
        shape: random() < 0.55 ? 'ball' : 'block'
      });
    }
  }

  // 物理判定で使う距離。Math.hypot はエンジンごとに最終桁が変わり得るが、
  // Math.sqrt は IEEE-754 で正しく丸めることが保証されているため、端末が違っても
  // 必ず同じ値になる。しきい値の比較は平方根を取らず二乗のまま行う(Issue #9)。
  function simDistance(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // 闘技場の外壁より内側へ寄せる。壁の中や壁の上へキャラを置かないための共通処理。
  function clampInsideArenaWall(x) {
    if (currentPattern !== 'tieredBasin') return x;
    const wallW = STAGE_W * ARENA_WALL_RATIO;
    const margin = UNIT_RADIUS + 4;
    return Math.min(STAGE_W - wallW - margin, Math.max(wallW + margin, x));
  }

  function arenaObstaclePosition(obstacle, nowMs = simTimeMs) {
    // Math.sin もエンジンごとに最終桁が変わり得る。ここは砲弾の衝突判定に使う位置なので、
    // 1/64px 単位へ丸めて端末差が当たり外れを変えないようにする(Issue #9)。
    const sway = Math.round(Math.sin(nowMs * 0.00072 + obstacle.phase) * obstacle.sway * 64) / 64;
    return { x: obstacle.x + sway, y: obstacle.y };
  }

  function hitArenaObstacle(x, y, radius = 0) {
    if (currentPattern !== 'tieredBasin') return null;
    const now = simTimeMs;
    for (const obstacle of arenaObstacles) {
      const p = arenaObstaclePosition(obstacle, now);
      const dx = x - p.x, dy = y - p.y, reach = obstacle.radius + radius;
      if (dx * dx + dy * dy <= reach * reach) {
        return { obstacle, x: p.x, y: p.y };
      }
    }
    return null;
  }

  function newTerrain(pattern) {
    currentThemeKey = THEME_KEYS[Math.floor(Math.random() * THEME_KEYS.length)];
    currentTheme = THEMES[currentThemeKey];
    parallaxSeed = Math.random() * 10000;
    const r = generateTerrain(pattern);
    currentPattern = r.pattern;
    rebuildArenaObstacles();
    currentSegments = r.segments;
    currentBridge = r.bridge || null;
    craterHistory = [];
    buildTerrainMask(r.segments);
    rescanColumnsFromGrid(0, TERRAIN_COLS - 1);
    minimapTerrainDirty = true;
    startOnIsland = r.startOnIsland;
    updateDebug();
  }

  // 中断データからの地形復元:未破壊の地形を作り直し、記録しておいたクレーターを同じ順で開け直す
  function loadTerrainFromSave(segments, craters, pattern, wasStartOnIsland, themeKey, savedParallaxSeed, savedBridge) {
    currentThemeKey = themeKey && THEMES[themeKey] ? themeKey : 'grass';
    currentTheme = THEMES[currentThemeKey];
    parallaxSeed = savedParallaxSeed || 0;
    currentPattern = pattern;
    rebuildArenaObstacles();
    currentSegments = segments;
    currentBridge = savedBridge || null;
    buildTerrainMask(segments, false);
    rescanColumnsFromGrid(0, TERRAIN_COLS - 1);
    for (const cr of craters) carveCraterInternal(cr.x, cr.y, cr.r, false);
    rebuildTerrainRim();
    minimapTerrainDirty = true;
    craterHistory = craters.slice();
    startOnIsland = wasStartOnIsland;
    updateDebug();
  }

  // ===== キャラクター =====
