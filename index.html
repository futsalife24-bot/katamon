    } catch (err) {
      if (online) online.protocolError = '安全な確認処理に失敗しました';
      onlineLobbyStatus('この端末では安全な確認処理を使えません。');
    }
  }

  function setSelfNotReady() {
    if (!online || online.kind !== 'firebase' || online.phase !== 'lobby' || !online.selfReady) return;
    online.selfReady = false;
    online.selfCommit = null;
    online.selfRevealed = false;
    netSend({ t: 'ready', value: false });
    onlineLobbyStatus('準備完了を取り消しました。モンスターを選び直せます。');
    renderFirebaseLobby();
  }
  function maybeRevealCharacter() {
    if (!online || online.kind !== 'firebase' || !online.selfCommit || !online.peerCommitted || online.selfRevealed || online.phase !== 'revealing') return;
    online.selfRevealed = true;
    netSend({ t: 'reveal', character: online.selfCharacter, nonce: online.selfNonce });
    onlineLobbyStatus('相手のモンスターを検証しています…');
  }
  async function verifyPeerReveal(msg) {
    if (!online || online.kind !== 'firebase') return;
    if (!acceptPeerReveal(online.peerRevealSeen)) { rejectFirebaseMessage('相手が選択内容を重複公開しました'); return; }
    online.peerRevealSeen = true;
    if (!CHARACTER_LIST.includes(msg.character) || typeof msg.nonce !== 'string' || msg.nonce.length < 24) {
      online.protocolError = '相手の選択データが不正です'; onlineLobbyStatus(online.protocolError); return;
    }
    try {
      const expected = await commitPayload(msg.character, msg.nonce);
      if (!online || expected !== online.peerCommit) {
        if (online) { online.protocolError = 'キャラクター確認が一致しません'; onlineLobbyStatus(online.protocolError); }
        return;
      }
      online.peerCharacter = msg.character;
      online.peerNonce = msg.nonce;
      online.revealVerified = true;
      onlineLobbyStatus('確認完了。開始データを待っています…');
      if (online.pendingStart) {
        const pendingStart = online.pendingStart;
        online.pendingStart = null;
        applyNetMessage(pendingStart);
      }
      maybeStartFirebaseMatch();
    } catch (_) { if (online) { online.protocolError = '確認処理に失敗しました'; onlineLobbyStatus(online.protocolError); } }
  }
  async function maybeStartFirebaseMatch() {
    if (!online || online.kind !== 'firebase' || online.role !== 'host' || !online.revealVerified || !online.selfRevealed || online.matchStarted) return;
    try {
      player.character = online.selfCharacter;
      cpu.character = online.peerCharacter;
      stopTitleBgm(); gamePhase = 'battle'; resetMatch(false);
      const first = await fairFirstPlayer(online.room, online.selfNonce, online.peerNonce);
      if (!online || online.kind !== 'firebase') return;
      activeIndex = first === 'p1' ? 0 : 1;
      // resetMatch はCPU戦の前提でユニットを組み直す。オンラインでは席を貼り直す必要がある。
      setOnlineSeat(online.seat);
      logSeatAssignment('hostStart');
      online.phase = 'starting';
      await firebaseRequest(`rooms/${online.room}/round`, online.auth, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'playing' }) });
      const snap = buildSnapshot();
      if (online.transport.saveSnapshot) await online.transport.saveSnapshot(snap);
      const startSent = await netSend({ t: 'start', snap });
      if (startSent !== true) throw new Error('Match start could not be sent.');
      online.matchStarted = true;
      closeOnlineLobby();
    } catch (_) { if (online) { online.protocolError = '開始データを作れませんでした'; onlineLobbyStatus(online.protocolError); } }
  }
  async function applyFirebaseStart(msg) {
    if (!online || online.kind !== 'firebase' || online.participantRole !== 'player' || online.role === 'host' || online.phase === 'playing' || online.startVerifying || !online.revealVerified) return;
    online.startVerifying = true;
    try {
      // ゲスト側も同じnonce列から先攻を再計算し、ホストのスナップショットを検証する。
      const first = await fairFirstPlayer(online.room, online.peerNonce, online.selfNonce);
      const chars = Array.isArray(msg.snap && msg.snap.units) ? msg.snap.units : [];
      const hostChar = chars.find(u => u && u.id === 'p1');
      const guestChar = chars.find(u => u && u.id === 'e1');
      if (!online || online.kind !== 'firebase' || !msg.snap || Number(msg.snap.activeIndex) !== (first === 'p1' ? 0 : 1)
          || !hostChar || !guestChar || hostChar.character !== online.peerCharacter || guestChar.character !== online.selfCharacter) {
        if (online) { online.startVerifying = false; online.protocolError = '先攻確認が一致しません'; onlineLobbyStatus(online.protocolError); }
        return;
      }
      applySnapshot(msg.snap);
      setOnlineSeat(online.seat);
      logSeatAssignment('guestStart');
      battleMode = 'normal'; stopTitleBgm(); gamePhase = 'battle'; playStageBgm(currentThemeKey, true);
      online.phase = 'playing';
      online.startVerifying = false;
      netSend({ t: 'ready' });
      closeOnlineLobby();
    } catch (_) { if (online) { online.startVerifying = false; online.protocolError = '開始確認に失敗しました'; onlineLobbyStatus(online.protocolError); } }
  }

  function renderFirebaseLobby() {
    if (!online || online.kind !== 'firebase') return;
    const slots = online.slots || {};
    if (onlineSlotsEl) onlineSlotsEl.textContent = FIREBASE_SEATS.map(seat => {
      const occupied = slots[seat] && slots[seat].uid;
      const mine = occupied === online.clientId ? ' あなた' : '';
      const state = seat === 'p1' || seat === 'e1' ? (seat === online.seat && online.selfReady ? ' 準備完了' : seat === online.peerSeat && online.peerReady ? ' 準備完了' : '') : '';
      const name = occupied ? firebaseSeatName(seat) : '';
      const who = occupied ? (name || '参加中') : '空席';
      return `${firebaseSeatLabel(seat)}: ${who}${mine}${state}`;
    }).join('\n');
    // 相手が準備完了でもホストは設定を変えられる。変えられたら相手は準備完了を取り消して選び直せる。
    const canEdit = isFirebaseHost() && online.phase === 'lobby';
    if (onlineTerrainEl) onlineTerrainEl.value = online.settings.terrain;
    if (onlineWindEl) onlineWindEl.value = online.settings.wind;
    if (onlineTurnsEl) onlineTurnsEl.value = String(online.settings.turnsPerPlayer);
    [onlineTerrainEl, onlineWindEl, onlineTurnsEl].forEach(el => { if (el) el.disabled = !canEdit; });
    if (onlineCharacterEl) onlineCharacterEl.disabled = !isFirebasePlayer() || online.selfReady || online.phase !== 'lobby';
    if (onlineReadyBtn) {
      onlineReadyBtn.disabled = !isFirebasePlayer() || online.phase !== 'lobby';
      onlineReadyBtn.textContent = online.selfReady ? '準備完了を取り消す' : '準備完了';
    }
    if (onlineStartBtn) onlineStartBtn.disabled = !isFirebaseHost() || !online.selfReady || !online.peerReady || online.phase !== 'lobby';
    const hasResultVote = Object.prototype.hasOwnProperty.call(online.rematchVotes || {}, online.seat);
    if (onlineRematchBtn) onlineRematchBtn.disabled = !isFirebasePlayer() || online.phase !== 'results' || hasResultVote || !!online.roundResetting;
    if (onlineReturnLobbyBtn) onlineReturnLobbyBtn.disabled = !isFirebasePlayer() || online.phase !== 'results' || hasResultVote || !!online.roundResetting;
  }
  function applyFirebaseLobbyState(msg) {
    if (!online || online.kind !== 'firebase') return;
    if (msg.seat !== 'p1') return;
    rememberFirebaseName(msg);
    if (msg.slots && typeof msg.slots === 'object') online.slots = msg.slots;
    if (msg.settings && typeof msg.settings === 'object') online.settings = normalizeLobbySettings(msg.settings);
    if (msg.status === 'revealing') { online.phase = 'revealing'; maybeRevealCharacter(); }
    else if (msg.status === 'lobby') { if (msg.nextRoundId) { online.currentRoundId = msg.nextRoundId; online.transport.setRoundId(msg.nextRoundId); online.transport.reconnect(); } resetLocalFirebaseRoundState(msg.autoReady === true); openFirebaseLobby(); }
    renderFirebaseLobby();
  }
  function resetLocalFirebaseRoundState(autoReady) {
    if (!online || online.kind !== 'firebase') return;
    logSeatAssignment('roundReset');
    online.phase = 'lobby'; online.selfReady = false; online.peerReady = false;
    online.selfCharacter = selectedOnlineCharacter();
    online.selfNonce = secureNonce(); online.selfCommit = null; online.selfRevealed = false;
    online.peerCommit = null; online.peerCommitted = false; online.peerRevealSeen = false;
    online.peerCharacter = null; online.peerNonce = null; online.revealVerified = false;
    // 初戦の開始確認フラグを残すと、再戦のstartが「確認中」と誤判定されて無言で捨てられる。
    online.matchStarted = false; online.resultSent = false; online.remoteAction = null; online.localAction = null; online.pendingStart = null; online.startVerifying = false;
    online.pendingRemoteTerminals.clear(); online.completedRemoteActions.clear(); online.rematchVotes = {};
    online.autoStartNextRound = !!autoReady;
    if (autoReady && isFirebasePlayer()) commitOwnCharacter();
  }
  async function refreshFirebaseRoster(broadcast) {
    if (!online || online.kind !== 'firebase') return;
    try {
      const room = await firebaseRequest(`rooms/${online.room}`, online.auth);
      if (!online || !room) return;
      online.slots = room.slots || online.slots;
      online.settings = normalizeLobbySettings(room.settings || online.settings);
      if (broadcast && isFirebaseHost()) netSend({ t: 'lobbyState', status: online.phase, slots: online.slots, settings: online.settings, name: localPlayerName() });
      renderFirebaseLobby();
    } catch (_) { /* SSEは継続し、次のpresenceで再試行する */ }
  }
  function maybeAutoStartFirebaseRound() {
    if (!isFirebaseHost() || !online.autoStartNextRound || online.phase !== 'lobby' || !online.selfReady || !online.peerReady || !online.peerCommitted) return;
    online.autoStartNextRound = false;
    requestFirebaseStart();
  }
  function applyFirebaseSpectatorSnapshot(msg) {
    if (!online || online.kind !== 'firebase' || !msg.snap) return;
    applySnapshot(msg.snap);
    // 観戦者には操作権を与えない。ローカル席をp1へ戻して入力ガードで完全に止める。
    setOnlineSeat('p1');
    battleMode = 'normal'; gamePhase = 'battle'; online.phase = 'playing'; closeOnlineLobby();
  }
  function receiveFirebaseSpectatorResult(msg) {
    if (!online || online.kind !== 'firebase') return;
    matchOver = true; winner = msg.winner; projectiles = []; awaitingResolve = false; online.phase = 'results';
    beginMatchEnd(msg.reason); scheduleFirebaseResultsLobby();
  }
  async function updateFirebaseSettings() {
    // ここのガードを canEdit と揃える。片方だけ直すと「選べるのに送られない」状態になる。
    if (!isFirebaseHost() || online.phase !== 'lobby') return;
    const settings = normalizeLobbySettings({ terrain: onlineTerrainEl && onlineTerrainEl.value, wind: onlineWindEl && onlineWindEl.value, turnsPerPlayer: onlineTurnsEl && onlineTurnsEl.value, revision: (online.settings.revision || 0) + 1 });
    await firebaseRequest(`rooms/${online.room}/settings`, online.auth, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings) });
    online.settings = settings; netSend({ t: 'settings', settings }); renderFirebaseLobby();
  }
  async function requestFirebaseStart() {
    if (!isFirebaseHost() || online.phase !== 'lobby' || !online.selfReady || !online.peerReady || !online.peerCommitted) return;
    try {
      await refreshFirebaseRoster(false);
      const players = { p1: online.clientId, e1: online.slots.e1 && online.slots.e1.uid || null };
      if (!players.e1) { onlineLobbyStatus('対戦者の入室を確認できません。'); return; }
      await firebaseRequest(`rooms/${online.room}/round`, online.auth, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'revealing', players }) });
      online.phase = 'revealing'; netSend({ t: 'lobbyState', status: 'revealing', slots: online.slots, settings: online.settings }); maybeRevealCharacter(); renderFirebaseLobby();
    } catch (_) { onlineLobbyStatus('開始状態を更新できませんでした。'); }
  }
  async function requestFirebaseRematch() {
    if (!isFirebasePlayer() || online.phase !== 'results') return;
    online.rematchVotes[online.seat] = true; netSend({ t: 'rematchVote', vote: true }); renderFirebaseLobby();
    if (isFirebaseHost() && online.rematchVotes.p1 && online.rematchVotes.e1) await resetFirebaseRound(true);
  }
  async function requestFirebaseReturnLobby() {
    if (!isFirebasePlayer() || online.phase !== 'results') return;
    online.rematchVotes[online.seat] = false;
    netSend({ t: 'rematchVote', vote: false }); renderFirebaseLobby();
    if (isFirebaseHost()) await resetFirebaseRound(false);
  }
  async function resetFirebaseRound(autoReady) {
    if (!isFirebaseHost() || online.roundResetting) return;
    online.roundResetting = true;
    renderFirebaseLobby();
    const leavingRoundId = online.currentRoundId;
    const nextId = firebaseRoundId();
    try {
      // 先に新round実体とroomのポインタを確定する。失敗時は誰も不存在roundへ切り替えない。
      // RTDBが空roundを消さないよう、次roundにも必ず具体値のcreatedAtを保存する。
      await firebaseRequest(`rooms/${online.room}/rounds/${nextId}`, online.auth, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ createdAt: firebaseServerNow(online.auth), latestSnapshot: null, messages: {} }) });
      await firebaseRequest(`rooms/${online.room}/round`, online.auth, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: nextId, status: 'lobby', players: { p1: online.clientId, e1: online.slots.e1 && online.slots.e1.uid || null } }) });
      if (!online || online.kind !== 'firebase' || online.currentRoundId !== leavingRoundId) return;
      // transportを切り替える直前、旧roundの購読者へ新roundIdを通知する。
      const announced = await netSend({ t: 'lobbyState', status: 'lobby', nextRoundId: nextId, autoReady: autoReady === true });
      if (announced !== true) throw new Error('Next round handoff could not be sent.');
      online.currentRoundId = nextId; online.transport.setRoundId(nextId); online.transport.reconnect(); resetLocalFirebaseRoundState(autoReady === true);
      openFirebaseLobby();
    } catch (_) {
      if (online && online.kind === 'firebase') {
        onlineLobbyStatus('次のラウンドを用意できませんでした。結果ロビーに留まります。');
        openFirebaseResultsLobby();
      }
    } finally {
      if (online && online.kind === 'firebase') { online.roundResetting = false; renderFirebaseLobby(); }
    }
  }
  function openFirebaseLobby() { if (onlineLobbyEl) { onlineLobbyEl.classList.add('open', 'in-room'); onlineLobbyEl.classList.remove('results'); } renderFirebaseLobby(); }
  // 決着した瞬間にロビーを開くと、勝敗の演出(余韻→決まり手→結果)が全部隠れて
  // 「何が起きたか分からないままロビーが出る」ことになる。演出が終わってから開く。
  function scheduleFirebaseResultsLobby() {
    if (!online || online.kind !== 'firebase') return;
    online.resultsLobbyPending = true;
  }
  function updateFirebaseResultsLobby() {
    if (!online || online.kind !== 'firebase' || !online.resultsLobbyPending) return;
    if (matchOver && matchEndPause > 0) return; // 決まり手を見せている最中
    online.resultsLobbyPending = false;
    // 対戦者は結果画面のボタンで選ぶ。ここでロビーを開くと勝敗が隠れてしまう。
    if (isFirebasePlayer()) { renderFirebaseLobby(); return; }
    openFirebaseResultsLobby();
  }
  function openFirebaseResultsLobby() {
    if (!online || online.kind !== 'firebase') return;
    online.resultsLobbyPending = false;
    if (onlineLobbyEl) { onlineLobbyEl.classList.add('open', 'in-room', 'results'); }
    // 準備フェーズの文言が残っていると、決着後の画面なのに「開始データを待っています」と出る。
    // 勝敗と決まり手はロビーにも出す。Canvasの結果表示はロビーに隠れて見えないため。
    const outcome = !matchOver ? '対戦が終わりました。'
      : online.participantRole === 'spectator' ? `決着:${matchEndReason || '撃破'}。`
      : localWon() ? `勝利! （${matchEndReason || '撃破'}）` : `敗北… （${matchEndReason || '撃破'}）`;
    onlineLobbyStatus(`${outcome} もう一度戦うか、ロビーへ戻るかを選んでください。`);
    renderFirebaseLobby();
  }
  async function leaveFirebaseLobby() {
    if (!online || online.kind !== 'firebase' || online.phase !== 'lobby') { onlineLobbyStatus('退出はロビーでのみ行えます。'); return; }
    if (!confirm('このロビーを退出しますか？')) return;
    const leaving = online;
    if (leaving.role === 'host') await firebaseRequest(`rooms/${leaving.room}`, leaving.auth, { method: 'DELETE' });
    else await firebaseRequest(`rooms/${leaving.room}/slots/${leaving.seat}`, leaving.auth, { method: 'DELETE' });
    endOnline(false, false);
    gamePhase = 'title'; startTitleBgm();
  }

  function beginOnline(role) {
    const transport = makeTransport(LOOPBACK_ROOM);
    if (!transport) return false; // BroadcastChannelが無い環境では黙って諦める
    online = {
      kind: 'loopback', role,
      transport,
      clientId: `${role}-${Math.random().toString(36).slice(2, 10)}`,
      seat: role === 'host' ? 'p1' : 'e1',
      phase: 'waiting',
      queue: [],
      retryTimer: 0,
      resultSent: false,
      peerLeft: false,
      versionMismatch: false, matchStarted: false
    };
    transport.onMessage(netReceive);
    setOnlineSeat(online.seat);
    if (role === 'host') {
      // 地形とキャラはホストが決める。キャラ選択の同期はStage 3の課題なので、いまは両方ランダム。
      battleMode = 'normal';
      winStreak = 0;
      runStats = { damageDealt: 0, shots: 0 };
      player.character = CHARACTER_LIST[Math.floor(Math.random() * CHARACTER_LIST.length)];
      cpu.character = CHARACTER_LIST[Math.floor(Math.random() * CHARACTER_LIST.length)];
      stopTitleBgm();
      gamePhase = 'battle';
      resetMatch(false);
    }
    netSend({ t: role === 'host' ? 'hello' : 'join' });
    return true;
  }

  function endOnline(sendBye, cleanup = true, skipDeferredCleanup = false) {
    if (!online) return;
    const leaving = online;
    if (leaving.authRefreshTimer) clearTimeout(leaving.authRefreshTimer);
    if (leaving.authRetryTimer) clearTimeout(leaving.authRetryTimer);
    // v3 Firebaseは試合終了・ページ離脱で部屋を消さない。明示的なロビー退出だけが席/部屋を消す。
    if (sendBye && leaving.kind !== 'firebase') { netSend({ t: 'bye' }); netSend({ t: 'bye' }); }
    leaving.transport.close();
    if (cleanup && !skipDeferredCleanup && leaving.kind === 'firebase' && leaving.role === 'host' && leaving.protocol === 2) {
      // sendChainに積んだbye POSTよりDELETEが先着しないよう少しだけ待つ。
      // pagehideはタイマーが停止しうるため、そこではskipDeferredCleanup=trueとしてTTLに任せる。
      setTimeout(() => firebaseRequest(`rooms/${leaving.room}`, leaving.auth, { method: 'DELETE' }).catch(() => {}), 1000);
    }
    online = null;
    setLocalSeat('p1');
    if (onlineLobbyEl) onlineLobbyEl.classList.remove('in-room', 'host', 'results');
    closeOnlineLobby();
  }

  // 開発用の入口はタイトルに着いてから開く。読み込み中に試合へ飛ばすと
  // 画像が揃う前に描き始めてしまい、音も端末のロック解除前で鳴らない。
  let pendingLoopback = null;
  function startPendingLoopback() {
    if (!pendingLoopback || gamePhase !== 'title') return;
    const role = pendingLoopback;
    pendingLoopback = null;
    beginOnline(role);
  }

  // 開発用パラメータの適用。devParams は席の切り替えと同じところで作ってある。
  if (devParams) {
    const lb = devParams.get('loopback');
    if (lb === 'host' || lb === 'guest') pendingLoopback = lb;
    netSim.delayMs = Math.max(0, Number(devParams.get('netdelay')) || 0);
    netSim.lossRate = Math.min(0.9, Math.max(0, Number(devParams.get('netloss')) || 0));
  }

  // 相手が来るまでは join/hello を撒き続ける。どちらが先に開いても繋がるようにするため。
  function updateOnline(dt) {
    startPendingLoopback();
    if (!online) return;
    updateFirebaseResultsLobby();
    // 既に終わっている接続を毎フレーム再判定しない。保留中の通知は放棄する。
    if (online.phase === 'ended' || online.protocolError) return;
    updateFirebasePendingTerminals();
    if (!online || online.phase === 'ended') return;
    updateFirebasePeerLiveness();
    if (!online || online.phase === 'ended') return;
    netDrainQueue(dt);
    if (online.phase !== 'waiting') return;
    online.retryTimer -= dt;
    if (online.retryTimer <= 0) {
      online.retryTimer = NET_RETRY_SEC;
      netSend({ t: online.role === 'host' ? 'hello' : 'join' });
    }
  }

  function wrapText(text, x, y, maxWidth, lineHeight) {
    let line = '';
    let cy = y;
    for (const ch of text) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, cy);
        line = ch;
        cy += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, cy);
  }

  function angularPlatePath(x, y, w, h, cut = 14) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + cut, y - h / 2);
    ctx.lineTo(x + w / 2 - cut, y - h / 2);
    ctx.lineTo(x + w / 2, y - h / 2 + cut);
    ctx.lineTo(x + w / 2, y + h / 2 - cut);
    ctx.lineTo(x + w / 2 - cut, y + h / 2);
    ctx.lineTo(x - w / 2 + cut, y + h / 2);
    ctx.lineTo(x - w / 2, y + h / 2 - cut);
    ctx.lineTo(x - w / 2, y - h / 2 + cut);
    ctx.closePath();
  }

  function drawRivet(x, y, r = 5.5) {
    const rivet = ctx.createRadialGradient(x - r * 0.36, y - r * 0.36, r * 0.18, x, y, r * 1.1);
    rivet.addColorStop(0, '#fff1a3');
    rivet.addColorStop(0.42, '#b47728');
    rivet.addColorStop(1, '#35200e');
    ctx.fillStyle = rivet;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#160e08';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ===== 戦闘UI共用:真鍮縁の黒鉄プレート =====
  // opts: cut(角の落とし幅) / edge(縁色) / lineWidth / fill(塗りの上書き) /
  //       rivets(四隅に鋲) / rivetInset / glow(縁の発光色)
  function drawIronPlate(x, y, w, h, opts = {}) {
    const cut = opts.cut != null ? opts.cut : 12;
    ctx.save();
    angularPlatePath(x, y, w, h, cut);
    let fill = opts.fill;
    if (!fill) {
      const g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
      g.addColorStop(0, UI.plateTop);
      g.addColorStop(0.12, UI.plateMid);
      g.addColorStop(1, UI.plateBottom);
      fill = g;
    }
    ctx.fillStyle = fill;
    ctx.fill();
    if (opts.glow) {
      ctx.shadowColor = opts.glow;
      ctx.shadowBlur = 12;
    }
    ctx.strokeStyle = opts.edge || UI.brass;
    ctx.lineWidth = opts.lineWidth != null ? opts.lineWidth : 2.5;
    ctx.stroke();

      const ins = opts.rivetInset != null ? opts.rivetInset : 13;
      const rr = opts.rivetRadius != null ? opts.rivetRadius : 4;
      drawRivet(x - w / 2 + ins, y - h / 2 + ins, rr);
      drawRivet(x + w / 2 - ins, y - h / 2 + ins, rr);
      drawRivet(x - w / 2 + ins, y + h / 2 - ins, rr);
      drawRivet(x + w / 2 - ins, y + h / 2 - ins, rr);
    }
  }

  function drawOutlinedText(text, x, y, opts = {}) {
    ctx.save();
    ctx.textAlign = opts.align || 'center';
    ctx.font = opts.font || `900 16px ${UI_FONT_HEAVY}`;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = opts.outline || UI.ink;
    ctx.lineWidth = opts.lineWidth != null ? opts.lineWidth : 4;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = opts.color || UI.parchment;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

    const isFree = kind === 'free';
    ctx.save();

    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 8;
    angularPlatePath(button.x, button.y, button.w + 10, button.h + 10, 18);
    const timber = ctx.createLinearGradient(0, button.y - button.h / 2, 0, button.y + button.h / 2);
    timber.addColorStop(0, '#6d3b1c');
    timber.addColorStop(0.45, '#351b11');
    timber.addColorStop(1, '#170d09');
    ctx.fillStyle = timber;
    ctx.fill();
    ctx.strokeStyle = '#1b0e08';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.shadowColor = 'transparent';

    angularPlatePath(button.x, button.y - 2, button.w, button.h, 14);
    const steel = ctx.createLinearGradient(0, button.y - button.h / 2, 0, button.y + button.h / 2);
    if (isFree) {
      steel.addColorStop(0, '#315a58');
      steel.addColorStop(0.48, '#163c3e');
      steel.addColorStop(1, '#092326');
    } else {
      steel.addColorStop(0, '#46566a');
      steel.addColorStop(0.48, '#273747');
      steel.addColorStop(1, '#111b27');
    }
    ctx.fillStyle = steel;
    ctx.fill();
    ctx.strokeStyle = isFree ? '#e28b37' : '#e6aa3b';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 左の紋章板。通常戦は照準、フリーは工具ギアを模した簡易アイコン。
    const badgeX = button.x - button.w / 2 + 43;
    ctx.fillStyle = isFree ? '#873e22' : '#a35a1d';
    ctx.beginPath();
    ctx.arc(badgeX, button.y - 2, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f1b74d';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = '#fff0b4';
    ctx.lineWidth = 3;
    if (isFree) {
      ctx.beginPath();
      ctx.arc(badgeX, button.y - 2, 9, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(badgeX + Math.cos(a) * 12, button.y - 2 + Math.sin(a) * 12);
        ctx.lineTo(badgeX + Math.cos(a) * 18, button.y - 2 + Math.sin(a) * 18);
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.arc(badgeX, button.y - 2, 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(badgeX - 18, button.y - 2);
      ctx.lineTo(badgeX + 18, button.y - 2);
      ctx.moveTo(badgeX, button.y - 20);
      ctx.lineTo(badgeX, button.y + 16);
      ctx.stroke();
    }

    drawRivet(button.x - button.w / 2 + 15, button.y - button.h / 2 + 14);
    drawRivet(button.x + button.w / 2 - 15, button.y - button.h / 2 + 14);
    drawRivet(button.x - button.w / 2 + 15, button.y + button.h / 2 - 14);
    drawRivet(button.x + button.w / 2 - 15, button.y + button.h / 2 - 14);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff6dc';
    ctx.strokeStyle = '#090b0d';
    ctx.lineWidth = 5;
    ctx.font = '900 23px "Arial Black", Impact, "Yu Gothic UI", sans-serif';
    ctx.strokeText(label, button.x + 25, button.y - 7);
    ctx.fillText(label, button.x + 25, button.y - 7);

  function drawLoadingScreen() {
    ctx.save();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, VW, VH);

    const angle = (Date.now() % 3600) / 3600 * Math.PI * 2;
    const spinnerY = VH / 2 - 100;
    const spinnerX = VW / 2;
    if (loadingEmblemReady) {
      const emblemSize = 112;
      ctx.save();
      ctx.translate(spinnerX, spinnerY);
      ctx.rotate(angle);
      ctx.shadowColor = 'rgba(255,210,74,0.35)';
      ctx.shadowBlur = 14;
      ctx.drawImage(loadingEmblemImage, -emblemSize / 2, -emblemSize / 2, emblemSize, emblemSize);
      ctx.restore();
    } else {
      // エンブレムが間に合わない瞬間だけ、軽量な円弧を予備表示する。
      ctx.beginPath();
      ctx.arc(VW / 2, spinnerY, 28, angle, angle + Math.PI * 1.45);
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    const readyToStart = gamePhase === 'press';
    const pulse = 0.55 + Math.sin(Date.now() / 260) * 0.28;
    ctx.textAlign = 'center';
    if (readyToStart) {
      ctx.fillStyle = titleStartPending ? 'rgba(255,255,255,0.78)' : `rgba(255,210,74,${Math.min(1, pulse + 0.18)})`;
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(titleStartPending ? 'STARTING BGM...' : 'TAP TO START', VW / 2, VH / 2 + 30);
      ctx.fillStyle = 'rgba(255,255,255,0.70)';

      ctx.fillText(titleStartPending ? 'タイトルを準備しています' : (titleStartFailed ? 'BGMを開始できませんでした。もう一度タップしてください' : '画面をタップしてタイトルBGMを開始'), VW / 2, VH / 2 + 53);
    } else {

      ctx.fillText('NOW LOADING...', VW / 2, VH / 2 + 30);

  function spawnEmpPulse(x, y, radius) {
    empRings.push({ x, y, radius, life: 0.55, maxLife: 0.55 });
    const count = 18;
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = radius * (0.2 + Math.random() * 0.8);
      particles.push({
        x: x + Math.cos(ang) * dist,
        y: y + Math.sin(ang) * dist,
        vx: Math.cos(ang) * 22,
        vy: Math.sin(ang) * 22,
        life: 0.45 + Math.random() * 0.3,
        maxLife: 0.75,
        color: Math.random() < 0.55 ? '#66e8ff' : '#b38cff',
        size: 2 + Math.random() * 2
      });
    }
  }

  function drawWheelSelectCard(card, def) {
    const main = { x: card.x, y: card.y, w: card.w, h: card.h };
    const left = main.x - main.w / 2;
    const top = main.y - main.h / 2;

    ctx.save();
    ctx.globalAlpha = card.alpha;
    ctx.shadowColor = card.focused ? `${def.color}aa` : 'rgba(0,0,0,0.72)';
    ctx.shadowBlur = card.focused ? 28 : 16;
    ctx.shadowOffsetY = card.focused ? 0 : 7;
    selectRoundedRect(left, top, main.w, main.h, 18);
    const cardFill = ctx.createLinearGradient(left, top, left + main.w, top + main.h);
    cardFill.addColorStop(0, 'rgba(13,23,40,0.99)');
    cardFill.addColorStop(0.72, 'rgba(24,35,52,0.98)');
    cardFill.addColorStop(1, `${def.color}42`);
    ctx.fillStyle = cardFill;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = def.color;
    ctx.lineWidth = card.focused ? 3 : 2;
    ctx.stroke();

    selectRoundedRect(left + 5, top + 5, main.w - 10, main.h - 10, 14);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 左側のキャラクター表示枠
    const imageBox = { x: left + 10, y: top + 10, w: 112, h: main.h - 20 };
    selectRoundedRect(imageBox.x, imageBox.y, imageBox.w, imageBox.h, 13);
    const imageGlow = ctx.createRadialGradient(
      imageBox.x + imageBox.w / 2, imageBox.y + 72, 5,
      imageBox.x + imageBox.w / 2, imageBox.y + 72, 82
    );
    imageGlow.addColorStop(0, `${def.color}48`);
    imageGlow.addColorStop(0.62, 'rgba(8,17,31,0.78)');
    imageGlow.addColorStop(1, 'rgba(3,7,16,0.96)');
    ctx.fillStyle = imageGlow;
    ctx.fill();
    ctx.strokeStyle = `${def.color}88`;
    ctx.stroke();

    const cImg = charImages[card.key];
    const cReady = cImg && cImg.complete && cImg.naturalWidth > 0;
    const imageCx = imageBox.x + imageBox.w / 2;
    const imageCy = imageBox.y + 74;
    if (cReady) {
      const imageScale = Math.min(104 / cImg.naturalWidth, 112 / cImg.naturalHeight);
      const iw = cImg.naturalWidth * imageScale;
      const ih = cImg.naturalHeight * imageScale;
      if (def.facesLeft) {
        ctx.save();
        ctx.translate(imageCx, imageCy);
        ctx.scale(-1, 1);
        ctx.drawImage(cImg, -iw / 2, -ih / 2, iw, ih);
        ctx.restore();

        ctx.drawImage(cImg, imageCx - iw / 2, imageCy - ih / 2, iw, ih);

      ctx.beginPath();
      ctx.arc(imageCx, imageCy, 31, 0, Math.PI * 2);
      ctx.fillStyle = def.color;
      ctx.fill();

    selectRoundedRect(imageBox.x + 12, imageBox.y + imageBox.h - 30, imageBox.w - 24, 19, 10);
    ctx.fillStyle = 'rgba(0,0,0,0.74)';
    ctx.fill();
    ctx.strokeStyle = `${def.color}aa`;
    ctx.stroke();
    ctx.fillStyle = def.color;
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.role, imageCx, imageBox.y + imageBox.h - 16);

    // 2/3幅の中へ情報を再配置する。

    ctx.stroke();

    ctx.font = 'bold 8px monospace';

    drawSelectStat('火力', def.selectStats[1], textX + 64, top + 101, def.color);
    drawSelectStat('機動', def.selectStats[2], textX + 128, top + 101, def.color);

    selectRoundedRect(textX, top + 127, contentW, 55, 10);
    ctx.fillStyle = 'rgba(255,210,74,0.09)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,74,0.46)';

  // 直撃>至近>爆風減衰のダメージ計算(blastMulでキャラの爆風サイズを反映)
  function computeDamage(dist, blastMul, damageMul = 1) {
    const DIRECT = 20 * blastMul, CLOSE = 48 * blastMul, BLAST = 100 * blastMul;
    if (dist <= DIRECT) return Math.round(45 * damageMul);
    if (dist <= CLOSE) return Math.round((45 - (dist - DIRECT) / (CLOSE - DIRECT) * 20) * damageMul);
    if (dist <= BLAST) return Math.round((25 - (dist - CLOSE) / (BLAST - CLOSE) * 25) * damageMul);
    return 0;
  }

  function emitEmp(x, y, radius, owner, turns) {
    spawnEmpPulse(x, y, radius);
    triggerShake(2.5, 0.16);
    const ownerTeam = teamOfOwner(owner);
    for (const u of units) {
      if (u.team === ownerTeam) continue; // 味方は巻き込まない
      const dist = Math.hypot(u.x - x, u.y - y);
      if (dist > radius) continue;
      const baseDamage = dist <= radius * 0.35 ? 20 : 10;
      const damage = Math.max(1, Math.round(baseDamage * (CHARACTERS[u.character]?.damageTakenMul || 1)));
      u.hp = Math.max(0, u.hp - damage);
      u.moveLockTurns = Math.max(u.moveLockTurns || 0, turns);
      spawnDamageText(u.x, u.y - UNIT_RADIUS - 10, damage);
      creditDamage(owner, u, damage);
    }
    triggerSpecialFlash(`電磁波: 移動封印 ${turns}手`);
    playExplosionSound(0.8);
    checkMatchEnd();
  }

  function explodeAt(x, y, blastMul, owner, damageMul = 1) {
    blastMul = blastMul || 1;
    carveCrater(x, y, 44 * blastMul);
    spawnExplosion(x, y, blastMul);
    triggerShake(4 + 4 * blastMul, 0.12 + 0.08 * blastMul);
    playExplosionSound(blastMul);
    for (const u of units) {
      const a = unitAnchor(u);
      const dist = Math.hypot(a.x - x, a.y - y);
      const dmg = computeDamage(dist, blastMul, damageMul);
      if (dmg > 0) {
        const takenMul = CHARACTERS[u.character]?.damageTakenMul || 1;
        const actualDamage = Math.max(1, Math.round(dmg * takenMul));
        u.hp = Math.max(0, u.hp - actualDamage);
        spawnDamageText(a.x, a.y - UNIT_RADIUS - 10, actualDamage);
        creditDamage(owner, u, actualDamage);
      }
    }
    checkMatchEnd();
  }

  function estimateFlightTime(vx0, vy0, gravity = GRAVITY) {
    // ほぼ水平(vy0が±1px/s程度)なドラッグはatan2/sinの浮動小数点誤差で
    // vy0がごく僅かな負値になり得るため、しきい値を設けてフォールバックに逃がす
    if (vy0 < -1) return Math.min(3, (2 * Math.abs(vy0)) / gravity);
    return 0.6;
  }

  // 水平付近では「発射高度へ戻るまでの時間」がほぼ0になるため、時間だけで
  // ガイド長を決めると点が発射位置に固まる。角度に関係なく最低限の距離を見せる。
  const TRAJECTORY_PREVIEW_MIN_DISTANCE = 100;
  const TRAJECTORY_PREVIEW_MAX_MIN_TIME = 0.45;
  function trajectoryPreviewDuration(vx0, vy0, gravity = GRAVITY) {
    const normalPreviewTime = estimateFlightTime(vx0, vy0, gravity) * 0.2;
    const speed = Math.max(1, Math.hypot(vx0, vy0));
    const minimumVisibleTime = Math.min(
      TRAJECTORY_PREVIEW_MAX_MIN_TIME,
      TRAJECTORY_PREVIEW_MIN_DISTANCE / speed
    );
    return Math.max(normalPreviewTime, minimumVisibleTime);
  }

  // 決着後の流れは2段階。まず何も出さずに着弾の余韻を見せ、そのあとで決まり手を宣告する。
  // 決まった瞬間に文字をかぶせると、何が起きたのかを見る間がなくなる。
  const MATCH_END_HOLD = 1;      // 余韻(戦場だけを見せる)
  const MATCH_END_BANNER = 1.3;  // 決まり手の表示
  const MATCH_END_PAUSE = MATCH_END_HOLD + MATCH_END_BANNER;
  let matchEndPause = 0;
  let matchEndReason = '';

  // 余韻が明けて、決まり手を出している最中か
  function matchEndBannerVisible() {
    return matchEndPause > 0 && matchEndPause <= MATCH_END_BANNER;
  }

  function beginMatchEnd(reason) {
    matchEndReason = reason;
    matchEndPause = MATCH_END_PAUSE;
  }

  // オンライン対戦では、決着を宣言していいのは「その手番を持っていた側」だけ。
  // 両者が独立に判定すると、演出のズレでHPが1違うだけで勝敗が食い違う。
  function canDeclareMatchEnd() {
    return !isOnline() || isLocalTurn();
  }

  function checkMatchEnd(reason) {
    if (matchOver) return;
    const playerAlive = teamAlive('player');
    const cpuAlive = teamAlive('cpu');
    if (playerAlive && cpuAlive) return;
    if (!canDeclareMatchEnd()) {
      // 自分の手番でない時の決着は相手が権威。待ちに入ったことを記録する。
      logOnlineEvent({ type: 'matchEnd', declared: false, reason: reason || '撃破', active: activeUnit().id });
      return;
    }
    logOnlineEvent({ type: 'matchEnd', declared: true, reason: reason || '撃破' });
    matchOver = true;
    winner = playerAlive ? 'player' : 'cpu'; // 相打ちはCPU勝ち扱い(引き分けは設けない)
    beginMatchEnd(reason || '撃破');
    applyStreakResult();
    netSyncResult(reason || '撃破');
  }

  // 陣営の残存率。2vs2ではチーム合計で比べる。
  function teamHpRatio(team) {
    let hp = 0;
    let max = 0;
    for (const u of units) {
      if (u.team !== team) continue;
      hp += u.hp;
      max += u.maxHp;
    }
    return max > 0 ? hp / max : 0;
  }

  function judgeByHp() {
    // 時間切れの判定も行動側が計算して送る(endTurn は手番を進める前に抜けるので、
    // ここでの activeUnit() はまだ「最後に動いた側」を指している)。
    if (!canDeclareMatchEnd()) return;
    matchOver = true;
    winner = teamHpRatio('player') > teamHpRatio('cpu') ? 'player' : 'cpu'; // 同率は引き分けなし・CPU勝ち扱い
    beginMatchEnd('時間切れ');
    applyStreakResult();
    netSyncResult('時間切れ');
  }

  let lastRunStreak = 0;
  let lastRunEfficiency = 0;
  // 連勝やスコアの集計は決着した瞬間に確定させる。
  // 勝敗音は着弾と同時だと早すぎるので、決まり手の宣告に合わせて別途鳴らす。
  function applyStreakResult() {
    if (battleMode === 'free') return;
    // 対人戦は連勝にもランキングにも含めない(勝ちの譲り合いの温床になるため)。
    if (isOnline()) return;
    if (winner === 'player') {
      winStreak++;
    } else {
      lastRunStreak = winStreak;
      lastRunEfficiency = currentEfficiency();
      winStreak = 0;
      runStats = { damageDealt: 0, shots: 0 }; // 連勝が途切れたら次の挑戦は与ダメ効率もリセット
      // ランキングへ送るのは「連勝が途切れた瞬間」。1勝もしていない挑戦は送らない。
      // 連勝中はキャラを変えずに戦い続けるので、負けた時のキャラ=その挑戦のキャラ。
      if (lastRunStreak > 0) submitScore(lastRunStreak, lastRunEfficiency, player.character);
    }
  }

  function startTurn() {
    resetMoveSync();
    for (const u of units) u.netWalkTargetX = null;
    // 風は全員が2巡するごとに切り替える(1vs1では従来どおり4ターンごと)
    if (turnCount % (turnOrder.length * 2) === 0) rollWind();
    const acting = activeUnit();
    acting.fuel = acting.fuelMax;
    focusCameraOn(acting.x);
    if (acting.control === 'cpu') {
      cpuThinkTimer = 0.7 + Math.random() * 0.5;
      const plan = planCpuMove(acting);
      cpuMoveDir = plan.dir;
      cpuMoveRemaining = plan.distance;
      cpuPhase = cpuMoveRemaining > 0 ? 'move' : 'aim';
    }
  }

  function endTurn() {
    if (matchOver) return;
    const acting = activeUnit();
    if (acting.moveLockTurns > 0) acting.moveLockTurns--;
    // そのキャラが1手番を終えるごとに1段階。使用した手番の終了時から再充填を始める。
    advanceSpecialCharge(acting);
    turnCount++;
    if (turnCount >= maxTurnsTotal()) {
      showCutIn('タイムアップ!', '判定は…', 1.6, () => { judgeByHp(); });
      return;
    }
    // 倒れたユニットの手番は飛ばす。1vs1では倒れた時点で決着なので通らないが、
    // 2vs2ではここが無いと死体に手番が渡って進行が止まる。
    for (let i = 0; i < turnOrder.length; i++) {
      activeIndex = (activeIndex + 1) % turnOrder.length;
      if (activeUnit().hp > 0) break;
    }
    startTurn();
    showCutIn(turnOwnerLabel(activeUnit()), '', 0.9);
  }

  // ===== CPU AI(精度成長型)=====
  // 連勝数が伸びるほど理論弾道からの誤差が縮む。20連勝〜はほぼ正解弾道。
  function cpuAccuracyTier(streak) {
    if (streak < 3) return { name: 'low', jitter: 0.38 };
    if (streak < 10) return { name: 'mid', jitter: 0.20 };
    if (streak < 20) return { name: 'high', jitter: 0.09 };
    return { name: 'perfect', jitter: 0.02 };
  }

  // CPUの移動計画:危機回避(近すぎる)・攻撃調整(遠すぎる)の時だけ動く。むやみに動かない。
  let cpuMoveDir = 0;
  let cpuMoveRemaining = 0;
  let cpuPhase = 'aim'; // 'move' | 'aim'

  function planCpuMove(self) {
    const tier = cpuAccuracyTier(winStreak);
    if (self.moveLockTurns > 0) return { dir: 0, distance: 0 };
    if (tier.name === 'low') return { dir: 0, distance: 0 }; // 1〜3連勝は動かない

    const foe = nearestEnemy(self);
    if (!foe) return { dir: 0, distance: 0 };
    const dist = Math.abs(foe.x - self.x);
    const NEAR = 150;  // 近すぎ(自爆や反撃のリスク)→離れる
    const FAR = 760;   // 横長ステージでは遠距離戦を基本にし、極端に遠い時だけ寄る

    let dir = 0;
    if (dist < NEAR) dir = self.x < foe.x ? -1 : 1;
    else if (dist > FAR) dir = self.x < foe.x ? 1 : -1;
    if (dir === 0) return { dir: 0, distance: 0 };

    // 中ティアは必要な時でも半分の確率でしか動かない(様子見)
    if (tier.name === 'mid' && Math.random() < 0.5) return { dir: 0, distance: 0 };

    const willingness = tier.name === 'perfect' ? 1 : tier.name === 'high' ? 0.85 : 0.6;
    return { dir, distance: self.fuelMax * willingness };
  }

  function cpuAutoTurn() {
    if (matchOver || projectiles.length) return;
    const self = activeUnit();
    const foe = nearestEnemy(self);
    if (!foe) return;
    const anchor = unitAnchor(self);
    const target = unitAnchor(foe);
    const def = CHARACTERS[self.character];
    const baseT = Math.min(2.2, Math.max(0.72, Math.abs(target.x - anchor.x) / 300)) * def.tBias;
    const tier = cpuAccuracyTier(winStreak);
    const useSpecial = isSpecialReady(self) && (tier.name === 'high' || tier.name === 'perfect');
    // 悪魔の必殺は重力も風も受けないので、逆算も直線で行わないと大きく外れる。
    const straightAim = useSpecial && def.key === 'akuma';
    const aimWindMul = straightAim ? 0 : (useSpecial && def.key === 'tori' ? def.windMul * 0.55 : (def.windMul || 1));
    const aimGravityMul = straightAim ? 0 : (def.gravityMul || 1);
    const launchSpeedMul = useSpecial ? (def.specialVelocityMul || 1) : 1;
    const { vx0, vy0 } = perfectAimVelocity(anchor, target, baseT, aimGravityMul, aimWindMul, launchSpeedMul);
    const jitter = tier.jitter;
    const vx = vx0 * (1 + (Math.random() * 2 - 1) * jitter);
    const vy = vy0 * (1 + (Math.random() * 2 - 1) * jitter);
    launchShot(self, anchor, vx, vy, useSpecial);
    awaitingResolve = true;
  }

  // 高低差・現在の風を考慮して(anchor→target)を正確に結ぶ「理論上の正解弾道」を逆算
  function perfectAimVelocity(anchor, target, tHint, gravityMul = 1, windMul = 1, launchSpeedMul = 1) {
    const dx = target.x - anchor.x;
    const dy = target.y - anchor.y;
    const distAbs = Math.max(1, Math.abs(dx));
    const t = tHint || Math.min(2.2, Math.max(0.72, distAbs / 300));
    const windAccel = wind.dir * wind.strength * WIND_ACCEL_MAX * windMul;
    const gravity = GRAVITY * gravityMul;
    const vx0 = ((dx - 0.5 * windAccel * t * t) / t) / launchSpeedMul;
    const vy0 = ((dy - 0.5 * gravity * t * t) / t) / launchSpeedMul;
    return { vx0, vy0, t };
  }

  function eliminateAtDeadLine(u) {
    if (u.hp <= 0 || u.y + UNIT_RADIUS < DEAD_LINE_Y) return false;
    u.hp = 0;
    u.vy = 0;
    u.grounded = true;
    playDeadLineSound();
    triggerShake(5, 0.18);
    checkMatchEnd('落下');
    return true;
  }

  function updateFalling(dt, u) {
    // 地面が残っていても、車体下端がデッドラインへ触れた時点で敗北。
    if (eliminateAtDeadLine(u)) return;
    if (u.grounded) {
      const nearbyGround = walkableGroundYAt(u.x, u.y + UNIT_RADIUS);
      const groundY = (nearbyGround === null ? u.y + UNIT_RADIUS : nearbyGround) - UNIT_RADIUS;
      if (groundY > u.y + 2) {
        // 足場が崩れて落下開始
        u.grounded = false;
        u.vy = 0;
        u.fallStartY = u.y;
      } else {
        u.y = groundY; // 地形に追従(登り降りはそのまま歩ける)
      }
    } else {
      const previousFeetY = u.y + UNIT_RADIUS;
      u.vy += GRAVITY * dt;
      u.y += u.vy * dt;
      if (eliminateAtDeadLine(u)) return;
      const g2 = groundYBelow(u.x, previousFeetY) - UNIT_RADIUS;
      if (u.y >= g2) {
        const intoVoid = g2 >= FLOOR_Y - UNIT_RADIUS - 2; // クレーターが底まで貫通=場外
        const fallDist = g2 - u.fallStartY;
        u.y = g2;
        u.vy = 0;
        u.grounded = true;
        if (fallDist > 15) {
          triggerShake(3, 0.1);
        }
        if (u.hp > 0) {
          if (intoVoid) {
            u.hp = 0; // 場外落下は即死(落下ダメージ自体は計算しない)
          }
          checkMatchEnd();
        }
      }
    }
  }

  // ===== 描画 =====
  function drawSky() {
    const fx = THEME_FX[currentThemeKey];
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, currentTheme.sky[0]);
    g.addColorStop(0.55, currentTheme.sky[1]);
    g.addColorStop(1, currentTheme.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    const stageBackground = getReadyStageBackground();
    if (stageBackground) {
      ctx.drawImage(stageBackground, 0, 0, VW, VH);
      // HUD・弾道・キャラクターの視認性を保ちつつ、生成背景の色彩を残す。
      const readabilityShade = ctx.createLinearGradient(0, 0, 0, VH);
      readabilityShade.addColorStop(0, 'rgba(5,10,18,0.06)');
      readabilityShade.addColorStop(0.48, 'rgba(5,10,18,0.03)');
      readabilityShade.addColorStop(1, 'rgba(5,10,18,0.19)');
      ctx.fillStyle = readabilityShade;
      ctx.fillRect(0, 0, VW, VH);
    }

    if (!stageBackground) {
    // テーマごとの天体と地平線の光。背景画像を増やさず、試合ごとに位置が少し変わる。
    const orbX = 78 + ((parallaxSeed * 0.137) % (VW - 156));
    const orbY = currentThemeKey === 'desert' ? 168 : 92;
    const orbRadius = currentThemeKey === 'desert' ? 32 : currentThemeKey === 'volcanic' ? 22 : 20;
    const glow = ctx.createRadialGradient(orbX, orbY, 0, orbX, orbY, orbRadius * 4.8);
    glow.addColorStop(0, fx.glow);
    glow.addColorStop(0.36, fx.glow);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(orbX - orbRadius * 5, orbY - orbRadius * 5, orbRadius * 10, orbRadius * 10);
    ctx.save();
    ctx.shadowColor = fx.orb;
    ctx.shadowBlur = 18;
    ctx.fillStyle = fx.orb;
    ctx.beginPath();
    ctx.arc(orbX, orbY, orbRadius, 0, Math.PI * 2);
    ctx.fill();
    if (currentThemeKey === 'grass' || currentThemeKey === 'snow') {
      ctx.fillStyle = currentTheme.sky[0];
      ctx.beginPath();
      ctx.arc(orbX + 8, orbY - 5, orbRadius * 0.92, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (currentThemeKey === 'snow') {
      // 淡いオーロラ。主張を抑えてUIと弾道を見やすく保つ。
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.lineCap = 'round';
      for (let band = 0; band < 3; band++) {
        const aurora = ctx.createLinearGradient(0, 0, VW, 0);
        aurora.addColorStop(0, 'rgba(76,255,208,0)');
        aurora.addColorStop(0.45, band === 1 ? 'rgba(96,196,255,0.65)' : 'rgba(98,255,195,0.55)');
        aurora.addColorStop(1, 'rgba(132,109,255,0)');
        ctx.strokeStyle = aurora;
        ctx.lineWidth = 16 - band * 3;
        ctx.beginPath();
        ctx.moveTo(-40, 105 + band * 28);
        ctx.bezierCurveTo(120, 35 + band * 22, 350, 210 - band * 18, VW + 40, 70 + band * 30);
        ctx.stroke();
      }
      ctx.restore();
    } else if (currentThemeKey === 'volcanic') {
      const lavaGlow = ctx.createRadialGradient(VW * 0.62, GROUND_MIN_Y + 10, 10, VW * 0.62, GROUND_MIN_Y, 260);
      lavaGlow.addColorStop(0, 'rgba(255,72,20,0.34)');
      lavaGlow.addColorStop(1, 'rgba(255,50,10,0)');
      ctx.fillStyle = lavaGlow;
      ctx.fillRect(0, 170, VW, GROUND_MIN_Y);
    }
    }

    // 星・火の粉・雪・砂埃をテーマ別に描き分ける。
    const t = performance.now() * 0.001;
    for (let i = 0; i < 44; i++) {
      let sx = (i * 137.5 + parallaxSeed * 0.19) % VW;
      let sy = (i * 71.3 + parallaxSeed * 0.07) % (GROUND_MIN_Y - 24);
      let size = 0.8 + (i % 4) * 0.45;
      let alpha = 0.35 + (i % 5) * 0.1;
      if (currentThemeKey === 'volcanic') {
        sx = (sx + Math.sin(t * 0.7 + i) * 18 + VW) % VW;
        sy = GROUND_MIN_Y - ((sy + t * (18 + i % 7)) % (GROUND_MIN_Y - 36));
        size += 0.6;
      } else if (currentThemeKey === 'snow') {
        sx = (sx + t * (5 + i % 4)) % VW;
        sy = (sy + t * (12 + i % 6)) % (GROUND_MIN_Y - 18);
      } else if (currentThemeKey === 'desert') {
        sx = (sx + t * (10 + i % 7)) % VW;
        sy = 145 + (sy % 185) + Math.sin(t + i) * 5;
        alpha *= 0.48;
      } else {
        alpha *= 0.72 + Math.sin(t * 2 + i) * 0.2;
      }
      ctx.globalAlpha = Math.max(0.08, alpha);
      ctx.fillStyle = fx.particle;
      ctx.beginPath();
      ctx.arc(sx, sy, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const vignette = ctx.createRadialGradient(VW / 2, VH * 0.4, 80, VW / 2, VH * 0.4, VW * 0.72);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, VW, VH);
  }

  // ===== 遠景パララックス(山のシルエット・雲。カメラより遅く動いて奥行きを出す) =====
  function bgHillY(x, seedOffset, baseY, amp) {
    const p = x + seedOffset;
    return baseY
      + Math.sin(p * 0.006) * amp
      + Math.sin(p * 0.017 + 1.3) * amp * 0.4
      + Math.sin(p * 0.041 + 2.7) * amp * 0.18;
  }

  function drawHillLayer(seedOffset, baseY, amp, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    const fromX = -200, toX = STAGE_W + 200, step = 24;
    ctx.moveTo(fromX, bgHillY(fromX, seedOffset, baseY, amp));
    for (let x = fromX + step; x <= toX; x += step) {
      ctx.lineTo(x, bgHillY(x, seedOffset, baseY, amp));
    }
    ctx.lineTo(toX, GROUND_MAX_Y + 50);
    ctx.lineTo(fromX, GROUND_MAX_Y + 50);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(fromX, bgHillY(fromX, seedOffset, baseY, amp));
    for (let x = fromX + step; x <= toX; x += step) {
      ctx.lineTo(x, bgHillY(x, seedOffset, baseY, amp));
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawCloudShape(cx, cy, r) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, r, r * 0.5, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - r * 0.6, cy + r * 0.15, r * 0.6, r * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + r * 0.6, cy + r * 0.1, r * 0.65, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawClouds() {
    ctx.save();
    ctx.fillStyle = currentTheme.cloud;
    const t = Date.now() * 0.008;
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 260 + t * 4 + parallaxSeed) % (STAGE_W + 400)) - 200;
      const cy = 60 + (i % 3) * 45;
      drawCloudShape(cx, cy, 34 + (i % 2) * 14);
    }
    ctx.restore();
  }

  function drawParallax() {
    // 専用背景が読み込めたテーマでは、画像内の遠景を活かして二重の山・雲を描かない。
    if (getReadyStageBackground()) return;
    ctx.save();
    applyWorldCamera(0.15);
    drawHillLayer(parallaxSeed, 220, 46, currentTheme.farHill);
    ctx.restore();
    ctx.save();
    applyWorldCamera(0.35);
    drawHillLayer(parallaxSeed + 500, 270, 60, currentTheme.nearHill);
    ctx.restore();
    ctx.save();
    applyWorldCamera(0.1);
    drawClouds();
    ctx.restore();
  }

  function drawTerrain() {
    // 地形マスク(ピクセル単位で穴があいた実体)をそのまま描画
    ctx.drawImage(terrainCanvas, 0, 0);
    // 地形マスクから生成した全周の境界線。浮島・縦崖・爆破穴も実際の形どおりに縁取る。
    ctx.drawImage(terrainRimCanvas, 0, 0);
    // 橋は既存の薄床地形に重ねた装飾。地形と一緒に爆破で削れる。
    ctx.drawImage(bridgeCanvas, 0, 0);
    // 闘技場だけの鉄柵・補強材。キャラクターより手前へ出ず、地形と一緒に爆破で欠ける。
    ctx.drawImage(arenaDecorationCanvas, 0, 0);
  }

  function drawArenaObstacles() {
    if (currentPattern !== 'tieredBasin' || !arenaObstacles.length) return;
    const now = simTimeMs; // 当たり判定と同じ時計。ズレると「見えている位置」で当たらなくなる
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (const obstacle of arenaObstacles) {
      const p = arenaObstaclePosition(obstacle, now);

      // 鎖は純粋な装飾。弾の判定は先端の鉄球・鉄塊だけに持たせる。
      const dx = p.x - obstacle.anchorX;
      const dy = p.y - obstacle.anchorY;
      const chainLength = Math.hypot(dx, dy);
      const links = Math.max(4, Math.floor(chainLength / 14));
      ctx.strokeStyle = '#1a2029';
      ctx.lineWidth = 4;
      for (let i = 0; i < links; i++) {
        const t = (i + 0.5) / links;
        const lx = obstacle.anchorX + dx * t;
        const ly = obstacle.anchorY + dy * t;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(Math.atan2(dy, dx) + (i % 2 ? Math.PI / 2 : 0));
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      const r = obstacle.radius;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.shadowColor = 'rgba(0,0,0,0.75)';
      ctx.shadowBlur = 10;
      if (obstacle.shape === 'ball') {
        ctx.fillStyle = '#202630';
        ctx.strokeStyle = '#9a6b31';
        ctx.lineWidth = 3;
        for (let i = 0; i < 12; i++) {
          const a = i * Math.PI * 2 / 12;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a - 0.09) * (r - 2), Math.sin(a - 0.09) * (r - 2));
          ctx.lineTo(Math.cos(a) * (r + 10), Math.sin(a) * (r + 10));
          ctx.lineTo(Math.cos(a + 0.09) * (r - 2), Math.sin(a + 0.09) * (r - 2));
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 2, 0, 0, r);
        g.addColorStop(0, '#69717d');
        g.addColorStop(0.45, '#343b46');
        g.addColorStop(1, '#11161d');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        const size = r * 1.55;
        ctx.rotate(Math.PI / 4);
        const g = ctx.createLinearGradient(-size, -size, size, size);
        g.addColorStop(0, '#606975');
        g.addColorStop(0.45, '#2b323c');
        g.addColorStop(1, '#10151c');
        ctx.fillStyle = g;
        ctx.strokeStyle = '#ad7937';
        ctx.lineWidth = 4;
        ctx.fillRect(-size / 2, -size / 2, size, size);
        ctx.strokeRect(-size / 2, -size / 2, size, size);
        ctx.strokeStyle = 'rgba(220,166,84,0.62)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-size * 0.34, 0);
        ctx.lineTo(size * 0.34, 0);
        ctx.moveTo(0, -size * 0.34);
        ctx.lineTo(0, size * 0.34);
        ctx.stroke();
      }
      ctx.fillStyle = '#d7a04e';
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.58, Math.sin(a) * r * 0.58, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawDeadLine() {
    const y = worldToScreenY(DEAD_LINE_Y);
    const pulse = 0.68 + Math.sin(performance.now() * 0.006) * 0.18;
    ctx.save();
    ctx.shadowColor = `rgba(255,45,55,${pulse})`;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = `rgba(255,72,72,${pulse + 0.12})`;
    ctx.lineWidth = 3;
    ctx.setLineDash([13, 7]);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(VW, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,95,95,0.95)';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DEAD LINE', VW / 2, y - 6);
    ctx.restore();
  }

  // 接地点付近の地形傾斜(ラジアン)。急すぎる斜面は見た目が破綻しないようクランプ
  function groundSlopeAt(u) {
    const d = 14;
    const feetY = u.y + UNIT_RADIUS;
    const leftGround = walkableGroundYAt(Math.max(0, u.x - d), feetY);
    const rightGround = walkableGroundYAt(Math.min(STAGE_W, u.x + d), feetY);
    const y1 = leftGround === null ? feetY : leftGround;
    const y2 = rightGround === null ? feetY : rightGround;
    const MAX_TILT = 0.5; // 約28.6度
    return Math.max(-MAX_TILT, Math.min(MAX_TILT, Math.atan2(y2 - y1, 2 * d)));
  }

  function drawUnit(u) {
    const a = unitAnchor(u);
    const isBossUnit = isBossMatch && u.team === 'cpu';
    const img = u.character ? charImages[u.character] : null;
    const imgReady = img && img.complete && img.naturalWidth > 0;
    const sourceFacesLeft = !!CHARACTERS[u.character]?.facesLeft;
    // プレイヤーは右、CPUは左を向く。左向き素材だけ反転ルールを入れ替える。
    const facingLeft = (u.team === 'cpu') !== sourceFacesLeft;
    const tilt = u.grounded ? groundSlopeAt(u) : 0; // 空中では傾けない

    // 画像は接地ライン(groundY = a.y + UNIT_RADIUS)に底面を合わせて描画
    const h = SPRITE_SIZE;
    const w = imgReady ? h * (img.naturalWidth / img.naturalHeight) : h;
    const imgTopAbs = a.y + UNIT_RADIUS - h;

    ctx.save();
    ctx.translate(a.x, a.y);
    if (isBossUnit) {
      ctx.beginPath();
      ctx.arc(0, UNIT_RADIUS - h / 2, h / 2 + 8, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd24a';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    if (imgReady) {
      ctx.save();
      ctx.globalAlpha = u.hp > 0 ? 1 : 0.4;
      // 接地点(0, UNIT_RADIUS)を軸に地形傾斜ぶんだけ回転。flipより外側に回転をかけることで
      // 反転していても傾き方向が世界座標基準(実際の地形)と一致するようにする
      ctx.translate(0, UNIT_RADIUS);
      ctx.rotate(tilt);
      if (facingLeft) ctx.scale(-1, 1);
      ctx.translate(0, -UNIT_RADIUS);
      ctx.drawImage(img, -w / 2, UNIT_RADIUS - h, w, h);
      ctx.restore();
    } else {
      // 画像読み込み中のフォールバック(色付き円)
      ctx.beginPath();
      ctx.arc(0, 0, UNIT_RADIUS, 0, Math.PI * 2);

  // ===== プレイヤー/CPUのHP・燃料ゲージ(WINDの左右)。燃料はターン開始で満タンに戻るので

    });

    ctx.fillRect(innerX, cardY + 30, innerW * fuelRatio, 5);

  // 引っ張り線(スクリーン座標。カメラの影響を受けないUIレイヤー)
  function drawPullLine() {
    if (!aimState) return;
    const { origin, curX, curY } = aimState;
    const cancelled = isInCancelZone(curX, curY);
    ctx.save();
    ctx.strokeStyle = cancelled ? 'rgba(255,90,90,0.85)' : 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(origin.x, origin.y);
    ctx.lineTo(curX, curY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(curX, curY, 10, 0, Math.PI * 2);
    ctx.fillStyle = cancelled ? 'rgba(255,90,90,0.85)' : 'rgba(255,255,255,0.8)';
    ctx.fill();
    ctx.restore();
  }

  // 弾道プレビュー(ワールド座標。カメラ変換の中で描画する)
  function drawTrajectoryPreview() {
    if (!aimState) return;
    const { anchor, origin, curX, curY } = aimState;
    if (isInCancelZone(curX, curY)) return;

    let dx = curX - origin.x;
    let dy = curY - origin.y;
    const dist = Math.min(MAX_DRAG, Math.hypot(dx, dy));
    if (dist < FIRE_MIN_DRAG) return;
    const ang = Math.atan2(dy, dx);
    dx = Math.cos(ang) * dist;
    dy = Math.sin(ang) * dist;

    // 発射方向は引っ張りの逆向き(自キャラの性能を反映)
    const me = localUnit();
    const def = CHARACTERS[me.character];
    const { vx0, vy0 } = computeLaunchVelocity(dx, dy, def);
    // 悪魔の必殺を構えている間は弾が直進するので、ガイドも重力・風を切って直線にする。
    const straightGuide = specialArmed && isSpecialReady(me) && def.key === 'akuma';
    const gravity = straightGuide ? 0 : GRAVITY * (def.gravityMul || 1);
    const previewT = trajectoryPreviewDuration(vx0, vy0, gravity) * (def.guideMul || 1);
    const steps = 14;
    const windAccel = straightGuide ? 0 : wind.dir * wind.strength * WIND_ACCEL_MAX * def.windMul;

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 1; i <= steps; i++) {
      const t = (previewT * i) / steps;
      const px = anchor.x + vx0 * t + 0.5 * windAccel * t * t;
      const py = anchor.y + vy0 * t + 0.5 * gravity * t * t;
      ctx.beginPath();
      ctx.arc(px, py, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 画面外の敵の方向インジケータ(スクリーン座標)
  function drawOffscreenIndicator() {
    const foe = foeUnit();
    const sx = worldToScreenX(foe.x);
    if (sx >= -UNIT_RADIUS && sx <= VW + UNIT_RADIUS) return;
    const onRight = sx > VW;
    const ix = onRight ? VW - 16 : 16;
    const iy = Math.max(180, Math.min(CONTROL_PANEL_Y - 30, worldToScreenY(foe.y)));
    ctx.save();
    ctx.fillStyle = 'rgba(255,107,107,0.9)';
    ctx.beginPath();
    if (onRight) {
      ctx.moveTo(ix + 10, iy);
      ctx.lineTo(ix - 6, iy - 9);
      ctx.lineTo(ix - 6, iy + 9);
    } else {
      ctx.moveTo(ix - 10, iy);
      ctx.lineTo(ix + 6, iy - 9);
      ctx.lineTo(ix + 6, iy + 9);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('敵', ix + (onRight ? -14 : 14), iy + 4);
    ctx.restore();
  }

  // 発射点から現在地(着弾点)までを一本の電撃ビームとして描く。
  // 影(shadowBlur)は長い線に掛けると重いので使わず、太さ違いの3本重ねで発光に見せる。
  function drawLightningPath(x0, y0, x1, y1, alpha, headRadius) {
    const dx = x1 - x0;
    const dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    if (len < 2) return;
    const nx = -dy / len;
    const ny = dx / len;
    const segments = Math.max(4, Math.min(72, Math.round(len / 26)));
    const now = performance.now();
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // 外側2層は加算合成にして、明るい地形の上でも発光が沈まないようにする。
    const layers = [
      { w: 18, c: 'rgba(120,60,235,0.5)', add: true },
      { w: 8, c: 'rgba(196,150,255,0.95)', add: true },
      { w: 2.4, c: '#ffffff', add: false }
    ];
    for (const layer of layers) {
      ctx.globalCompositeOperation = layer.add ? 'lighter' : 'source-over';
      ctx.strokeStyle = layer.c;
      ctx.lineWidth = layer.w;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      for (let s = 1; s < segments; s++) {
        const t = s / segments;
        // 両端は軸上に固定し、中ほどだけ大きく振れさせると雷らしい形になる
        const sway = Math.sin(s * 2.3 + now * 0.021) * 8 * Math.sin(t * Math.PI);
        ctx.lineTo(x0 + dx * t + nx * sway, y0 + dy * t + ny * sway);
      }
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    if (headRadius > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const head = ctx.createRadialGradient(x1, y1, 0, x1, y1, headRadius * 3.4);
      head.addColorStop(0, 'rgba(255,255,255,1)');
      head.addColorStop(0.32, 'rgba(214,170,255,0.85)');
      head.addColorStop(1, 'rgba(120,60,235,0)');
      ctx.fillStyle = head;
      ctx.beginPath();
      ctx.arc(x1, y1, headRadius * 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawProjectile() {
    for (const b of lightningBeams) {
      drawLightningPath(b.x0, b.y0, b.x1, b.y1, Math.max(0, b.life / b.maxLife) * 0.9, 0);
    }
    for (const p of projectiles) {
      if (p.lightning) {
        drawLightningPath(p.originX, p.originY, p.x, p.y, 1, 4.6);
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));

      if (p.fireworkShard) {
        ctx.shadowColor = '#ff9d42';
        ctx.shadowBlur = 12;
        const spark = ctx.createLinearGradient(-24, 0, 10, 0);
        spark.addColorStop(0, 'rgba(255,116,40,0)');
        spark.addColorStop(0.55, '#ffb84a');
        spark.addColorStop(1, '#fff3b0');
        ctx.strokeStyle = spark;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-24, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();
        ctx.fillStyle = '#fff5bb';
        ctx.beginPath();
        ctx.arc(10, 0, 3.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.pierce) {
        // 貫通弾は高密度のエネルギーボルト。芯・外光・速度線を分けて描く。
        ctx.shadowColor = '#5de8ff';
        ctx.shadowBlur = 18;
        const beam = ctx.createLinearGradient(-32, 0, 13, 0);
        beam.addColorStop(0, 'rgba(79,195,247,0)');
        beam.addColorStop(0.55, 'rgba(79,195,247,0.48)');
        beam.addColorStop(1, '#dfffff');
        ctx.strokeStyle = beam;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(-32, 0);
        ctx.lineTo(12, 0);
        ctx.stroke();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-20, 0);
        ctx.lineTo(15, 0);
        ctx.stroke();
        ctx.fillStyle = '#eaffff';
        ctx.beginPath();
        ctx.moveTo(17, 0);
        ctx.lineTo(7, -6);
        ctx.lineTo(7, 6);
        ctx.closePath();
        ctx.fill();
      } else {
        // 通常弾は金属製の砲弾。飛翔方向に合わせた尾・胴・帯・先端で立体感を出す。
        const hot = p.blastMul > 1.45;
        const trail = ctx.createLinearGradient(-30, 0, -4, 0);
        trail.addColorStop(0, 'rgba(255,120,36,0)');
        trail.addColorStop(0.55, hot ? 'rgba(255,80,20,0.45)' : 'rgba(255,192,74,0.30)');
        trail.addColorStop(1, hot ? 'rgba(255,223,112,0.92)' : 'rgba(255,238,170,0.72)');
        ctx.strokeStyle = trail;
        ctx.lineWidth = hot ? 7 : 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-30, 0);
        ctx.lineTo(-4, 0);
        ctx.stroke();

        ctx.shadowColor = hot ? '#ff5b22' : '#ffd45c';
        ctx.shadowBlur = hot ? 16 : 9;
        const shell = ctx.createLinearGradient(0, -6, 0, 6);
        shell.addColorStop(0, '#fff2b0');
        shell.addColorStop(0.28, hot ? '#d85a24' : '#9a7541');
        shell.addColorStop(0.72, hot ? '#71301f' : '#40372e');
        shell.addColorStop(1, '#17191d');
        ctx.fillStyle = shell;
        ctx.beginPath();
        ctx.moveTo(11, 0);
        ctx.quadraticCurveTo(6, -6, -5, -5);
        ctx.lineTo(-9, -3);
        ctx.lineTo(-9, 3);
        ctx.lineTo(-5, 5);
        ctx.quadraticCurveTo(6, 6, 11, 0);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(0,0,0,0.78)';
        ctx.lineWidth = 1.3;
        ctx.stroke();
        ctx.fillStyle = hot ? '#ff9d42' : '#d0a451';
        ctx.fillRect(-4, -5, 3, 10);
        ctx.strokeStyle = 'rgba(255,255,255,0.48)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-3, -3.2);
        ctx.lineTo(5.5, -2.4);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  const continueBtn = { x: VW / 2, y: VH / 2 + 72, w: 210, h: 46 };
  const resultTitleBtn = { x: VW / 2, y: VH / 2 + 132, w: 210, h: 42 };

  // 決着直後、結果画面を出す前に「何で決まったか」を見せる。
  // 撃破と落下では立ち回りの反省点が違うので、区別が付かないと学べない。
  const MATCH_END_LABELS = {
    '撃破': { sub: 'KNOCKOUT', color: '#ff9d42' },
    '落下': { sub: 'RING OUT', color: '#59c9ff' },
    '時間切れ': { sub: 'TIME UP', color: '#ffd24a' }
  };

  // 収まらない名前は末尾を「…」に詰める。詰めないと右隣のキャラ名に重なる。
  function fitText(text, font, maxWidth) {
    ctx.save();
    ctx.font = font;
    let s = String(text == null ? '' : text);
    if (ctx.measureText(s).width <= maxWidth) { ctx.restore(); return s; }
    while (s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
    ctx.restore();
    return s + '…';
  }

  // 記録に残っているキャラのキーから表示名を引く。未登録の古い記録は「−」。
  function characterLabel(key) {
    const def = key && CHARACTERS[key];
    return def ? def.name : '−';
  }

  function drawRankingRow(y, rank, name, streak, eff, highlight, character) {
    const w = 466;
    const left = VW / 2 - w / 2;
    ctx.save();
    ctx.fillStyle = highlight ? 'rgba(199,131,53,0.26)' : (rank % 2 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.16)');
    ctx.fillRect(left, y - 15, w, 30);
    if (highlight) {
      ctx.strokeStyle = UI.gold;
      ctx.lineWidth = 1.6;
      ctx.strokeRect(left + 0.8, y - 14.2, w - 1.6, 28.4);
    }
    ctx.restore();
    // 上位3人は色を変えて一目で分かるようにする
    const rankColor = rank === 1 ? '#ffd24a' : rank === 2 ? '#dfe6ef' : rank === 3 ? '#e0a26a' : UI.brassLabel;
    drawOutlinedText(String(rank), left + 30, y + 5, {
      font: `900 ${rank <= 3 ? 19 : 15}px ${UI_FONT_HEAVY}`, color: rankColor, lineWidth: 3.5
    });
    const nameFont = `900 15px ${UI_FONT_HEAVY}`;
    drawOutlinedText(fitText(name, nameFont, 168), left + 56, y + 5, {
      font: nameFont, color: highlight ? '#fff' : UI.parchment, lineWidth: 3.5, align: 'left'
    });
    const charFont = `900 12px ${UI_FONT_HEAVY}`;
    drawOutlinedText(fitText(characterLabel(character), charFont, 98), left + 240, y + 5, {
      font: charFont, color: highlight ? '#ffe3ab' : UI.brassLabel, lineWidth: 3, align: 'left'
    });
    drawOutlinedText(`${streak}`, left + w - 96, y + 5, {

  function drawMatchEndReason() {
    if (!matchEndBannerVisible()) return;
    const style = MATCH_END_LABELS[matchEndReason] || MATCH_END_LABELS['撃破'];
    const progress = 1 - matchEndPause / MATCH_END_BANNER;
    // 出だしで素早く現れ、最後に軽く消える
    const alpha = Math.min(1, progress * 6) * Math.min(1, matchEndPause * 4);
    const bandY = VH * 0.34;
    const bandH = 130;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(2,5,10,0.72)';

    ctx.lineWidth = 2;
    ctx.strokeRect(0, bandY + 1, VW, bandH - 2);
    // 出だしだけ少し大きく見せて衝撃を出す
    const scale = 1 + 0.16 * Math.max(0, 1 - progress * 4);
    ctx.translate(VW / 2, bandY + bandH / 2);

  // 通信の途中経過を控えておき、拒否された時にまとめてコピーできるようにするボタン。
  const onlineLogCopyBtn = { x: VW / 2, y: VH * 0.36 + 96, w: 220, h: 34 };
  let onlineLogCopyStatus = '';
  async function copyOnlineLog() {
    if (!online || !online.log || !online.log.length) { onlineLogCopyStatus = 'ログがありません'; return; }
    const text = JSON.stringify({ room: online.room, role: online.role, seat: online.seat, log: online.log });
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        onlineLogCopyStatus = 'コピーしました';
        return;
      }
      throw new Error('unsupported');
    } catch (_) { /* 下の手段へ落とす */ }
    // navigator.clipboard は権限や文脈で失敗することがある(実機で発生)。
    // 選択済みのテキストエリアを一時的に置き、旧APIでコピーし直す。
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(area);
      onlineLogCopyStatus = ok ? 'コピーしました' : 'コピーできません。共有ボタンをお試しください';
      if (ok) return;
    } catch (_) { /* 最後の手段へ */ }
    // それも駄目なら共有シートに載せる。スマホではこれが一番通りやすい。
    try {
      if (navigator.share) { await navigator.share({ title: 'カタモン 通信ログ', text }); onlineLogCopyStatus = '共有しました'; return; }
    } catch (_) { /* ユーザーが閉じただけの場合も含む */ }
    onlineLogCopyStatus = 'コピーできません。localStorage の katamon_online_log_v1 を確認してください';
  }

  // 敗北時は連勝が既に0でランキング送信も済んでおり、守るものが無いので従来どおり。
  function keepsRunOnExit() {
    return matchOver && battleMode !== 'free' && !isOnline() && localWon();
  }

  function suspendRunToTitle() {
    // resetMatch の末尾はステージBGMを鳴らし直すので、先にタイトルへ移してから呼ぶ。
    gamePhase = 'title';
    resetMatch(true);      // つぎの試合(ボス戦の判定・地形・キャラ・必殺チャージの持ち越し)を用意
    saveSuspendedMatch();  // winStreak / runStats / isBossMatch ごと保存される
    hasSuspendedSave = true;
    returnToTitleFromResult();
  }

  function returnToTitleFromResult() {
    stopStageBgm();
    projectiles = [];
    aimState = null;
    moveDir = 0;
    inputMode = null;
    awaitingResolve = false;
    matchOver = false;
    matchEndPause = 0;
    matchEndReason = '';
    turnSettle = TURN_SETTLE_SEC;
    winner = null;
    cutIn = null;
    gamePhase = 'title';
    startTitleBgm();
  }

  function exitOnlineFromMenu() {
    if (online && online.kind === 'firebase') {
      const leaving = online;
      menuOpen = false;
      // メニューに「オンライン対戦を退出します」と明記しているので、その場で退出させる。
      // 通知とFirebaseの片付けは裏で続け、端末側は通信不調でも必ずタイトルへ戻す。
      const bye = netSend({ t: 'bye' });
      Promise.resolve(bye).catch(() => false).then(() => {
        const path = leaving.role === 'host' ? `rooms/${leaving.room}` : `rooms/${leaving.room}/slots/${leaving.seat}`;
        return firebaseRequest(path, leaving.auth, { method: 'DELETE' });
      }).catch(() => {});
      endOnline(false, false);
      hasSuspendedSave = false;
      returnToTitleFromResult();
      return;
    }
    // loopbackは従来どおり即時終了。
    endOnline(true);
    menuOpen = false;
    hasSuspendedSave = false;
    returnToTitleFromResult();
  }

  // ===== ミニマップ(ステージ全体とカメラの可視範囲を表示) =====
  const MINIMAP = { x: 13, y: 120, w: VW - 26, h: 56 };
  function isInMinimap(p) {
    return p.x >= MINIMAP.x && p.x <= MINIMAP.x + MINIMAP.w
      && p.y >= MINIMAP.y && p.y <= MINIMAP.y + MINIMAP.h;
  }
  function moveCameraFromMinimap(point, snapToMarker = false) {
    const pad = 4;
    const innerX = MINIMAP.x + pad;
    const innerY = MINIMAP.y + pad;
    const innerW = MINIMAP.w - pad * 2;
    const innerH = MINIMAP.h - pad * 2;
    const mapWorldTop = 260;
    const mapWorldBottom = Math.max(CONTROL_PANEL_Y + 8, GROUND_MAX_Y + 44);
    const mapWorldH = mapWorldBottom - mapWorldTop;
    const toMapX = x => innerX + (Math.max(0, Math.min(STAGE_W, x)) / STAGE_W) * innerW;
    const toMapY = y => innerY + Math.max(0, Math.min(1, (y - mapWorldTop) / mapWorldH)) * innerH;

    // P/Eマーカーを直接タップした時は、圧縮座標の誤差を挟まず本人の中心へ合わせる。
    if (snapToMarker) {
      for (const unit of units) {
        if (Math.hypot(point.x - toMapX(unit.x), point.y - toMapY(unit.y)) <= 18) {
          focusCameraOn(unit.x, true);
          return;
        }
      }
    }

    const ratio = Math.max(0, Math.min(1, (point.x - innerX) / innerW));
    cameraX = centerCameraOn(ratio * STAGE_W);
    cameraTargetX = null;
  }
  // 世界全体を圧縮する縦長ミニマップ。STAGE_Wだけを参照するため、将来の横長ステージにも追従する。
  function drawMinimap() {
    const map = MINIMAP;
    const pad = 4;
    const innerX = map.x + pad;
    const innerY = map.y + pad;
    const innerW = map.w - pad * 2;
    const innerH = map.h - pad * 2;
    const mapWorldTop = 260;
    const mapWorldBottom = Math.max(CONTROL_PANEL_Y + 8, GROUND_MAX_Y + 44);
    const mapWorldH = mapWorldBottom - mapWorldTop;
    const toMapX = x => innerX + (Math.max(0, Math.min(STAGE_W, x)) / STAGE_W) * innerW;
    const toMapY = y => innerY + Math.max(0, Math.min(1, (y - mapWorldTop) / mapWorldH)) * innerH;

    ctx.save();
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(map.x, map.y, map.w, map.h, 6) : ctx.rect(map.x, map.y, map.w, map.h);
    ctx.fillStyle = 'rgba(3,9,19,0.34)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(199,131,53,0.85)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.rect(innerX, innerY, innerW, innerH);
    ctx.clip();

    // solidGridの実際の塊を圧縮して描き、浮島の下や爆破穴を空洞のまま残す。
    const startRow = Math.max(0, Math.floor(mapWorldTop / ROW_H));
    const endRow = Math.min(ROWS - 1, Math.ceil(mapWorldBottom / ROW_H));
    const terrainFill = ctx.createLinearGradient(0, innerY, 0, innerY + innerH);
    terrainFill.addColorStop(0, 'rgba(235,243,255,0.30)');
    terrainFill.addColorStop(1, 'rgba(78,116,155,0.54)');
    ctx.fillStyle = terrainFill;
    ctx.beginPath();
    for (let c = 0; c < TERRAIN_COLS; c++) {
      const x0 = innerX + c / TERRAIN_COLS * innerW;
      const x1 = innerX + (c + 1) / TERRAIN_COLS * innerW;
      let runStart = -1;
      for (let r = startRow; r <= endRow + 1; r++) {
        const solid = r <= endRow && solidGrid[r * TERRAIN_COLS + c] === 1;
        if (solid && runStart < 0) runStart = r;
        if (!solid && runStart >= 0) {
          const y0 = toMapY(runStart * ROW_H);
          const y1 = toMapY(r * ROW_H);
          ctx.rect(x0, y0, Math.max(1, x1 - x0 + 0.25), Math.max(1, y1 - y0));
          runStart = -1;
        }
      }
    }
    ctx.fill();

    // 各地形塊の上面と下面を細く縁取りし、浮島であることを判別しやすくする。
    ctx.beginPath();
    for (let c = 0; c < TERRAIN_COLS; c++) {
      const x0 = innerX + c / TERRAIN_COLS * innerW;
      const x1 = innerX + (c + 1) / TERRAIN_COLS * innerW;
      for (let r = startRow; r <= endRow; r++) {
        if (solidGrid[r * TERRAIN_COLS + c] !== 1) continue;
        const aboveSolid = r > startRow && solidGrid[(r - 1) * TERRAIN_COLS + c] === 1;
        const belowSolid = r < endRow && solidGrid[(r + 1) * TERRAIN_COLS + c] === 1;
        if (!aboveSolid) {
          const y = toMapY(r * ROW_H);
          ctx.moveTo(x0, y);
          ctx.lineTo(x1, y);
        }
        if (!belowSolid) {
          const y = toMapY((r + 1) * ROW_H);
          ctx.moveTo(x0, y);
          ctx.lineTo(x1, y);
        }
      }
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.82)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 鎖は省き、実際に砲弾判定を持つ先端障害物だけをミニマップへ表示する。
    if (currentPattern === 'tieredBasin') {
      const now = simTimeMs;
      ctx.fillStyle = '#d7a04e';
      ctx.strokeStyle = '#fff2c2';
      ctx.lineWidth = 0.8;
      for (const obstacle of arenaObstacles) {
        const p = arenaObstaclePosition(obstacle, now);
        ctx.beginPath();
        ctx.arc(toMapX(p.x), toMapY(p.y), 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    // 現在カメラに映っている横幅を淡く表示して、ズーム時の位置を把握しやすくする。
    const cameraMapX = toMapX(cameraX);
    const cameraMapW = Math.min(STAGE_W, visibleWorldWidth()) / STAGE_W * innerW;
    ctx.fillStyle = 'rgba(121,214,255,0.13)';
    ctx.fillRect(cameraMapX, innerY, cameraMapW, innerH);
    ctx.strokeStyle = 'rgba(143,229,255,0.88)';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(cameraMapX + 0.5, innerY + 0.5, Math.max(1, cameraMapW - 1), innerH - 1);
    const drawUnitMark = (u, color, label) => {
      const x = toMapX(u.x), y = toMapY(u.y);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.24;
      ctx.beginPath(); ctx.moveTo(x, innerY); ctx.lineTo(x, y); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, x, Math.max(innerY + 8, y - 6));
    };
    drawUnitMark(localUnit(), '#4fc3f7', 'P');
    drawUnitMark(foeUnit(), '#ff6b6b', 'E');
    ctx.restore();

    const heightGap = Math.round(Math.abs(localUnit().y - foeUnit().y));
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('MAP', map.x + 7, map.y + 11);
    ctx.textAlign = 'right';
    ctx.fillText(`ΔH ${heightGap}`, map.x + map.w - 7, map.y + 11);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText(`${Math.round(cameraZoom * 100)}%`, map.x + map.w / 2, map.y + map.h - 6);
    ctx.restore();
  }

  function drawCutIn() {
    if (!cutIn) return;
    const elapsed = cutIn.duration - cutIn.timer;
    const fadeIn = Math.min(1, elapsed / 0.15);
    const fadeOut = Math.min(1, cutIn.timer / 0.25);
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, VH * 0.4, VW, 120);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, VH * 0.4, VW, 120);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(cutIn.text, VW / 2, VH * 0.4 + 62);
    if (cutIn.sub) {
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText(cutIn.sub, VW / 2, VH * 0.4 + 92);
    }

  function drawSpecialButton() {
    // 花火が飛んでいる間は、このボタンが手動起爆に切り替わる。
    const me = localUnit();
    const detonatable = isLocalTurn() && !matchOver && !netInputLocked() && !!localFireworkInFlight();
    const ready = detonatable || isSpecialReady(me);
    const active = ready && isLocalTurn() && !awaitingResolve && !matchOver && !cutIn && !netInputLocked();
    const chargeRatio = detonatable ? 1 : me.specialCharge / SPECIAL_CHARGE_MAX;
    const def = CHARACTERS[me.character];
    ctx.save();
    // 台座の影
    ctx.beginPath();
    ctx.arc(specialBtn.x, specialBtn.y + 3, specialBtn.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.fill();

    // 黒鉄の本体(発動待機中は灼熱色)
    const sBody = ctx.createRadialGradient(
      specialBtn.x - specialBtn.r * 0.35, specialBtn.y - specialBtn.r * 0.4, specialBtn.r * 0.1,
      specialBtn.x, specialBtn.y, specialBtn.r
    );
    if (specialArmed || detonatable) {
      sBody.addColorStop(0, '#ffb45e'); sBody.addColorStop(0.55, '#e0642a'); sBody.addColorStop(1, '#7a2410');
    } else if (ready) {
      sBody.addColorStop(0, '#574a26'); sBody.addColorStop(0.6, '#332c17'); sBody.addColorStop(1, '#15120a');
    } else {
      sBody.addColorStop(0, '#2b333a'); sBody.addColorStop(0.6, '#1a2026'); sBody.addColorStop(1, '#0c1014');
    }
    ctx.beginPath();
    ctx.arc(specialBtn.x, specialBtn.y, specialBtn.r, 0, Math.PI * 2);
    ctx.fillStyle = sBody;
    ctx.fill();

    // 真鍮の外輪(溜まりきると発光)
    if (ready) { ctx.shadowColor = (specialArmed || detonatable) ? '#ffd08a' : UI.gold; ctx.shadowBlur = 14; }
    ctx.strokeStyle = (specialArmed || detonatable) ? '#fff2d0' : ready ? UI.gold : 'rgba(126,116,99,0.5)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(specialBtn.x, specialBtn.y, specialBtn.r - 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 外周ゲージで0〜MAXの充填量を常時見せる。
    if (chargeRatio > 0) {
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(
        specialBtn.x,
        specialBtn.y,
        specialBtn.r - 7,
        -Math.PI / 2,
        -Math.PI / 2 + Math.PI * 2 * chargeRatio
      );
      ctx.strokeStyle = ready ? UI.gold : 'rgba(255,210,74,0.72)';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
    ctx.restore();

    ctx.save();
    ctx.textBaseline = 'middle';
    drawOutlinedText(detonatable ? '起爆' : '必殺', specialBtn.x, specialBtn.y - 12, {
      font: `900 13px ${UI_FONT_HEAVY}`,
      color: ready ? UI.parchment : 'rgba(226,232,240,0.6)', lineWidth: 3.5
    });
    drawOutlinedText(detonatable ? 'BOOM' : def.special, specialBtn.x, specialBtn.y + 2, {
      font: `900 8px ${UI_FONT_HEAVY}`,
      color: ready ? UI.brassLight : 'rgba(226,232,240,0.5)', lineWidth: 3
    });
    drawOutlinedText(detonatable ? 'TAP' : ready ? 'MAX' : `${me.specialCharge}/${SPECIAL_CHARGE_MAX}`, specialBtn.x, specialBtn.y + 17, {
      font: `900 11px ${UI_FONT_HEAVY}`,
      color: ready ? UI.gold : 'rgba(226,232,240,0.62)', lineWidth: 3
    });
