    character: null, specialCharge: 0, moveLockTurns: 0, jumpAvailable: true
  };
  // 2vs2の3人目・4人目。1vs1の間は units へ入れないので、既存の進行に一切影響しない。
  const ally2 = {
    x: STAGE_W * 0.3, y: 0, vy: 0, grounded: true, fallStartY: 0,
    hp: MAX_HP, maxHp: MAX_HP, fuel: FUEL_MAX, fuelMax: FUEL_MAX,
    color: '#8fd8ff', label: 'ALLY',
    id: 'p2', team: 'player', control: 'cpu',
    character: null, specialCharge: 0, moveLockTurns: 0, jumpAvailable: true
  };
  const foe2 = {
    x: STAGE_W * 0.7, y: 0, vy: 0, grounded: true, fallStartY: 0,
    hp: MAX_HP, maxHp: MAX_HP, fuel: FUEL_MAX, fuelMax: FUEL_MAX,
    color: '#ffa07a', label: 'CPU2',
    id: 'e2', team: 'cpu', control: 'cpu',
    character: null, specialCharge: 0, moveLockTurns: 0, jumpAvailable: true
  };
  const units = [player, cpu];
  // '1v1' | '2v2'。units の中身を差し替えるだけで、進行ロジックには手を入れない。
  // 手番は units の並びから作る(resetMatch の turnOrder)。味方と敵が交互になる順で入れる。
  let matchFormat = '1v1';
  function is2v2() { return matchFormat === '2v2'; }
  function setMatchFormat(format) {
    matchFormat = format === '2v2' ? '2v2' : '1v1';
    units.length = 0;
    if (matchFormat === '2v2') units.push(player, cpu, ally2, foe2);
    else units.push(player, cpu);
  }

  function unitById(id) {
    for (const u of units) if (u.id === id) return u;
    return null;
  }

  // ===== 席(この端末がどのユニットに座っているか) =====
  // CPU戦では常に 'p1'。オンライン対戦のゲスト側は 'e1'(画面右)に座ることになるので、
  // 入力・HUD・カメラ・結果画面は player/cpu を直接見ず、必ずこの2つを通す。
  // 逆に「プレイヤー陣営」の話(キャラ選択・連勝・ランキング)は team で判断すること。
  let localUnitId = 'p1';
  function localUnit() { return unitById(localUnitId) || units[0]; }
  // 「代表して1体だけ見せたい」場面(画面外インジケータ・結果画面・高低差表示)で使う敵。
  // 2vs2では倒れた敵を指し続けないよう、生きている敵のうち一番近い方を選ぶ。
  function foeUnit() {
    const me = localUnit();
    let best = null;
    let bestDist = Infinity;
    for (const u of units) {
      if (u.team === me.team) continue;
      if (!best) best = u; // 全滅していても null を返さないための保険
      if (u.hp <= 0) continue;
      const d = Math.abs(u.x - me.x);
      if (bestDist === Infinity || d < bestDist) { bestDist = d; best = u; }
    }
    return best || me;
  }
  // 「勝ったのはこの端末の陣営か」。winner は陣営名なので席を見て判定する。
  function localWon() { return winner != null && winner !== 'draw' && winner === localUnit().team; }
  function isDraw() { return winner === 'draw'; }
  // 手番の知らせに出す2行。2vs2は4体居るので「CPUのターン」だけでは、
  // 味方のCPUなのか敵のCPUなのかも、4体のうちどれなのかも分からない(実機で指摘)。
  // 見出しはHPカードと同じ呼び名にして、カードと見比べられるようにする。
  function turnCutInLines(u) {
    if (!u) return { text: '', sub: '', color: '#fff' };
    const mine = u.team === localUnit().team;
    const isCpu = u.control === 'cpu' || unitSeatIsCpu(u);
    const role = u.id === localUnitId ? 'あなたのターン' : (mine ? '味方のターン' : '相手のターン');
    const sub = u.id === localUnitId || !isCpu ? role : `${role}（CPU）`;
    // ターンバーは常に出ているので短く。カットインが消えた後もここで誰の番か分かる。
    return { text: u.label, sub, short: `${u.label} ${role}`, color: mine ? UI.ally : UI.enemy };
  }
  // そのユニットの席に人が座っていないか。2vs2の空席＝CPUの担当(決定3)。
  function unitSeatIsCpu(u) {
    if (!u || !online || online.kind !== 'firebase' || !firebaseLobbyIs2v2()) return false;
    return firebaseCpuSeats().some(seat => firebaseSeatUnitId(seat) === u.id);
  }
  // 席を移すと操作権も一緒に動く。相手をAIにするか相手端末にするかで control が変わる。
  function setSeat(id, foeControl) {
    if (!unitById(id)) return;
    localUnitId = id;
    for (const u of units) u.control = (u.id === id) ? 'local' : foeControl;
  }
  function setLocalSeat(id) { setSeat(id, 'cpu'); }   // CPU戦
  // オンライン対戦。渡すのは「席」で、動かすのはその席に結ばれたユニット。
  // 1vs1では席名とユニット名が一致するので、これまでと同じ動きになる。
  function setOnlineSeat(seat) {
    setSeat(firebaseSeatUnitId(seat), 'remote');
    // 2vs2で誰も座っていない席はCPUが埋める(決定3)。動かすのはホストの端末だけで、
    // ほかの端末はその結果を受け取る側なので remote のまま置く。CPUの照準には乱数が
    // 混ざるため、各端末で同じ結果を再現させる道は取らない(Issue #26)。
    if (!isFirebaseHost() || !firebaseLobbyIs2v2()) return;
    for (const emptySeat of firebaseCpuSeats()) {
      const u = unitById(firebaseSeatUnitId(emptySeat));
      if (u && u.control !== 'local') u.control = 'cpu';
    }
  }
  // この端末がそのユニットの行動を決めて配る側か。自分の席のキャラに加え、
  // 2vs2の空席のCPUはホストが動かす。通信の送信側はすべてここを通す。
  function netControlsUnit(u) {
    if (!u) return false;
    if (u.control === 'local') return true;
    return u.control === 'cpu' && isFirebaseHost();
  }
  // 席とcontrolの割り当てを1行で残す。実機で「ターンバーはあなた、ダイヤルは相手」という
  // 食い違いが出た。両者は localUnitId と control を別々に見ているため、ここがズレると起きる。
  function logSeatAssignment(where) {
    if (!online || online.kind !== 'firebase') return;
    logOnlineEvent({
      type: 'seats', where, seat: online.seat, localUnitId,
      controls: units.map(u => `${u.id}:${u.control}`).join(','),
      active: (activeUnit() || {}).id
    });
  }

  // オンライン対戦中かどうか。UI・連勝・中断まわりの分岐はすべてこれを見る。
  // 中身は §オンライン対戦 で作る。ここで宣言だけ先にしておくのは、
  // 初期化時に走る中断セーブの読み込みより前に参照できるようにするため。
  let online = null;
  function isOnline() { return online !== null; }
  // 相手待ち・決着後は自分の操作を受け付けない。
  // ガードは launchShot ではなく入力受付レイヤに置く(必殺の保留中に状態が届いても二重発射しないため)。
  function netInputLocked() { return isOnline() && (online.phase !== 'playing' || online.participantRole === 'spectator'); }
  // 開発用の入口。完成していない機能なのでタイトルには何も出していない。
  //   ?seat=e1                      … 右側の席に座ってCPU戦を通す(視点の切り離しの確認)
  //   ?loopback=host / =guest       … 同一端末の2タブで対戦する(Stage 2b)
  //   ?netdelay=500&netloss=0.1     … 遅延(ms)とパケットロス(0〜0.9)を注入する
  const devParams = (() => {
    try { return new URLSearchParams(location.search); } catch (_) { return null; }
  })();
  if (devParams) {
    const seatParam = devParams.get('seat');
    if (seatParam === 'p1' || seatParam === 'e1') setLocalSeat(seatParam);
  }

  // 弾の owner はユニットIDなので、陣営を見るには一度ユニットを引き直す。
  function teamOfOwner(owner) {
    const u = unitById(owner);
    return u ? u.team : null;
  }

  function teamAlive(team) {
    for (const u of units) if (u.team === team && u.hp > 0) return true;
    return false;
  }

  // 自分から見て一番近い敵。CPUの狙う相手を決めるのに使う。
  function nearestEnemy(u) {
    let best = null;
    let bestDist = Infinity;
    for (const other of units) {
      if (other.team === u.team || other.hp <= 0) continue;
      const d = Math.abs(other.x - u.x);
      if (d < bestDist) { bestDist = d; best = other; }
    }
    return best;
  }

  // u.facingLeft は「画像を左右反転するか」を表すフラグであって、「世界で左を向いているか」
  // ではない。元画像が左向きのキャラ(facesLeft)は反転すると右を向くため、この2つは意味が
  // 逆になる。v91で向きの再判定を足した際にこの変換が抜け、facesLeftの7体が相手に背を
  // 向けたまま撃つ状態になっていた(2026-08-02に実機で発覚)。
  // 変換は必ずこの2つの関数を通すこと。式を各所へ直接書くと同じ食い違いが再発する。
  function spriteFlipForFacing(u, faceLeftInWorld) {
    return faceLeftInWorld !== !!CHARACTERS[u.character]?.facesLeft;
  }
  function unitFacesLeftInWorld(u) {
    // 未設定なら初期配置どおり(プレイヤーは右、CPUは左を向く)として扱う。
    if (u.facingLeft == null) return u.team === 'cpu';
    return u.facingLeft !== !!CHARACTERS[u.character]?.facesLeft;
  }
  function faceUnitTowardOpponent(u) {
    const foe = nearestEnemy(u);
    if (foe) u.facingLeft = spriteFlipForFacing(u, foe.x < u.x);
  }
  function faceAllUnitsTowardOpponents() {
    for (const u of units) faceUnitTowardOpponent(u);
  }

  // 撃破済みの判定はここ1か所だけ。**絵を薄くする条件と、爆風が当たる条件を必ず同じにする。**
  // 別々に書いていた頃は、2vs2で薄くなっているキャラの上にダメージ数字が出ていた(実機報告)。
  function unitDefeated(u) {
    return !u || u.hp <= 0;
  }

  // 与ダメ効率に積むのは「プレイヤー陣営が敵陣営へ与えた分」だけ。自爆や味方誤爆は数えない。
  function creditDamage(owner, target, amount) {
    if (teamOfOwner(owner) === 'player' && target.team !== 'player') runStats.damageDealt += amount;
  }

  function applyCharacter(u, key) {
    const def = CHARACTERS[key];
    u.character = key;
    u.maxHp = def.maxHp;
    u.hp = def.maxHp;
    u.fuelMax = Math.round(FUEL_MAX * def.fuelMul);
    u.fuel = u.fuelMax;
    u.color = def.color;
    u.label = def.name;
    u.moveLockTurns = 0;
    u.facingLeft = null;
  }

  function unitAnchor(u) {
    // キャラの中心(発射基点/爆風判定の基点)
    return { x: u.x, y: u.y };
  }

  // 開始位置の足場探し。狙った場所に地面が無ければ、そこから外側→内側の順に近い足場を探す。
  // 闘技場マップは中央が奈落なので、2vs2の内側2体(p2/e2)を比率どおりに置くと開幕で落ちて即死する
  // (実際に4体中2体が0秒で死んだ)。1vs1は今までどおり比率の場所がそのまま足場なので、
  // 探索は1回目で当たり、開始位置は1pxも変わらない。
  const SPAWN_SEARCH_RANGE = 280; // これ以上離すと陣営の左右が入れ替わりかねない
  const SPAWN_MIN_GAP = 44;       // 味方同士が重なって出ないための最低間隔
  function spawnXNear(desiredX, placed) {
    const outward = desiredX < STAGE_W / 2 ? -1 : 1; // 奈落は中央側にあるので、まず外へ逃がす
    const ok = x => {
      if (x < UNIT_RADIUS || x > STAGE_W - UNIT_RADIUS) return false;
      if (groundYAt(x) >= DEAD_LINE_Y) return false; // 地面が無い/死線より下の足場
      for (const other of placed) if (Math.abs(other.x - x) < SPAWN_MIN_GAP) return false;
      return true;
    };
    if (ok(desiredX)) return desiredX;
    for (let offset = COL_W; offset <= SPAWN_SEARCH_RANGE; offset += COL_W) {
      const first = desiredX + offset * outward;
      if (ok(first)) return first;
      const second = desiredX - offset * outward;
      if (ok(second)) return second;
    }
    return desiredX; // どこにも足場が無い地形。従来どおり比率の位置へ置く
  }

  function initUnitOnGround(u) {
    u.y = groundYAt(u.x) - UNIT_RADIUS;
    u.vy = 0;
    u.grounded = true;
    u.fallStartY = u.y;
  }

  // ===== 風 =====
  const WIND_ACCEL_MAX = 260; // px/s^2
  const CALM_WIND_CHANCE = 0.18; // 風が切り替わる区間ごとに無風になる確率
  const CALM_BATTLE_CHANCE = 0.06; // 対戦全体が無風になる確率
  let wind = { dir: 1, strength: 0 }; // strength: 0..1
  let calmWind = false;
  let calmBattle = false;

  // 固定風の指定を一箇所で解決する。フリーモードとオンラインのロビー設定の両方に効く。
  // 以前は rollWind がフリーモードしか見ておらず、ロビーで風を選んでも
  // 実際の対戦はランダム風のままだった。
  function activeFixedWind() {
    if (battleMode === 'free') {
      const selected = WIND_OPTIONS[freeModeConfig.windIndex] || WIND_OPTIONS[0];
      return selected && selected.key !== 'random' ? selected : null;
    }
    if (online && online.kind === 'firebase' && online.settings) {
      const selected = WIND_OPTIONS.find(option => option.key === online.settings.wind);
      return selected && selected.key !== 'random' ? selected : null;
    }
    return null;
  }

  function rollWind() {
    {
      const selected = activeFixedWind();
      if (selected) {
        calmBattle = selected.key === 'calm';
        calmWind = selected.key === 'calm';
        wind.dir = selected.dir || 1;
        wind.strength = selected.strength;
        return;
      }
    }
    calmWind = calmBattle || Math.random() < CALM_WIND_CHANCE;
    if (calmWind) {
      wind.dir = 1;
      wind.strength = 0;
      return;
    }
    wind.dir = Math.random() < 0.5 ? -1 : 1;
    wind.strength = Math.random(); // 0(無風)〜1(強風)
  }

  // ===== 弾道物理 =====
  const GRAVITY = 650; // px/s^2
  const MAX_DRAG = 130; // px
  const VEL_SCALE = 7.8; // 横長ステージでも高角度砲撃が届くよう、旧値から約20%延長
  const FIRE_MIN_DRAG = 12;

  // 引っ張り量(dx,dy)からキャラ性能を反映した発射初速を計算する共通処理(プレビューと実発射で共有)
  // 引っ張った向きをそのまま反映する(狙った角度を歪めない。水平が撃ちにくい問題はVEL_SCALE側で補う)
  function computeLaunchVelocity(dx, dy, def) {
    const vx0 = -dx * VEL_SCALE * def.velScaleMul;
    const vy0 = -dy * VEL_SCALE * def.velScaleMul;
    return { vx0, vy0 };
  }

  let projectiles = []; // [{x,y,vx,vy,owner,radius,blastMul,windMul,gravityMul,pierce,emp,firework}]
  let aimState = null;   // {owner, anchorX, anchorY, curX, curY}

  function fireProjectile(owner, anchor, vx, vy, opts) {
    opts = opts || {};
    const windMul = opts.windMul != null ? opts.windMul : 1;
    const gravityMul = opts.gravityMul != null ? opts.gravityMul : 1;
    projectiles.push({
      x: anchor.x, y: anchor.y, vx, vy, owner, radius: 5,
      originX: anchor.x, originY: anchor.y,   // 電撃ビームを発射点から伸ばすのに使う
      blastMul: opts.blastMul || 1,
      windMul,
      gravityMul,
      // 花火は「いつ・どこで開くか」を発射時に確定させる。飛行中の通信も、
      // フレームごとの積み上げも使わないので両端末で必ず一致する。
      apexBurst: opts.firework && !opts.fireworkShard
        ? fireworkApexBurst(anchor, vx, vy, wind.dir * wind.strength * WIND_ACCEL_MAX * windMul, GRAVITY * gravityMul)
        : null,
      damageMul: opts.damageMul != null ? opts.damageMul : 1,
      pierce: !!opts.pierce,
      emp: !!opts.emp,
      empRadius: opts.empRadius || 90,
      empTurns: opts.empTurns || 2,
      noTerrain: !!opts.noTerrain,
      ignoreObstacles: !!opts.ignoreObstacles,
      lightning: !!opts.lightning,
      firework: !!opts.firework,
      jump: opts.jump != null ? !!opts.jump : !!(unitById(owner) && unitById(owner).jumpShot),
      fireworkShard: !!opts.fireworkShard,
      deathGateMarker: !!opts.deathGateMarker,
      deathGateScythe: !!opts.deathGateScythe,
      fireworkTimer: 0,
      travelDistance: 0,
      shardBlasts: 0,          // 拡散弾が起こし終えた爆発の回数
      deathGateCarves: 0,
      maxDistance: opts.maxDistance || 0,
      hitTargets: []
    });
  }

  // 跳躍の着地点は「弾が当たった場所の下」だけを足場にする。
  // 垂直壁の途中へ当たった場合は、壁の最上面へ吸い上げず、その場から落下させる。
  function jumpLandingSurfaceYAt(x, impactY, p, terrainHit) {
    const surface = walkableGroundYAt(x, impactY + UNIT_RADIUS);
    if (surface === null) return null;
    // 地形衝突は「上から地表を横切った」時だけ着地扱いにする。
    // 横から垂直壁へ当たった場合、列の最上面を拾って壁に張り付くのを防ぐ。
    if (terrainHit) {
      const prevY = Number.isFinite(p.prevY) ? p.prevY : impactY - p.vy * 0.016;
      if (!(p.vy > 0 && prevY <= surface + UNIT_RADIUS * 0.5 && impactY >= surface - UNIT_RADIUS * 0.5)) return null;
    }
    // 着弾点が地表よりかなり下なら、地面ではなく縦壁の側面に当たっている。
    if (impactY > surface + UNIT_RADIUS * 0.75) return null;
    // 左右の地表が取れない、または歩いて登れない急斜面なら張り付かせない。
    const sample = 12;
    const left = walkableGroundYAt(Math.max(0, x - sample), surface + UNIT_RADIUS);
    const right = walkableGroundYAt(Math.min(STAGE_W - 1, x + sample), surface + UNIT_RADIUS);
    if (left === null || right === null) return null;
    const slope = Math.atan2(right - left, sample * 2);
    if (Math.abs(slope) >= MAX_CLIMB_ANGLE) return null;
    return surface;
  }

  function teleportOwnerToImpact(p, x, y, terrainHit = false) {
    if (!p.jump) return;
    p.jump = false;
    const u = unitById(p.owner);
    if (!u || u.hp <= 0) return;
    u.x = Math.min(STAGE_W - UNIT_RADIUS, Math.max(UNIT_RADIUS, x));
    faceAllUnitsTowardOpponents();
    const surface = jumpLandingSurfaceYAt(u.x, y, p, terrainHit);
    if (surface !== null) {
      u.y = surface - UNIT_RADIUS;
      u.grounded = true;
      u.vy = 0;
    } else {
      // 壁面衝突ならめり込んだ現在位置を使わず、衝突前の位置へ戻してから落下させる。
      // 闘技場の外壁は画面上端より1400px上まで当たり判定を持つ(ARENA_WALL_SKY_EXTENSION)。
      // 跳躍も内部的には砲弾なのでそこへ当たるが、その領域は地形キャンバスの外で
      // 着地面を取れない。以前は下限 -UNIT_RADIUS で丸めていたため、壁の上端に
      // 乗ったまま画面天井で固まっていた(実機で y=-16 として再現・Issue #9)。
      // 壁の内側へ押し戻し、必ず見える高さから落とす。
      const backX = terrainHit && Number.isFinite(p.prevX) ? p.prevX : u.x;
      const backY = terrainHit && Number.isFinite(p.prevY) ? p.prevY : y - UNIT_RADIUS;
      u.x = Math.min(STAGE_W - UNIT_RADIUS, Math.max(UNIT_RADIUS, clampInsideArenaWall(backX)));
      u.y = Math.max(0, backY);
      u.grounded = false;
      u.vy = 0;
      u.fallStartY = u.y;
    }
    // 発動した手番の終了時に1段階減るため、次の自分の手番を丸ごと封印する。
    u.moveLockTurns = Math.max(u.moveLockTurns || 0, 2);
    if (u.id === localUnitId) focusCameraOn(u.x, true);
    faceUnitTowardOpponent(u);
    pushFloatText(u.x, u.y - UNIT_RADIUS - 12, '跳躍!', '#8ee7ff', 20);
  }

  function rotateVec(vx, vy, deg) {
    const r = deg * Math.PI / 180;
    return { vx: vx * Math.cos(r) - vy * Math.sin(r), vy: vx * Math.sin(r) + vy * Math.cos(r) };
  }

  // ===== 花火(スモエルの必殺)=====
  const FIREWORK_SHARD_BLASTS = [0.5, 0.34, 0.22];  // 拡散弾が進みながら起こす爆発。大→中→小
  const FIREWORK_SHARD_RANGE = 180;                 // 拡散弾が進む距離
  const FIREWORK_SHARD_DAMAGE_MUL = 0.18;           // 拡散弾1発ぶんのダメージは小さく
  const FIREWORK_BURST_DAMAGE_CAP = 22;             // 1炸裂でユニット1体が拡散弾から受ける合計上限
  let fireworkBurstDamage = null;

  // 花火の空中炸裂点。発射条件だけから数式で求めるので、端末のフレームレートにも
  // 通信の遅れにも左右されず、両端末で必ず同じ場所になる(風は飛行中変わらない)。
  // 上へ撃った時だけ弧の頂点で開く。頂点が近すぎる(自分の拡散弾が届く範囲)場合と、
  // 水平・下向きに撃った場合は空中で開かず、従来どおり着弾して開く。
  function fireworkApexBurst(anchor, vx0, vy0, windAccel, gravity) {
    if (!(vy0 < 0) || !(gravity > 0)) return null;
    const t = -vy0 / gravity;
    const x = anchor.x + vx0 * t + 0.5 * windAccel * t * t;
    const y = anchor.y + vy0 * t + 0.5 * gravity * t * t;
    const dx = x - anchor.x, dy = y - anchor.y;
    if (dx * dx + dy * dy < FIREWORK_SHARD_RANGE * FIREWORK_SHARD_RANGE) return null;
    return { t, x, y };
  }

  function spawnFireworkBurst(p) {
    const speed = 360;
    // 8方向は弾の進行方向ではなく世界の絶対角を基準にする。進行方向基準だと
    // 速度のわずかな差で扇の向きが変わり、端末ごとに削れ方がずれる。
    // 打ち上げ花火は飛んできた向きに関係なく丸く開くので、見た目もこちらが自然。
    const baseAngle = 0;
    // 24発ぶんの爆発が素通しで合算されると即死するので、炸裂ごとに被ダメージ上限を持たせる。
    fireworkBurstDamage = {};
    for (const u of units) fireworkBurstDamage[u.id] = 0;
    spawnExplosion(p.x, p.y, 0.55);
    for (let i = 0; i < 8; i++) {
      const angle = baseAngle + (Math.PI * 2 * i) / 8;
      fireProjectile(p.owner, { x: p.x, y: p.y }, Math.cos(angle) * speed, Math.sin(angle) * speed, {
        windMul: 0,
        gravityMul: 0,
        pierce: true,
        fireworkShard: true,
        maxDistance: FIREWORK_SHARD_RANGE
      });
    }
  }

  // 拡散弾の爆発。地形の縁の再構築だけは呼び出し側で1フレームに1回へまとめる。
  function fireworkShardExplode(p, blastMul, x, y) {
    const radius = 44 * blastMul;
    carveCraterInternal(x, y, radius, false);
    craterHistory.push({ x, y, r: radius });
    spawnExplosion(x, y, blastMul * 0.5);
    playCrackleSound(blastMul);
    for (const u of units) {
      if (unitDefeated(u)) continue;
      const dealt = fireworkBurstDamage ? (fireworkBurstDamage[u.id] || 0) : 0;
      const budget = FIREWORK_BURST_DAMAGE_CAP - dealt;
      if (budget <= 0) continue;
      const a = unitAnchor(u);
      const raw = computeDamage(simDistance(a.x, a.y, x, y), blastMul, FIREWORK_SHARD_DAMAGE_MUL);
      if (raw <= 0) continue;
      const takenMul = CHARACTERS[u.character]?.damageTakenMul || 1;
      const dmg = Math.min(budget, Math.max(1, Math.round(raw * takenMul)));
      if (fireworkBurstDamage) fireworkBurstDamage[u.id] = dealt + dmg;
      u.hp = Math.max(0, u.hp - dmg);
      spawnDamageText(a.x, a.y - UNIT_RADIUS - 10, dmg);
      creditDamage(p.owner, u, dmg);
    }
    checkMatchEnd();
  }

  // ===== デスゲート(死神の必殺) =====
  // 印は通常弾と同じく狙った地点へ飛ぶ。ただし爆発・ダメージは起こさず、
  // DEAD LINE から鎌を立ち上げるためのX座標だけを決める。
  // 闘技場の棚を丸ごと消さないよう、射程は固定で短めにしている。
  const DEATH_GATE_RANGE = 260;
  const DEATH_GATE_SPEED = 310;
  // 死線側を広く、上端を細く削って逆三角形の裂け目にする。
  const DEATH_GATE_CARVE_RADIUS_BOTTOM = 26;
  const DEATH_GATE_CARVE_RADIUS_TOP = 8;
  // 下側はゆるく、上側で絞る。直線ではなく丸みのある輪郭になる。
  const DEATH_GATE_CARVE_CURVE_POWER = 3;
  const DEATH_GATE_CARVE_STRIDE = 14;
  // 最初の削りから DEAD LINE を確実に抜けるよう、少し下から鎌を出す。
  const DEATH_GATE_START_DEPTH = 34;

  function spawnDeathGate(p, impactX, impactY) {
    // 着弾位置には印だけを残す。ここではHP・地形を一切変えない。
    spawnExplosion(impactX, impactY, 0.24);
    playCrackleSound(0.45);
    fireProjectile(p.owner, { x: impactX, y: DEAD_LINE_Y + DEATH_GATE_START_DEPTH }, 0, -DEATH_GATE_SPEED, {
      windMul: 0,
      gravityMul: 0,
      pierce: true,
      ignoreObstacles: true,
      deathGateScythe: true,
      maxDistance: DEATH_GATE_RANGE
    });
  }

  // 1フレーム内に何個も削っても地形の縁は呼び出し側で一度しか組み直さない。
  function deathGateCarveRadius(distance, maxDistance) {
    // 最初の削りを底辺、最後の削りを頂点に固定する。距離基準なので端末性能に左右されない。
    const span = Math.max(1, maxDistance - DEATH_GATE_CARVE_STRIDE);
    const progress = Math.min(1, Math.max(0, (distance - DEATH_GATE_CARVE_STRIDE) / span));
    return DEATH_GATE_CARVE_RADIUS_BOTTOM
      + (DEATH_GATE_CARVE_RADIUS_TOP - DEATH_GATE_CARVE_RADIUS_BOTTOM)
        * progress ** DEATH_GATE_CARVE_CURVE_POWER;
  }

  function carveDeathGate(p, x, y, distance) {
    const radius = deathGateCarveRadius(distance, p.maxDistance);
    carveCraterInternal(x, y, radius, false);
    craterHistory.push({ x, y, r: radius });
  }

  // キャラ性能+必殺ショットを反映して発射する共通口。
  // 必殺はカットインを見せ切ってから撃ちたいので、一度保留してから deferred=true で撃ち直す。
  function launchShot(unit, anchor, vx0, vy0, useSpecial, deferred, useJump) {
    const def = CHARACTERS[unit.character];
    const owner = unit.id;
    // 発射直前に両者の現在位置を基準に向きを確定する。
    faceAllUnitsTowardOpponents();
    // 保留から戻ってきた時はチャージを0にした後なので、readyの再判定はしない。
    const activateSpecial = deferred ? !!useSpecial : (useSpecial && isSpecialReady(unit));
    const activateJump = deferred ? !!useJump : (!!useJump && unit.jumpAvailable !== false && unit.moveLockTurns <= 0);

    if (tutorialActive() && unit.id === 'p1' && !deferred) tutorial.stepShots++;
    if (activateJump && !deferred) unit.jumpAvailable = false;
    unit.jumpShot = activateJump;

    if (activateSpecial && !deferred) {
      unit.specialCharge = 0;
      triggerSpecialFlash(`必殺: ${def.special}!!`, def);
      playSpecialSound();
      pendingShot = { timer: SPECIAL_FLASH_DURATION, fire: () => launchShot(unit, anchor, vx0, vy0, true, true, activateJump) };
      return;
    }

    if (activateSpecial && def.key === 'shinigami') {
      // 死神の必殺: 着弾は位置指定だけ。そこからDEAD LINEの鎌が真上へ進み、
      // 固定距離ぶんだけ地形を削る。印にも鎌にも直接ダメージはない。
      fireProjectile(owner, anchor, vx0, vy0, {
        windMul: def.windMul,
        deathGateMarker: true,
        noTerrain: true
      });
    } else if (activateSpecial && def.key === 'medama') {
      // 目玉の必殺: 地形を削らず、着弾点から電磁波を放って移動を封じる。
      fireProjectile(owner, anchor, vx0, vy0, {
        blastMul: def.blastMul,
        windMul: def.windMul,
        emp: true,
        empRadius: def.empRadius,
        empTurns: 2,
        noTerrain: true
      });
    } else if (activateSpecial && def.key === 'iwa') {
      // 岩の必殺: 地形大破壊(巨大クレーター)
      fireProjectile(owner, anchor, vx0, vy0, { blastMul: def.blastMul * 2.6, windMul: def.windMul });
    } else if (activateSpecial && def.key === 'tori') {
      // 鳥の必殺: 貫通せず、風と重力に強い超高速ロケット。
      fireProjectile(owner, anchor, vx0 * 1.45, vy0 * 1.45, {
        blastMul: def.blastMul,
        windMul: def.windMul * 0.55,
        gravityMul: def.gravityMul,
        damageMul: 1.05
      });
    } else if (activateSpecial && def.key === 'kyoryu') {
      // 恐竜の必殺: 強化砲弾(バランス型らしい高威力・大爆風の一撃)
      fireProjectile(owner, anchor, vx0, vy0, { blastMul: def.blastMul * 1.8, windMul: def.windMul });
    } else if (activateSpecial && def.key === 'barugerukan') {
      // バルゲルカンの必殺: 5連掃射(水弾を広範囲へばらまく)
      for (const deg of [-16, -8, 0, 8, 16]) {
        const v = rotateVec(vx0, vy0, deg);
        fireProjectile(owner, anchor, v.vx, v.vy, { blastMul: def.blastMul * 0.76, windMul: def.windMul });
      }
    } else if (activateSpecial && def.key === 'nisenmono') {
      // ニセンモノの必殺: 高速貫通レーザー
      fireProjectile(owner, anchor, vx0 * 1.8, vy0 * 1.8, { blastMul: def.blastMul * 1.2, windMul: def.windMul, pierce: true });
    } else if (activateSpecial && def.key === 'burumutan') {
      // ブルームタンの必殺: 自己回復後に花弾を発射
      const heal = Math.min(30, unit.maxHp - unit.hp);
      unit.hp += heal;
      if (heal > 0) spawnHealText(unit.x, unit.y - 32, heal);
      fireProjectile(owner, anchor, vx0, vy0, {
        blastMul: def.blastMul,
        windMul: def.windMul,
        gravityMul: def.gravityMul
      });
    } else if (activateSpecial && def.key === 'sumoeru') {
      // スモエルの必殺: 着弾・手動起爆・3秒経過のいずれかで8方向へ散る花火。
      // 本体の威力は通常弾と同じ。細かく削るのは拡散弾側の役目。
      fireProjectile(owner, anchor, vx0, vy0, {
        blastMul: def.blastMul,
        windMul: def.windMul,
        firework: true
      });
    } else if (activateSpecial && def.key === 'doRednote') {
      // 弩レッドノートの必殺: 超高速の貫通狙撃
      fireProjectile(owner, anchor, vx0 * 2.15, vy0 * 2.15, { blastMul: def.blastMul * 1.25, windMul: def.windMul, pierce: true });
    } else if (activateSpecial && def.key === 'mocchario') {
      // モッチャリオの必殺: 高火力・大爆風のレーザー砲
      fireProjectile(owner, anchor, vx0 * 1.1, vy0 * 1.1, { blastMul: def.blastMul * 2.0, windMul: def.windMul });
    } else if (activateSpecial && def.key === 'mecha') {
      // メカの必殺: 狭い扇状に3発を高速斉射
      for (const deg of [-5, 0, 5]) {
        const v = rotateVec(vx0, vy0, deg);
        fireProjectile(owner, anchor, v.vx * 1.25, v.vy * 1.25, { blastMul: def.blastMul * 0.85, windMul: def.windMul });
      }
    } else if (activateSpecial && def.key === 'akuma') {
      // 悪魔の必殺: 重力も風も空中障害物も無視してまっすぐ走る電撃。地面か相手で止まる。
      fireProjectile(owner, anchor, vx0 * 2, vy0 * 2, {
        blastMul: def.blastMul * 1.2,
        windMul: 0,
        gravityMul: 0,
        damageMul: 1.35,
        ignoreObstacles: true,
        lightning: true
      });
    } else if (activateSpecial && def.key === 'jinba') {
      // 人馬の必殺: 地形を貫通して進む大爆発の突撃槍
      fireProjectile(owner, anchor, vx0 * 1.3, vy0 * 1.3, {
        blastMul: def.blastMul * 1.9,
        windMul: def.windMul,
        pierce: true
      });
    } else if (activateSpecial && def.key === 'kishi') {
      // 騎士の必殺: 自分のHPを代償に超高威力の一撃を放つ。自滅はしない。
      const cost = Math.min(15, Math.max(0, unit.hp - 1));
      if (cost > 0) {
        unit.hp -= cost;
        spawnDamageText(unit.x, unit.y - UNIT_RADIUS - 10, cost);
      }
      fireProjectile(owner, anchor, vx0, vy0, {
        blastMul: def.blastMul * 1.7,
        windMul: def.windMul,
        damageMul: 1.5
      });
    } else if (activateSpecial && def.key === 'neko') {
      // 猫の必殺: 大爆風で地形を削りつつ、当たった相手の移動を1手だけ封じる。
      fireProjectile(owner, anchor, vx0, vy0, {
        blastMul: def.blastMul * 1.5,
        windMul: def.windMul,
        emp: true,
        empRadius: def.empRadius,
        empTurns: 1
      });
    } else {
      fireProjectile(owner, anchor, vx0, vy0, {
        blastMul: def.blastMul,
        windMul: def.windMul,
        gravityMul: def.gravityMul
      });
    }

    // チャージ消費・カットイン・必殺音は保留に入る前に済ませてある。
    unit.jumpShot = false;
    if (!activateSpecial) playLaunchSound();
  }

  // ===== ターン制御 =====
  const TURNS_PER_UNIT = 15;  // 1体あたりの手番数。総ターン数は参加人数に比例させる
  let turnOrder = units.map(u => u.id); // 手番はこの並びで回る
  let activeIndex = 0;
  let turnCount = 0;
  function maxTurnsTotal() {
    const lobbyTurns = online && online.kind === 'firebase' && online.settings ? Number(online.settings.turnsPerPlayer) : TURNS_PER_UNIT;
    return ([10, 15, 20].includes(lobbyTurns) ? lobbyTurns : TURNS_PER_UNIT) * Math.max(1, turnOrder.length);
  }
  function activeUnit() { return unitById(turnOrder[activeIndex]) || units[0]; }
  // 手番を持っているのがこの端末で操作するユニットか(将来のオンライン対戦の入力ガード)
  function isLocalTurn() { return activeUnit().control === 'local'; }
  let awaitingResolve = false; // 発射後、着弾+落下が収まるまでtrue
  const TURN_SETTLE_SEC = 0.8; // 着弾が収まってから手番を交代するまでの余韻
  // CPUが狙いを定めるのにかける時間。実測で「手番の交代から発射まで1.8〜2.1秒、うち
  // 0.9秒はカットインで盤面が隠れている」ため、CPUが何をしているか見られる時間が
  // 1秒しかなかった。ここを伸ばすと、移動して狙う様子が読めるようになる。
  const CPU_THINK_MIN_SEC = 1.5;
  const CPU_THINK_RANGE_SEC = 0.8;
  let turnSettle = TURN_SETTLE_SEC;
  let matchOver = false;
  let winner = null;
  let cpuThinkTimer = 0;
  let winStreak = 0;     // 連勝数(CPU AIの精度に反映。負けると0に戻る)
  let isBossMatch = false; // 10連勝ごとの節目演出フラグ
  let bossBannerTimer = 0;

  // ===== カットイン(対戦開始・ターン交代・タイムアップ演出) =====
  // 表示中はupdate()を早期returnさせてゲーム進行を止め、切り替わりを分かりやすくする
  // 表示時間はユーザー要望で2倍にした(1.8→3.6秒)。
  // 飛来(VS_FLY_SEC)・衝突・撃ち抜け(VS_EXIT_SEC)の速さは変えない。伸ばした分は
  // まん中の「止まって見せている時間」に足す。動きまで倍にすると鈍く見えるため。
  const MATCHUP_CUTIN_DURATION = 3.6;
  // 手番の知らせ。実測で「交代から発射まで1.8〜2.1秒、うち0.9秒はカットインで盤面が隠れている」
  // ため、盤面を見られる時間が1秒しかなかった。誰の番かを読む時間を先に確保する。
  const TURN_CUTIN_DURATION = 1.3;
  let cutIn = null; // message: { timer, duration, text, sub, color, onDone } / matchup: { kind, left, right, ... }
  function showCutIn(text, sub, duration, onDone, color) {
    cutIn = { kind: 'message', timer: duration, duration, text, sub: sub || '', onDone: onDone || null, color: color || '#fff' };
  }

  // 席順ではなく陣営で分ける。units は p1,e1,p2,e2 の交互順なので、
  // filter すると左=p1,p2 / 右=e1,e2 の表示順が必ず保たれる。
  function matchupTeam(team) {
    return units.filter(u => u.team === team).map(u => ({ id: u.id, character: u.character }));
  }

  function showBattleStartCutIn() {
    // 中断セーブを作るために、タイトル画面の裏で resetMatch を呼ぶ経路がある。
    // そこでは表示せず、本当に戦闘画面へ入る時だけ作る。
    if (gamePhase !== 'battle') { battleIntroPending = false; return; }
    battleIntroPending = true;
    cutIn = {
      kind: 'matchup',
      timer: MATCHUP_CUTIN_DURATION,
      duration: MATCHUP_CUTIN_DURATION,
      left: matchupTeam('player'),
      right: matchupTeam('cpu'),
      onDone: beginFirstTurn
    };
  }
  // 開始カットインが終わるまで、最初の手番は始まっていない。
  //
  // これが無いと、オンラインのホストで「初手が相手(CPU)の時、カットインが明けた
  // 瞬間に着弾している」という状態になる。原因は2つ重なっていた。
  //   1. resetMatch は activeIndex=0(自分)で startTurn を済ませるが、そのあと
  //      オンラインは先攻を activeIndex へ入れ直す。入れ直した相手の手番は
  //      startTurn を通らないので、CPUの思考時間が用意されないまま 0 で残る。
  //   2. ホストは resetMatch から開始カットインまでの間に通信を4往復する。
  //      その間 gamePhase は battle でカットインも無いので、盤面が動いてしまう。
  // 実測では、カットイン終了の0.02秒後に発射されていた。
  let battleIntroPending = false;
  function beginFirstTurn() {
    battleIntroPending = false;
    const acting = activeUnit();
    // 先攻が入れ替わっていても、ここで必ずその手番の入り口を通す。
    if (acting && acting.control === 'cpu') beginCpuTurnPlan(acting);
  }

  // ===== 下部コントローラパネル(この境界より下は地形を描かない専用エリア) =====
  // CONTROL_PANEL_Y と DEAD_LINE_Y はファイル冒頭で定義済み(地形生成が参照するため)。
  const PANEL_CY = CONTROL_PANEL_Y + (VH - CONTROL_PANEL_Y) / 2;

  // ===== 移動(長押しボタン)。発射ジョイスティックの左右斜め下に配置 =====
  const BTN_R = 51;
  const leftBtn = { x: 98, y: PANEL_CY + 64 };
  const rightBtn = { x: VW - 98, y: PANEL_CY + 64 };
  let moveDir = 0; // -1, 0, 1
  let inputMode = null; // 'moveL' | 'moveR' | 'aim' | 'pan' | 'pinch' | 'cameraSlider' | 'volumeSlider'
  let inputPointerId = null;
  let volumeDragKey = null; // 音量スライダーをドラッグ中の対象('bgm' | 'sfx')

  // ===== 視点距離スライダー: ピンチ操作が難しい端末でも、自分の画面だけを確実に調整できる =====
  // コントローラー部の左上。右上の必殺ボタンと向かい合い、移動・発射には触れない位置。
  const CAMERA_SLIDER = { x: 60, y: CONTROL_PANEL_Y + 31, w: 110 };
  function cameraSliderValue() {
    return (cameraZoom - MIN_CAMERA_ZOOM) / (MAX_CAMERA_ZOOM - MIN_CAMERA_ZOOM);
  }
  function isInCameraSlider(p) {
    return p.x >= CAMERA_SLIDER.x - 16 && p.x <= CAMERA_SLIDER.x + CAMERA_SLIDER.w + 16
      && Math.abs(p.y - CAMERA_SLIDER.y) <= 25;
  }
  function setCameraZoomFromSlider(point) {
    const value = Math.max(0, Math.min(1, (point.x - CAMERA_SLIDER.x) / CAMERA_SLIDER.w));
    cameraZoom = clampCameraZoom(MIN_CAMERA_ZOOM + (MAX_CAMERA_ZOOM - MIN_CAMERA_ZOOM) * value);
    saveCameraZoom();
    cameraX = clampCameraX(cameraX);
    cameraTargetX = null;
  }

  // ===== 発射ボタン(画面下部中央・固定アンカー式スリング。ここから引っ張って離すと発射) =====
  const FIRE_BTN = { x: VW / 2, y: PANEL_CY, r: 117 };
  const CANCEL_RADIUS = 26; // ボタン中心のごく近くまで戻した時だけキャンセル(パワー調整の可動域を広く取る)
  function isInCancelZone(x, y) {
    return Math.hypot(x - FIRE_BTN.x, y - FIRE_BTN.y) <= CANCEL_RADIUS;
  }

  // ===== 視点移動:画面(コントローラパネルより上)を直接スライドでパン。離しても位置はそのまま =====
  let panLastX = 0;
  const activeTouchPoints = new Map();
  let pinchState = null;

  // ===== 必殺ショット(4段階リチャージ・右移動ボタンの上に配置) =====
  const specialBtn = { x: VW - 92, y: CONTROL_PANEL_Y + 66, r: 46 };
  const jumpBtn = { x: 92, y: CONTROL_PANEL_Y + 100, r: 34 };
  let specialArmed = false;
  let jumpArmed = false;

  // ===== メニュー(一時停止・タイトルに戻る) =====
  const menuBtn = { x: 26, y: 20, r: 17 };

  const SELECT_WHEEL_MAX_RENDERED_CARDS = 7;

  function wrapSelectWheelPosition(value) {
    const count = CHARACTER_LIST.length;
    return ((value % count) + count) % count;
  }

  function getSelectWheelDelta(index) {
    const count = CHARACTER_LIST.length;
    let delta = index - selectWheelPosition;
    while (delta > count / 2) delta -= count;
    while (delta < -count / 2) delta += count;
    return delta;
  }

  function getFocusedSelectIndex() {
    return ((Math.round(selectWheelPosition) % CHARACTER_LIST.length) + CHARACTER_LIST.length) % CHARACTER_LIST.length;
  }

  function getVisibleSelectCards() {
    const focusedIndex = getFocusedSelectIndex();
    return CHARACTER_LIST.map((key, index) => {
      const delta = getSelectWheelDelta(index);
      const angle = delta * SELECT_WHEEL_ANGLE_STEP;
      const depth = Math.cos(angle);
      const alpha = depth >= 0
        ? 0.28 + depth * 0.72
        : 0.18 + (depth + 1) * 0.12;
      return {
        key,
        index,
        order: index + 1,
        delta,
        depth,
        scale: 1,
        horizontalScale: 1,
        verticalScale: 1,
        alpha,
        // 最奥のカードは発射ギアの背後まで右へ回り込み、斜め向きの水車を形作る。
        x: selectFocusedMainCard.x + (1 - depth) * SELECT_WHEEL_DEPTH_SHIFT_X,
        y: SELECT_WHEEL_CENTER_Y + Math.sin(angle) * SELECT_WHEEL_RADIUS_Y - (1 - depth) * SELECT_WHEEL_DEPTH_LIFT_Y,
        w: selectFocusedMainCard.w,
        h: selectFocusedMainCard.h,
        focused: index === focusedIndex && Math.abs(delta) < 0.15
      };
    }).sort((a, b) => a.depth - b.depth);
  }

  function getRenderedSelectCards() {
    return getVisibleSelectCards()
      .sort((a, b) => b.depth - a.depth)
      .slice(0, SELECT_WHEEL_MAX_RENDERED_CARDS)
      .sort((a, b) => a.depth - b.depth);
  }

    const cards = getRenderedSelectCards().slice().sort((a, b) => b.depth - a.depth);

      if (card.depth < 0) continue;
      const halfW = card.w * card.scale * card.horizontalScale / 2;
      const halfH = card.h * card.scale * card.verticalScale / 2;
      if (Math.abs(point.x - card.x) <= halfW && Math.abs(point.y - card.y) <= halfH) return card;
    }
    return null;
  }

    if (groundYAt(x) >= DEAD_LINE_Y) {

      key: 'wind', title: '風を読む',
      body: ['画面の上に風の向きと強さが出ている。', '弾は風に流される。ずらして狙おう。'],
      hint: '風下へ撃つなら弱く、風上へ撃つなら強く。',
      setup() { tutorialSetWind(1, 0.85); tutorialPlace(player, 0.16); tutorialPlace(tutorialDummy(), 0.74); },
      cleared() { return tutorialDummy().hp < tutorial.baseHp; }
    },
    {
      key: 'move', title: '動く',
      body: ['左下と右下のボタンで動ける。', '動けるのは燃料の分だけ。動いてみよう。'],
      hint: '燃料はターンごとに戻る。使い切って大丈夫。',
      setup() { tutorialSetWind(-1, 0.3); },
      cleared() { return Math.abs(player.x - tutorial.baseX) >= 55; }
    },
    {
      key: 'jump', title: '跳ぶ',
      body: ['左の「跳躍」を押してから撃つと跳べる。', '1試合に1回だけ。使ってみよう。'],
      hint: '跳躍を押すとボタンが光る。そのまま輪を引いて離す。',
      setup() { tutorialSetWind(1, 0.2); player.jumpAvailable = true; },
      cleared() { return player.jumpAvailable === false; }
    },
    {
      key: 'special', title: '必殺技',
      body: ['右下の「必殺」は手番を重ねると溜まる。', '溜まったら押してから撃つ。撃ってみよう。'],
      hint: '必殺を押してから、いつもどおり輪を引いて離す。',
      setup() { tutorialSetWind(1, 0.1); player.specialCharge = SPECIAL_CHARGE_MAX; tutorialPlace(tutorialDummy(), 0.62); },
      cleared() { return player.specialCharge < tutorial.baseCharge; }
    },
    {
      key: 'terrain', title: '足場を壊す',
      body: ['地面は撃つと削れる。相手の足場を壊すと', '落ちて場外になる。細い足場を撃ち抜こう。'],
      hint: '足場のまん中あたりを狙おう。1発で崩せる。',
      setup() {
        tutorialSetWind(1, 0);
        const foe = tutorialDummy();
        tutorialPlace(player, 0.16);
        tutorialPlace(foe, 0.68);
        // 左右を底まで掘って切り離し、さらに**足元の下も空洞にする**。
        //
        // ここは一度、左右を掘るだけにしていた。すると的は「底まで続く太い柱」の上に
        // 立つことになり、1発では削りきれない(通常弾のクレーターは半径60px弱、柱の高さは
        // 200px以上)。落ちてもすぐ柱の残りに着地するので、何度撃っても終わらなかった。
        // 薄い板だけ残して下を抜けば、1発で崩れてそのまま場外まで落ちる。
        tutorialDigColumn(foe.x - TUTORIAL_LEDGE_HALF_W - 46, 46);
        tutorialDigColumn(foe.x + TUTORIAL_LEDGE_HALF_W + 46, 46);
        initUnitOnGround(foe);
        tutorialHollowUnder(foe);
        initUnitOnGround(foe);
      },
      cleared() {
        const foe = tutorialDummy();
        return foe.hp <= 0 || foe.y + UNIT_RADIUS >= DEAD_LINE_Y;
      }
    }
  ];

  function startTutorial() {
    clearSuspendedMatch();
    hasSuspendedSave = false;
    battleMode = 'tutorial';
    setMatchFormat('1v1');
    // 使うキャラは固定。恐竜は説明文どおり素直な弾道で、最初の一発を当てやすい。
    player.character = 'kyoryu';
    cpu.character = 'iwa';   // 的は大きくて当てやすいもの
    gamePhase = 'battle';
    winStreak = 0;
    runStats = { damageDealt: 0, shots: 0 };
    tutorial = { stepIndex: 0, stepShots: 0, clearTimer: 0, cleared: false, baseHp: 0, baseX: 0, baseCharge: 0 };
    resetMatch(false);
    // 手番は自分だけ。相手を turnOrder から外すので、的は一度も動かない。
    turnOrder = ['p1'];
    activeIndex = 0;
    turnCount = 0;
    applyTutorialStep();
  }

  function applyTutorialStep() {
    const step = tutorialStep();
    if (!step) return;
    step.setup();
    faceAllUnitsTowardOpponents();
    player.fuel = player.fuelMax;
    tutorial.stepShots = 0;
    tutorial.cleared = false;
    tutorial.clearTimer = 0;
    // 項目ごとにHPを戻す。倒せてしまうと項目の途中で終わってしまうため。
    tutorialDummy().hp = tutorialDummy().maxHp;
    tutorial.baseHp = tutorialDummy().hp;
    tutorial.baseX = player.x;
    tutorial.baseCharge = player.specialCharge;
    focusCameraOn((player.x + tutorialDummy().x) / 2, true);
  }

  function advanceTutorialStep() {
    tutorial.stepIndex++;
    if (tutorial.stepIndex >= TUTORIAL_STEPS.length) { finishTutorial(); return; }
    applyTutorialStep();
  }

  function finishTutorial() {
    markTutorialCleared();
    tutorial = null;
    battleMode = 'normal';
    showCutIn('チュートリアル完了!', 'これで対戦に出られます', 2.0, () => {
      returnToTitleFromResult();
      showTitleNotice('おつかれさま。まずはCPU対戦から遊んでみよう。');
    });
  }

  // 「とばす」を押した人にも、次からは勧めない。本人が決めたことなので蒸し返さない。
  function skipTutorial() {
    markTutorialCleared();
    tutorial = null;
    battleMode = 'normal';
    returnToTitleFromResult();
  }

  function updateTutorial(dt) {
    if (!tutorialActive() || gamePhase !== 'battle') return;
    const step = tutorialStep();
    if (!step) return;
    if (tutorial.cleared) {
      tutorial.clearTimer -= dt;
      if (tutorial.clearTimer <= 0) advanceTutorialStep();
      return;
    }
    // 撃ち続けても的は倒れない。完了判定より先に止めること。後にすると、
    // 一撃で倒しきった時にHPが負のまま画面へ出る。
    // 最後の項目だけは、落として終わるので止めない。
    const foe = tutorialDummy();
    if (step.key !== 'terrain' && foe.hp <= 0) foe.hp = 1;
    if (step.cleared()) {
      tutorial.cleared = true;
      tutorial.clearTimer = TUTORIAL_CLEAR_HOLD_SEC;
    }
  }

  // チュートリアルの案内板。上のHUDと下の操作パネルの間に置くので、
  // 説明を読みながらそのまま操作できる。指の邪魔になる位置には出さない。
  const TUTORIAL_PANEL = { x: 14, y: 232, w: VW - 28, h: 104 };
  const tutorialSkipBtn = { x: VW - 72, y: 252, w: 96, h: 28 };
  function drawTutorialOverlay() {
    if (!tutorialActive() || gamePhase !== 'battle') return;
    const step = tutorialStep();
    if (!step) return;
    const p = TUTORIAL_PANEL;

    // 的の上に印を出す。どれを狙うのかを迷わせない。
    const foe = tutorialDummy();
    if (foe && foe.hp > 0 && !tutorial.cleared) {
      const ax = worldToScreenX(foe.x);
      const ay = worldToScreenY(foe.y - UNIT_RADIUS - 34);
      const bob = Math.sin(simTimeMs / 260) * 4;
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = UI.gold;
      ctx.beginPath();
      ctx.moveTo(ax, ay + bob + 12);
      ctx.lineTo(ax - 9, ay + bob - 4);
      ctx.lineTo(ax + 9, ay + bob - 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = 'rgba(6,12,20,0.82)';
    ctx.strokeStyle = tutorial.cleared ? '#8fe6b0' : UI.brass;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x, p.y, p.w, p.h, 12);
    else ctx.rect(p.x, p.y, p.w, p.h);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    const stepNo = `${tutorial.stepIndex + 1}/${TUTORIAL_STEPS.length}`;
    if (tutorial.cleared) {
      drawOutlinedText('できた!', p.x + p.w / 2, p.y + 46, {
        font: `900 26px ${UI_FONT_HEAVY}`, color: '#8fe6b0', lineWidth: 5
      });
      const next = TUTORIAL_STEPS[tutorial.stepIndex + 1];
      drawOutlinedText(next ? `つぎは「${next.title}」` : 'これで最後', p.x + p.w / 2, p.y + 76, {
        font: `900 13px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3
      });
      return;
    }

    drawOutlinedText(`${stepNo}  ${step.title}`, p.x + 16, p.y + 28, {
      align: 'left', font: `900 17px ${UI_FONT_HEAVY}`, color: UI.gold, lineWidth: 4
    });
    step.body.forEach((line, i) => {
      drawOutlinedText(line, p.x + 16, p.y + 54 + i * 21, {
        align: 'left', font: `900 13px ${UI_FONT_HEAVY}`, color: UI.parchment, lineWidth: 3
      });
    });
    // 何度か外した人にだけ、追加の一言を出す。最初から全部出すと読む気が失せる。
    if (tutorial.stepShots >= TUTORIAL_HINT_AFTER_SHOTS && step.hint) {
      drawOutlinedText(step.hint, p.x + 16, p.y + 96, {
        align: 'left', font: `900 12px ${UI_FONT_HEAVY}`, color: '#ffd98a', lineWidth: 3
      });
    }

    // 「とばす」はいつでも押せる。閉じ込めない。
    const b = tutorialSkipBtn;
    ctx.save();
    ctx.fillStyle = 'rgba(20,28,40,0.9)';
    ctx.strokeStyle = UI.brass;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 8);
    else ctx.rect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    drawOutlinedText('とばす', b.x, b.y + 5, {
      font: `900 13px ${UI_FONT_HEAVY}`, color: UI.brassLight, lineWidth: 3
    });
  }

  // ===== 中断/再開(ブラウザを閉じても続きから再開できる) =====
  const SUSPEND_KEY = 'katamon_suspend_v1';

  const SNAPSHOT_VERSION = 4;

  function serializeUnit(u) {
    return {
      id: u.id, team: u.team, control: u.control, character: u.character,
      hp: u.hp, maxHp: u.maxHp, fuel: u.fuel, fuelMax: u.fuelMax,
      x: u.x, y: u.y, specialCharge: u.specialCharge, moveLockTurns: u.moveLockTurns,
      jumpAvailable: u.jumpAvailable !== false,
      facingLeft: u.facingLeft == null ? null : !!u.facingLeft
    };
  }

  // 試合の状態を丸ごと1つのオブジェクトにする。中断セーブはこれをlocalStorageへ
  // 書くだけの薄い層で、オンライン対戦のターン境界の同期にもそのまま使える。
  function buildSnapshot() {
    return {
      v: SNAPSHOT_VERSION,
      battleMode,
      freeModeConfig: { ...freeModeConfig },
      stageW: STAGE_W,
      segments: currentSegments,
      craters: craterHistory,
      pattern: currentPattern,
      startOnIsland,
      bridge: currentBridge,
      themeKey: currentThemeKey,
      parallaxSeed,
      simTimeMs, // 再開時に闘技場の障害物の揺れが飛ばないよう位相も持ち越す
      matchFormat,
      units: units.map(serializeUnit),
      turnOrder: turnOrder.slice(),
      activeIndex, turnCount,
      wind: { dir: wind.dir, strength: wind.strength, calmWind, calmBattle },
      winStreak, runStats, isBossMatch,
      camera: { x: cameraX, zoom: cameraZoom }
    };
  }

  // v3までは player/cpu の2固定だった。現行の units 形式へ寄せてから読む。
  function migrateSnapshot(data) {
    if (!data || Array.isArray(data.units)) return data;
    if (!data.player || !data.cpu) return null;
    data.units = [
      { ...data.player, id: 'p1', team: 'player', control: 'local', character: data.playerChar },
      { ...data.cpu, id: 'e1', team: 'cpu', control: 'cpu', character: data.cpuChar }
    ];
    data.turnOrder = ['p1', 'e1'];
    data.activeIndex = data.currentTurn === 'cpu' ? 1 : 0;
    data.matchFormat = '1v1';
    data.v = SNAPSHOT_VERSION;
    return data;
  }

  function saveSuspendedMatch() {
    // 対人戦は片方だけ中断しても再開できないので保存しない(復帰はStage 4の課題)。
    if (isOnline()) return;
    try { localStorage.setItem(SUSPEND_KEY, JSON.stringify(buildSnapshot())); } catch (err) { /* 保存できなくても対戦は続行可能 */ }
  }

  function loadSuspendedMatch() {
    try {
      const raw = localStorage.getItem(SUSPEND_KEY);
      if (!raw) return null;
      const data = migrateSnapshot(JSON.parse(raw));
      // 旧960px地形は列数が違うため、横長化後に無理に復元せず新しい試合へ切り替える。
      if (!data || !Array.isArray(data.segments) || data.segments.length !== TERRAIN_COLS) return null;
      // 人数が保存時の対戦形式と食い違うセーブは復元しない。
      // タイトルへ戻ると units は1vs1へ戻るので、現在の units.length ではなく
      // セーブ自身が名乗る形式と突き合わせる(そうしないと2vs2の中断が必ず捨てられる)。
      const savedFormat = data.matchFormat === '2v2' ? '2v2' : '1v1';
      const expectedCount = savedFormat === '2v2' ? 4 : 2;
      if (!Array.isArray(data.units) || data.units.length !== expectedCount) return null;
      return data;
    } catch (err) { return null; }
  }

  function clearSuspendedMatch() {
    try { localStorage.removeItem(SUSPEND_KEY); } catch (err) { /* noop */ }
  }

  // スナップショットを現在の試合状態へ流し込む。飛翔中の弾や入力は持ち越さず、
  // 必ずターン境界の状態から再開する(進行中の演出を復元しようとすると破綻するため)。
  function applySnapshot(data) {
    battleMode = data.battleMode === 'free' ? 'free' : 'normal';
    // 人数を先に合わせる。units の中身を作り替えるので、以降のループより必ず前に置く。
    // 旧セーブやv99以前のオンライン相手は matchFormat を持たないので1vs1として扱う。
    setMatchFormat(data.matchFormat === '2v2' ? '2v2' : '1v1');
    if (data.freeModeConfig) {
      freeModeConfig.playerIndex = wrapOptionIndex(Number(data.freeModeConfig.playerIndex) || 0, CHARACTER_LIST.length);
      freeModeConfig.cpuIndex = wrapOptionIndex(Number(data.freeModeConfig.cpuIndex) || 0, CHARACTER_LIST.length);
      freeModeConfig.terrainIndex = wrapOptionIndex(Number(data.freeModeConfig.terrainIndex) || 0, FREE_TERRAIN_OPTIONS.length);
      freeModeConfig.windIndex = wrapOptionIndex(Number(data.freeModeConfig.windIndex) || 0, WIND_OPTIONS.length);
      freeModeConfig.formatIndex = wrapOptionIndex(Number(data.freeModeConfig.formatIndex) || 0, FORMAT_OPTIONS.length);
    }

    loadTerrainFromSave(data.segments, data.craters, data.pattern, data.startOnIsland, data.themeKey, data.parallaxSeed, data.bridge);
    // 途中まで溜まった物理の刻みは持ち越さない。ターン境界の状態から始め直す(Issue #9)。
    resetPhysicsClock();
    // 旧セーブには無いので0から。障害物の揺れが少しずれるだけで実害はない。
    simTimeMs = Number.isFinite(data.simTimeMs) ? data.simTimeMs : 0;

    // v1の旧セーブにはyが無いので、その場合だけ従来どおり列の最上面へ置く。
    // 新しいセーブは保存時の高さを基準に、同じレイヤーの足場へ復帰させる。
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      const saved = data.units[i];
      applyCharacter(u, saved.character);
      u.hp = saved.hp;
      u.maxHp = saved.maxHp;
      u.fuel = saved.fuel;
      u.fuelMax = saved.fuelMax;
      u.x = saved.x;
      u.moveLockTurns = Number.isFinite(saved.moveLockTurns) ? Math.max(0, Math.min(2, saved.moveLockTurns)) : 0;
      // 旧セーブは「未使用=満タン、使用済み=空」として新チャージ制へ移行する。
      u.specialCharge = Number.isFinite(saved.specialCharge)
        ? Math.max(0, Math.min(SPECIAL_CHARGE_MAX, saved.specialCharge))
        : (saved.specialUsed ? 0 : SPECIAL_CHARGE_MAX);
      u.jumpAvailable = saved.jumpAvailable !== false;
      u.facingLeft = typeof saved.facingLeft === 'boolean' ? saved.facingLeft : null;
      const savedY = Number.isFinite(saved.y) ? saved.y : groundYAt(u.x) - UNIT_RADIUS;
      const nearbyGround = walkableGroundYAt(u.x, savedY + UNIT_RADIUS);
      u.y = (nearbyGround === null ? groundYAt(u.x) : nearbyGround) - UNIT_RADIUS;
      u.vy = 0;
      u.grounded = true;
      u.fallStartY = u.y;
    }
    // 跳躍後の向きは相手の座標が揃った後に再計算し、通信順で一瞬反転するのを防ぐ。
    for (const u of units) faceUnitTowardOpponent(u);

    projectiles = [];
    aimState = null;
    moveDir = 0;
    inputMode = null;
    inputPointerId = null;
    activeTouchPoints.clear();
    pinchState = null;
    specialArmed = false;
    jumpArmed = false;
    matchOver = false;
    matchEndPause = 0;
    matchEndReason = '';
    turnSettle = TURN_SETTLE_SEC;
    winner = null;
    awaitingResolve = false;
    turnOrder = Array.isArray(data.turnOrder) && data.turnOrder.length ? data.turnOrder.slice() : units.map(u => u.id);
    activeIndex = Math.max(0, Math.min(turnOrder.length - 1, Number(data.activeIndex) || 0));
    turnCount = data.turnCount;
    wind.dir = data.wind.dir;
    wind.strength = data.wind.strength;
    calmBattle = data.wind.calmBattle === true;
    calmWind = data.wind.calmWind === true || (calmBattle && wind.strength === 0);
    winStreak = data.winStreak;
    runStats = data.runStats;
    isBossMatch = data.isBossMatch;
    bossBannerTimer = 0;
    cpuMoveDir = 0;
    cpuMoveRemaining = 0;
    cpuPhase = 'aim';
    particles = [];
    empRings = [];
    lightningBeams = [];
    floatTexts = [];
    shakeTimer = 0;
    specialFlash = { timer: 0, text: '' };
    pendingShot = null;
    confirmDialog = null;
    cutIn = null;
    menuOpen = false;
    if (isOnline()) {
      // カメラは端末ごとの見やすさであり、相手のスナップショットで上書きしない。
      // 開始時・ターン境界では、左右の席に関係なく行動キャラを映す。
      focusCameraOn(activeUnit().x, true);
    } else {
      cameraZoom = clampCameraZoom(data.camera && Number.isFinite(data.camera.zoom) ? data.camera.zoom : DEFAULT_CAMERA_ZOOM);
      cameraX = clampCameraX(data.camera && Number.isFinite(data.camera.x) ? data.camera.x : centerCameraOn(localUnit().x));
      cameraTargetX = null;
    }
  }

  function resumeSuspendedMatch() {
    pendingNewMatchKey = null;
    const data = loadSuspendedMatch();
    if (!data) return;
    applySnapshot(data);
    gamePhase = 'battle';
    syncBgm({ restartStage: true });

    clearSuspendedMatch();
    hasSuspendedSave = false;
    updateDebug();
  }

  let hasSuspendedSave = !!loadSuspendedMatch();

  // ===== オンライン対戦(Stage 3: Firebase REST/SSE、開発時はBroadcastChannel)=====
  //
  // 方式は「行動側権威 + ターン境界スナップショット」。
  //   撃った側 : 自分で物理を回して着弾させ、ターンの切れ目に buildSnapshot() を送る
  //   受けた側 : 発射コマンドを再生して見た目を合わせ、届いたスナップショットで上書きする
  // 演出が多少ズレても最後に必ず揃うので、決定性(可変dt・非シード地形)を直さなくて済む。
  //
  // 通信は send/onMessage/close の3つだけのインターフェースに切ってある。
  // BroadcastChannel は既存v2を維持する。Firebaseだけを常設ロビーv3へ上げる。
  const PROTO_VERSION = 2;
  const FIREBASE_PROTO_VERSION = 3;
  const FIREBASE_SEATS = ['p1', 'e1', 's1', 's2'];
  const FIREBASE_PLAYER_SEATS = ['p1', 'e1'];
  const FIREBASE_ROUND_RE = /^[0-9a-f]{48}$/;
  const LOOPBACK_ROOM = 'katamon-loopback';
  // v101までの「すぐ対戦」は世界にこの1部屋しか無く、3人目は必ず弾かれていた。
  // v102からは open インデックス経由のマッチメイキングへ移行したので、もう使わない。
  // 定数だけ残してあるのは、旧版の端末がまだこの部屋に居る可能性を説明するため。
  const LEGACY_QUICK_MATCH_ROOM = 'KATAMN22';
  const NET_RETRY_SEC = 0.6; // 相手待ちの間、join/hello を撒き直す間隔
  const ROOM_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const ROOM_CODE_LENGTH = 8;
  // 部屋の期限は短く取り、ホストが生きている間だけ延ばし続ける(Stage 4-2)。
  // ホストが消えれば ROOM_TTL_MS で期限切れになり、「期限切れの部屋は誰でも上書き作成・削除
  // できる」既存ルール(2026-07-27に本番9/9で検証済み)がそのまま発火する。乗っ取りの仕組みを
  // 新設しないのがこの設計の要点。以前は2時間で、放置された簡単対戦がその間ずっと詰んでいた。
  // 更新が丸ごと失敗し続けた時だけ対戦中でも部屋が切れるので、10分はその猶予でもある。
  // ROOM_LEASE_RENEW_MS は ROOM_TTL_MS より十分に短く保つこと(stage3testで固定してある)。
  const ROOM_TTL_MS = 10 * 60 * 1000;
  const ROOM_LEASE_RENEW_MS = 60 * 1000;
  // 待っている部屋の公開一覧(Issue #23)。載せるのは「この合言葉の部屋が空いて待っている」
  // という事実だけで、部屋の中身(rooms/$room)は従来どおり席を持つ人しか読めない。
  // 案内の期限は部屋の期限と揃える。ホストが居る限りは部屋の延命と一緒に載せ直す。

      if (!watched.includes(seat)) { delete online.matchSeatSilentMs[seat]; continue; }
      if (!Number.isFinite(online.matchSeatSilentMs[seat])) online.matchSeatSilentMs[seat] = 0;
      if (!hidden) online.matchSeatSilentMs[seat] += elapsed;
    }
    if (!isFirebaseHost()) return;
    if (!watched.some(firebaseMatchSeatSuspect)) return;
    // 押せる表示を出すロビーと違い、試合中は自動で進める(ユーザー判断)。
    // ホストが席を外していても残りの3人が最後まで遊べるようにするため。
    online.matchSeatVerifyWaitMs = (online.matchSeatVerifyWaitMs || 0) + elapsed;
    if (online.matchSeatVerifyWaitMs < FIREBASE_MATCH_SEAT_VERIFY_INTERVAL_MS) return;
    online.matchSeatVerifyWaitMs = 0;

  // ホストだけ。ロビーの verifyStaleFirebaseSeats と同じくサーバー時刻のseenAtで確かめるが、
  // ボタンを出すのではなくその場で引き継ぐ。読み直せない時は何もしない(古い情報で席を消さない)。
  async function verifyFirebaseMatchSeats() {
    if (!isFirebaseHost() || online.phase !== 'playing' || online.matchSeatChecking) return;
    const checking = online;
    checking.matchSeatChecking = true;
    try {
      const room = await firebaseRequest(`rooms/${checking.room}`, checking.auth);
      if (online !== checking || !room || checking.phase !== 'playing') return;
      checking.slots = room.slots || {};
      const serverNow = firebaseServerNow(checking.auth);
      for (const seat of firebaseMatchTakeoverSeats()) {
        if (!firebaseMatchSeatSuspect(seat)) continue;
        const slot = checking.slots[seat];
        if (!slot || !slot.uid || !firebaseSeatHeartbeatAllowsRelease(serverNow, Number(slot.seenAt))) continue;
        await takeOverFirebaseSeatWithCpu(seat);
        // 名簿を配り直すので、残りは次の巡回で見る。1回に1席だけ引き継ぐ。
        return;
      }
    } catch (_) {
      // 部屋を読めないのは通信不良。ここで引き継ぐと生きている人を追い出しかねない。
    } finally {

  // --- ロビーの心拍(Stage 4-1) ---

  // 1つの関数にまとめるとロビーの都合で対戦が切れる事故が起きるので、統合してはいけない。
  // 時計はロビー滞在中の可視時間だけを積む。対戦中・結果表示中は止まったままでよく、
  // 止めておくことで「長い試合から戻った直後に全員が応答なしに見える」のを防いでいる。
  function advanceFirebaseLobbyLiveness(entry, now, hidden) {

  function firebaseSeatStale(clockMs, seenMs) {

  }
  function noteFirebaseSeatSeen(seat) {
    if (!online || online.kind !== 'firebase' || !online.lobbyLiveness || !online.seatSeen) return;
    if (!FIREBASE_SEATS.includes(seat)) return;
    online.seatSeen[seat] = online.lobbyLiveness.clockMs;

    if (online.seatReleaseReady) delete online.seatReleaseReady[seat];
  }
  // 自席は判定しない(自分が生きているのは自明)。空席も判定しない。
  function firebaseSeatIsStale(seat) {
    if (!online || online.kind !== 'firebase' || !online.lobbyLiveness || !online.seatSeen) return false;
    if (seat === online.seat) return false;
    if (!(online.slots && online.slots[seat] && online.slots[seat].uid)) return false;
    return firebaseSeatStale(online.lobbyLiveness.clockMs, online.seatSeen[seat]);
  }
  function updateFirebaseLobbyLiveness() {
    if (!online || online.kind !== 'firebase' || !online.lobbyLiveness || online.phase !== 'lobby') return;
    const result = advanceFirebaseLobbyLiveness(online.lobbyLiveness, firebaseMonotonicNow(), typeof document !== 'undefined' && document.hidden);
    // 在席が見えている席で未記録のものは、いま見た時刻を起点にする。
    // これが無いと、入室直後や後から来た人がいきなり「応答なし」に見える。
    for (const seat of FIREBASE_SEATS) {
      const occupied = !!(online.slots && online.slots[seat] && online.slots[seat].uid);
      if (occupied && !Number.isFinite(online.seatSeen[seat])) online.seatSeen[seat] = result.clockMs;
      else if (!occupied && seat in online.seatSeen) delete online.seatSeen[seat];
    }
    if (result.pingDue) {
      online.lobbyLiveness.pingVisibleMs = 0;
      netSend({ t: 'ping' });
    }
    // 表示が変わった時だけ描き直す。毎フレーム席ボードを組み直さないため。
    let changed = false;
    for (const seat of FIREBASE_SEATS) {
      const stale = firebaseSeatIsStale(seat);
      if (!!online.seatStale[seat] !== stale) {
        online.seatStale[seat] = stale;
        if (!stale && online.seatReleaseReady) delete online.seatReleaseReady[seat];
        changed = true;
      }
    }
    // 画面上の無応答(45秒)は早めの警告。席を実際に空けられるかはRulesと同じ
    // seenAt(90秒)を読み直して確認する。5秒おきなら書き込みを増やさず、待ち時間も短い。
    if (isFirebaseHost() && FIREBASE_SEATS.some(seat => online.seatStale[seat])
        && result.clockMs >= (online.seatReleaseNextCheckMs || 0)) {
      online.seatReleaseNextCheckMs = result.clockMs + FIREBASE_SEAT_RELEASE_VERIFY_INTERVAL_MS;
      verifyStaleFirebaseSeats();
    }
    // 状態表示も合わせて直す。入室時の「接続しました。相手を待っています…」が残ると
    // 席ボードの「応答なし」と食い違い、どちらが本当なのか分からなくなる。
    if (changed) {
      const staleSeats = FIREBASE_SEATS.filter(seat => online.seatStale[seat]);
      if (staleSeats.length === 1) onlineLobbyStatus(`${firebaseSeatLabel(staleSeats[0])}の応答が途切れています。`);
      else if (staleSeats.length) onlineLobbyStatus('応答が途切れている席があります。');
      else onlineLobbyStatus('応答が戻りました。');
      renderFirebaseLobby();
    }
  }
  // 送信者が「自分の負け」を宣言しているか。移動中の落下死など、こちらでは
  // 再現できない決着はこの形で届く。負けを譲る側に不正の動機は無いので信用してよい。
  // 逆に「自分の勝ち」の主張はここでは真にならず、従来どおり厳格に検証される。
  function firebaseResultConcedes(msg) {
    if (!msg || msg.t !== 'result') return false;
    // 送信者の陣営は「席→ユニット」の対応で引く。2vs2では席名とユニット名が一致しない。
    const senderUnit = FIREBASE_SEATS.includes(msg.seat) ? unitById(firebaseSeatUnitId(msg.seat)) : null;
    return !!senderUnit && (msg.winner === 'player' || msg.winner === 'cpu') && msg.winner !== senderUnit.team;
  }

  function firebaseFlowAllows(msg, flow) {
    if (msg.t === 'fire') return !!flow && flow.activeId === msg.unitId && flow.remoteUnitId === msg.unitId && !flow.remoteAction;
    // 敗北宣言は対応する fire を持たないので、行動との対応づけを要求しない。
    // 降参が通るには関門が3つ(この判定・receiveFirebaseTerminal・case 'result')あり、
    // 1つでも塞がっていると decisive な決着が届かず対戦が詰む。必ず3箇所とも通すこと。
    if (firebaseResultConcedes(msg)) return true;
    if (msg.t === 'state' || msg.t === 'result') return !!flow && firebaseActionMatches(msg, flow.remoteAction);
    return true;
  }
  // 拒否理由を名指しできるようにする。可変dtの弾道差でどの項目が閾値を超えたのか
  // 分からないと、「拒否された」以上のことが実機報告から分からず切り分けが進まない。
  function stateSnapshotMismatchReason(snap, baseline) {
    if (!snap || !baseline || !Array.isArray(snap.units) || !Array.isArray(baseline.units)) return 'shape';
    if (snap.turnCount !== baseline.turnCount) return 'turnCount';
    // 2vs2は4体。人数が食い違うのは対戦方式そのものがずれている時なので、まとめてshapeで弾く。
    if (snap.units.length !== baseline.units.length || !Array.isArray(snap.turnOrder) || !Array.isArray(baseline.turnOrder) || snap.turnOrder.length !== baseline.turnOrder.length) return 'shape';
    if (snap.turnOrder.some((id, i) => id !== baseline.turnOrder[i])) return 'turnOrder';
    if (snap.units.some((u, i) => u.maxHp !== baseline.units[i].maxHp)) return 'maxHp';
    if (snap.pattern !== baseline.pattern) return 'pattern';
    if (snap.themeKey !== baseline.themeKey) return 'themeKey';
    if (snap.parallaxSeed !== baseline.parallaxSeed) return 'parallaxSeed';
    // RTDBを往復するとオブジェクトのキーがアルファベット順に並び替わって返る。
    // 生成した側は {startX,endX,y,style,seed} の順、受け取った側は {endX,seed,...} の順になり、
    // 素の JSON.stringify では値が同じでも文字列が一致せず、橋ステージで必ず切れていた。
    // キーの並びに依存しない比較を使う。
    if (stableFirebaseJson(snap.segments) !== stableFirebaseJson(baseline.segments)) return 'terrain.segments';
    if (stableFirebaseJson(snap.bridge) !== stableFirebaseJson(baseline.bridge)) return 'terrain.bridge';
    if (Math.abs(snap.craters.length - baseline.craters.length) > 24) return 'craters';
    for (let i = 0; i < snap.units.length; i++) {
      const saved = snap.units[i], local = baseline.units[i];
      // HPは通信の入口(hasSafeUnitSnapshot)で既に 0〜maxHp に収まるよう検証済みで、
      // ここでの一致判定は改ざん対策として機能していない。花火のような多段ヒットは
      // フレームレートの差だけで数ポイント動き、実際に「まだ生きているのに0/140と誤表示され、
      // 通信中断」という実害を起こした。stateは受理さえすれば applySnapshot で正しい値へ
      // 上書きされるので、一致しなくても実害はない。「撃った側が原理的に不正できる」のは
      // 引継書に明記された既知の許容事項であり、ここで縛っても防御にならない。
      if (Math.abs(saved.x - local.x) > 160) return `x.${i}(${Math.round(local.x)}->${Math.round(saved.x)})`;
      if (Math.abs(saved.y - local.y) > 160) return `y.${i}(${Math.round(local.y)}->${Math.round(saved.y)})`;
      // 燃料は比較しない。移動そのものは通信しておらず、fire は移動後の座標しか運ばない。
      // 受信側は相手の燃料を減らしようがなく、相手が24px以上動いた時点で必ず食い違う
      // (実機で fuel.0 として再現)。HPと同じく通信の入口で 0〜fuelMax に検証済みで、
      // state を受理すれば applySnapshot が正しい値へ上書きするため実害もない。
      if (Math.abs(saved.specialCharge - local.specialCharge) > 1) return `specialCharge.${i}`;
      if ((saved.jumpAvailable !== false) !== local.jumpAvailable) return `jumpAvailable.${i}`;
    }
    return '';
  }
  function stateSnapshotMatchesBaseline(snap, baseline) { return stateSnapshotMismatchReason(snap, baseline) === ''; }
  // 試合中に想定されるキャラの表(ユニットID→キャラ)。1vs1は席から一意に決まるが、
  // 2vs2は空席のCPUのキャラをホストが決めるので、開始データを検証した時点で作って持つ。
  // 表が無い間は従来どおり自分と相手の2つから組み立て、1vs1の経路を変えない。
  function expectedFirebaseUnitCharacters() {
    if (online && online.unitCharacters) return online.unitCharacters;
    const hostChar = online.role === 'host' ? online.selfCharacter : online.peerCharacter;
    const guestChar = online.role === 'host' ? online.peerCharacter : online.selfCharacter;
    return { p1: hostChar, e1: guestChar };
  }
  function firebaseStateMismatchReason(snap) {
    // state は相手端末の描画フレーム差を少し許容する一方、地形の差し替えや大幅な座標改ざんは拒否する。HPはaction-side authorityのため入口範囲だけ検証する。
    if (!snap || !Array.isArray(snap.units) || !online) return 'precondition';

    if (!snap.units.every(u => u && expected[u.id] === u.character)) return 'character';
    return stateSnapshotMismatchReason(snap, buildSnapshot());
  }
  function firebaseStateMatchesLocal(snap) { return firebaseStateMismatchReason(snap) === ''; }
  // 対戦ごとの通信ログ。実機で不具合が起きた時、スクショの1行だけでなく
  // 直前のやり取りを丸ごと送ってもらえるようにする(ユーザー要望、2026-07-27)。
  const ONLINE_LOG_KEY = 'katamon_online_log_v1';
  const ONLINE_LOG_MAX = 80;
  // 進行に効く種別だけ記録する。move と ping は毎ターン大量に出て枠を潰すので除く。
  const ONLINE_LOG_SKIP = new Set(['move', 'ping', 'presence']);
  function logOnlineEvent(entry) {
    if (!online || !online.log) return;
    online.log.push({ t: Date.now(), turn: turnCount, ...entry });
    if (online.log.length > ONLINE_LOG_MAX) online.log.shift();
  }
  function persistOnlineLog() {
    if (!online || !online.log) return;
    try { localStorage.setItem(ONLINE_LOG_KEY, JSON.stringify({ room: online.room, role: online.role, log: online.log })); }
    catch (_) { /* 保存できなくても対戦は続行できる */ }
  }
  function rejectFirebaseMessage(reason) {
    if (!online) return;
